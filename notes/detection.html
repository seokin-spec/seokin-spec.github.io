<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>검출과 분광기 노트</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · 검출과 분광기</span><span class="status" title="전문가 검토 전 초안이다. 값의 대략·예시·확인 필요 표시를 같이 본다.">검토 중</span></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>
  <div class="stage" id="stage">
    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="왼쪽 그림"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="오른쪽 그림"></svg></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>재생</button>
    <span id="tgl"></span>
  </div>
  <div class="notes">
    <div class="read"><ul id="read"></ul><div class="case" id="case" hidden></div></div>
    <div class="quiz"><span class="k">점검 질문</span><p id="q"></p><details id="ad"><summary>답 보기</summary><p id="a"></p></details></div>
  </div>
  <nav><button id="prev" type="button">← 이전</button><div class="dots" id="dots"></div><button id="next" type="button">다음 →</button></nav>
</div>

<script>
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 검출과 분광기 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 검출과 분광기
// @status 검토 중
/* 검출과 분광기 노트: 모노크로메이터(Czerny-Turner), 검출기(MCT·CCD·PMT). Boxcar 탭은 나중에 추가.
   빛이 들어오는 순서대로: 분광기가 파장을 고르고 → 검출기가 광자를 전자로 바꾼다. */
const NOTE={key:'detection'};

/* ---------- 공통 헬퍼 (mo = 모노크로메이터, dt = 검출기) ---------- */
/* 파장(nm) → 보기용 색. 700 nm 넘으면 어두운 빨강 (근적외선, 실제로는 안 보임) */
const moCol=l=>l>700?'hsl(0,55%,36%)':`hsl(${Math.round(Math.max(0,Math.min(270,270*(1-(l-400)/300))))},72%,40%)`;
const moGauss=(x,x0,w)=>Math.exp(-(((x-x0)/w)**2)*2.77);
const moTri=(x,x0,w)=>Math.max(0,1-Math.abs(x-x0)/w);
const moMir=(x,y)=>`<path d="M${x-28},${y-6} Q${x},${y+10} ${x+28},${y-6}" style="fill:none;stroke:var(--fg)" stroke-width="2.5"/>`;
/* Czerny-Turner 광로. o.cols = [[λ nm, 위치 오프셋 -1..1], ...], o.exit = 'slit' | 'array', o.rot = 격자 회전(°), o.num = 번호 배지 */
function moCT(o={}){const cols=o.cols||[[550,0]],rot=o.rot??0;
 let s=LN(46,252,56,252,'var(--fg)',{w:3})+LN(64,252,74,252,'var(--fg)',{w:3});
 s+=LN(60,252,74,54,'var(--pump)',{w:1})+LN(60,252,106,54,'var(--pump)',{w:1});
 s+=LN(74,54,144,190,'var(--pump)',{w:1})+LN(106,54,176,190,'var(--pump)',{w:1});
 cols.forEach(([l,k])=>{const col=moCol(l),a=214+7*k,b=246+7*k,f=262+22*k;
  s+=LN(144,190,a,54,col,{w:1.3})+LN(176,190,b,54,col,{w:1.3})+LN(a,54,f,250,col,{w:1.3})+LN(b,54,f,250,col,{w:1.3})});
 s+=moMir(90,52)+moMir(230,52)+`<rect x="138" y="186" width="44" height="8" class="dev" transform="rotate(${rot} 160 190)"/>`;
 if(o.exit==='array'){s+=Array.from({length:12},(_,i)=>`<rect x="${222+i*7}" y="252" width="6" height="10" style="fill:var(--s3)" fill-opacity="${.25+.06*(i%3)}" stroke="var(--s3)" stroke-width=".6"/>`).join('')}
 else s+=`<line x1="222" x2="302" y1="252" y2="252" class="lvl2"/>`+LN(242,252,256,252,'var(--fg)',{w:3})+LN(268,252,282,252,'var(--fg)',{w:3});
 s+=T(60,272,'입구 슬릿','sub','middle')+T(90,24,'거울 1','sub','middle')+T(160,222,'회절격자','sub','middle')+T(230,24,'거울 2','sub','middle')+T(262,276,o.exit==='array'?'배열 검출기':'출구 슬릿','sub','middle');
 if(o.num){const B=(x,y,n)=>`<g data-n="${n}">${badge(x,y,n,'var(--fg)')}</g>`;s+=B(30,252,1)+B(54,36,2)+B(196,202,3)+B(270,36,4)+B(298,236,5)}
 return s}
/* 격자 방정식: d = 1/(gr/mm) */
const MO_D=1e6/1200; /* 1200 gr/mm → d ≈ 833 nm (3단계 격자 회전) */
/* 1단계·7단계 격자 그림: 600 gr/mm, 입사각 α = 50° (오른쪽에서 들어옴).
   β는 법선의 입사 반대쪽(왼쪽)에서 잰다: m λ = d (sin α − sin β). β = α면 0차(거울 반사). */
const MO_D1=1e6/600,MO_AL=50*Math.PI/180;
const moBeta=(l,m=1)=>Math.asin(Math.sin(MO_AL)-m*l/MO_D1);
function moGr(cx,cy,R,inLab){const al=MO_AL;
 return `<line x1="40" x2="280" y1="${cy}" y2="${cy}" class="lvl"/>`+Array.from({length:24},(_,i)=>`<path d="M${40+i*10},${cy} l8,6 l2,-6" fill="none" style="stroke:var(--muted)" stroke-width=".8"/>`).join('')
  +`<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${cy-R-8}" class="lvl2"/>`+T(cx,cy-R-14,'법선','sub','middle')
  +LN(cx+R*Math.sin(al),cy-R*Math.cos(al),cx+4,cy-4,'var(--pump)',{w:2,mk:'g'})+T(cx+R*Math.sin(al)+4,cy-R*Math.cos(al)-8,inLab,'sub','end')
  +LN(cx,cy,cx-.7*R*Math.sin(al),cy-.7*R*Math.cos(al),'var(--pump)',{w:1.2,dash:1})+T(cx-.7*R*Math.sin(al)-4,cy-.7*R*Math.cos(al)+4,'0차','sub','end')+T(cx-.7*R*Math.sin(al)-4,cy-.7*R*Math.cos(al)+18,'(거울 반사)','sub','end')
  +`<path d="M${cx},${cy-34} A34,34 0 0 1 ${cx+34*Math.sin(al)},${cy-34*Math.cos(al)}" fill="none" style="stroke:var(--muted)"/>`+T(cx+16,cy-40,'α','sub')}

/* ======================= 모노크로메이터 (Czerny-Turner) ======================= */
const MO=[
{t:'회절격자: 파장마다 꺾이는 각도가 다르다',ec:'격자에 들어오고 나가는 빛 (600 gr/mm, α = 50°)',mc:'회절각 β vs 파장',
 slider:{min:400,max:900,step:10,init:550,label:'파장 λ',fmt:v=>Math.round(v)+' nm'},
 e:v=>{const R=140,cx=160,cy=210,b=moBeta(v);
  let s=moGr(cx,cy,R,'들어오는 빛 (백색)');
  [400,650,900].forEach(l=>{const bb=moBeta(l);s+=LN(cx,cy,cx-(R-10)*Math.sin(bb),cy-(R-10)*Math.cos(bb),moCol(l),{w:1})});
  s+=LN(cx,cy,cx-R*Math.sin(b),cy-R*Math.cos(b),moCol(v),{w:3})+T(cx-R*Math.sin(b)-4,cy-R*Math.cos(b)-6,Math.round(v)+' nm','sub','end',moCol(v))
   +`<path d="M${cx},${cy-56} A56,56 0 0 0 ${cx-56*Math.sin(b)},${cy-56*Math.cos(b)}" fill="none" style="stroke:${moCol(v)}"/>`+T(cx-72*Math.sin(.09),cy-72*Math.cos(.09)+4,'β','sub','end',moCol(v));
  s+=T(20,250,`1차 회절: λ = ${Math.round(v)} nm → β = ${(b*180/Math.PI).toFixed(1)}°`,'lab')+T(20,268,'얇은 선 = 400, 650, 900 nm 위치','sub')+T(282,228,'격자 홈','sub','end');
  return s},
 m:v=>{const bt=l=>moBeta(l)*180/Math.PI;
  const P=plot({x:[400,900],y:[0,50],xt:[400,500,600,700,800,900].map(x=>({v:x,l:String(x)})),yt:[0,10,20,30,40,50].map(y=>({v:y,l:y+'°'})),xl:'wavelength λ (nm)',yl:'회절각 β',T:30});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(50)}" y2="${P.Y(50)}" class="lvl2"/>`+T(P.R,P.Y(50)+14,'0차 (β = α = 50°)','sub','end')+crv(P,bt,400,900,'var(--fg)')+`<circle cx="${P.X(v)}" cy="${P.Y(bt(v))}" r="6" style="fill:${moCol(v)}"/>`+T(P.L+8,P.T-10,'m λ = d (sin α − sin β), m = 1','lab')},
 read:['격자는 아주 촘촘한 홈(여기서는 1 mm에 600개, 홈 간격 d ≈ 1667 nm)이 새겨진 거울이다.','홈마다 반사된 빛이 서로 간섭한다. 이웃 홈에서 온 빛의 길이 차이 d (sin α − sin β)가 파장의 정수배(m λ)가 되는 방향에서만 세게 더해진다. 이게 격자 방정식이다.','여기서 β는 법선의 입사 반대쪽에서 잰 각이다. 책마다 부호 약속이 달라 m λ = d (sin α + sin β)로 쓰고 β를 음수로 두기도 한다. 내용은 같다.','0차(m = 0)는 길이 차이가 0인 방향, 곧 β = α인 거울 반사다. 파장과 상관없어 색이 나뉘지 않는다.','1차에서는 파장이 길수록 β가 작아진다. 거울 반사 방향에서 더 멀리 꺾이는 셈이다. 그래서 백색광이 각도로 펼쳐진다. 슬라이더로 λ를 바꾸면 굵은 선이 움직인다.','홈이 더 촘촘하면(d가 작으면) 같은 파장 차이가 더 큰 각도 차이로 벌어진다.'],
 q:'1200 gr/mm 격자로 바꾸면 d와 각도 퍼짐은?',a:'d가 약 833 nm로 절반이 되고, 같은 파장 차이에 대한 각도 차이는 대략 2배가 된다.'},
{t:'Czerny-Turner 배치: 거울 둘, 격자 하나, 슬릿 둘',ec:'광로 (위에서 본 그림, 보기 쉽게 단순화)',mc:'출구 평면에서 본 빛',
 e:()=>moCT({cols:[[450,-1],[550,0],[650,1]],num:1}),
 m:()=>{const P=plot({x:[-6,6],y:[0,1.15],xt:[{v:-4,l:'−4'},{v:0,l:'0'},{v:4,l:'+4'}],xl:'출구 평면 위치 (mm, 예시)',L:30,noy:1,T:34});
  let s=P.s+`<g data-n="5"><rect x="${P.X(-.5)}" y="${P.T}" width="${P.X(.5)-P.X(-.5)}" height="${P.B-P.T}" style="fill:var(--s4)" fill-opacity=".18"/>${badge(P.X(0),P.T-12,5,'var(--fg)')}</g>`;
  [[450,-4],[550,0],[650,4]].forEach(([l,x])=>{s+=crv(P,u=>moGauss(u,x,.8),x-2,x+2,moCol(l))+T(P.X(x),P.Y(1.06),l+' nm','sub','middle',moCol(l))});
  return s+T(P.X(0)+14,P.T-8,'출구 슬릿 (나머지는 막힘)','sub')},
 read:[`${c(1,'f')} 입구 슬릿이 좁은 광원 역할을 한다.`,`${c(2,'f')} 오목거울 1이 퍼지는 빛을 평행광으로 만든다.`,`${c(3,'f')} 격자가 파장마다 다른 각도로 보낸다(1단계).`,`${c(4,'f')} 오목거울 2가 평행광을 다시 모으는데, 각도가 다르니 파장마다 출구 평면의 다른 위치에 초점이 맺힌다.`,`${c(5,'f')} 출구 슬릿은 그중 한 좁은 띠만 통과시킨다. "한 색만 고른다"는 뜻의 monochromator다.`,'거울 두 개를 대칭으로 놓으면 한 거울이 만드는 수차(코마)를 다른 거울이 일부 상쇄한다(확인 필요). 실제 장치는 각도가 더 작고, 그림의 광선 간격은 보기 쉽게 과장했다.'],
 q:'출구 슬릿을 빼면 어떤 장치가 되나?',a:'출구 평면 전체에 스펙트럼이 펼쳐진다. 거기에 배열 검출기를 두면 여러 파장을 한 번에 찍는 분광기(spectrograph)가 된다(6단계).'},
{t:'격자를 돌리면 출구 파장이 바뀐다',ec:'격자 회전',mc:'광원 스펙트럼 위의 통과 대역',
 slider:{min:13,max:34,step:.5,init:20,label:'격자 각도 θ',fmt:v=>v.toFixed(1)+'°',play:1},
 e:v=>{const l=2*MO_D*Math.cos(15*Math.PI/180)*Math.sin(v*Math.PI/180);
  return moCT({cols:[[l,0]],rot:v-20})+T(96,244,`θ = ${v.toFixed(1)}°`,'lab')+T(96,262,`출구 λ ≈ ${Math.round(l)} nm`,'lab','start',moCol(l))},
 m:v=>{const l=2*MO_D*Math.cos(15*Math.PI/180)*Math.sin(v*Math.PI/180),src=x=>Math.min(1,.15+.85*Math.exp(-(((x-750)/320)**2)));
  const P=plot({x:[350,950],y:[0,1.15],xt:[400,500,600,700,800,900].map(x=>({v:x,l:String(x)})),xl:'wavelength λ (nm)',yl:'세기 (상대)',T:30});
  return P.s+crv(P,src,350,950,'var(--s6)',{dash:1})+`<rect x="${P.X(l-6)}" y="${P.Y(src(l))}" width="${Math.max(2,P.X(l+6)-P.X(l-6))}" height="${P.B-P.Y(src(l))}" style="fill:${moCol(l)}" fill-opacity=".8"/>`
   +T(P.R,P.T-12,'점선 = 할로젠 램프 (예시)','sub','end')+T(P.X(l),P.Y(1.1),Math.round(l)+' nm','sub','middle')},
 read:['Czerny-Turner에서는 입구와 출구 방향이 고정되어 있고 격자만 돈다. 격자를 돌리면 α와 β가 함께 바뀌고 출구 슬릿에 오는 파장이 바뀐다.','입사와 회절 사이 각도(편향각)가 고정이면 λ = (2d/m) cos K sin θ 꼴이 된다. K = 편향각의 절반, θ = 격자 회전각이다(여기서는 K = 15° 가정).','재생을 누르면 격자가 돌며 통과 대역이 광원 스펙트럼 위를 훑는다. 출구 뒤에 PMT 같은 단일 검출기를 두고 값을 기록하면 파장 스캔이 된다.','그래서 모노크로메이터 + 단일 검출기는 "한 번에 한 파장"이다. 넓은 범위를 찍으려면 시간이 걸린다.'],
 q:'파장 스캔 중 광원 세기가 흔들리면 어떻게 되나?',a:'스펙트럼에 그대로 섞인다. 한 파장씩 다른 시간에 재기 때문이다. 그래서 기준 검출기로 광원을 같이 재서 나누거나 이중 빔 배치를 쓴다.'},
{t:'슬릿 폭과 분해능은 맞바꾼다',ec:'출구 평면의 슬릿 상 (Hg 노란 두 줄)',mc:'측정 스펙트럼 (역선형 분산 2.5 nm/mm 예시)',
 slider:{min:50,max:1000,step:10,init:200,label:'슬릿 폭',fmt:v=>Math.round(v)+' µm'},
 e:v=>{const D=2.5,sc=100,w=v/1000*sc,sep=2.1/D*sc,x1=120,x2=x1+sep;
  let s=T(20,30,`통과 대역 ≈ 슬릿 폭 × 역선형 분산`,'lab')+T(20,48,`= ${(v/1000).toFixed(2)} mm × 2.5 nm/mm = ${(v/1000*D).toFixed(2)} nm`,'lab');
  s+=T(20,72,v/1000*D<2.1?'→ 두 줄이 갈라져 보인다':'→ 두 줄이 한 덩어리로 뭉친다','labn')+`<line x1="20" x2="300" y1="200" y2="200" class="lvl2"/>`+T(20,218,'출구 평면','sub');
  s+=`<g data-n="1"><rect x="${x1-w/2}" y="110" width="${w}" height="80" style="fill:var(--s4)" fill-opacity=".45"/>${badge(x1,98,1,'var(--s4)')}</g>`;
  s+=`<g data-n="2"><rect x="${x2-w/2}" y="110" width="${w}" height="80" style="fill:var(--s5)" fill-opacity=".45"/>${badge(x2,98,2,'var(--s5)')}</g>`;
  s+=LN(x1,236,x2,236,'var(--muted)',{w:1})+T((x1+x2)/2,252,'두 줄 간격 2.1 nm = 0.84 mm','sub','middle')+T(20,272,'막대 폭 = 입구 슬릿의 상 (슬릿 폭과 같음, 배율 1 가정)','sub');
  return s},
 m:v=>{const bp=v/1000*2.5,h=v/1000;const P=plot({x:[572,584],y:[0,1.15],xt:[574,576,578,580,582].map(x=>({v:x,l:String(x)})),xl:'wavelength λ (nm)',yl:'세기 (상대, 같은 축)',T:30});
  const f=x=>h*(moTri(x,577.0,bp)+moTri(x,579.1,bp));
  return P.s+crv(P,f,572,584,'var(--fg)',{n:600})+crv(P,x=>h*moTri(x,577.0,bp),572,584,'var(--s4)',{n:600,dash:1,w:1.2})+crv(P,x=>h*moTri(x,579.1,bp),572,584,'var(--s5)',{n:600,dash:1,w:1.2})
   +`<g data-n="1">${badge(P.X(577),P.Y(Math.max(f(577),h))-16,1,'var(--s4)')}</g><g data-n="2">${badge(P.X(579.1),P.Y(Math.max(f(579.1),h))-16,2,'var(--s5)')}</g>`
   },
 read:['출구에서 옆으로 1 mm 갈 때 파장이 얼마나 바뀌는지를 역선형 분산(nm/mm)이라 한다. 여기서는 2.5 nm/mm로 가정했다(초점거리 약 300 mm, 1200 gr/mm 근처의 대략값, 확인 필요).',`입구 슬릿의 상이 출구 평면에 맺힌다. 파장이 다른 ${c(1,'s4')} 577.0 nm와 ${c(2,'s5')} 579.1 nm는 0.84 mm 떨어진 두 막대가 된다.`,'슬릿을 넓히면 막대가 넓어져 서로 겹친다. 통과 대역이 두 줄 간격(2.1 nm)보다 넓어지면 한 봉우리로 뭉친다.','대신 슬릿이 넓을수록 빛이 많이 들어온다. 오른쪽 그림은 같은 축이라 슬릿을 넓히면 봉우리가 높아진다. 분해능과 신호를 맞바꾸는 셈이다.','분산을 키우려면 초점거리를 늘리거나 홈이 더 촘촘한 격자를 쓴다.'],
 q:'슬릿 50 µm, 역선형 분산 4 nm/mm면 통과 대역은?',a:'0.05 mm × 4 nm/mm = 0.2 nm.'},
{t:'홈 개수와 blaze: 효율이 높은 파장을 고른다',ec:'격자 단면 (톱니 홈)',mc:'회절 효율 (예시)',
 slider:{min:0,max:2,step:1,init:0,label:'격자',fmt:v=>['1200 gr/mm · 500 nm','600 gr/mm · 1 µm','150 gr/mm · 4 µm'][Math.round(v)]},
 e:v=>{const i=Math.round(v),p=[16,32,128][i],th=17.5*Math.PI/180,x0=30,x1=290,y=170;let d=`M${x0},${y}`;
  for(let x=x0;x<x1;x+=p){const h=p*Math.cos(th)*Math.sin(th);d+=` L${Math.min(x1,x+p*Math.cos(th)**2)},${y-h} L${Math.min(x1,x+p)},${y}`}
  const xf=x0+p*Math.cos(th)**2*.5,yf=y-p*Math.cos(th)*Math.sin(th)*.5;
  return `<path d="${d}" style="fill:var(--soft);stroke:var(--fg)" stroke-width="1.4"/>`+`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" class="lvl2"/>`
   +LN(x0,y+18,x0+p,y+18,'var(--muted)',{w:1})+LN(x0,y+12,x0,y+24,'var(--muted)',{w:1})+LN(x0+p,y+12,x0+p,y+24,'var(--muted)',{w:1})+T(x0+p+6,y+22,'d = '+['833 nm','1667 nm','6.7 µm'][i],'sub')
   +T(20,30,['1200 gr/mm, blaze 500 nm','600 gr/mm, blaze 1 µm','150 gr/mm, blaze 4 µm'][i],'lab')+T(20,48,'세 격자 모두 blaze 각 약 17.5° (예시)','sub')
   +T(20,250,'홈 면의 기울기(blaze 각)가 한 파장에서 반사 방향과','sub')+T(20,266,'회절 방향을 맞춰 그 파장 효율을 높인다','sub')+(i===2?'':T(xf,yf-34,'톱니 하나','sub','middle'))},
 m:v=>{const i=Math.round(v),lb=[.5,1,4];const P=plot({x:[.3,10],y:[0,1],logx:1,xt:[{v:.3,l:'0.3'},{v:1,l:'1'},{v:3,l:'3'},{v:10,l:'10'}],yt:[{v:0,l:'0'},{v:.5,l:'50%'},{v:1,l:'100%'}],xl:'wavelength (µm)',yl:'효율',T:30});
  const ef=b=>x=>.85*Math.exp(-((Math.log10(x/b)/(x<b?.17:.3))**2));
  return P.s+lb.map((b,j)=>crv(P,ef(b),b/2.5,Math.min(10,b*4),j===i?'var(--s3)':'var(--s6)',{w:j===i?2.5:1,dash:j!==i,n:300})).join('')+lb.map((b,j)=>T(P.X(b),P.Y(.9),['500 nm','1 µm','4 µm'][j],'sub','middle',j===i?'var(--s3)':undefined)).join('')+T(P.R,P.T-12,'실선 = 고른 격자, 점선 = 나머지','sub','end')},
 read:['홈 단면을 톱니 모양으로 깎으면, 각 홈 면이 작은 거울처럼 한 방향으로 빛을 몰아 준다. 그 방향이 원하는 파장의 1차 회절 방향과 맞으면 효율이 크게 오른다. 그 파장을 blaze 파장이라 한다.','효율 곡선은 blaze 파장 근처에서 높고, 짧은 쪽으로 빨리, 긴 쪽으로 천천히 떨어진다(대략적인 모양, 예시).','파장이 길수록 홈 간격 d도 커야 한다. m λ ≤ 2d라야 1차 회절이 생기기 때문이다. 그래서 중적외선용 격자는 홈이 성기다(예: 수십–150 gr/mm, 확인 필요).','분광기 하나에 격자 두세 개를 달아 돌려 가며 쓰는 경우가 많다. 측정 파장에 맞는 격자를 골랐는지 먼저 본다.'],
 q:'5 µm(2000 cm⁻¹)를 1200 gr/mm 격자로 보면?',a:'d ≈ 0.83 µm라 m λ ≤ 2d ≈ 1.7 µm 조건을 넘는다. 1차 회절이 생기지 않는다. 중적외선용 격자(홈이 성긴 것)로 바꿔야 한다.'},
{t:'출구 슬릿 대신 배열 검출기: 분광기(spectrograph)',ec:'출구 평면에 배열 검출기',mc:'한 번에 찍은 스펙트럼 (64화소, 예시)',
 e:()=>moCT({cols:[[450,-1],[550,0],[650,1]],exit:'array'})+T(96,244,'출구 평면 전체를','sub')+T(96,260,'화소 수십~수천 개가 받는다','sub'),
 m:()=>{const P=plot({x:[0,65],y:[0,1.15],xt:[{v:1,l:'1'},{v:16,l:'16'},{v:32,l:'32'},{v:48,l:'48'},{v:64,l:'64'}],xl:'화소 번호',yl:'신호 (상대)',T:30});
  let s=P.s;for(let i=1;i<=64;i++){const y=.08+.92*Math.exp(-(((i-30)/14)**2))-.35*Math.exp(-(((i-38)/2.5)**2));s+=`<rect x="${P.X(i-.4)}" y="${P.Y(y)}" width="${P.X(i+.4)-P.X(i-.4)}" height="${P.B-P.Y(y)}" style="fill:var(--s3)" fill-opacity=".75"/>`}
  return s+T(P.X(38),P.Y(.38),'흡수 띠','sub','middle')+T(P.R,P.T-12,'화소 하나 = 파장 한 칸','sub','end')},
 read:['출구 슬릿을 빼고 출구 평면에 CCD나 MCT 배열을 놓으면, 여러 파장을 한 번에 찍는다. 이걸 spectrograph(분광기)라 부른다.','화소당 파장 간격 = 역선형 분산 × 화소 폭. 예: 2.5 nm/mm × 25 µm = 0.0625 nm (예시).','분해능은 출구 슬릿 대신 입구 슬릿 폭과 화소 크기가 정한다. 입구 슬릿 상이 화소 두세 개보다 좁으면 화소가 한계가 된다.','우리 IR pump-probe 셋업은 모노크로메이터(Horiba iHR 320) 뒤에 MCT 배열(한 스펙트럼 64화소)을 둔다. 격자와 화소당 간격은 확인 필요(논문 TODO).','배열이라도 화소 수가 유한해 한 번에 보는 범위가 정해진다. 범위를 넓히려면 격자를 돌려 여러 구간을 이어 붙인다.'],
 q:'64화소 배열로 200 cm⁻¹ 범위를 찍으면 화소당 간격은?',a:'약 3 cm⁻¹ (200 / 64 ≈ 3.1 cm⁻¹).'},
{t:'고차 회절이 겹친다: order-sorting 필터',ec:'같은 방향으로 나가는 두 빛',mc:'측정 스펙트럼 (가로축 = 1차 기준 파장)',
 tg:[{k:'f',l:'long-pass 필터 (500 nm 아래 차단)',on:false}],
 e:(v,tg)=>{const cx=160,cy=200,R=140,b=moBeta(800);
  let s=moGr(cx,cy,R,'백색광');
  s+=`<g data-n="1">`+LN(cx,cy,cx-R*Math.sin(b)-2,cy-R*Math.cos(b),'var(--s3)',{w:3})+badge(cx-R*.62*Math.sin(b)-22,cy-R*.62*Math.cos(b),1,'var(--s3)')+'</g>';
  if(!tg.f)s+=`<g data-n="2">`+LN(cx,cy,cx-R*Math.sin(b)+2,cy-R*Math.cos(b),'var(--s5)',{w:2,dash:1})+badge(cx-R*.75*Math.sin(b)+18,cy-R*.75*Math.cos(b),2,'var(--s5)')+'</g>';
  s+=T(20,24,'1 × 800 nm = 2 × 400 nm','lab')+T(20,42,'m λ가 같으면 β도 같다','sub');

 m:v=>{const f=(g,t)=>Math.exp(-g/(2*dtKT(t)))/Math.exp(-g/(2*dtKT(300)));const P=plot({x:[60,300],y:[1e-9,1],logy:1,xt:[{v:77,l:'77'},{v:150,l:'150'},{v:200,l:'200'},{v:300,l:'300'}],yt:[{v:1,l:'1'},{v:1e-3,l:'10⁻³'},{v:1e-6,l:'10⁻⁶'},{v:1e-9,l:'10⁻⁹'}],xl:'온도 (K)',yl:'상대값',L:62,T:30});

   +`<circle cx="${P.X(v)}" cy="${P.Y(f(.1,v))}" r="5" style="fill:var(--s1)"/>`+`<line x1="${P.X(140)}" x2="${P.X(140)+22}" y1="${P.Y(1e-6)}" y2="${P.Y(1e-6)}" style="stroke:var(--s1)" stroke-width="2"/>`+T(P.X(140)+28,P.Y(1e-6)+4,'0.1 eV (약 12 µm 차단)','sub')+`<line x1="${P.X(140)}" x2="${P.X(140)+22}" y1="${P.Y(1e-7)}" y2="${P.Y(1e-7)}" style="stroke:var(--s5)" stroke-width="2" stroke-dasharray="5 4"/>`+T(P.X(140)+28,P.Y(1e-7)+4,'0.25 eV (약 5 µm 차단)','sub')},
 read:['띠 간격이 작으면 긴 파장을 보지만, 열에너지만으로도 전자가 띠 간격을 넘어 버린다. 빛 없이 생긴 이 전자가 암전류와 잡음이 된다.','300 K의 kT는 약 26 meV(약 208 cm⁻¹)다. 띠 간격 0.1 eV는 kT의 4배뿐이다. Si(1.1 eV)는 kT의 40배가 넘어 실온에서도 훨씬 조용하다.','열 전자 수는 대략 exp(−E_g / 2kT)를 따른다(온도 앞 인자는 무시한 근사). 세어 보기: 300 K에서 1000개라면 77 K에서는 약 4개다.','그래서 MCT는 액체 질소(77 K)로 식힌다. 열전 냉각(TE)은 단 수에 따라 대략 200–240 K까지 내려간다(그림의 220 K는 예시, 확인 필요). 77 K까지 못 내려가 16 µm 같은 긴 파장 MCT에는 LN₂를 대신하지 못한다(논문 A.4.3).','띠 간격도 온도에 따라 바뀐다. 측정 중 온도가 일정해야 하는 이유이기도 하다. LN₂가 떨어지면 신호와 잡음이 같이 변한다.'],
 q:'5 µm 차단 MCT(0.25 eV)와 12 µm 차단 MCT(0.1 eV) 중 냉각이 더 절실한 쪽은?',a:'12 µm 쪽. 띠 간격이 작아 같은 온도에서 열 전자가 훨씬 많다.'},
{t:'PMT: 광전자 하나를 수백만 개로 키운다',ec:'광음극 → 다이노드 → 양극',mc:'증폭률 vs 다이노드 단 수 (단마다 4배)',
 slider:{min:1,max:12,step:1,init:10,label:'다이노드 수',fmt:v=>Math.round(v)+'단'},
 e:v=>{const n=Math.round(v);let s=`<rect x="12" y="150" width="14" height="70" style="fill:var(--s5)" fill-opacity=".35" stroke="var(--s5)"/>`+T(19,240,'광음극','sub','middle')+LN(-4,130,14,166,'var(--s4)',{w:2,mk:'s4'})+T(4,120,'광자','sub');

  const ax=26+(n+1)*20;s+=`<rect x="${ax-4}" y="140" width="8" height="40" style="fill:var(--s3)"/>`+LN(px,py,ax-4,160,'var(--s2)',{w:3.5})+T(ax,196,'양극','sub','middle');
  return s+T(12,36,`전자 1개 × 4^${n} = ${Math.round(4**n).toLocaleString('en-US')}개`,'lab')+T(12,54,`= 전하 약 ${(4**n*1.602e-19*1e15).toPrecision(2)} fC`,'sub')+T(12,266,'선 굵기 = 전자 수 (보기용)','sub')},
 m:v=>{const n=Math.round(v);const P=plot({x:[0,13],y:[1,1e8],logy:1,xt:[1,4,8,12].map(x=>({v:x,l:String(x)})),yt:[{v:1,l:'1'},{v:1e2,l:'10²'},{v:1e4,l:'10⁴'},{v:1e6,l:'10⁶'},{v:1e8,l:'10⁸'}],xl:'다이노드 수',yl:'증폭률',T:30});
  let s=P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(1e6)}" y2="${P.Y(1e6)}" class="lvl2"/>`+T(P.L+6,P.Y(1e6)-6,'10⁶ (흔한 PMT 수준, 대략)','sub');
  for(let i=1;i<=12;i++)s+=`<circle cx="${P.X(i)}" cy="${P.Y(4**i)}" r="${i===n?6:3}" style="fill:${i===n?'var(--s2)':'var(--s6)'}"/>`;
  return s},
 read:['광자가 광음극에 맞으면 광전자 하나가 튀어나온다(광음극 QE 대략 10–30%, 확인 필요).','광전자는 전압으로 가속되어 첫 다이노드에 부딪히고, 전자 몇 개를 새로 떼어 낸다. 이게 단마다 반복된다.','세어 보기: 단마다 4배면 10단에서 4¹⁰ ≈ 10⁶배다. 전자 하나가 약 0.16 pC 펄스가 되어 광자 하나도 셀 수 있다.','응답이 빠르다(대략 ns). 그래서 형광 수명 측정이나 아주 약한 빛에 쓴다.','단점: 화소가 하나라 스펙트럼을 한 번에 못 찍고(모노크로메이터로 스캔, 앞 탭 3단계), 전원이 켜진 상태에서 센 빛을 받으면 망가질 수 있다.'],
 q:'단마다 3배, 12단이면 증폭률은?',a:'3¹² ≈ 5.3 × 10⁵.'},
{t:'CCD: 화소마다 모아서 한 칸씩 밀어 읽는다',ec:'전하 이동 (화소 8개, 예시)',mc:'읽어 낸 스펙트럼',
 slider:{min:0,max:8,step:.02,init:0,label:'읽기 진행',fmt:v=>Math.floor(v)+' / 8칸',play:1},

  for(let i=0;i<8;i++){const x=24+i*30;s+=`<rect x="${x}" y="110" width="26" height="80" rx="2" style="fill:var(--soft);stroke:var(--fg)"/>`+T(x+13,206,String(i+1),'sub','middle')}
  for(let j=0;j<8;j++){const pos=j+k+(j+k<8?fr*.9:0);if(j+k>=8)continue;const x=24+pos*30,h=q[j]*76;s+=`<rect x="${x+3}" y="${188-h}" width="20" height="${h}" style="fill:var(--s2)" fill-opacity=".75"/>`}

  return s+T(20,36,'① 노출: 화소(우물)마다 광전자를 모은다','sub')+T(20,54,'② 읽기: 전하를 한 칸씩 오른쪽으로 밀어 끝에서 하나씩 잰다','sub')+T(20,236,'막대 = 화소에 모인 전하','sub')+T(20,254,'가로 = 파장 방향 (분광기 출구 평면)','sub')},
 m:v=>{const q=[.25,.5,.9,1,.7,.4,.3,.15],k=Math.floor(v);const P=plot({x:[.4,8.6],y:[0,1.15],xt:[1,2,3,4,5,6,7,8].map(x=>({v:x,l:String(x)})),xl:'화소 번호',yl:'신호 (상대)',T:30});
  let s=P.s;for(let j=0;j<8;j++){const read=j>=8-k;s+=read?`<rect x="${P.X(j+1-.35)}" y="${P.Y(q[j])}" width="${P.X(j+1+.35)-P.X(j+1-.35)}" height="${P.B-P.Y(q[j])}" style="fill:var(--s2)"/>`:`<rect x="${P.X(j+1-.35)}" y="${P.Y(.06)}" width="${P.X(j+1+.35)-P.X(j+1-.35)}" height="${P.B-P.Y(.06)}" style="fill:var(--line)"/>`}
  return s+T(P.R,P.T-12,k>=8?'한 장 완성':'오른쪽 끝 화소부터 차례로 들어온다','sub','end')},
 read:['노출 시간 동안 화소마다 광전자를 모은다. 화소를 전자를 담는 우물로 보면 된다.','노출이 끝나면 전하를 한 칸씩 옆으로 밀어, 끝에 있는 증폭기 하나로 차례로 잰다. 재생을 누르면 오른쪽 끝 화소부터 읽혀 오른쪽 그림이 채워진다.','분광기 출구 평면에 두면 가로가 파장이 되어 스펙트럼 한 장을 한 번에 얻는다(앞 탭 6단계). 실제 분광용 CCD는 세로 방향 화소를 먼저 합친(binning) 뒤 가로로 읽는다.','QE가 높다(뒷면 조사형 대략 최대 90%, 확인 필요). 대신 읽는 데 시간이 걸려 1 kHz 샷마다 한 장씩 읽기는 보통 어렵다(확인 필요).','냉각하면 암전류(열 전자, 3단계와 같은 논리)가 준다. Si는 띠 간격이 커서 MCT만큼 세게 식히지 않아도 된다.'],
 q:'CCD 노출 중에 셔터 없이 읽기를 시작하면?',a:'전하를 미는 동안에도 빛이 들어와 다른 화소 자리에 전하가 더해진다. 스펙트럼이 옆으로 번진다(smear).'},
{t:'잡음 세어 보기: 광자가 적을 때와 많을 때',ec:'지금 광자 수에서 신호와 잡음 (전자 개수)',mc:'SNR vs 광자 수 (log-log)',
 slider:{min:.5,max:4,step:.05,init:2.6,label:'광자 수',fmt:v=>Math.round(10**v).toLocaleString('en-US')+'개'},
 e:v=>{const N=10**v,pS=.25*N,pN=Math.sqrt(pS),cS=.9*N,cN=Math.sqrt(cS+25);
  const row=(y,lab,S,Nn,k,n)=>{const sc=x=>Math.max(1,Math.min(200,200*Math.log10(1+x)/Math.log10(1+.9e4)));return `<g data-n="${n}">${badge(26,y+10,n,COL[k])}</g>`+T(42,y-6,lab,'lab')
   +`<rect x="42" y="${y}" width="${sc(S)}" height="12" style="fill:${COL[k]}"/>`+T(48+sc(S),y+10,'신호 '+S.toFixed(S<10?1:0),'sub')
   +`<rect x="42" y="${y+18}" width="${sc(Nn)}" height="12" style="fill:${COL[k]}" fill-opacity=".35"/>`+T(48+sc(Nn),y+28,'잡음 '+Nn.toFixed(1),'sub')+T(42,y+48,'SNR = '+(S/Nn).toFixed(1),'labn','start',COL[k])};
  return row(50,'PMT (QE 25%, 읽기 잡음 무시)',pS,pN,'s5',1)+row(150,'CCD (QE 90%, 읽기 잡음 5 e⁻)',cS,cN,'s2',2)+T(20,262,'막대 길이는 log 눈금 (보기용)','sub')},
 m:v=>{const N=10**v,sp=n=>Math.sqrt(.25*n),sc=n=>.9*n/Math.sqrt(.9*n+25);const P=plot({x:[3,1e4],y:[.1,100],logx:1,logy:1,xt:[{v:10,l:'10'},{v:100,l:'100'},{v:1e3,l:'10³'},{v:1e4,l:'10⁴'}],yt:[{v:.1,l:'0.1'},{v:1,l:'1'},{v:10,l:'10'},{v:100,l:'100'}],xl:'광자 수',yl:'SNR',T:30});
  return P.s+`<g data-n="1">${crv(P,sp,3,1e4,'var(--s5)')}<circle cx="${P.X(N)}" cy="${P.Y(sp(N))}" r="5" style="fill:var(--s5)"/></g><g data-n="2">${crv(P,sc,3,1e4,'var(--s2)')}<circle cx="${P.X(N)}" cy="${P.Y(sc(N))}" r="5" style="fill:var(--s2)"/></g>`
   +`<line x1="${P.X(10.7)}" x2="${P.X(10.7)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(10.7)+4,P.Y(.2),'약 11개에서 역전 (가정 아래)','sub')+T(P.X(800),P.Y(4),'PMT','sub','start','var(--s5)')+T(P.X(150),P.Y(25),'CCD','sub','end','var(--s2)')},
 read:['광자는 무작위로 도착한다. 평균 N개를 받으면 흔들림이 √N이다(shot noise). 전자 100개면 잡음 10, SNR 10이다. 전자 10 000개면 잡음 100, SNR 100이다.','읽기 잡음은 읽을 때마다 더해지는 고정 잡음이다(CCD 대략 수 e⁻, 여기서는 5 e⁻ 가정, 확인 필요). 신호가 작을 때 SNR을 크게 깎는다.',`${c(1,'s5')} PMT는 증폭이 커서 읽기 잡음을 거의 무시할 수 있다. 대신 QE가 낮다(25% 가정).`,`${c(2,'s2')} CCD는 QE가 높다(90% 가정). 신호가 충분하면 읽기 잡음이 묻혀 CCD가 이긴다.`,'이 가정에서는 광자 약 11개 아래에서만 PMT가 유리하다. 실제로는 PMT의 증폭 잡음, 양쪽의 암전류가 더해져 경계가 움직인다(예시 계산).'],
 q:'광자 400개: PMT(QE 25%)와 CCD(QE 90%, 읽기 잡음 5 e⁻)의 SNR은?',a:'PMT 전자 100개 → SNR 10. CCD 전자 360개 → √(360 + 25) ≈ 19.6 → SNR 약 18.'},
{t:'정리: 어떤 실험에 무엇을 쓰나',ec:'파장 범위와 읽는 속도 (대략)',mc:'비교 표 (대략, 예시)',
 e:()=>{const P=plot({x:[.2,20],y:[0,5],logx:1,xt:[{v:.2,l:'0.2'},{v:1,l:'1'},{v:5,l:'5'},{v:20,l:'20'}],xl:'wavelength (µm)',L:20,noy:1,T:30});
  const it=[['PMT · 화소 1 · ns 응답',.2,.9,'s5'],['CCD · 배열 · 노출 후 읽기',.2,1.1,'s2'],['InGaAs 배열 · 근적외선',.9,1.7,'s4'],['MCT 배열 · 1 kHz 샷마다',2,16,'s1']];
  return P.s+it.map(([l,a,b,k],i)=>{const y=P.Y(4.4-i*1.05);return `<g data-n="${i+1}">`+badge(P.X(.2)+10,y+10,i+1,COL[k])+`<rect x="${P.X(a)}" y="${y+2}" width="${P.X(b)-P.X(a)}" height="14" rx="3" style="fill:${COL[k]}" fill-opacity=".45"/></g>`+T(P.X(i<2?.26:a),y-6,l,'sub')}).join('')},
 m:()=>{const rows=[['','화소','한 번 읽기','쓰는 곳 (예시)'],['① PMT','1','ns (연속)','형광 수명'],['② CCD','수백–수천','ms–s','Raman, 형광'],['③ InGaAs','수백','약 0.1–1 ms','근적외선 분광'],['④ MCT 배열','수십–백여','1 ms (샷마다)','IR pump-probe']],xs=[8,78,140,226];
  let s='';rows.forEach((r,i)=>{const y=40+i*34;if(i)s+=`<g data-n="${i}"><line x1="8" x2="316" y1="${y-21}" y2="${y-21}" style="stroke:var(--line)"/></g>`;r.forEach((t,j)=>{s+=T(xs[j],y,t,i?'sub':'lab','start',i&&j===0?COL[['s5','s2','s4','s1'][i-1]]:undefined)})});
  return s+TM(8,206,['한 번 읽기 = 값 하나(PMT)나 스펙트럼 한 장(배열)을','얻는 데 걸리는 시간 (대략, 모델마다 다름)','우리 IR pump-probe: MCT 배열 128화소 (2줄 × 64),','LN₂ 77 K, 1 kHz 샷마다 읽기 (논문 3.3, A.4)'],'sub',undefined,15)},
 read:[`${c(1,'s5')} PMT: 화소 하나, 빠르고 증폭이 크다. 약한 빛, 단일 파장, 형광 수명에 쓴다. 스펙트럼은 모노크로메이터로 스캔한다.`,`${c(2,'s2')} CCD: QE가 높고 화소가 많다. Raman, 형광 스펙트럼처럼 노출을 길게 주고 한 장씩 찍는 측정에 맞는다.`,`${c(3,'s4')} InGaAs 배열: Si가 못 보는 근적외선(대략 0.9–1.7 µm)용이다.`,`${c(4,'s1')} MCT 배열: 중적외선이고 1 kHz 샷마다 읽을 수 있다. 그래서 IR pump-probe와 <a href="2d-spectroscopy.html">2D IR</a>에서 pump-on과 pump-off를 샷마다 비교한다.`,'"한 번 읽기"는 값이나 스펙트럼 한 장을 얻는 데 걸리는 시간이다. PMT는 출력이 연속이라 ns 단위로 따라가고, CCD는 노출과 읽기를 합쳐 ms–s가 걸린다. MCT 배열은 1 kHz 레이저에 맞춰 1 ms마다 한 장씩 읽는다(값은 대략, 확인 필요).','고르는 순서: 첫째 파장(재료가 정함) → 둘째 빛의 세기(잡음, 6단계) → 셋째 읽는 시간과 화소 수(한 장씩인가, 샷마다인가). 표의 값은 대략이고 모델마다 다르다(확인 필요).'],
 q:'Raman을 785 nm로 재고 Raman shift 3000 cm⁻¹까지 보려면 CCD로 충분한가?',a:'785 nm에서 3000 cm⁻¹ 떨어진 산란광은 약 1 µm다. Si CCD 한계(약 1.1 µm) 바로 안쪽이라 볼 수는 있지만 QE가 많이 떨어진다. 그래서 785 nm Raman은 근적외선 감도를 높인 CCD를 쓰거나 범위를 줄인다(대략).'}];

const TABS=[
 {id:'mo',name:'모노크로메이터',sub:'Czerny-Turner',desc:'회절격자가 파장을 각도로 펼치고, 거울 둘과 슬릿 둘이 한 색을 고른다. 분해능, blaze, 고차 회절, 보정까지.',steps:MO},
 {id:'dt',name:'검출기',sub:'MCT · CCD · PMT',desc:'광자가 전자가 되는 순간부터. 재료가 정하는 파장 한계, 냉각, PMT 증폭, CCD 읽기, 잡음 세어 보기.',steps:DT}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent='재생';
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${i+1}단계" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent='재생';return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent='정지';
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent='재생'}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
render();
</script>
