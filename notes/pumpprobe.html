<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}

.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
const LANG='ko';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title IR pump-probe 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · IR pump-probe
// @status 검토 중
// @lang ko en
// @title.en IR Pump-Probe Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · IR pump-probe
// @status.en Under review
/* IR pump-probe 노트: 원리·신호, 셋업 검증. 근거는 졸업 논문 1.6.4, 3장, 부록 B의 방법·장비 부분만.
   우리 측정 결과(HgSe, HDO 측정값)는 넣지 않는다. HDO는 문헌 행동(제대로 된 셋업이 재현해야 할 것)으로만 쓴다.
   부호: 연구실 규약 ΔT/T. 빨강 = +, 파랑 = −. ΔA와 부호가 반대다.
   글은 TR('한국어','English')로 쓴다 (영어판 notes/en/pumpprobe.html). */
const NOTE={key:'pumpprobe'};

/* ---------- 헬퍼 (pp) ---------- */
const ppG=(x,x0,f)=>Math.exp(-2.7726*((x-x0)/f)**2);            /* 가우시안, f = FWHM */
const ppErf=x=>{const s=Math.sign(x),a=Math.abs(x),t=1/(1+.3275911*a);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-a*a))};
/* 시간축 위 펄스 모양: 가운데 x, 바닥 y, 높이 h, FWHM w(px) */
function ppPulse(x,y,h,w,col,op=.35){let d=`M${(x-1.6*w).toFixed(1)},${y}`;for(let i=-32;i<=32;i++){const u=i/20*w;d+=` L${(x+u).toFixed(1)},${(y-h*ppG(u,0,w)).toFixed(1)}`}
 return `<path d="${d} Z" style="fill:${col};stroke:${col}" fill-opacity="${op}" stroke-width="1.2"/>`}
/* 0을 기준으로 + 부분은 빨강, − 부분은 파랑으로 칠한 곡선 (ΔT/T 부호 규약) */
function ppSigned(P,f,a,b,n=300){let up=`M${P.X(a)},${P.Y(0)}`,dn=up,ln='';
 for(let i=0;i<=n;i++){const v=a+(b-a)*i/n,y=f(v),X=P.X(v).toFixed(1);up+=` L${X},${P.Y(Math.max(0,y)).toFixed(1)}`;dn+=` L${X},${P.Y(Math.min(0,y)).toFixed(1)}`;ln+=(i?' L':'M')+X+','+P.Y(y).toFixed(1)}
 const end=` L${P.X(b)},${P.Y(0)} Z`;
 return `<path d="${up+end}" style="fill:var(--s1)" fill-opacity=".28"/><path d="${dn+end}" style="fill:var(--s2)" fill-opacity=".28"/><path d="${ln}" fill="none" style="stroke:var(--fg)" stroke-width="1.8"/>`}
const ppZero=P=>`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(0)}" y2="${P.Y(0)}" class="ax"/>`;
/* 범례 한 줄: 선 견본 + 글자 */
const ppLeg=(x,y,col,lab,dash)=>`<line x1="${x}" x2="${x+20}" y1="${y}" y2="${y}" style="stroke:${col}" stroke-width="2"${dash?' stroke-dasharray="5 4"':''}/>`+T(x+26,y+4,lab,'sub');
/* 편광자 원: 가운데, 반지름, 투과축 각도(수직 기준, 도) */
const ppPol=(x,y,r,deg)=>{const a=deg*Math.PI/180,dx=r*.85*Math.sin(a),dy=r*.85*Math.cos(a);return `<circle cx="${x}" cy="${y}" r="${r}" style="fill:var(--soft);stroke:var(--fg)" stroke-width="1.2"/>`+LN(x-dx,y+dy,x+dx,y-dy,'var(--fg)',{w:2.5})};
const PP_C=.29979; /* 빛의 속도 mm/ps */
const PP_WP=167.6,PP_WR=132; /* 펌프·프로브 1/e² 반경 µm (논문 3.3, 프로브 값은 확인 필요) */

/* ======================= 원리 · 신호 ======================= */
const SI=[
{t:TR('pump-probe: 흔들고, 기다렸다가, 본다','Pump-probe: perturb, wait, then look'),ec:TR('시간축 위의 두 펄스','Two pulses on a time axis'),mc:TR('지연에 따른 신호 (예시)','Signal versus delay (example)'),
 slider:{min:-1,max:10,step:.1,init:1,label:TR('지연 t','Delay t'),fmt:v=>v.toFixed(1)+' ps',play:1},
 e:v=>{const x0=70,k=21,xp=x0+k*v,n=v>0?Math.round(10*Math.exp(-v/2)):0;
  let s=T(20,26,TR(`들뜬 분자: 10개 중 ${n}개 (예시, τ = 2 ps)`,`Excited molecules: ${n} of 10 (example, τ = 2 ps)`),'lab');
  for(let i=0;i<10;i++){const x=46+i*24;s+=i<n?`<circle cx="${x}" cy="62" r="8" style="fill:var(--s4)"/>`:`<circle cx="${x}" cy="62" r="8" style="fill:none;stroke:var(--s6)" stroke-width="1.3"/>`}
  s+=`<circle cx="46" cy="96" r="6" style="fill:var(--s4)"/>`+T(58,100,TR('들뜬 상태','excited'),'sub')+`<circle cx="146" cy="96" r="6" style="fill:none;stroke:var(--s6)" stroke-width="1.3"/>`+T(158,100,TR('바닥 상태','ground'),'sub');
  s+=`<line x1="20" x2="304" y1="200" y2="200" class="ax"/>`+T(304,218,TR('시간 →','time →'),'sub','end');
  s+=`<g data-n="1">${ppPulse(x0,200,62,12,'var(--pump)')}</g>`+T(x0,128,'pump','sub','middle')+`<g data-n="2">${ppPulse(xp,200,40,10,'var(--s5)')}</g>`+T(xp,250,'probe','sub','middle','var(--s5)');
  if(Math.abs(v)>.4)s+=LN(x0,232,xp,232,'var(--muted)',{w:1,mk:'g'});
  return s+T(20,272,v<0?TR(`t = ${v.toFixed(1)} ps: probe가 먼저 지나간다`,`t = ${v.toFixed(1)} ps: the probe arrives first`):TR(`t = ${v.toFixed(1)} ps 뒤에 probe가 지나간다`,`the probe arrives t = ${v.toFixed(1)} ps later`),'sub')},
 m:v=>{const f=t=>.5*(1+ppErf(t/.1))*Math.exp(-Math.max(t,0)/2);const P=plot({x:[-1,10],y:[-.15,1.15],xt:[0,2,4,6,8,10].map(t=>({v:t,l:String(t)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:TR('지연 t (ps)','delay t (ps)'),yl:TR('ΔT/T (상대)','ΔT/T (relative)'),T:30});

   +T(P.R,P.T-12,TR('빨강 = + (투과 증가)','red = + (more transmission)'),'sub','end')},
 read:[TR(`${c(1,'g')} pump 펄스가 샘플의 일부를 들뜨게 한다. 바닥 상태 분자가 줄고 들뜬 분자가 생긴다.`,`${c(1,'g')} The pump pulse excites part of the sample. Ground-state molecules decrease and excited molecules appear.`),
  TR(`${c(2,'s5')} 약한 probe 펄스가 지연 t 뒤에 지나가며 투과를 잰다. 들뜬 분자가 많을수록 투과가 많이 바뀐다.`,`${c(2,'s5')} A weak probe pulse passes after a delay t and measures the transmission. The more excited molecules, the larger the change in transmission.`),
  TR('지연 t를 바꿔 가며 재면 들뜬 분자가 줄어드는 과정이 곡선으로 나온다. 재생을 누르면 오른쪽 점이 곡선을 따라간다.','Measuring at many delays traces the decay of the excited molecules as a curve. With Play, the dot on the right follows the curve.'),
  TR('t < 0이면 probe가 먼저 지나가서 신호가 없다. 그래서 음의 지연 몇 점은 기준선(배경)으로 쓴다.','At t < 0 the probe arrives first, so there is no signal. A few negative delays therefore serve as the baseline (background).'),
  TR('pump와 probe 사이 시간 동안 계는 "개체수" 상태에 있다. 그래서 pump-probe는 개체수 변화(이완, 에너지 이동)를 잰다. 2D IR과 같은 3차 응답이다(<a href="2d-spectroscopy.html">2D 분광 노트</a>).','Between pump and probe the system is in a population state. Pump-probe therefore measures population changes (relaxation, energy transfer). It is the same third-order response as 2D IR (<a href="2d-spectroscopy.html">2D spectroscopy notes</a>).')],
 q:TR('지연 t = 0 근처 신호를 바로 이완으로 해석하면 안 되는 이유는?','Why should the signal near t = 0 not be read directly as relaxation?'),a:TR('두 펄스가 겹치는 동안은 시간 순서가 정해지지 않고, 창·용매의 비공명 신호(coherent artifact)가 섞인다. 셋업 검증 탭 3단계에서 다룬다.','While the two pulses overlap, their time order is undefined and non-resonant signals from windows and solvent (coherent artifact) are mixed in. Step 3 of the Setup checks tab covers this.')},
{t:TR('초퍼: 샷마다 pump-on과 pump-off를 번갈아 잰다','Chopper: alternate pump-on and pump-off shot by shot'),ec:TR('1 kHz 레이저, 500 Hz 초퍼','1 kHz laser, 500 Hz chopper'),mc:TR('샷마다 잰 probe 에너지 (예시)','Probe energy per shot (example)'),
 e:()=>{const xs=Array.from({length:8},(_,i)=>40+i*36);let s=T(20,40,TR('pump: 초퍼(500 Hz)가 한 번 걸러 막는다','pump: the chopper (500 Hz) blocks every other pulse'),'sub')+T(20,128,TR('probe: 매 샷 지나간다 (1 kHz)','probe: passes every shot (1 kHz)'),'sub');

 m:()=>{const P=plot({x:[.5,8.5],y:[.95,1.07],xt:[1,2,3,4,5,6,7,8].map(i=>({v:i,l:String(i)})),yt:[{v:.96,l:'0.96'},{v:1,l:'1.00'},{v:1.04,l:'1.04'}],xl:TR('샷 번호','shot number'),yl:TR('probe 에너지 (상대)','probe energy (relative)'),T:30});

   +`<g data-n="1"><circle cx="${P.X(i)}" cy="${P.Y(on)}" r="5" style="fill:var(--s4)"/></g><circle cx="${P.X(i+1)}" cy="${P.Y(off)}" r="5" style="fill:var(--panel);stroke:var(--s6)" stroke-width="1.5"/>`}

 read:[TR('레이저는 1 kHz로 펄스를 낸다. pump 길에 500 Hz 초퍼를 두면 pump가 한 번 걸러 막힌다.','The laser fires at 1 kHz. A 500 Hz chopper in the pump path blocks every other pump pulse.'),
  TR(`그래서 연이은 두 probe 샷이 ${c(1,'s4')} pump-on과 pump-off가 된다. 두 샷 사이 1 ms 동안 레이저 세기는 거의 안 바뀐다.`,`Two consecutive probe shots are therefore ${c(1,'s4')} pump-on and pump-off. The laser intensity barely changes in the 1 ms between them.`),
  TR('오른쪽 그림처럼 레이저 세기가 몇 % 흔들려도, 바로 이웃한 두 샷의 차이는 거의 그대로다. 느린 흔들림이 쌍 안에서 지워진다.','As on the right, even when the laser intensity drifts by a few %, the difference between two neighbouring shots stays almost the same. Slow drift cancels within each pair.'),
  TR('세어 보기: 1초에 500쌍이다. 쌍 N개를 평균하면 무작위 잡음은 √N로 준다. 500쌍이면 한 쌍보다 약 22배 조용하다.','Counting it out: 500 pairs per second. Averaging N pairs reduces random noise by √N. With 500 pairs the result is about 22 times quieter than a single pair.'),
  TR('이 방식은 샷마다 따로 읽을 수 있는 검출 체계가 있어야 한다(5단계).','This scheme needs a detection chain that reads every shot separately (step 5).')],
 q:TR('초퍼를 1 kHz(레이저와 같은 빈도)로 돌리면?','What happens if the chopper runs at 1 kHz (the laser rate)?'),a:TR('pump가 매 샷 막히거나(또는 매 샷 통과해) on/off 쌍이 생기지 않는다. 반복률의 절반이어야 한 번 걸러 막힌다.','The pump is blocked on every shot (or passes on every shot), so no on/off pairs form. The chopper must run at half the repetition rate to block every other pulse.')},
{t:TR('ΔT/T: 투과가 늘면 빨강(+), 줄면 파랑(−)','ΔT/T: more transmission is red (+), less is blue (−)'),ec:TR('pump-off와 pump-on의 probe 투과 (0.9부터 확대)','Probe transmission, pump-off and pump-on (zoomed from 0.9)'),mc:TR('같은 사건, 두 가지 표기','One event, two notations'),

 m:v=>{const dA=-Math.log10(1+v/100)*1000,col=v>0?'var(--s1)':v<0?'var(--s2)':'var(--s6)',X1=x=>160+x/3*130,X2=a=>160+a/13*130;
  let s=T(30,40,TR('ΔT/T (%) — 우리 연구실 규약','ΔT/T (%) — our lab convention'),'lab')+`<rect x="30" y="60" width="130" height="22" style="fill:var(--s2)" fill-opacity=".12"/><rect x="160" y="60" width="130" height="22" style="fill:var(--s1)" fill-opacity=".12"/>`+LN(30,71,290,71,'var(--muted)',{w:1});

  s+=T(30,200,TR('ΔA (mOD) — 흡광도 규약','ΔA (mOD) — absorbance convention'),'lab')+LN(30,151,290,151,'var(--muted)',{w:1});
  [-13,0,13].forEach(a=>s+=LN(X2(a),146,X2(a),156,'var(--muted)',{w:1})+T(X2(a),176,(a>0?'+':'')+a,'sub','middle'));
  s+=`<line x1="${X1(v)}" y1="104" x2="${X2(dA)}" y2="140" class="lvl2"/>`+`<circle cx="${X1(v)}" cy="71" r="7" style="fill:${col}"/><circle cx="${X2(dA)}" cy="151" r="7" style="fill:${col}"/>`;
  return s+T(30,222,`ΔA = −log₁₀(1 + ΔT/T) = ${dA>0.05?'+':''}${Math.abs(dA)<.05?'0.0':dA.toFixed(1)} mOD`,'labn')+T(30,242,TR('점 색 = ΔT/T 부호 (같은 사건이라 같은 색)','dot colour = sign of ΔT/T (same event, same colour)'),'sub')+T(30,258,TR('투과 증가(빨강) = 흡수 감소 = ΔA < 0','more transmission (red) = less absorption = ΔA < 0'),'sub')+T(30,274,TR('작은 신호에서 ΔA ≈ −0.434 · ΔT/T','for small signals ΔA ≈ −0.434 · ΔT/T'),'sub')},
 read:[TR('ΔT/T = (T_on − T_off) / T_off. pump가 있을 때 probe가 얼마나 더(또는 덜) 지나가는지의 비율이다.','ΔT/T = (T_on − T_off) / T_off. It is the fraction by which more (or less) probe passes when the pump is on.'),
  TR('우리 연구실은 ΔT/T로 쓴다. 빨강 = +(투과 증가), 파랑 = −(투과 감소). 모든 노트의 신호 그림이 이 규약을 따른다.','Our lab reports ΔT/T. Red = + (more transmission), blue = − (less transmission). Every signal figure in these notes follows this convention.'),
  TR('흡광도 변화 ΔA = −log₁₀(1 + ΔT/T)는 부호가 반대다. 문헌의 ΔA 그림과 비교할 때는 부호를 뒤집어 읽는다.','The absorbance change ΔA = −log₁₀(1 + ΔT/T) has the opposite sign. When comparing with ΔA figures in the literature, the sign is read flipped.'),
  TR('ΔT/T를 만들려면 T_off(probe 크기)를 같이 저장해야 한다. 예전 LabVIEW 프로그램은 ΔT(전압 차이)만 저장해서 ΔT/T도 ΔA도 만들 수 없었다. 지금 Python 프로그램은 T_off를 같이 저장한다(논문 3.4).','Building ΔT/T requires saving T_off (the probe level) as well. The earlier LabVIEW program saved only ΔT (a voltage difference), so neither ΔT/T nor ΔA could be formed. The current Python program saves T_off too (thesis 3.4).'),
  TR('ΔT만 있으면 스펙트럼이 probe 스펙트럼 모양으로 가중되어, 봉우리 위치와 크기를 문헌과 직접 비교할 수 없다. 한 파수에서의 감쇠 시간은 probe가 일정하면 영향이 없다.','With ΔT alone the spectrum is weighted by the probe spectrum shape, so peak positions and sizes cannot be compared directly with the literature. Decay times at a single wavenumber are unaffected if the probe is stable.'),
  TR('변환이 비선형이라 큰 신호에서는 "평균 후 변환"과 "변환 후 평균"이 다르다. 우리는 ΔT/T를 평균한 뒤 ΔA로 바꾼다.','The conversion is nonlinear, so for large signals "average then convert" differs from "convert then average". We average ΔT/T and then convert to ΔA.')],
 q:TR('ΔT/T = +1%면 ΔA는 대략?','If ΔT/T = +1%, what is ΔA, approximately?'),a:TR('약 −4.3 mOD. 부호가 반대이고 크기는 약 0.434배(mOD 단위로 4.3)다.','About −4.3 mOD. The sign is opposite and the size is about 0.434 times (4.3 in mOD).')},
{t:TR('GSB, SE, ESA: 세 신호의 부호와 위치','GSB, SE, ESA: sign and position of the three signals'),ec:TR('진동 준위와 probe 전이','Vibrational levels and probe transitions'),mc:TR('과도 스펙트럼 ΔT/T (예시)','Transient spectrum ΔT/T (example)'),
 tg:[{k:'g',l:'① GSB',on:true},{k:'s',l:'② SE',on:true},{k:'e',l:'③ ESA',on:true}],
 e:(v,tg)=>{let s=L(30,262,240)+T(266,244,'v=0','sub')+L(30,262,150)+T(266,154,'v=1','sub')+L(30,262,72)+T(266,76,'v=2','sub');

  return s+T(30,24,TR('점 = 들뜬 분자, 빈 원 = 바닥에서 빠진 자리','dot = excited, open circle = ground-state hole'),'sub')+T(30,264,TR('v=1→2 간격이 v=0→1보다 좁다 (비조화)','the v=1→2 gap is smaller than v=0→1 (anharmonic)'),'sub')},
 m:(v,tg)=>{const P=plot({x:[2300,2600],y:[-1,1.1],xt:[2300,2400,2500,2600].map(x=>({v:x,l:String(x)})),yt:[{v:-1,l:'−1'},{v:0,l:'0'},{v:1,l:'+1'}],xl:'probe wavenumber ω₃ (cm⁻¹)',yl:TR('ΔT/T (상대)','ΔT/T (relative)'),T:30});
  const g=x=>tg.g?.5*ppG(x,2500,50):0,se=x=>tg.s?.5*ppG(x,2500,50):0,es=x=>tg.e?-.8*ppG(x,2400,60):0;

  if(tg.e)s+=`<g data-n="3">${badge(P.X(2400)-22,P.Y(-.8),3,'var(--s2)')}</g>`;

 read:[TR(`${c(1,'b')} GSB(바닥 상태 탈색): 바닥에서 분자가 빠져 v=0→1 흡수가 줄어든다. 투과가 늘어 ΔT/T > 0, 빨강.`,`${c(1,'b')} GSB (ground-state bleach): molecules leave the ground state, so the v=0→1 absorption drops. Transmission rises, ΔT/T > 0, red.`),
  TR(`${c(2,'b')} SE(유도 방출): v=1 분자가 probe에 밀려 빛을 더 내보낸다. 역시 투과 증가, 빨강. 위치는 GSB와 같은 ω₀₁이다.`,`${c(2,'b')} SE (stimulated emission): v=1 molecules are driven by the probe to emit extra light. Transmission also rises, red. It sits at ω₀₁, the same position as the GSB.`),
  TR(`${c(3,'r')} ESA(들뜬 상태 흡수): v=1 분자가 v=1→2로 probe를 먹는다. 투과 감소, 파랑.`,`${c(3,'r')} ESA (excited-state absorption): v=1 molecules absorb the probe on the v=1→2 transition. Transmission drops, blue.`),
  TR('v=1→2 간격이 v=0→1보다 좁아서(비조화성) ESA는 낮은 파수 쪽에 따로 선다. 체크박스로 하나씩 켜고 끄면 합이 어떻게 만들어지는지 보인다.','The v=1→2 gap is smaller than v=0→1 (anharmonicity), so the ESA stands apart on the low-wavenumber side. Toggling each checkbox shows how the sum is built.'),
  TR('완전한 조화 진동자라면 ESA가 GSB+SE와 같은 자리, 같은 크기로 서로 지워 신호가 0이 된다. 진동 신호가 보이는 것 자체가 비조화성 덕분이다. 2D 노트의 IR 탭과 같은 논리다.','For a perfectly harmonic oscillator the ESA would sit at the same position as GSB+SE with the same size, and the signal would cancel to 0. A vibrational signal is visible only because of anharmonicity. This is the same logic as the IR tab of the 2D notes.'),
  TR('주의: 문헌의 ΔA 그림에서는 GSB가 음수(아래)다. 같은 스펙트럼이 위아래로 뒤집혀 있다.','Note: in ΔA figures in the literature the GSB is negative (pointing down). The same spectrum is flipped upside down.')],
 q:TR('ESA를 끄면 2400 cm⁻¹ 근처는?','What remains near 2400 cm⁻¹ when the ESA is switched off?'),a:TR('신호가 0에 가깝다. 그 자리의 파란 띠는 전부 v=1→2 흡수(ESA)였다.','The signal is close to 0. The blue band there came entirely from the v=1→2 absorption (ESA).')},

 read:[TR(`${c(1,'f')} 모노크로메이터가 probe를 파장별로 펼친다(<a href="detection.html">검출과 분광기 노트</a>, 모노크로메이터 탭).`,`${c(1,'f')} The monochromator spreads the probe by wavelength (<a href="detection.html">detection and spectrometer notes</a>, Monochromator tab).`),
  TR(`${c(2,'f')} 출구 평면의 MCT 배열(한 스펙트럼 64화소)이 모든 파장을 한 샷에 받는다. 2026년 HDO 설정에서 화소당 약 4.5 cm⁻¹다(논문 3.3, 계산값). MCT는 액체 질소로 식힌다(검출기 탭 3단계).`,`${c(2,'f')} An MCT array in the exit plane (64 pixels per spectrum) records all wavelengths in one shot. In the 2026 HDO settings this is about 4.5 cm⁻¹ per pixel (thesis 3.3, calculated). The MCT is cooled with liquid nitrogen (Detectors tab, step 3).`),
  TR(`${c(3,'f')} 게이트 적분기가 레이저 트리거에 맞춰 샷마다 검출기 펄스를 적분한다. 그래서 1 kHz 샷 하나하나가 숫자 하나가 된다.`,`${c(3,'f')} A gated integrator, timed by the laser trigger, integrates the detector pulse on every shot. Each 1 kHz shot thus becomes one number.`),
  TR(`${c(4,'f')} 디지털 입출력 카드로 PC에 샷별 값이 들어오고, 연이은 on/off 쌍으로 ΔT/T 스펙트럼을 만든다.`,`${c(4,'f')} A digital I/O card passes the per-shot values to the PC, and consecutive on/off pairs give the ΔT/T spectrum.`),
  TR('적분기 출력은 약 4.7 V까지만 선형이다. 측정 전에 ND 필터로 probe 세기를 바꿔 가며 선형 범위 안인지 확인한다(논문 3.4).','The integrator output is linear only up to about 4.7 V. Before measuring, the probe level is varied with ND filters to confirm it stays in the linear range (thesis 3.4).')],
 case:TR('<b>사례: 1.7초마다 나타난 유령 파형.</b> 예전에 만들던 가시광 pump-probe 셋업에서, 빛을 거의 바꾸지 않았는데도 기록에 약 1.7초 주기의 느린 파형이 계속 나타났다. 처음에는 DAQ 장비나 전기 잡음을 의심했다. 원인은 샘플링 시계였다. 레이저 반복률은 실제로 1000.57 Hz였고, DAQ는 자기 시계로 1 kSa/s를 찍었다. 샘플 순간이 펄스마다 약 0.57 µs씩 밀리면서 약 20 µs 길이의 검출기 펄스를 천천히 훑었고, 그게 1.75초마다 반복되는 맥놀이가 된 것이다. 레이저 트리거를 "시작 신호"로만 연결해서는 고쳐지지 않는다. 처음 한 번만 맞고 그다음은 시계가 따로 가기 때문이다. 해법은 레이저 트리거로 샘플 시계 자체를 맞추거나(한 샷에 한 샘플), 샷마다 트리거되는 적분기를 쓰는 것이다. 지금 IR 셋업은 적분기가 샷마다 트리거되어 이 문제가 없다(논문 부록 B).','<b>Case: a ghost waveform every 1.7 seconds.</b> In an earlier visible pump-probe setup under construction, a slow waveform with a period of about 1.7 s kept appearing in the records although the light hardly changed. DAQ hardware or electrical noise was suspected first. The cause was the sampling clock. The laser repetition rate was actually 1000.57 Hz, while the DAQ sampled at 1 kSa/s on its own clock. The sampling instant slipped by about 0.57 µs per pulse and slowly scanned across the roughly 20 µs detector pulse, producing a beat that repeated every 1.75 s. Wiring the laser trigger only as a "start" signal does not fix this: it aligns the first sample, and afterwards the clocks drift apart. The fix is to lock the sample clock itself to the laser trigger (one sample per shot) or to use an integrator triggered on every shot. The current IR setup triggers its integrator on every shot and does not have this problem (thesis Appendix B).'),
 q:TR('적분기 없이 검출기 출력을 자체 시계 1 kSa/s DAQ로 바로 찍으면?','What happens if the detector output is sampled directly by a DAQ on its own 1 kSa/s clock, without an integrator?'),a:TR('레이저와 시계가 조금만 달라도 샘플 순간이 펄스 위를 천천히 미끄러져, 몇 초 주기의 가짜 파형(맥놀이)이 생긴다. 대부분의 샘플은 펄스가 없는 바닥을 찍는다.','Even a small mismatch between the laser and the clock makes the sampling instant slide slowly across the pulse, creating a false waveform (beat) with a period of seconds. Most samples land on the baseline between pulses.')}];

 read:[TR('pump 세기는 편광자 두 장으로 줄인다. 앞 편광자를 돌리고, 뒤 편광자는 레이저 편광과 나란히 고정한다.','The pump is attenuated with two polarizers. The first one is rotated; the second is fixed parallel to the laser polarization.'),
  TR(`${c(1,'s4')} 앞 편광자를 φ만큼 돌리면 지날 때 cos²φ, 뒤 편광자를 지날 때 다시 cos²φ가 곱해져 cos⁴φ가 된다(Malus 법칙 두 번). 편광 방향은 뒤 편광자가 정하니 각도를 바꿔도 샘플 위 편광은 그대로다.`,`${c(1,'s4')} Rotating the first polarizer by φ gives cos²φ there and another cos²φ at the second polarizer, so cos⁴φ in total (Malus's law twice). The second polarizer sets the polarization, so the polarization at the sample does not change with the angle.`),
  TR('파장판(λ/2) 대신 와이어 그리드 편광자를 쓰는 이유: 파장판은 한 파장 근처에서만 제대로 작동하지만, 편광자는 중적외선 전체에서 작동한다.','Why wire-grid polarizers instead of a half-wave plate: a wave plate works properly only near one wavelength, while the polarizers work across the whole mid-IR.'),
  TR('완전히 막지는 못한다. 남는 빛(P_leak)과 최대 출력의 비, 곧 소광비가 대략 320이었다(2026-08 맞춤, 논문 3.5.1).','They do not block completely. The ratio of maximum power to leaked light (P_leak), the extinction ratio, was approx. 320 (fit from 2026-08, thesis 3.5.1).'),
  TR('곡선은 각도를 고르는 안내일 뿐이다. 실제 측정값은 곡선과 ±10% 정도 어긋났고, 가파른 곳에서는 1°에 약 13%씩 바뀐다. 그래서 플루언스는 늘 그 각도에서 직접 잰 출력으로 계산한다(다음 단계).','The curve is only a guide for choosing the angle. Measured values deviated from it by about ±10%, and on the steep part the power changes by about 13% per degree. The fluence is therefore always calculated from the power measured at that angle (next step).'),
  TR('뒤에 고정 Ge ND 필터(OD 0.62)를 둔다. 출력은 ND 앞에서 재므로, 편광자를 높은 투과 쪽에서 쓸 수 있어 출력계 읽기가 배경보다 훨씬 크다.','A fixed Ge ND filter (OD 0.62) follows. Power is measured before the ND, so the polarizers can operate at high transmission and the power-meter reading is much larger than the background.')],

  TR('세어 보기(P = 500 µW): 500 µW ÷ 1000 Hz = 500 nJ. ND(OD 0.62)를 지나면 10^(−0.62) ≈ 0.24배라 약 120 nJ. 가우시안 빔 중심의 플루언스 F_peak = 2E/(πw²) ≈ 272 µJ/cm².','Counting it out (P = 500 µW): 500 µW ÷ 1000 Hz = 500 nJ. The ND (OD 0.62) passes 10^(−0.62) ≈ 0.24 of it, so about 120 nJ. The fluence at the centre of a Gaussian beam is F_peak = 2E/(πw²) ≈ 272 µJ/cm².'),
  TR('배경(출력계가 빛 없이 읽는 값, 수백 µW 수준)을 빼야 한다. 배경이 몇 µW만 달라져도, 낮은 출력 단계에서는 비율이 크게 흔들린다(논문 3.5.3).','The background (what the meter reads with no light, on the order of hundreds of µW) must be subtracted. A background change of only a few µW shifts the ratios strongly at the low-power steps (thesis 3.5.3).'),
  TR(`${c(1,'g')} pump 반경 167.6 µm는 100 µm 핀홀 투과로 구했다. 같은 해 knife-edge로는 약 100.6 µm였다. 어느 쪽이 맞는지에 따라 절대 플루언스가 2.78배 달라진다(확인 필요).`,`${c(1,'g')} The pump radius of 167.6 µm came from transmission through a 100 µm pinhole. A knife-edge scan in the same year gave about 100.6 µm. Depending on which is right, the absolute fluence changes by a factor of 2.78 (to be verified).`),
  TR(`${c(2,'s5')} probe 반경(약 132 µm)은 기록을 찾지 못했다(확인 필요). pump가 probe보다 넓어 probe는 pump의 가운데를 주로 보지만, 그 안에서도 플루언스가 고르지 않다. 반경을 가정하면 probe가 보는 평균은 F_peak의 약 0.62배다(계산).`,`${c(2,'s5')} No record of the probe radius (about 132 µm) was found (to be verified). The pump is wider than the probe, so the probe mostly sees the pump centre, but the fluence is not uniform even there. With the assumed radii, the average fluence seen by the probe is about 0.62 F_peak (calculated).`),

   +ppLeg(30,24,'var(--pump)','pump')+ppLeg(110,24,'var(--s5)','probe')+T(20,48,TR(`겹침 정도 ${Math.round(ov*100)}% (100% = 완전히 겹침)`,`overlap ${Math.round(ov*100)}% (100% = complete overlap)`),'sub')

  const P=plot({x:[-.6,2],y:[-1,1.3],xt:[-.5,0,.5,1,1.5,2].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:TR('지연 t (ps)','delay t (ps)'),yl:TR('ΔT/T (상대)','ΔT/T (relative)'),T:42});

   +ppLeg(P.L+6,P.T-28,'var(--s1)',TR('실제 응답','true response'),1)+ppLeg(P.L+TR(110,120),P.T-28,'var(--s5)',TR('겹침 신호','overlap signal'),1)+ppLeg(P.L+6,P.T-12,'var(--fg)',TR('측정 = IRF로 번진 응답 + 겹침 신호','measured = IRF-broadened response + overlap'))},
 read:[TR(`${c(1,'g')} pump와 ${c(2,'s5')} probe는 길이가 수십–백 fs인 펄스다. 지연이 0 근처면 두 펄스가 겹쳐 시간 순서가 정해지지 않는다.`,`${c(1,'g')} The pump and ${c(2,'s5')} probe are pulses tens to a hundred fs long. Near zero delay they overlap and their time order is undefined.`),
  TR('측정 신호 = 실제 응답을 장비 응답(IRF, pump와 probe의 상호상관)으로 번지게 한 것. 그래서 계단처럼 급한 변화도 IRF 폭만큼 완만하게 올라온다.','The measured signal is the true response broadened by the instrument response (IRF, the pump-probe cross-correlation). Even a step-like change therefore rises gradually over the IRF width.'),
  TR('겹치는 동안에는 창·용매에서 교차 위상 변조(XPM) 같은 비공명 신호가 더해진다(coherent artifact). 이 구간은 피팅에서 빼거나 따로 모델링한다.','During the overlap, non-resonant signals such as cross-phase modulation (XPM) in windows and solvent are added (coherent artifact). This range is excluded from fits or modelled separately.'),
  TR('역으로 쓸모도 있다. 순수 용매나 창만 넣고 XPM을 재면 그 중심이 time zero, 폭이 IRF가 된다. 3 mm ZnSe 판에서 IRF 약 165 fs를 얻었다(확인 필요). ZnSe는 이 영역에서 분산이 거의 0이라 기준으로 좋다.','It is also useful. Measuring the XPM of a neat solvent or a bare window gives time zero from its centre and the IRF from its width. A 3 mm ZnSe plate gave an IRF of about 165 fs (to be verified). ZnSe has nearly zero dispersion in this range, which makes it a good reference.'),
  TR('다만 샘플 셀(CaF₂ 창)의 분산은 ZnSe와 다르다. 셀 안의 IRF는 같은 광학 조건의 용매로 따로 재야 한다(논문 3.6, 남은 일).','The sample cell (CaF₂ windows), however, has different dispersion from ZnSe. The IRF inside the cell must be measured separately with solvent under the same optical conditions (thesis 3.6, still to do).')],
 q:TR('IRF가 165 fs인데 100 fs 성분을 피팅으로 뽑으면?','With an IRF of 165 fs, what about a 100 fs component extracted by fitting?'),a:TR('IRF와 겹쳐 잘 구분되지 않는다. IRF를 같이 컨볼루션한 모델로 맞추고, 그 성분은 "IRF 수준"이라고 조건을 단다.','It overlaps with the IRF and is hard to separate. The fit uses a model convolved with the IRF, and that component is reported with the qualifier "at the IRF level".')},
{t:TR('분산: 광학 재료를 지나면 time zero가 움직인다','Dispersion: passing through material shifts time zero'),ec:TR('광학 부품이 더하는 분산 (2200 cm⁻¹, 계산)','Dispersion added by optics (2200 cm⁻¹, calculated)'),mc:TR('probe 파수에 따른 time zero','Time zero versus probe wavenumber'),
 tg:[{k:'cor',l:TR('화소별 time zero 보정','per-pixel time-zero correction'),on:false}],
 e:()=>{const X=g=>150+g/3000*130,rows=[[TR('pump Ge 3 mm','pump Ge 3 mm'),2770,'s4'],[TR('pump CaF₂','pump CaF₂'),-860,'s3'],[TR('pump 합','pump total'),1910,'f'],[TR('probe Ge 2 mm','probe Ge 2 mm'),1840,'s4'],[TR('probe CaF₂','probe CaF₂'),-860,'s3'],[TR('probe 합','probe total'),980,'f']];
  let s=`<line x1="${X(0)}" x2="${X(0)}" y1="40" y2="214" class="ax"/>`+T(X(0),32,'0','sub','middle')+T(X(3000),32,'+3000 fs²','sub','end');
  rows.forEach(([l,g,k],i)=>{const y=52+i*28+(i>2?10:0);s+=T(X(0)-6-(g<0?Math.abs(X(g)-X(0)):0),y+4,l,'sub','end')+`<rect x="${Math.min(X(0),X(g))}" y="${y-7}" width="${Math.abs(X(g)-X(0))}" height="14" rx="2" style="fill:${COL[k]}" fill-opacity="${k==='f'?.75:.45}"/>`+T(Math.max(X(0),X(g))+4,y+4,(g>0?'+':'')+g,'sub')});
  return s+`<g data-n="1"><rect x="${X(0)}" y="${52+5*28+10-7}" width="${X(980)-X(0)}" height="14" rx="2" style="fill:none;stroke:var(--s5)" stroke-width="2"/></g>`+T(20,248,TR('GDD (군지연 분산, fs²): Ge는 +, CaF₂는 −','GDD (group-delay dispersion, fs²): Ge +, CaF₂ −'),'sub')+T(20,266,TR('Ge 1 mm를 넣고 빼면 time zero 약 10 ps 이동 (계산)','±1 mm Ge shifts time zero by approx. 10 ps (calc.)'),'sub')},
 m:(v,tg)=>{const P=plot({x:[2100,2300],y:[-40,40],xt:[2100,2150,2200,2250,2300].map(x=>({v:x,l:String(x)})),yt:[{v:-40,l:'−40'},{v:0,l:'0'},{v:40,l:'+40'}],xl:'probe wavenumber ω₃ (cm⁻¹)',yl:TR('time zero 이동 (fs)','time-zero shift (fs)'),T:30});
  return P.s+ppZero(P)+`<g data-n="1">${crv(P,x=>.18*(x-2200),2100,2300,'var(--s5)',{w:2.2,dash:!!tg.cor})}</g>`+(tg.cor?crv(P,()=>0,2100,2300,'var(--fg)',{w:2.5})+T(P.R,P.Y(0)-8,TR('보정 후','corrected'),'sub','end'):'')
   +T(P.L+6,P.T-10,TR('기울기 약 18 fs / 100 cm⁻¹ (probe 길 예산, 계산)','slope ≈ 18 fs / 100 cm⁻¹ (calc.)'),'sub')},
 read:[TR('중적외선 펄스는 Ge 결합판(HeNe 길잡이 빛을 합치는 2 mm 판), pump 길의 Ge ND 필터, 셀의 CaF₂ 창을 지난다. 이 영역에서 Ge는 양(+), CaF₂는 음(−)의 군지연 분산(GDD)을 준다.','The mid-IR pulses pass a Ge combiner (a 2 mm plate that merges the HeNe guide beam), the Ge ND filter in the pump path, and the CaF₂ cell windows. In this range Ge adds positive (+) and CaF₂ negative (−) group-delay dispersion (GDD).'),
  TR('GDD가 있으면 파수마다 도착 시간이 달라진다(처프). 펄스가 길어지고, probe 스펙트럼의 화소마다 time zero가 조금씩 다르다.','With GDD, each wavenumber arrives at a different time (chirp). The pulse lengthens, and time zero differs slightly from pixel to pixel across the probe spectrum.'),
  TR(`${c(1,'s5')} probe 길 예산 약 +980 fs²면, probe 파수 100 cm⁻¹마다 time zero가 약 18 fs 어긋난다(계산). 체크박스를 켜면 화소별로 time zero를 맞춰 평평하게 만든 결과가 보인다.`,`${c(1,'s5')} With a probe-path budget of about +980 fs², time zero shifts by about 18 fs per 100 cm⁻¹ of probe wavenumber (calculated). The checkbox shows the result after aligning time zero pixel by pixel, which flattens the line.`),
  TR('세어 보기: Ge의 군굴절률은 약 4라, 1 mm를 더 지나면 공기보다 약 (4 − 1) × 1 mm ÷ c ≈ 10 ps 늦다. 필터를 넣고 빼면 time zero를 다시 찾아야 한다.','Counting it out: the group index of Ge is about 4, so 1 mm of extra Ge delays the pulse by about (4 − 1) × 1 mm ÷ c ≈ 10 ps relative to air. Inserting or removing a filter means time zero must be found again.'),
  TR('OPA 출력 자체의 처프는 모른다. 그래서 최적 Ge 두께는 계산이 아니라 XPM 폭이 가장 좁아지는 조건으로 정한다(논문 3.6, 남은 일). 계산은 시험할 범위를 정할 때만 쓴다.','The chirp of the OPA output itself is unknown. The optimum Ge thickness is therefore set by the narrowest XPM width, not by calculation (thesis 3.6, still to do). The calculation only sets the range to test.')],
 q:TR('pump 길에서만 Ge ND 필터를 빼면 time zero는 어느 쪽으로 움직이나?','If the Ge ND filter is removed from the pump path only, which way does time zero move?'),a:TR('pump가 약 10 ps 일찍 도착한다. 같은 겹침을 만들려면 지연 스테이지를 그만큼 pump 길이 길어지는 쪽으로 옮겨야 한다.','The pump arrives about 10 ps earlier. To restore the overlap, the delay stage must move so that the pump path becomes longer by the same amount.')},
{t:TR('지연 스테이지: 1 µm = 6.67 fs, 그리고 빔 걸음','Delay stage: 1 µm = 6.67 fs, and beam walk-off'),ec:TR('retroreflector가 실린 스테이지 (pump 길)','Stage carrying a retroreflector (pump path)'),mc:TR('스테이지 위치에 따른 겹침 신호 (가정)','Overlap signal versus stage position (assumed)'),
 slider:{min:0,max:90,step:1,init:45,label:TR('스테이지 이동','stage travel'),fmt:v=>Math.round(v)+' mm',play:1},
 e:v=>{const x=110+v*1.5,dt=2*v/PP_C,d=40*v/90,sc=.24;
  const xm=x+7.6;let s=LN(14,70,x-12,70,'var(--pump)',{w:1.8,mk:'g'})+PL([[x-12,70],[xm,70],[xm,100],[x-12,100]],'var(--pump)',{w:1.8})+LN(x-12,100,14,100,'var(--pump)',{w:1.8,mk:'g'})+`<polyline points="${x},62 ${x+22},85 ${x},108" fill="none" style="stroke:var(--fg)" stroke-width="2.5"/>`;
  s+=`<g data-n="1"><rect x="${x-6}" y="114" width="40" height="10" rx="2" style="fill:var(--s6)" fill-opacity=".45"/></g>`+LN(110,134,290,134,'var(--muted)',{w:1})+T(110,150,'0','sub','middle')+T(245,150,'90 mm','sub','middle');
  s+=T(20,30,TR(`이동 ${Math.round(v)} mm → 왕복 경로 +${2*Math.round(v)} mm → 지연 +${Math.round(dt)} ps`,`travel ${Math.round(v)} mm → round trip +${2*Math.round(v)} mm → delay +${Math.round(dt)} ps`),'lab')+T(20,48,TR('1 µm 이동 = 2 µm 경로 = 6.67 fs · 0 mm = 지연 −50 ps','1 µm travel = 2 µm path = 6.67 fs · 0 mm = delay −50 ps'),'sub');
  const cx=200,cy=204;s+=`<circle cx="${cx}" cy="${cy}" r="${PP_WR*sc}" style="fill:var(--s5)" fill-opacity=".15" stroke="var(--s5)" stroke-dasharray="4 3"/><g data-n="2"><circle cx="${cx+d*sc}" cy="${cy}" r="${PP_WP*sc}" style="fill:none;stroke:var(--pump)" stroke-width="2"/></g>`;
  return s+TM(20,186,TR(['샘플 위치의 두 빔','(빔 방향에서 본 단면)','회색 pump, 보라 probe'],['both beams at the sample','(cross-section, seen','along the beam)','grey pump, purple probe']),'sub')+T(300,264,TR(`pump 어긋남 ${d.toFixed(0)} µm (가정)`,`pump offset ${d.toFixed(0)} µm (assumed)`),'sub','end')},
 m:v=>{const ov=dd=>Math.exp(-2*dd*dd/(PP_WP**2+PP_WR**2)),t=-50+v/90*600,d=x=>40*(x+50)/600;
  const P=plot({x:[-50,550],y:[.9,1.01],xt:[0,100,200,300,400,500].map(x=>({v:x,l:String(x)})),yt:[{v:.9,l:'0.90'},{v:.95,l:'0.95'},{v:1,l:'1.00'}],xl:TR('지연 (ps)','delay (ps)'),yl:TR('겹침 신호 (상대)','overlap signal (relative)'),L:62,T:30});
  return P.s+`<g data-n="2">${crv(P,x=>ov(d(x)),-50,550,'var(--fg)')}<circle cx="${P.X(t)}" cy="${P.Y(ov(d(t)))}" r="6" style="fill:var(--pump)"/></g>`
   +T(P.R,P.T-12,TR('끝에서 약 −6.8% (어긋남 40 µm, 선형 가정)','approx. −6.8% at the end (40 µm offset, linear, assumed)'),'sub','end')+T(P.L+6,P.Y(.915),TR('10 ps 안쪽 변화 < 0.1%','change within 10 ps < 0.1%'),'sub')},
 read:[TR(`${c(1,'s6')} pump 길의 지연 스테이지는 retroreflector를 싣고 움직인다. 빛은 갔다가 돌아오므로 스테이지 1 µm 이동이 경로 2 µm, 곧 2 µm ÷ c ≈ 6.67 fs다.`,`${c(1,'s6')} The delay stage in the pump path carries a retroreflector. The light goes out and back, so 1 µm of stage travel is 2 µm of path, i.e. 2 µm ÷ c ≈ 6.67 fs.`),
  TR('세어 보기: 90 mm 이동 → 경로 180 mm → 약 600 ps. 우리 셋업은 −50에서 +550 ps를 훑을 때 이만큼 움직였다.','Counting it out: 90 mm of travel → 180 mm of path → about 600 ps. Our setup moved this far to scan from −50 to +550 ps.'),
  TR(`${c(2,'g')} 스테이지 축과 빔이 조금만 어긋나도, 움직일수록 샘플 위 pump 위치가 옆으로 걷는다(beam walk). 겹침이 줄면 신호가 줄어, 실제로는 없는 "느린 감쇠"처럼 보인다.`,`${c(2,'g')} If the beam is slightly misaligned with the stage axis, the pump spot walks sideways at the sample as the stage moves (beam walk-off). Less overlap means less signal, which looks like a "slow decay" that is not really there.`),
  TR('핀홀 투과로 보면 전체 이동에서 pump 출력이 약 10% 줄었다. 옆으로 40 µm 어긋난 것으로 해석하면 겹침 신호는 끝에서 약 6.8%, 500 ps에서 5–6% 준다(가정한 계산). 10 ps 안쪽 변화는 0.1%도 안 된다.','Pinhole transmission showed the pump power falling by about 10% over the full travel. Read as a 40 µm sideways offset, the overlap signal drops by about 6.8% at the end and by 5–6% at 500 ps (calculation under assumptions). Within 10 ps the change is below 0.1%.'),
  TR('같은 출력 감소를 빔 크기 변화(약 6%)나 출력계 배경 흔들림으로도 설명할 수 있다. 그래서 이 값은 보정값이 아니라 "느린 성분을 해석할 때 고려할 크기"다. 위치와 크기를 따로 재려면 knife-edge로 지연마다 빔 중심을 잰다(논문 3.7).','The same power loss could also be explained by a change in beam size (about 6%) or by drift of the power-meter background. This value is therefore not a correction but "the size to keep in mind when interpreting slow components". Separating position from size requires knife-edge scans of the beam centre at each delay (thesis 3.7).')],
 q:TR('수백 ps짜리 느린 성분과 수 ps짜리 빠른 성분 중 beam walk에 더 민감한 쪽은?','Which is more sensitive to beam walk-off: a slow component of hundreds of ps or a fast one of a few ps?'),a:TR('느린 성분. 수 ps 안에서는 스테이지가 거의 안 움직여 겹침 변화가 무시할 만하다.','The slow component. Within a few ps the stage hardly moves, so the overlap change is negligible.')},
{t:TR('HDO로 셋업 확인: 맞는 셋업이 재현해야 할 것','Checking the setup with HDO: what a correct setup should reproduce'),ec:TR('과도 스펙트럼 모양 (문헌 행동 기반 예시)','Transient spectrum shape (example based on literature behaviour)'),mc:TR('2500 cm⁻¹ 근처 회복 (문헌값 T₁ ≈ 1.8 ps)','Recovery near 2500 cm⁻¹ (literature T₁ ≈ 1.8 ps)'),

   +T(P.R,P.T-12,TR(`t = ${v.toFixed(1)} ps · 모양은 예시`,`t = ${v.toFixed(1)} ps · shape is an example`),'sub','end')},
 m:v=>{const P=plot({x:[0,10],y:[-.05,1.05],xt:[0,2,4,6,8,10].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:TR('지연 t (ps)','delay t (ps)'),yl:TR('ΔT/T (상대)','ΔT/T (relative)'),T:30});

  return P.s+ppZero(P)+`<g data-n="1">${crv(P,f,0,10,'var(--s1)')}<circle cx="${P.X(v)}" cy="${P.Y(f(v))}" r="6" style="fill:var(--s1)"/></g>`+T(P.X(2.2),P.Y(.6),'exp(−t / 1.8 ps)','sub')+T(P.X(2.2),P.Y(.6)+14,TR('(문헌 T₁, 단순화)','(literature T₁, simplified)'),'sub')},
 read:[TR('묽은 HDO/H₂O의 O–D 신축(약 2500 cm⁻¹)은 중적외선 pump-probe의 표준 시험 시료다. 여러 연구실이 결과를 냈고(문헌 [10] 등), 우리 측정 범위 안에 있다.','The O–D stretch of dilute HDO in H₂O (about 2500 cm⁻¹) is a standard test sample for mid-IR pump-probe. Many groups have published results (ref. [10] and others), and it lies within our measurement range.'),
  TR(`맞는 셋업이라면: ${c(1,'s1')} 약 2500 cm⁻¹에 GSB+SE(ΔT/T > 0, 빨강), ${c(2,'s2')} 낮은 파수 쪽에 ESA(ΔT/T < 0, 파랑)가 보여야 한다. 이것으로 부호 규약과 띠 위치를 확인한다.`,`A correct setup should show ${c(1,'s1')} GSB+SE near 2500 cm⁻¹ (ΔT/T > 0, red) and ${c(2,'s2')} ESA on the low-wavenumber side (ΔT/T < 0, blue). This checks the sign convention and the band positions.`),
  TR('회복 시간은 문헌의 개체수 수명 T₁ ≈ 1.8 ps(Kropman 외)와 비교한다. 온도, 조성, 들뜸 조건이 같은 문헌값을 골라야 한다.','The recovery time is compared with the literature population lifetime T₁ ≈ 1.8 ps (Kropman et al.). The literature value must match in temperature, composition and excitation conditions.'),
  TR('10 ps쯤에는 열(시료가 데워진 것)에서 오는 작은 신호가 남는다. 이건 GSB나 ESA로 해석하지 않는다. 오른쪽은 이를 뺀 단순화 그림이다.','Around 10 ps a small signal from heating of the sample remains. It is not interpreted as GSB or ESA. The right panel is a simplified picture without it.'),
  TR('크기(진폭)까지 비교하려면 probe 수준을 같이 저장해 ΔT/T나 ΔA를 만들어야 한다(원리·신호 탭 3단계). 플루언스를 바꿔도 수명이 그대로인지도 확인할 항목이다.','Comparing amplitudes also requires saving the probe level to form ΔT/T or ΔA (Principle tab, step 3). Whether the lifetime stays the same when the fluence changes is another item to check.')],
 q:TR('HDO 측정에서 ESA가 GSB보다 높은 파수에 나오면 무엇을 의심하나?','If the ESA appears at higher wavenumber than the GSB in an HDO measurement, what is suspect?'),a:TR('축(파수 보정)이나 부호가 뒤집혔을 가능성. 비조화성 때문에 ESA는 낮은 파수 쪽이어야 한다. 모노크로메이터 보정과 ΔT/T 정의(on − off)를 확인한다.','The axis (wavenumber calibration) or the sign may be flipped. Because of anharmonicity the ESA must be on the low-wavenumber side. The monochromator calibration and the ΔT/T definition (on − off) are the first things to check.')}];

const TABS=[
 {id:'si',name:TR('원리 · 신호','Principle · Signal'),sub:TR('ΔT/T와 부호','ΔT/T and sign'),desc:TR('pump로 흔들고 probe로 본다. 초퍼로 샷마다 on/off를 비교하고, ΔT/T의 부호로 GSB·SE·ESA를 읽는다. 검출 체계까지.','Perturb with the pump, look with the probe. A chopper compares on/off shot by shot, and the sign of ΔT/T identifies GSB, SE and ESA. Up to the detection chain.'),steps:SI},
 {id:'ck',name:TR('셋업 검증','Setup checks'),sub:TR('플루언스 · 시간 · 겹침','fluence · time · overlap'),desc:TR('펌프 세기 조절과 플루언스 계산, time zero와 IRF, 분산, 지연 스테이지와 빔 걸음, HDO로 셋업 확인.','Pump attenuation and fluence, time zero and IRF, dispersion, the delay stage and beam walk-off, and checking the setup with HDO.'),steps:CK}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
