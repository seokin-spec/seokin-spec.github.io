<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>2D 분광 노트</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
/* 2D 노트 전용 스타일 */
:root{--gsb:var(--s1);--esa:var(--s2)} /* ΔT/T 부호색 별칭: GSB/SE = 빨강(+), ESA = 파랑(−) */
.beam2{fill:none;stroke:var(--pump);stroke-width:1.5;stroke-dasharray:4 4}.beam3{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 3}
.curve{fill:none;stroke:var(--fg);stroke-width:2}.harm{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.box{fill:none;stroke:var(--line)}.diag{stroke:var(--muted);stroke-dasharray:4 4}.tk{stroke:var(--muted)}
.axisnote{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;color:var(--muted)}.axisnote summary{cursor:pointer;color:var(--fg);font-weight:500}.axisnote p{margin:8px 0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · 2D 분광 노트</span><span class="status" title="전문가 검토 전 초안이다. 값의 대략·예시·확인 필요 표시를 같이 본다.">검토 중</span><a class="lang" id="langbtn" data-base="en/2d-spectroscopy.html" href="en/2d-spectroscopy.html" title="English"><b>한</b> · EN</a></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>
  <div class="stage" id="stage">
    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="왼쪽 그림"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="오른쪽 그림"></svg></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>재생</button>
    <span id="tgl"></span>
  </div>
  <div class="notes">
    <div class="read"><ul id="read"></ul><div class="case" id="case" hidden></div></div>
    <div class="quiz"><span class="k">점검 질문</span><p id="q"></p><details id="ad"><summary>답 보기</summary><p id="a"></p></details></div>
  </div>
  <nav><button id="prev" type="button">← 이전</button><div class="dots" id="dots"></div><button id="next" type="button">다음 →</button></nav>
</div>

<script>
const LANG='ko';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 2D 분광 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 2D 분광 노트
// @status 검토 중
// @lang ko en
// @title.en 2D Spectroscopy Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · 2D spectroscopy
// @status.en Under review
/* 2D 분광 노트: 2D IR, 2DES, 셋업. 그림 헬퍼 중 이 노트만 쓰는 것(MAP, pk, br, nt, P, CIR)은 여기 둔다. */
const AXIS_NOTE=TR('3차 신호는 빛과 세 번 상호작용하고, 그 사이 시간 구간이 셋이다. t₁(첫 두 상호작용 사이, 결맞음), t₂ = T(대기), t₃(마지막 상호작용 뒤 신호 방출, 결맞음). t₁과 t₃를 푸리에 변환한 것이 ω₁(pump 축)과 ω₃(probe 축)이다. T는 보통 시간 그대로 두고 T마다 2D 맵을 한 장씩 보므로 ω₂ 축이 없다. T 동안의 beat를 따로 푸리에 변환하면 ω₂가 나온다(beat map). IR pump-probe는 펌프 한 펄스 안에서 두 번 상호작용해 t₁ ≈ 0이라 ω₁ 축 없이 ω₃(probe) 축만 있다. 2D IR에서 모드 두 개를 다룰 때는 축 이름과 겹치지 않게 모드 A, B(ω_A, ω_B)로 쓴다. 이 내용은 2D IR과 2DES에 공통이다.','A third-order signal comes from three interactions with light, separated by three time intervals: t₁ (between the first two interactions, a coherence), t₂ = T (waiting time), and t₃ (signal emission after the last interaction, a coherence). Fourier transforming t₁ and t₃ gives ω₁ (pump axis) and ω₃ (probe axis). T is usually kept in the time domain, with one 2D map per T, so there is no ω₂ axis. Fourier transforming the beats during T gives ω₂ (a beat map). In IR pump-probe, two interactions happen within one pump pulse, so t₁ ≈ 0 and only the ω₃ (probe) axis remains. When 2D IR treats two modes, they are called modes A and B (ω_A, ω_B) so that the names do not clash with the axis labels. This box applies to both 2D IR and 2DES.');
const CIR=['','①','②','③','④'];
const P=(cx,vy,D,a=.012)=>{const h=a*D*D;return `<path class="curve" d="M${cx-D},${vy-h} Q${cx},${vy+h} ${cx+D},${vy-h}"/>`};
function MAP(rng,ticks,items){const[lo,hi]=rng,X=v=>50+(v-lo)/(hi-lo)*250,Y=v=>270-(v-lo)/(hi-lo)*250;
 let s=`<rect x="50" y="20" width="250" height="250" class="box"/><line x1="50" y1="270" x2="300" y2="20" class="diag"/>`;
 (ticks.x||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="270" y2="276" class="tk"/>`+T(X(t.v),290,t.l,'sub','middle'));
 (ticks.y||[]).forEach(t=>s+=`<line x1="44" x2="50" y1="${Y(t.v)}" y2="${Y(t.v)}" class="tk"/>`+T(40,Y(t.v)+4,t.l,'sub','end'));
 s+=T(175,308,'pump wavenumber ω₁ (cm⁻¹)','lab','middle')+`<text x="-18" y="145" class="lab" text-anchor="middle" transform="rotate(-90 -18 145)">probe wavenumber ω₃ (cm⁻¹)</text>`;
 return s+items.map(f=>f(X,Y)).join('')}
function pk(v1,v3,k,o={}){return(X,Y)=>{const col=COL[k],x=X(v1),y=Y(v3),rx=o.rx??(o.el?20:12),ry=o.ry??(o.el?9:12);
 let s=`<g${o.n?` data-n="${o.n}"`:''}><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${o.el?-45:0} ${x} ${y})" style="fill:${o.dash?'none':col};fill-opacity:${o.o??.75};stroke:${col};stroke-opacity:${o.so??1}"${o.dash?' stroke-dasharray="4 3" stroke-width="1.5"':''}/>`;
 if(o.n)s+=badge(o.br?x+Math.max(rx,ry)+(o.bo??12):x-Math.max(rx,ry)-12,y,o.n,col);
 if(o.lab)s+=T(x+(o.lx??(Math.max(rx,ry)+(o.br?26:6))),y+(o.ly??4),o.lab,'sub');
 return s+'</g>'}}
function br(v1,a,b,lab,dx=24){return(X,Y)=>{const x=X(v1)+dx,y1=Y(a),y2=Y(b);return `<path d="M${x-4},${y1} H${x} V${y2} H${x-4}" fill="none" style="stroke:var(--muted)"/>`+T(x+4,(y1+y2)/2+4,lab,'sub')}}
const nt=(x,y,s,a='middle')=>()=>T(x,y,s,'sub',a);

/* ---------- 2D IR: Morse ---------- */
const De=4.17,r0=1.4,xr=r=>30+(r-.75)*62,yE=E=>270-E*55;
const mV=r=>De*(1-Math.exp(-(r-r0)))**2;
const morse=(()=>{let d='';for(let r=.78;r<=5.01;r+=.04){const y=Math.max(18,yE(mV(r)));d+=(d?' L':'M')+xr(r).toFixed(1)+','+y.toFixed(1)}return `<path class="curve" d="${d}"/>`})();
const harm=(()=>{let d='';for(let r=.42;r<=2.381;r+=.04){d+=(d?' L':'M')+xr(r).toFixed(1)+','+yE(De*(r-r0)**2).toFixed(1)}return `<path class="harm" d="${d}"/>`})();
const tp=(E,h)=>{const s=Math.sqrt(E/De);return h?[r0-s,r0+s]:[r0-Math.log(1+s),r0-Math.log(1-s)]};
const EV=[.485,1.365,2.125,2.765],EH=[.5,1.5,2.5];
const lev=(E,h,lab,cls)=>{const[a,b]=tp(E,h);return L(xr(a),xr(b),yE(E),cls||(h?'lvl2':'lvl'))+(lab?T(xr(b)+6,yE(E)+4,lab,'sub'):'')};
const morseLv=()=>morse+EV.map((E,i)=>lev(E,0,'v='+i)).join('');
const yM=E=>285-E*95;
function twoMode(coupled){const E={a:1,b:1.3,aa:1.88,ab:coupled?2.23:2.3,bb:2.48};
 let s=L(30,290,yM(0))+T(30,yM(0)-6,'|00⟩','sub')+T(75,18,TR('모드 A 사다리','mode A ladder'),'sub','middle')+T(160,18,TR('둘 다 1개','one each'),'sub','middle')+T(245,18,TR('모드 B 사다리','mode B ladder'),'sub','middle')
 +L(40,110,yM(E.a))+T(40,yM(E.a)-6,'|10⟩','sub')+L(40,110,yM(E.aa))+T(40,yM(E.aa)-6,'|20⟩','sub')
 +L(210,280,yM(E.b))+T(250,yM(E.b)-6,'|01⟩','sub')+L(210,280,yM(E.bb))+T(250,yM(E.bb)-6,'|02⟩','sub')
 +L(125,195,yM(E.ab))+T(126,yM(E.ab)+15,'|11⟩','sub')+L(110,170,yM(E.a),'lvl2');
 if(coupled)s+=L(125,195,yM(2.3),'lvl2')+T(198,yM(2.3)+4,'Δ_AB','sub');else s+=T(198,yM(2.3)+4,'Δ_AB = 0','sub');s+=T(282,118,coupled?TR('②가 ① 보다 Δ_AB 짧다','② shorter by Δ_AB'):TR('① ② 길이가 같다','① and ② equal length'),'sub','end');
 s+=A(60,yM(0)-2,60,yM(E.a)+3,'g',0,{at:'end',t:'pump',tx:-44,ty:20})+A(245,yM(0)-2,245,yM(E.b)+3,'b',1,{dx:-14})+A(160,yM(E.a),160,yM(E.ab)+3,'r',2,{dx:-14});
 return s}

function tmPeaks(coupled){const d=coupled?.07:0,s={rx:9,ry:9};
 const p=[pk(1,1,'b',{...s,lab:TR('모드 A','mode A'),lx:-58}),pk(1,.88,'r',s),pk(1.3,1.3,'b',{...s,lab:TR('모드 B','mode B')}),pk(1.3,1.18,'r',s),br(1,1,.88,'Δ_A',14)];
 if(coupled)p.push(pk(1,1.3,'b',{...s,n:1}),pk(1,1.3-d,'r',{...s,n:2}),pk(1.3,1,'b',s),pk(1.3,1-d,'r',s),br(1,1.3,1.23,'Δ_AB',14));
 else p.push(pk(1,1.3,'b',{rx:11,ry:11,o:.35,n:1}),pk(1,1.3,'r',{rx:11,ry:11,o:.35,n:2,br:1,lab:TR('합 = 0','sum = 0')}),pk(1.3,1,'b',{rx:11,ry:11,o:.35}),pk(1.3,1,'r',{rx:11,ry:11,o:.35,lab:'0'}));
 return p}

 q:TR('두 cross peak의 Δ_AB는 같은가?','Is Δ_AB the same for the two cross peaks?'),a:TR('같다. 어느 모드를 먼저 들뜨게 하든 |11⟩ 에너지는 하나뿐이다.','Yes. Whichever mode is excited first, there is only one |11⟩ energy.')},

 read:[TR('이 단계부터 T &gt; 0이다. 슬라이더로 T(ps)를 늘리면 두 가지가 동시에 일어난다.','From this step on, T &gt; 0. Increasing T (ps) with the slider makes two things happen at once.'),TR('<b>첫째, 피크 모양: 대각선 타원 → 원.</b> 같은 C=O라도 주변 환경이 분자마다 달라 진동수가 조금씩 다르다(불균일 넓어짐, 에너지 그림의 점선).','<b>First, peak shape: diagonal ellipse → circle.</b> Even for the same C=O, the surroundings differ from molecule to molecule, so the frequencies differ slightly (inhomogeneous broadening, the dashed lines in the energy diagram).'),TR('T가 짧으면 분자가 pump 때의 자기 진동수를 아직 기억한다. ω₁에서 들뜬 분자는 ω₃도 같은 값에서 probe되니, 피크가 대각선 방향으로 길쭉하다.','At short T, each molecule still remembers its frequency at the time of the pump. A molecule excited at ω₁ is probed at the same ω₃, so the peak is stretched along the diagonal.'),TR('T가 길어지면 환경이 요동치며 진동수가 바뀌어 기억을 잃는다(spectral diffusion). pump 진동수와 probe 진동수가 무관해져 피크가 둥글어진다.','At longer T, the environment fluctuates, the frequency changes, and the memory is lost (spectral diffusion). The pump and probe frequencies become uncorrelated, and the peak becomes round.'),TR('정량: 타원 기울기(center line slope, CLS)가 진동수 상관 함수 C(T) ∝ exp(−T/τ_c)를 따라 1에서 0으로 줄어든다. 끝까지 남는 둥근 폭은 균일 선폭(빠른 요동, T₂).','Quantitatively: the ellipse slope (center line slope, CLS) follows the frequency correlation function C(T) ∝ exp(−T/τ_c) and falls from 1 to 0. The round width that remains at the end is the homogeneous linewidth (fast fluctuations, T₂).'),TR('<b>둘째, cross peak: 교환.</b> 5단계의 free / Li⁺-bound 경우. T 동안 Li⁺가 붙었다 떨어지면, free 위치에서 pump한 분자가 bound 위치에서 probe된다.','<b>Second, cross peaks: exchange.</b> The free / Li⁺-bound case of step 5. If Li⁺ binds or unbinds during T, a molecule pumped at the free position is probed at the bound position.'),TR(`${c(1,'b')} ${c(2,'r')} cross peak 쌍이 T에 따라 자란다. ESA가 bound 자신의 Δ만큼 아래라 상쇄되지 않는다.`,`The ${c(1,'b')} ${c(2,'r')} cross-peak pair grows with T. The ESA lies below by the bound species’ own Δ, so it does not cancel.`),TR('교환은 양방향이라 두 cross peak가 대칭으로 자란다(2DES 에너지 전달은 내리막 쪽이 큼).','Exchange goes both ways, so the two cross peaks grow symmetrically (in 2DES energy transfer, the downhill one is larger).'),TR('동시에 진동 수명 T₁으로 전체 신호가 줄어든다. 교환이 T₁보다 느리면 cross peak가 자라기 전에 사라진다.','At the same time, the whole signal decays with the vibrational lifetime T₁. If exchange is slower than T₁, the cross peaks vanish before they can grow.'),TR('그림 값(τ_c 2 ps, 교환 5 ps, T₁ 8 ps)은 설명용 가정.','The figure values (τ_c 2 ps, exchange 5 ps, T₁ 8 ps) are assumed for illustration.')],
 q:TR('8단계(coupling) cross peak와 교환 cross peak는 어떻게 구분하나? 그리고 피크가 처음부터 둥글면 무슨 뜻인가?','How are step-8 (coupling) cross peaks told apart from exchange cross peaks? And what does a peak that is round from the start mean?'),a:TR('coupling cross peak는 T = 0부터 있고 T에 따라 줄기만 한다. 교환 cross peak는 T = 0에 없고 T에 따라 자란다. 처음부터 둥글면 불균일 넓어짐이 작거나, 기억을 잃는 속도가 측정 가능한 가장 짧은 T보다 빠르다는 뜻.','Coupling cross peaks are present from T = 0 and only decay with T. Exchange cross peaks are absent at T = 0 and grow with T. A peak that is round from the start means either little inhomogeneous broadening, or memory loss faster than the shortest measurable T.')}];

const seg=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
function along(pts,d){for(let i=1;i<pts.length;i++){const L=seg(pts[i-1],pts[i]);if(d<=L){const r=d/L;return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r]}d-=L}return null}
function pulsePos(inPts,exitPts,arr,Tf){const d=(arr-Tf)*VP;if(d>=0)return along([...inPts].reverse(),d);return exitPts?along(exitPts,-d):null}
const poly=(pts,cls='beam',ex='')=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="${cls}"${ex}/>`;
function dot(p,col,lab,av,low){if(!p)return'';if(av&&av.some(([x,y,w,h])=>p[0]>x-6&&p[0]<x+w+6&&p[1]>y-6&&p[1]<y+h+6))return'';return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5.5" style="fill:${col}"/>`+(lab?T(p[0]+8,p[1]+(low?16:-6),lab,'sub'):'')}
function boxL(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
function phase(Tf){return Tf<TA[0]?TR('펄스들이 샘플로 가는 중','pulses on the way to the sample'):Tf<TA[1]?TR('1번 지남 → 결맞음 구간 t₁','after 1 → coherence period t₁'):Tf<TA[2]?TR('2번 지남 → 대기 구간 T','after 2 → waiting time T'):TR('3번 지남 → 신호 방출 구간 t₃','after 3 → signal emission t₃')}
function timeline(Tf,labs,mini){const X=t=>t*.3,Y0=210;let s='';
 const bump=t=>{let d='';for(let u=-60;u<=60;u+=5){const y=Y0-55*Math.exp(-(u*u)/(2*18*18));d+=(d?' L':'M')+X(t+u).toFixed(1)+','+y.toFixed(1)}return `<path d="${d}" fill="none" style="stroke:var(--pump)" stroke-width="2"/>`};
 let sig='';for(let t=600;t<=1000;t+=4){const y=Y0-30*Math.exp(-(t-600)/170)*(1+Math.cos(2*Math.PI*(t-600)/45))/2;sig+=(sig?' L':'M')+X(t).toFixed(1)+','+y.toFixed(1)}

 read:[TR('분자 집합의 상태를 밀도 행렬 ρ = |ket⟩⟨bra|로 쓴다. 행이 ket, 열이 bra다.','The state of the molecular ensemble is written as a density matrix ρ = |ket⟩⟨bra|. Rows are ket, columns are bra.'),TR(`${c(1,'s3')} 대각선(ρ_gg, ρ_ee)은 집단(population)이다. 각 상태에 분자가 몇 %인지 나타내고, 진동하지 않는다.`,`${c(1,'s3')} The diagonal (ρ_gg, ρ_ee) holds populations. They give the percentage of molecules in each state and do not oscillate.`),TR(`${c(2,'s5')} 비대각선(ρ_eg, ρ_ge)은 결맞음(coherence)이다. 두 상태 에너지 차이 ω_eg로 진동하고, 이 진동이 빛을 낸다. 그래서 신호는 결맞음에서 나온다.`,`${c(2,'s5')} The off-diagonal (ρ_eg, ρ_ge) holds coherences. They oscillate at the energy difference ω_eg, and this oscillation radiates light. So the signal comes from a coherence.`),TR('빛과 한 번 상호작용할 때마다 ket이나 bra 중 한쪽 지표만 바뀐다. 이 규칙을 그림으로 그린 것이 이중 Feynman 다이어그램(DSFD)이다.','Each interaction with light changes only one index, either ket or bra. Drawing this rule gives the double-sided Feynman diagram (DSFD).')],

{t:TR('그리는 규칙: 선형 흡수(FTIR) 하나로 연습','Drawing rules: practice with linear absorption (FTIR)'),ec:TR('1차 다이어그램','first-order diagram'),mc:TR('결맞음의 감쇠(FID) → 흡수선','coherence decay (FID) → absorption line'),
 e:()=>fdDiag(120,{ys:[250,206,112,60],it:[['k',1,'s3']],rho:['|g⟩⟨g|','|e⟩⟨g|','|g⟩⟨g|'],sig:'b'})+`<g data-n="1">${badge(206,159,1,'var(--s5)')}</g>`+T(218,163,TR('결맞음 구간','coherence period'),'sub')
   +`<g data-n="2">${badge(70,94,2,'var(--s1)')}</g>`+T(200,202,TR('왼쪽 초록 화살표:','left green arrow:'),'sub')+T(200,218,TR('빛이 ket을 올림','light raises the ket'),'sub')+T(20,24,TR('시간 ↑ (아래에서 위로)','time ↑ (bottom to top)'),'sub')+fdKey(20,284),
 m:()=>{const P1=plot({x:[0,10],y:[-1.1,1.1],T:30,B:118,L:40,noy:1,xt:[{v:0,l:'0'},{v:10,l:TR('시간 →','time →')}]}),P2=plot({x:[2400,2600],y:[0,1.1],T:166,B:262,L:40,noy:1,xt:[{v:2450,l:'2450'},{v:2500,l:'2500'},{v:2550,l:'2550'}],xl:'wavenumber (cm⁻¹)'});
  return P1.s+P2.s+`<line x1="${P1.L}" x2="${P1.R}" y1="${P1.Y(0)}" y2="${P1.Y(0)}" class="lvl2"/><g data-n="1">${crv(P1,t=>Math.cos(2*Math.PI*1.2*t)*Math.exp(-t/2.5),0,10,'var(--s5)',{n:500,w:1.5})}${badge(P1.L-18,P1.Y(.7),1,'var(--s5)')}</g>`
   +T(P1.L,22,TR('자유 유도 감쇠 (FID)','free induction decay (FID)'),'sub')+LN(160,124,160,152,'var(--muted)',{w:1.5,mk:'g'})+T(168,142,TR('푸리에 변환','Fourier transform'),'sub')
   +`<g data-n="2">${crv(P2,w=>fdLor(w,2500,14),2400,2600,'var(--fg)')}${badge(P2.X(2500)+22,P2.Y(1)+4,2,'var(--s1)')}</g>`+T(P2.R,P2.Y(.6),TR('흡수선','absorption line'),'sub','end')+T(P2.L,P2.T-4,TR('감쇠가 빠를수록 선이 넓다 (예시)','faster decay, broader line (example)'),'sub')},
 read:[TR('두 세로선 중 왼쪽이 ket, 오른쪽이 bra다. 시간은 아래에서 위로 흐른다. 선 사이에 그 구간의 밀도 행렬 원소를 적는다.','Of the two vertical lines, the left is the ket and the right is the bra. Time runs from bottom to top. The density-matrix element of each interval is written between the lines.'),TR('화살표 하나 = 빛과 한 번의 상호작용. 선으로 들어오는 화살표는 그 쪽 상태를 올리고, 선에서 나가는 화살표는 내린다.','One arrow = one interaction with light. An arrow pointing into a line raises that side; an arrow pointing away lowers it.'),TR(`마지막 점선 화살표는 시료가 내보내는 ${c(2,'s1')} 신호다. 신호가 나간 뒤에는 집단(대각선)으로 끝나야 한다.`,`The last dashed arrow is the ${c(2,'s1')} signal emitted by the sample. After the signal leaves, the diagram must end in a population (diagonal).`),TR(`FTIR은 가장 단순한 1차 다이어그램이다. 빛이 한 번 ket을 올려 ${c(1,'s5')} 결맞음 |e⟩⟨g|를 만들고, 이 결맞음이 줄어들며 내는 빛(FID)을 푸리에 변환하면 흡수선이 된다.`,`FTIR is the simplest, first-order diagram. One interaction raises the ket and creates the ${c(1,'s5')} coherence |e⟩⟨g|; Fourier transforming the light it emits while decaying (FID) gives the absorption line.`),TR('부호 규칙: bra 쪽 상호작용이 하나 늘 때마다 부호가 바뀐다. 부호 = (−1)^(bra 쪽 수). 다음 단계부터 쓴다.','Sign rule: each additional bra-side interaction flips the sign. Sign = (−1)^(number on the bra side). Used from the next step on.')],
 q:TR('FID가 더 빨리 사라지면 흡수선은?','If the FID dies out faster, what happens to the absorption line?'),a:TR('더 넓어진다. 결맞음이 빨리 깨지는 것(dephasing)이 선 폭을 정한다.','It gets broader. How fast the coherence is lost (dephasing) sets the linewidth.')},
{t:TR('GSB와 SE: bra 쪽이 짝수 번 → +','GSB and SE: even number on the bra side → +'),ec:TR('pump-probe 경로 두 개 (non-rephasing)','two pump-probe pathways (non-rephasing)'),mc:TR('probe 스펙트럼 (ω_eg = 2500 cm⁻¹ 예시)','probe spectrum (ω_eg = 2500 cm⁻¹, example)'),
 e:()=>fdDiag(48,{...FD_GSB,name:'GSB',sub:TR('bra 0번 → +','bra ×0 → +'),n:1})+fdDiag(204,{...FD_SE,name:'SE',sub:TR('bra 2번 → +','bra ×2 → +'),n:2,hi:2})+fdKey(40,20),
 m:()=>fdSpec(0,'gse'),
 read:[TR('pump-probe에서는 처음 두 상호작용이 pump 한 펄스에서, 세 번째가 probe에서 온다. 신호는 probe 방향으로 나와 probe와 함께 검출된다.','In pump-probe, the first two interactions come from one pump pulse and the third from the probe. The signal leaves in the probe direction and is detected together with the probe.'),TR(`${c(1,'s1')} GSB: pump 두 번이 ket만 올렸다 내려, 바닥 상태에 "구멍"을 남긴다(|g⟩⟨g|). probe가 다시 |e⟩⟨g|를 만들고 ω_eg에서 신호가 나온다. bra 쪽 0번이라 부호 +.`,`${c(1,'s1')} GSB: the two pump interactions raise and lower the ket only, leaving a "hole" in the ground state (|g⟩⟨g|). The probe creates |e⟩⟨g| again and the signal appears at ω_eg. No bra-side interactions, so the sign is +.`),TR(`${c(2,'s1')} SE: pump가 ket과 bra를 하나씩 올려 들뜬 집단 |e⟩⟨e|를 만든다. probe가 bra를 내려 |e⟩⟨g|가 되고, 역시 ω_eg에서 신호가 나온다. bra 쪽 2번이라 부호 +.`,`${c(2,'s1')} SE: the pump raises the ket and the bra once each, creating the excited population |e⟩⟨e|. The probe lowers the bra to give |e⟩⟨g|, and the signal again appears at ω_eg. Two bra-side interactions, so the sign is +.`),TR('둘 다 probe 흡수를 줄인다(투과가 는다). 이 페이지의 ΔT/T 규약으로 + (빨강)이다. ΔA로 그리면 음수라 색이 반대다.','Both reduce probe absorption (transmission increases). In the ΔT/T convention of this page that is + (red). Plotted as ΔA it is negative, so the colors are reversed.'),TR('진동 전이에서는 두 경로가 같은 자리(ω_eg), 같은 크기로 겹친다. 2D IR 탭 2단계의 "GSB+SE" 피크가 이것이다.','For a vibrational transition, the two pathways overlap at the same position (ω_eg) with the same size. This is the "GSB+SE" peak of 2D IR step 2.')],
 q:TR('SE 다이어그램에서 T 구간(가운데 긴 구간)의 원소는?','In the SE diagram, which element occupies the T interval (the long middle interval)?'),a:TR('|e⟩⟨e|. 들뜬 상태의 집단이다. 그래서 T 동안 들뜬 상태가 사라지면 SE도 함께 줄어든다.','|e⟩⟨e|, the excited-state population. So when the excited state decays during T, the SE decreases with it.')},
{t:TR('ESA: bra 쪽이 홀수 번 → −, 그리고 상쇄','ESA: odd number on the bra side → −, and cancellation'),ec:TR('ESA 경로와 준위','ESA pathway and levels'),mc:TR('probe 스펙트럼: 합과 성분','probe spectrum: sum and parts'),
 slider:{min:0,max:80,step:2,init:30,label:TR('비조화성 Δ','anharmonicity Δ'),fmt:v=>Math.round(v)+' cm⁻¹'},
 e:v=>{const Y=[248,176,116];return fdDiag(40,{...FD_ESA,name:'ESA',sub:TR('bra 1번 → −','bra ×1 → −'),n:3,hi:2})+fdKey(40,20)
   +['g','e','f'].map((l,i)=>L(200,280,Y[i])+T(286,Y[i]+4,l,'sub')).join('')+A(214,Y[0]-2,214,Y[1]+3,'g',0)+A(236,Y[0]-2,236,Y[1]+3,'g',0)+A(262,Y[1]-2,262,Y[2]+3,'s3',3,{dx:14})
   +T(196,76,'ω_fe = ω_eg − Δ','sub')+T(196,94,`Δ = ${Math.round(v)} cm⁻¹`,'sub')},
 m:v=>fdSpec(v,'all'),
 read:[TR(`${c(3,'s2')} ESA: pump가 만든 |e⟩⟨e|에서 probe가 ket을 한 번 더 올려 |f⟩⟨e|가 된다. 신호는 ω_fe에서 나오고, bra 쪽 1번이라 부호 −(파랑)다. probe 흡수가 늘어난다.`,`${c(3,'s2')} ESA: starting from the |e⟩⟨e| made by the pump, the probe raises the ket once more to |f⟩⟨e|. The signal appears at ω_fe, and with one bra-side interaction the sign is − (blue). Probe absorption increases.`),TR('세기도 다이어그램이 정한다. GSB, SE는 각각 μ_eg⁴, ESA는 μ_eg²μ_fe²에 비례한다. 조화 진동자는 μ_fe² = 2μ_eg²라 ESA 하나가 GSB + SE 둘과 크기가 같다.','The diagram also sets the strength. GSB and SE each scale as μ_eg⁴, and ESA as μ_eg²μ_fe². For a harmonic oscillator μ_fe² = 2μ_eg², so one ESA equals GSB + SE together.'),TR('슬라이더로 Δ를 0으로 줄이면 ω_fe = ω_eg가 되어 + 와 −가 정확히 지워진다. 조화 진동자는 pump-probe 신호가 없다. 신호가 보이는 것은 비조화성 덕분이다(2D IR 탭 4단계와 같은 논리).','Reducing Δ to 0 with the slider makes ω_fe = ω_eg, and + and − cancel exactly. A harmonic oscillator gives no pump-probe signal. The signal is visible thanks to anharmonicity (same logic as 2D IR step 4).'),TR('Δ가 선 폭보다 크면 + 띠와 − 띠가 따로 보인다. Δ가 작으면 두 띠가 겹쳐 봉우리 위치가 실제 ω_eg, ω_fe에서 밀려난다. 그래서 두 봉우리 간격은 Δ와 꼭 같지 않다.','When Δ is larger than the linewidth, the + and − bands appear separately. When Δ is small, the bands overlap and the peak positions are pushed away from the true ω_eg and ω_fe. So the spacing between the two peaks is not exactly Δ.')],
 q:TR('Δ가 선 폭보다 훨씬 작으면 스펙트럼은 어떤 모양인가?','What does the spectrum look like when Δ is much smaller than the linewidth?'),a:TR('+ 와 − 가 거의 지워지고, 미분 모양(위아래로 붙은 작은 쌍)만 남는다. 크기도 Δ에 비례해 작아진다.','+ and − nearly cancel, leaving only a derivative shape (a small up-down pair). Its size also shrinks in proportion to Δ.')},
{t:TR('시간 변수: t₁ ≈ 0, T를 스캔, t₃는 분광기가','Time variables: t₁ ≈ 0, T is scanned, t₃ goes to the spectrometer'),ec:TR('SE 경로의 세 구간','three intervals of the SE pathway'),mc:TR('T에 따른 신호 (집단 수명 1.5 ps 예시)','signal vs T (population lifetime 1.5 ps, example)'),
 slider:{min:0,max:5,step:.05,init:0,label:TR('지연 T','delay T'),fmt:v=>v.toFixed(2)+' ps',play:1},
 e:v=>{const ys=[262,238,216,120,78,52],x=60,xb=x+FD_W,bx=xb+40;const pop=Math.exp(-v/1.5);
  const brace=(a,b,lab,sub)=>`<path d="M${bx-4},${a} H${bx} V${b} H${bx-4}" fill="none" style="stroke:var(--muted)"/>`+T(bx+6,(a+b)/2+(sub?-2:4),lab,'labn')+(sub?T(bx+6,(a+b)/2+13,sub,'sub'):'');
  return fdDiag(x,{...FD_SE,ys,hi:2})+brace(ys[1],ys[2],'t₁ ≈ 0','')+brace(ys[2],ys[3],TR('T = 지연','T = delay'),TR('스테이지로 스캔','scanned by stage'))+brace(ys[3],ys[4],'t₃',TR('분광기 → ω₃','spectrometer → ω₃'))+fdKey(40,20)
   +`<rect x="${x+6}" y="${ys[2]-8-(ys[2]-ys[3]-16)*pop}" width="${FD_W-12}" height="${(ys[2]-ys[3]-16)*pop}" style="fill:var(--s1);fill-opacity:.15"/>`+T(bx+6,286,TR(`남은 집단 ${Math.round(pop*100)}%`,`population left ${Math.round(pop*100)}%`),'sub')},
 m:v=>{const P=plot({x:[0,5],y:[0,1.1],xt:[0,1,2,3,4,5].map(t=>({v:t,l:String(t)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:TR('지연 T (ps)','delay T (ps)'),yl:TR('ΔT/T (상대)','ΔT/T (rel.)'),T:30});
  return P.s+crv(P,t=>Math.exp(-t/1.5),0,5,'var(--s1)')+`<circle cx="${P.X(v)}" cy="${P.Y(Math.exp(-v/1.5))}" r="6" style="fill:var(--s1)"/>`+T(P.R,P.T-12,TR('ω_eg에서 본 GSB + SE','GSB + SE at ω_eg'),'sub','end')},
 read:[TR('상호작용 사이 세 구간을 t₁, T(= t₂), t₃라 한다. 2D IR 탭 첫 단계 위 "공통" 상자의 시간 축과 같은 것이다.','The three intervals between interactions are t₁, T (= t₂) and t₃. They match the time axis in the shared box above the first 2D IR step.'),TR('t₁: 두 pump 상호작용이 한 펄스 안에서 일어나 거의 0이다. 그래서 pump-probe에는 ω₁ 축이 없다. 2D IR은 이 t₁을 스캔해 ω₁ 축을 얻는다.','t₁: both pump interactions happen within one pulse, so it is almost 0. That is why pump-probe has no ω₁ axis. 2D IR scans this t₁ to obtain the ω₁ axis.'),TR('T: pump와 probe 사이 지연이다. 지연 스테이지로 직접 스캔하는 유일한 구간이다. 이 동안 시료는 집단(|e⟩⟨e|)에 있다. 그래서 pump-probe는 집단이 줄어드는 속도를 잰다.','T: the delay between pump and probe. It is the only interval scanned directly, with the delay stage. During T the sample is in a population (|e⟩⟨e|), so pump-probe measures how fast the population decays.'),TR('t₃: 신호가 나오는 구간이다. 스캔하지 않는다. 투과한 probe를 분광기로 펼쳐 배열 검출기로 찍으면 t₃가 바로 ω₃ 축으로 바뀐다(검출과 분광기 노트).','t₃: the interval in which the signal is emitted. It is not scanned. Dispersing the transmitted probe in a spectrometer onto an array detector turns t₃ directly into the ω₃ axis (detection and spectrometer note).'),TR('재생을 누르면 T가 늘며 |e⟩⟨e| 집단이 줄고(왼쪽 색칠), 신호가 같이 준다(오른쪽). 1.5 ps는 예시 값이다.','With Play, T increases, the |e⟩⟨e| population shrinks (shaded, left) and the signal drops with it (right). 1.5 ps is an example value.')],
 q:TR('pump와 probe가 겹치는 T ≈ 0 근처 데이터를 조심해야 하는 이유는?','Why must data near T ≈ 0, where pump and probe overlap, be treated with care?'),a:TR('펄스가 겹치면 상호작용 순서가 정해지지 않고, 용매·창의 비공명 신호(coherent artifact)가 더해진다. 그래서 이 구간은 피팅에서 빼거나 따로 다룬다.','When the pulses overlap, the interaction order is not defined, and nonresonant signals from solvent and windows (coherent artifact) add in. So this region is excluded from fits or treated separately.')},

 read:[TR('같은 GSB라도 pump의 두 상호작용 순서에 따라 두 경로가 있다. t₁ 동안 결맞음이 |g⟩⟨e|(rephasing)인지 |e⟩⟨g|(non-rephasing)인지가 다르다.','Even the same GSB has two pathways, depending on the order of the two pump interactions. They differ in whether the coherence during t₁ is |g⟩⟨e| (rephasing) or |e⟩⟨g| (non-rephasing).'),TR('rephasing은 t₁에서 거꾸로 돌던 위상을 t₃에서 되감는다. 그래서 주파수가 조금씩 다른 분자들의 위상이 다시 모이는 echo가 생긴다.','Rephasing unwinds during t₃ the phase that ran backwards during t₁. Molecules with slightly different frequencies therefore come back into phase: an echo.'),TR('두 경로는 나가는 방향이 다르다(위 식). 그런데 pump-probe에서는 k₁ = k₂(같은 pump 빔)라 두 식이 모두 k_s = k₃가 되어, 둘 다 probe 방향으로 나와 합쳐진다.','The two pathways leave in different directions (equations above). In pump-probe, however, k₁ = k₂ (the same pump beam), so both equations give k_s = k₃: both leave in the probe direction and add.'),TR('그래서 pump-probe로는 둘을 나눌 수 없다. 나누려면 세 빔을 따로 쓰는 BOXCARS 배치나 위상 순환(phase cycling)이 필요하다(셋업 탭).','So pump-probe cannot separate them. Separating them needs a BOXCARS geometry with three separate beams, or phase cycling (setup tab).')],
 q:TR('GSB, SE, ESA 각각에 rephasing·non-rephasing이 있다면 pump-probe 경로는 모두 몇 개인가?','If GSB, SE and ESA each have rephasing and non-rephasing versions, how many pump-probe pathways are there?'),a:TR('6개(3 × 2). 3준위계에서 바닥 아래로 내려가거나 결맞음으로 끝나는 경로를 빼면 이만큼 남는다.','Six (3 × 2). In a three-level system, that is what remains after removing pathways that go below the ground state or end in a coherence.')},
{t:TR('편광: magic angle 54.7°','Polarization: magic angle 54.7°'),ec:TR('pump와 probe 편광 방향 (빔 진행 방향에서 본 모습)','pump and probe polarization directions (viewed along the beams)'),mc:TR('T에 따른 신호 (예시: 집단 5 ps, 회전 3 ps)','signal vs T (example: population 5 ps, rotation 3 ps)'),

 read:[TR('pump는 편광 방향과 나란한 전이 쌍극자를 가진 분자를 더 많이 들뜨게 한다(광선택). 그래서 신호는 pump와 probe 편광 사이 각 θ에 따라 달라진다.','The pump preferentially excites molecules whose transition dipole is parallel to its polarization (photoselection). So the signal depends on the angle θ between the pump and probe polarizations.'),TR('들뜬 분자가 회전하면 이 치우침이 풀리며 신호가 변한다. 이 효과가 이방성 r(T)이다. 평행(0°)은 크게, 수직(90°)은 작게 보인다.','As the excited molecules rotate, this bias relaxes and the signal changes. This effect is the anisotropy r(T). Parallel (0°) appears larger, perpendicular (90°) smaller.'),TR('3cos²θ − 1 = 0이 되는 θ ≈ 54.7°(magic angle)에서는 r 항이 사라진다. 그러면 분자 회전이 집단 감소처럼 보이는 일을 막을 수 있다.','At θ ≈ 54.7° (the magic angle), where 3cos²θ − 1 = 0, the r term vanishes. This keeps molecular rotation from looking like population decay.'),TR('슬라이더로 θ를 바꾸면 실선이 평행과 수직 사이를 오가고, 54.7°에서 점선(S_iso)과 겹친다. 수명 5 ps, 회전 3 ps, r(0) = 0.4는 예시 값이다.','Changing θ with the slider moves the solid line between parallel and perpendicular; at 54.7° it overlaps the dotted S_iso. Lifetime 5 ps, rotation 3 ps and r(0) = 0.4 are example values.'),TR('반대로 평행과 수직을 둘 다 재면 r(T)를 따로 얻어 회전 동역학을 볼 수 있다. 이때 두 채널이 정말 서로 다른 편광인지 확인해야 한다.','Conversely, measuring both parallel and perpendicular gives r(T) separately and reveals rotational dynamics. The two channels must then be checked to really carry different polarizations.')],
 q:TR('평행과 수직 신호로 등방성 신호를 만드는 식은?','What formula builds the isotropic signal from the parallel and perpendicular signals?'),a:TR('S_iso = (S_∥ + 2S_⊥) / 3. 수직 방향이 두 개(공간의 나머지 두 축)라 2를 곱한다.','S_iso = (S_∥ + 2S_⊥) / 3. There are two perpendicular directions (the other two axes of space), hence the factor 2.')},
{t:TR('직접 그려 보기: 상호작용 세 번을 고르면 신호가 정해진다','Building a diagram: three chosen interactions fix the signal'),ec:TR('내가 고른 다이어그램','chosen diagram'),mc:TR('판정: 이름, 부호, 자리','verdict: name, sign, position'),
 tg:[{k:'b1',l:TR('①을 bra 쪽에','① on bra side'),on:false},{k:'b2',l:TR('②를 bra 쪽에','② on bra side'),on:false},{k:'d2',l:TR('② 내림','② down'),on:true},{k:'b3',l:TR('③(probe)을 bra 쪽에','③ (probe) on bra side'),on:false},{k:'d3',l:TR('③ 내림','③ down'),on:false}],

 read:[TR('체크박스로 세 상호작용이 ket(왼쪽)인지 bra(오른쪽)인지, ②와 ③이 올림인지 내림인지 고르면 다이어그램과 판정이 바로 바뀐다. ①은 바닥 |g⟩⟨g|에서 시작하니 항상 올림이다.','The checkboxes choose whether each interaction acts on the ket (left) or the bra (right), and whether ② and ③ go up or down; the diagram and the verdict update at once. ① starts from the ground state |g⟩⟨g|, so it always goes up.'),TR('규칙 1: pump 두 번(①②)은 +k 하나, −k 하나여야 한다. ket 올림과 bra 내림이 +k, ket 내림과 bra 올림이 −k다. 그래야 지연 T 동안 집단(대각선)에 머물고 신호가 probe 방향으로 나온다.','Rule 1: the two pump interactions (①②) must be one +k and one −k. Ket up and bra down are +k; ket down and bra up are −k. Only then does the system stay in a population (diagonal) during T and the signal leave in the probe direction.'),TR('규칙 2: probe(③)는 +k₃(ket 올림 또는 bra 내림)이고, 그 뒤 ket이 bra보다 한 칸 위인 결맞음이어야 ket 쪽에서 신호가 나온다.','Rule 2: the probe (③) is +k₃ (ket up or bra down), and afterwards the state must be a coherence with the ket one level above the bra, so that the signal is emitted on the ket side.'),TR('규칙 3: 부호 = (−1)^(bra 쪽 수). 이 규칙을 모두 지키는 조합은 오른쪽 표의 6개뿐이다. GSB와 SE는 +(빨강), ESA는 −(파랑)이다. rephasing 단계 점검 질문의 "6개"가 이것이다.','Rule 3: sign = (−1)^(number on the bra side). Only the 6 combinations in the table on the right satisfy all the rules. GSB and SE are + (red), ESA is − (blue). These are the "six" of the check question in the rephasing step.'),TR('①을 bra 쪽에 두면 rephasing, ket 쪽에 두면 non-rephasing이다. pump-probe에서는 둘이 같은 방향으로 나와 합쳐진다.','With ① on the bra side the pathway is rephasing; on the ket side it is non-rephasing. In pump-probe both leave in the same direction and add.'),TR('✗가 나오면 오른쪽에 이유가 나온다. 대부분 "g 아래로 내려감"이거나 "pump 두 번이 같은 부호"다.','When ✗ appears, the reason is shown on the right. Usually it is "goes below g" or "both pump interactions have the same sign".')],
 q:TR('①②를 모두 ket 올림으로 고르면 어떤 상태가 되고, 왜 pump-probe 신호가 아닌가?','If ① and ② are both chosen as ket up, which state results, and why is it not a pump-probe signal?'),a:TR('|f⟩⟨g|, 두 양자(2Q) 결맞음이다. +k가 두 번이라 신호가 2k_pump + k₃ 쪽으로 나가 probe 방향과 다르다. 이런 경로는 2Q 2D 분광에서 따로 잰다.','|f⟩⟨g|, a two-quantum (2Q) coherence. With +k twice, the signal leaves along 2k_pump + k₃, not the probe direction. Such pathways are measured separately in 2Q 2D spectroscopy.')}];

if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
