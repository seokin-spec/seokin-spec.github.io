<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>랩 측정 기법 노트</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · 측정 기법 노트</span><span class="status" title="전문가 검토 전 초안이다. 값의 대략·예시·확인 필요 표시를 같이 본다.">검토 중</span></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>
  <div class="stage" id="stage">
    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="왼쪽 그림"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="오른쪽 그림"></svg></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>재생</button>
    <span id="tgl"></span>
  </div>
  <div class="notes">
    <div class="read"><ul id="read"></ul><div class="case" id="case" hidden></div></div>
    <div class="quiz"><span class="k">점검 질문</span><p id="q"></p><details id="ad"><summary>답 보기</summary><p id="a"></p></details></div>
  </div>
  <nav><button id="prev" type="button">← 이전</button><div class="dots" id="dots"></div><button id="next" type="button">다음 →</button></nav>
</div>

<script>
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 랩 측정 기법 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 측정 기법 노트
// @status 검토 중
/* 랩 측정 기법 노트: FTIR·UV-Vis, Raman, CARS, VSFG, DEMS·OEMS */
const NOTE={key:'labtech'};
const lor=(x,x0,g)=>g*g/((x-x0)**2+g*g);

/* ======================= FTIR · UV-Vis ======================= */
const sig=x=>1/(1+Math.exp(-x));
function trows(P,items,y0,dy,h,Tf){return items.map((it,i)=>{const y=y0+i*dy;let d='';const a=Math.min(P.X(P.xa),P.X(P.xb)),n=240;
 for(let k=0;k<=n;k++){const w=P.xa+(P.xb-P.xa)*k/n,t=Tf(it,w);d+=(k?' L':'M')+P.X(w).toFixed(1)+','+(y+(1-t)*h).toFixed(1)}
 return T(P.L-8,y+h/2+4,it.l,'sub','end')+`<line x1="${P.L}" x2="${P.R}" y1="${y}" y2="${y}" class="lvl2"/><path d="${d} L${P.X(P.xb).toFixed(1)},${y} L${P.X(P.xa).toFixed(1)},${y} Z" style="fill:var(--s4)" fill-opacity=".25"/><path d="${d}" fill="none" style="stroke:var(--s3)" stroke-width="1.8"/>`}).join('')}
const tLeg=(x,y,tail)=>`<line x1="${x}" x2="${x+22}" y1="${y}" y2="${y}" style="stroke:var(--s3)" stroke-width="2"/>`+T(x+28,y+4,'투과율 (위 100%, 아래 0%)','sub')+`<rect x="${x+170}" y="${y-6}" width="16" height="12" style="fill:var(--s4)" fill-opacity=".35"/>`+T(x+192,y+4,'용매가 먹음'+tail,'sub');
const irT=(it,w)=>it.r.reduce((t,[a,b])=>t*(1-sig((a-w)/18)*sig((w-b)/18)),1);
const uvT=(it,w)=>sig((w-it.c-6)/5);

const blkLeg=(x,y,tail)=>`<line x1="${x}" x2="${x+22}" y1="${y}" y2="${y}" style="stroke:var(--s3)" stroke-opacity=".5" stroke-width="3"/>`+T(x+28,y+4,'보임','sub')+`<rect x="${x+64}" y="${y-6}" width="22" height="12" rx="2" style="fill:var(--s4)" fill-opacity=".85"/>`+T(x+92,y+4,'용매 흡광이 너무 셈 → 못 봄'+tail,'sub');
function bars(P,items,y0,dy,mode){return items.map((it,i)=>{const y=y0+i*dy;let s=T(P.L-8,y+4,it.l,'sub','end');
 if(mode==='clear'){s+=it.r.map(([a,b])=>`<rect x="${Math.min(P.X(a),P.X(b))}" y="${y-8}" width="${Math.abs(P.X(b)-P.X(a))}" height="16" rx="3" style="fill:var(--s3)" fill-opacity=".35"/>`).join('');
  const cut=it.cut??it.r[it.r.length-1][1];s+=`<line x1="${P.X(cut)}" x2="${P.X(cut)}" y1="${y-10}" y2="${y+10}" style="stroke:var(--s3)" stroke-width="3"/>`+T(P.X(cut)+(it.lft?6:-6),y+4,String(cut),'labn',it.lft?'start':'end');if(it.note)s+=T(P.L+6,y+4,it.note,'subn')}
 else{s+=`<line x1="${P.L}" x2="${P.R}" y1="${y}" y2="${y}" style="stroke:var(--s3)" stroke-opacity=".5" stroke-width="3"/>`+it.r.map(([a,b])=>`<rect x="${Math.min(P.X(a),P.X(b))}" y="${y-7}" width="${Math.max(2,Math.abs(P.X(b)-P.X(a)))}" height="14" rx="2" style="fill:var(--s4)" fill-opacity=".85"/>`).join('')}
 return s}).join('')}
const irAx={x:[4000,400],xt:[{v:4000,l:'4000'},{v:3000,l:'3000'},{v:2000,l:'2000'},{v:1000,l:'1000'},{v:400,l:'400'}],xl:'wavenumber (cm⁻¹)',L:92,noy:1,T:26,B:236};
const FU=[
{t:'창·셀 재질: 빛이 지나가는 범위',ec:'FTIR 창 재질',mc:'UV-Vis 큐벳 재질',
 e:()=>{const P=plot(irAx);return P.s+T(P.L,14,'숫자 = 투과 하한 (cm⁻¹, 대략)','sub')+bars(P,[{l:'KBr',r:[[4000,400]],note:'물에 녹음'},{l:'ZnSe',r:[[4000,600]],note:'ATR'},{l:'NaCl',r:[[4000,650]],note:'물에 녹음'},{l:'Ge',r:[[4000,700]],note:'ATR'},{l:'BaF₂',r:[[4000,800]]},{l:'CaF₂',r:[[4000,1100]],note:'물에 강함'},{l:'다이아몬드',r:[[4000,2500],[1800,400]],note:'ATR'},{l:'유리·석영',r:[[4000,2800]],cut:2800,lft:1}],40,25,'clear')},
 m:()=>{const P=plot({x:[190,1100],xt:[{v:200,l:'200'},{v:400,l:'400'},{v:600,l:'600'},{v:800,l:'800'},{v:1000,l:'1000'}],xl:'wavelength (nm)',L:110,noy:1,T:26,B:236});
  return P.s+T(P.L,14,'숫자 = 투과 하한 (nm, 대략)','sub')+bars(P,[{l:'석영 (UV 등급)',r:[[190,1100]],cut:190,lft:1},{l:'UV용 플라스틱',r:[[220,1100]],cut:220,lft:1},{l:'PMMA',r:[[300,1100]],cut:300,lft:1},{l:'광학 유리',r:[[330,1100]],cut:330,lft:1},{l:'폴리스티렌',r:[[340,1100]],cut:340,lft:1}],50,38,'clear')},
 read:['막대가 있는 곳은 빛이 지나가고, 끊긴 곳은 그 재질이 빛을 먹는다(값은 대략).','FTIR: NaCl, KBr은 넓게 투명하지만 물에 녹는다. 수용액이나 습한 샘플에는 쓰지 않는다.','CaF₂, BaF₂는 물에 강한 대신 저파수(약 1100, 800 cm⁻¹ 아래)를 가린다.','ATR 결정으로는 ZnSe, Ge, 다이아몬드를 많이 쓴다. 다이아몬드는 약 2500–1800 cm⁻¹에 자체 흡수가 있다.','유리와 석영은 중적외 대부분을 막는다. 그래서 FTIR에는 유리 셀을 못 쓴다.','UV-Vis: 200 nm 근처까지 보려면 석영 큐벳. 유리와 일반 플라스틱은 약 300–340 nm 아래를 가린다.'],
 case:'<b>사례: 큐벳 하나로 결과가 바뀐다.</b> 한 기업 분석팀에서 같은 시료를 두 사람이 UV-Vis로 쟀다. 첫 번째 사람은 한 번 쓰고 버리는 PS(폴리스티렌) 큐벳을 썼고, 스펙트럼에 특이점이 없었다. 두 번째 사람은 닦아서 다시 쓰는 석영 큐벳을 썼고, 흡수가 나왔다. PS는 약 340 nm 아래를 스스로 먹기 때문에, 그 아래에 있던 시료의 흡수가 큐벳 흡수에 묻혀 안 보였던 것이다. 이렇듯 분석에서는 용기(vessel) 선택이 결과를 바꾼다. FTIR의 창 재질도 마찬가지.',
 q:'KBr 창 셀에 수용액을 넣으면?',a:'KBr이 녹아 창이 뿌옇게 상한다. CaF₂ 창(약 1100 cm⁻¹ 아래는 포기)이나 ATR(다이아몬드, ZnSe)을 쓴다.'},
{t:'용매: 어디가 가려지나',ec:'FTIR 용매 투과율 (얇은 셀, 대략)',mc:'UV-Vis 용매 투과율 (괄호 = cutoff nm)',
 e:()=>{const P=plot(irAx);P.xa=4000;P.xb=400;return P.s+tLeg(8,14,'')+trows(P,[{l:'H₂O',r:[[3700,3000],[1700,1590],[900,380]]},{l:'D₂O',r:[[2750,2300],[1250,1180],[600,380]]},{l:'CHCl₃',r:[[3040,3000],[1240,1200],[800,650]]},{l:'CCl₄',r:[[820,740]]},{l:'아세토나이트릴',r:[[3010,2900],[2270,2240],[1460,1360],[1060,1020],[930,910]]}],34,40,28,irT)},
 m:()=>{const P=plot({x:[190,500],xt:[{v:200,l:'200'},{v:300,l:'300'},{v:400,l:'400'},{v:500,l:'500'}],xl:'wavelength (nm)',L:120,noy:1,T:26,B:236});
  const it=[['물',190],['아세토나이트릴',190],['헥세인',195],['메탄올',205],['클로로폼',245],['DMSO',265],['톨루엔',285],['아세톤',330]];

 read:['곡선은 용매만 넣었을 때의 투과율이다. 바닥까지 떨어져 노랗게 칠해진 곳은 용매가 빛을 다 먹어서, 그 파수에서는 샘플 신호를 못 본다.','FTIR: 물은 약 3400 cm⁻¹(O–H 신축), 1640 cm⁻¹(굽힘), 900 cm⁻¹ 아래를 크게 가린다. 단백질 amide I(약 1650 cm⁻¹)가 물 굽힘에 묻힌다.','D₂O로 바꾸면 굽힘이 약 1210 cm⁻¹로 내려가 1650 cm⁻¹ 근처가 열린다. 대신 2500 cm⁻¹ 근처가 막힌다.','CCl₄처럼 거의 투명한 용매는 일부만 가린다. 용매 선택은 "어디를 볼지" 고르는 일.','UV-Vis는 cutoff(1 cm에서 흡광도 1이 되는 파장) 아래를 못 본다. 아세톤, 톨루엔은 UV 측정에 맞지 않는다.','값은 문헌마다 조금 다른 대략값이고, 가려지는 폭은 경로가 길수록 넓어진다.'],
 q:'IR로 단백질 2차 구조를 볼 때 D₂O를 쓰는 이유는?',a:'H₂O 굽힘(약 1640 cm⁻¹)이 amide I(약 1650 cm⁻¹)를 덮기 때문. D₂O는 굽힘이 약 1210 cm⁻¹로 내려가 amide I 영역이 열린다.'},

 e:()=>T(14,18,'투과 셀 (FTIR)','lab')+LN(20,52,226,52,'var(--pump)',{mk:'g'})+`<rect x="96" y="28" width="14" height="48" class="dev"/><rect x="128" y="28" width="14" height="48" class="dev"/><rect x="110" y="30" width="18" height="44" style="fill:var(--s2)" fill-opacity=".25"/>`+T(119,92,'spacer 수–100 μm','sub','middle')+T(160,40,'창','sub')

  +PL([[31,125],[71,165],[88,182],[124,146],[160,182],[196,146],[232,182],[249,165],[289,125]],'var(--pump)',{mk:'g'})
  +[124,196].map(x=>LN(x,146,x,130,'var(--s2)',{dash:1})).join('')+T(160,122,'dₚ ≈ 0.5–2 μm','sub','middle')+T(160,198,'결정 (다이아몬드, ZnSe, Ge)','sub','middle')

 m:()=>{const P=plot({x:[1e-4,10],logx:1,xt:[{v:1e-4,l:'1 μm'},{v:1e-3,l:'10 μm'},{v:1e-2,l:'100 μm'},{v:1e-1,l:'1 mm'},{v:1,l:'1 cm'},{v:10,l:'10 cm'}],xl:'경로 길이 l',L:20,R:300,noy:1,T:26,B:236});
  const it=[['C=O, 순수 액체 (ε ≈ 300, c ≈ 10 M)',3.3e-4,'s1'],['물 1640 cm⁻¹ (ε ≈ 20, c = 55 M)',9e-4,'s1'],['염료 10 μM (ε ≈ 10⁵)',1,'s2'],['단백질 280 nm, 1 mg/mL',1.5,'s2']];
  return P.s+it.map(([l,v,k],i)=>{const y=52+i*48;return T(P.L,y-12,l,'sub')+`<line x1="${P.L}" x2="${P.X(v)}" y1="${y}" y2="${y}" style="stroke:${COL[k]}" stroke-opacity=".4" stroke-width="2"/><circle cx="${P.X(v)}" cy="${y}" r="6" style="fill:${COL[k]}"/>`}).join('')+T(P.R,18,'빨강 IR · 파랑 UV-Vis','sub','end')},
 read:['A = εcl. A가 0.1–1 사이일 때 정량이 가장 믿을 만하다.','IR: 진동 흡수는 ε가 작지만(대략 10–1000 M⁻¹cm⁻¹), 용매나 순수 액체는 농도가 수–수십 M이라 A = 1이 μm에서 이미 온다. 그래서 FTIR 투과 셀은 μm급.','UV-Vis: 전자 전이는 ε가 크고(10³–10⁵) 보통 μM–mM 묽은 용액을 재므로 cm급 큐벳이 맞다.','ATR은 셀 두께 대신 침투 깊이 dₚ = λ / (2π n₁ √(sin²θ − (n₂/n₁)²))가 경로를 정한다. dₚ ∝ λ라 저파수 밴드가 상대적으로 세게 보인다(ATR 보정이 필요한 이유).','KBr 펠릿, DRIFTS(분말 확산 반사)도 고체 FTIR에 쓴다.'],
 q:'물 1640 cm⁻¹ 밴드를 A ≈ 1로 보려면 셀 두께는?',a:'약 10 μm. ε ≈ 20 M⁻¹cm⁻¹, c = 55 M로 l = 1/(εc) ≈ 9 μm (대략값).'},

  +box(96,252,48,24,'검출기')+T(160,268,'→ 간섭무늬 → FT → 스펙트럼','sub')+T(8,24,'HeNe 레이저가 거울 위치를 기준 잡음','sub'),

  +box(240,76,58,28,'검출기')+box(240,166,58,28,'검출기')+T(14,24,'한 파장씩 골라 샘플과 기준을 번갈아 잰다','sub'),
 read:['FTIR은 모든 파장을 한꺼번에 받아 간섭무늬(interferogram)를 찍고 푸리에 변환한다.','장점 셋: 한꺼번에 받으니 잡음에 유리(Fellgett), 슬릿이 없어 빛이 많다(Jacquinot), HeNe 레이저로 파수 정확도가 높다(Connes).','FTIR은 보통 single-beam이라 배경을 따로 찍어 나눈다. 공기 중 H₂O, CO₂가 변하면 그대로 남으므로 퍼지와 배경 갱신이 중요하다.','UV-Vis는 회절격자로 한 파장씩 고르고, 이중 빔이면 샘플과 기준(용매)을 동시에 비교해 램프 흔들림을 지운다.'],
 q:'FTIR 스펙트럼에 2350 cm⁻¹ 근처 위아래로 출렁이는 피크가 생기면?',a:'공기 중 CO₂가 배경을 찍을 때와 달라진 것. 퍼지 상태를 확인하고 배경을 다시 찍는다.'}];

function ramanLv(){return L(30,262,248)+T(266,252,'v=0','sub')+L(30,262,212)+T(266,216,'v=1','sub')+L(30,262,62,'lvl2')+T(266,66,'가상 상태','sub')}
const RA=[
{t:'Rayleigh, Stokes, anti-Stokes',ec:'에너지 그림',mc:'Raman 스펙트럼',slider:{min:100,max:1500,step:10,init:300,label:'온도',fmt:v=>Math.round(v)+' K'},
 e:()=>ramanLv()+A(52,247,52,65,'g',0)+A(72,65,72,245,'g',1,{dx:14})+A(118,247,118,65,'g',0)+A(138,65,138,209,'s3',2,{dx:14})+A(196,211,196,65,'g',0)+A(216,65,216,245,'s5',3,{dx:14})
  +T(40,40,'레이저 ω₀ (회색 위 화살표)','sub'),
 m:v=>{const P=plot({x:[-1600,1600],y:[0,1.15],xt:[{v:-1000,l:'−1000'},{v:0,l:'0'},{v:1000,l:'+1000'}],xl:'Raman shift (cm⁻¹)',L:30,noy:1,T:30});
  const nu=1000,n0=18797,r=((n0+nu)/(n0-nu))**4*Math.exp(-1.4388*nu/v);
  return P.s+crv(P,x=>lor(x,1000,18),400,1600,'var(--s3)')+crv(P,x=>r*lor(x,-1000,18),-1600,-400,'var(--s5)')+LN(P.X(0),P.Y(0),P.X(0),P.Y(1.15),'var(--pump)',{w:2.5})
   +`<g data-n="1">${badge(P.X(0)-16,P.Y(.9),1,'var(--pump)')}</g>`+T(P.X(0)-8,P.Y(1.08),'Rayleigh (필터로 제거)','sub','end')
   +`<g data-n="2">${badge(P.X(1000)+18,P.Y(.85),2,'var(--s3)')}</g>`+T(P.X(1550),P.Y(.75),'Stokes','sub','end')
   +`<g data-n="3">${badge(P.X(-1000)+20,P.Y(Math.max(r,.1)+.08),3,'var(--s5)')}</g>`+T(P.X(-1550),P.Y(.75),'anti-Stokes','sub')
   +T(P.R,P.T-8,'I(aS)/I(S) = '+r.toFixed(3),'lab','end')},
 read:[`${c(1,'g')} Rayleigh: 들어온 빛과 같은 에너지로 나간다. 압도적으로 세서 필터로 막는다.`,`${c(2,'s3')} Stokes: 분자가 진동 하나(v=0→1)를 가져가 그만큼 낮은 에너지로 나간다.`,`${c(3,'s5')} anti-Stokes: 이미 v=1에 있던 분자가 진동 에너지를 내줘 더 높은 에너지로 나간다. v=1 인구가 적어 약하다.`,'세기 비 I(aS)/I(S) ≈ ((ν₀+ν)/(ν₀−ν))⁴ · exp(−hcν/kT). 슬라이더로 온도를 올려 보면 anti-Stokes가 자란다(532 nm, 1000 cm⁻¹ 가정). 그래서 Raman 온도계로 쓴다.','Raman shift = ω₀ − ω_산란. 레이저를 바꿔도 shift 값은 그대로다.','"가상 상태"는 실제 준위가 아니라 빛과 분자가 잠깐 섞인 상태를 그린 것.'],
 q:'레이저를 532 nm에서 785 nm로 바꾸면 Raman shift 값은?',a:'그대로다. 바뀌는 건 산란광의 절대 파장과 세기(∝ ν⁴)뿐.'},
{t:'선택 규칙: IR과 Raman은 서로 다른 것을 본다',ec:'CO₂의 진동 세 가지',mc:'IR vs Raman (막대 = 활성)',
 e:()=>{const xs=[90,140,190],R=[12,9,12];
  const mol=(y,arr,lab,ir,ra,n)=>{let s=`<g data-n="${n}">${badge(50,y,n,'var(--fg)')}</g><line x1="${xs[0]}" x2="${xs[2]}" y1="${y}" y2="${y}" class="lvl"/>`+xs.map((x,i)=>`<circle cx="${x}" cy="${y}" r="${R[i]}" style="fill:${i===1?'var(--pump)':'var(--s1)'}"/>`).join('');
   s+=arr.map(([i,dx,dy])=>{const x=xs[i];return dy?LN(x,y+Math.sign(dy)*(R[i]+3),x,y+Math.sign(dy)*(R[i]+3)+dy,'var(--fg)',{w:2,mk:'f'}):LN(x,y-R[i]-9,x+dx,y-R[i]-9,'var(--fg)',{w:2,mk:'f'})}).join('');
   const mk=(ok,lab2,x)=>T(x,y+4,lab2,'sub')+T(x+(lab2==='IR'?18:44),y+4,ok?'✓':'✗','lab','start',ok?'var(--s3)':'var(--s1)');
   return s+T(14,y-38,lab,'lab')+mk(ir==='✓','IR',222)+mk(ra==='✓','Raman',258)};
  return mol(72,[[0,-20,0],[2,20,0]],'대칭 신축 (약 1388 cm⁻¹)','✗','✓',1)+mol(150,[[0,16,0],[1,-16,0],[2,16,0]],'비대칭 신축 2349 cm⁻¹','✓','✗',2)+mol(222,[[0,0,16],[1,0,-18],[2,0,16]],'굽힘 667 cm⁻¹','✓','✗',3)+T(14,276,'화살표 = 원자가 움직이는 방향 (반 주기)','sub')},
 m:()=>{const P1=plot({x:[500,2500],y:[0,1],T:30,B:110,L:40,noy:1,xt:[{v:667,l:'667'},{v:2349,l:'2349'}]});const P2=plot({x:[500,2500],y:[0,1],T:150,B:236,L:40,noy:1,xt:[{v:1336,l:'1285 · 1388'}],xl:'wavenumber / Raman shift (cm⁻¹)'});
  const st=(P,v,h,k,n)=>`<g data-n="${n}"><line x1="${P.X(v)}" x2="${P.X(v)}" y1="${P.Y(0)}" y2="${P.Y(h)}" style="stroke:${COL[k]}" stroke-width="4"/>${n&&v!==1388?badge(P.X(v)+(v===1285?-14:14),P.Y(h)+2,n,'var(--fg)'):''}</g>`;
  return P1.s+P2.s+T(40,20,'IR (쌍극자 변화)','lab')+T(40,140,'Raman (분극률 변화)','lab')+st(P1,667,.6,'s1',3)+st(P1,2349,.95,'s1',2)+st(P2,1285,.6,'s3',1)+st(P2,1388,.95,'s3',1)+T(P2.X(1500),P2.Y(.8),'Fermi 공명으로 둘로 갈라짐','sub')+[[P1,1336,1],[P2,667,3],[P2,2349,2]].map(([P,v,n])=>`<g data-n="${n}"><line x1="${P.X(v)}" x2="${P.X(v)}" y1="${P.Y(0)}" y2="${P.Y(.5)}" class="lvl2"/>`+T(P.X(v),P.Y(.5)-6,'없음','sub','middle')+'</g>').join('')},
 read:['왼쪽 번호의 진동이 오른쪽 같은 번호 막대(또는 "없음")에 대응한다. 번호에 마우스를 올려 보자.','IR은 진동하며 쌍극자가 변해야(∂μ/∂Q ≠ 0) 보이고, Raman은 분극률이 변해야(∂α/∂Q ≠ 0) 보인다.','CO₂처럼 대칭 중심이 있는 분자는 IR 활성과 Raman 활성이 겹치지 않는다(상호 배제 규칙).','CO₂ 대칭 신축은 Raman에만 보이고, Fermi 공명 때문에 1285/1388 cm⁻¹ 두 개로 갈라져 나온다.','물과 유리는 Raman이 약하다. 그래서 수용액, 유리 바이알째 측정이 쉽다. FTIR과 정반대.'],
 q:'공기 중 N₂, O₂는 IR과 Raman 중 어디에 보이나?',a:'Raman에만 보인다. 등핵 이원자 분자는 쌍극자 변화가 없어 IR 불활성. Raman에서 N₂ 약 2331, O₂ 약 1555 cm⁻¹ 피크로 나올 수 있다.'},
{t:'신호 크기와 형광',ec:'레이저 에너지와 형광',mc:'측정 스펙트럼 (예시)',slider:{min:0,max:2,step:1,init:0,label:'레이저',fmt:v=>['532 nm','785 nm','1064 nm'][Math.round(v)]},

 m:v=>{const i=Math.round(v),fl=[30,3,.2][i],sc=[(785/532)**4,1,(785/1064)**4][i];const P=plot({x:[200,3200],y:[0,35],xt:[{v:500,l:'500'},{v:1500,l:'1500'},{v:2500,l:'2500'}],xl:'Raman shift (cm⁻¹)',yl:'세기 (상대)',T:26});

 read:['Raman은 아주 약한 과정이다. 산란 단면적이 흡수·형광보다 10의 여러 제곱 작아서, 형광이 조금만 있어도 묻힌다.','슬라이더로 레이저를 바꿔 보자. 532 nm는 S₁에 닿아 형광이 크고, 785, 1064 nm로 갈수록 형광이 줄어든다.','대신 Raman 세기 ∝ ν⁴라 긴 파장일수록 약해진다. 532 vs 785 nm면 약 4.7배 차이. 1064 nm는 InGaAs 검출기나 FT-Raman을 쓴다.','레이저를 전자 흡수에 일부러 맞추면 특정 발색단만 크게 증폭된다(공명 Raman). 금속 나노구조 위에서 크게 증폭되는 건 SERS.','그림의 형광 크기는 설명용 예시. 실제로는 샘플마다 크게 다르다.'],
 q:'형광이 심한 샘플에 532 nm 대신 785 nm를 쓰면 얻는 것과 잃는 것은?',a:'형광 배경이 크게 준다(얻음). Raman 자체 세기는 ν⁴로 약 1/4.7, 검출기 효율도 떨어진다(잃음).'},
{t:'셋업: 레이저를 막는 필터',ec:'후방 산란 Raman 배치',mc:'필터 투과 (Raman shift 기준)',
 e:()=>box(6,30,56,26,'레이저')+LN(62,43,150,43,'var(--s3)',{mk:'s3'})+`<line x1="150" y1="33" x2="170" y2="53" style="stroke:var(--fg)" stroke-width="2.5"/>`+T(176,66,'다이크로익 미러','sub')

 m:()=>{const P=plot({x:[-1500,1500],y:[0,1.1],xt:[{v:-1000,l:'−1000'},{v:0,l:'0'},{v:1000,l:'+1000'}],yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:'Raman shift (cm⁻¹)',yl:'투과율',T:30});

 read:['같은 대물렌즈로 쏘고 되돌아온 산란광(180°)을 모으는 배치가 가장 흔하다.','Rayleigh가 Raman보다 10⁶배 이상 세서, 레이저 파장을 막는 필터가 필수다.','notch 필터는 레이저 근처만 막아 Stokes와 anti-Stokes를 둘 다 본다. edge 필터는 한쪽(Stokes)만 통과시킨다.','100 cm⁻¹ 아래 저파수를 보려면 특수 필터(VBG 등)가 필요하다.','분광기의 회절격자와 슬릿이 해상도를 정한다.'],
 q:'anti-Stokes로 온도를 재려면 어느 필터를 쓰나?',a:'notch 필터. edge 필터는 anti-Stokes 쪽을 막는다.'}];

function carsE(o={}){let s=L(30,262,250)+T(266,254,'v=0','sub')+(o.nr?L(30,262,212,'lvl2')+T(266,216,'(공명 없음)','sub'):L(30,262,212)+T(266,216,'v=1','sub'))+L(30,262,80,'lvl2')+L(30,262,42,'lvl2')+T(266,46,'가상','sub')+T(266,84,'가상','sub');
 s+=A(70,249,70,83,'s3',1,{dx:-14})+A(95,81,95,210,'s1',2,{dx:14})+A(140,211,140,45,'s3',3,{dx:-14})+A(170,43,170,247,'s2',4,{dx:14});
 if(!o.nr)s+=`<path d="M22,250 H16 V212 H22" fill="none" style="stroke:var(--muted)"/>`+T(12,235,'Ω','sub','end');return s}
const CA=[
{t:'에너지 그림: 네 개의 빛',ec:'에너지 그림',mc:'빛의 절대 파수 (예: CH 신축)',slider:{min:2700,max:3100,step:5,init:2900,label:'Ω = ω_p − ω_S',fmt:v=>Math.round(v)+' cm⁻¹'},
 e:()=>carsE()+T(40,24,'pump · Stokes · probe(= pump) · anti-Stokes','sub'),
 m:v=>{const P=plot({x:[8500,16500],y:[0,1.15],xt:[{v:9000,l:'9000'},{v:12500,l:'12500'},{v:16000,l:'16000'}],xl:'wavenumber (cm⁻¹)',L:30,noy:1,T:30});
  const ws=12500-v,wa=12500+v,h=lor(v,2900,15);const st=(x,hh,k,n,lab)=>`<g data-n="${n}"><line x1="${P.X(x)}" x2="${P.X(x)}" y1="${P.Y(0)}" y2="${P.Y(hh)}" style="stroke:${COL[k]}" stroke-width="5"/>${badge(P.X(x),P.Y(Math.max(hh,.3))-16,n,COL[k])}</g>`+(n===4?T(P.X(x)-12,P.Y(Math.max(hh,.3))-12,lab,'sub','end'):T(P.X(x)+12,P.Y(hh)-12,lab,'sub'));
  const gap=(a,b)=>LN(P.X(a)+4,P.Y(.12),P.X(b)-6,P.Y(.12),'var(--muted)',{w:1,mk:'g'})+LN(P.X(b)-4,P.Y(.12),P.X(a)+6,P.Y(.12),'var(--muted)',{w:1,mk:'g'})+T((P.X(a)+P.X(b))/2,P.Y(.12)-6,'Ω','sub','middle');
  return P.s+st(ws,.8,'s1',2,'Stokes')+st(12500,1,'s3',1,'pump')+st(wa,Math.max(.02,h*.9),'s2',4,'anti-Stokes')+gap(ws,12500)+gap(12500,wa)+T(P.R,P.T-12,'공명(2900 cm⁻¹) 일치도: '+Math.round(h*100)+'%','lab','end')},
 read:[`${c(1,'s3')} pump(ω_p)와 ${c(2,'s1')} Stokes(ω_S)의 차이 Ω = ω_p − ω_S가 분자 진동과 맞으면, 두 빛이 진동을 "같은 박자로" 흔든다.`,`${c(3,'s3')} probe(보통 pump 빔을 한 번 더 씀)가 그 진동에 부딪혀 ${c(4,'s2')} anti-Stokes 빛 ω_as = ω_p − ω_S + ω_pr = 2ω_p − ω_S가 나온다.`,'슬라이더로 Stokes를 바꿔 Ω를 움직여 보자. 진동(여기서 2900 cm⁻¹ 가정)과 맞을 때만 신호가 크다. Stokes를 스캔하면 Raman 스펙트럼을 훑는 셈.','오른쪽 축은 레이저 빛 자체의 절대 파수다. 빛이 셋 이상이라 기준점 하나로 잴 수 없기 때문. Raman shift에 해당하는 건 막대 사이 간격 Ω다.','예시 숫자: pump 800 nm(12500 cm⁻¹), Stokes 약 1042 nm, 신호 약 649 nm.','신호가 pump보다 파란 쪽(높은 주파수)에 나오므로, 빨간 쪽으로 나오는 형광 배경과 겹치지 않는다.'],
 q:'Stokes 대신 pump 파장을 바꿔도 Raman 스펙트럼을 훑을 수 있나?',a:'있다. Ω = ω_p − ω_S가 바뀌기만 하면 된다. 다만 신호 위치 ω_as = 2ω_p − ω_S도 같이 움직인다.'},
{t:'왜 신호가 큰가: 결맞음',ec:'자발 Raman vs CARS',mc:'신호 vs 분자 수 N (log-log)',
 e:()=>{const xs=[50,90,130,170,210,250];let s=T(14,22,'자발 Raman: 분자마다 제멋대로, 사방으로','lab');
  s+=xs.map((x,i)=>{const a=[0.3,2.1,4.0,1.2,5.2,2.9][i];return `<circle cx="${x}" cy="70" r="7" style="fill:var(--s3)" fill-opacity=".6"/>`+LN(x,70,x+22*Math.cos(a),70+22*Math.sin(a),'var(--s3)',{mk:'s3'})}).join('');
  s+=T(14,140,'CARS: 같은 위상으로 더해져 한 방향 빔','lab')+xs.map(x=>`<circle cx="${x}" cy="190" r="7" style="fill:var(--s2)" fill-opacity=".6"/>`+LN(x+6,190,x+30,190,'var(--s2)',{mk:'s2'})).join('')+LN(270,190,306,190,'var(--s2)',{w:4,mk:'s2'});
  return s},
 m:()=>{const P=plot({x:[1e2,1e8],y:[1,1e12],logx:1,logy:1,xt:[{v:1e2,l:'10²'},{v:1e4,l:'10⁴'},{v:1e6,l:'10⁶'},{v:1e8,l:'10⁸'}],yt:[{v:1,l:'1'},{v:1e6,l:'10⁶'},{v:1e12,l:'10¹²'}],xl:'N',yl:'신호 (상대)',T:26});
  return P.s+crv(P,n=>n*1e3,1e2,1e8,'var(--s3)')+crv(P,n=>n*n*.1,1e2,1e6,'var(--s2)')+T(P.X(3e6),P.Y(1e8),'Raman ∝ N','sub')+T(P.X(2e2),P.Y(1e9),'CARS ∝ N²','sub')},
 read:['자발 Raman은 분자마다 따로 산란해서 위상이 제각각이다. 세기가 그냥 더해져 N에 비례하고 빛은 사방으로 흩어진다.','CARS는 pump와 Stokes가 모든 분자의 진동을 같은 위상으로 흔든다. 방출이 위상 맞춰 더해져 세기가 N²에 비례하고 레이저처럼 한 방향 빔으로 나온다.','식으로는 I_CARS ∝ |χ⁽³⁾|² I_p² I_S, 그리고 χ⁽³⁾ ∝ N.','그래서 지질처럼 C–H가 빽빽한 곳은 아주 밝아 빠른(비디오 속도) 현미경 이미징이 가능하다.','반대로 농도가 낮으면 N²로 급하게 약해져 묽은 성분은 CARS가 불리하다.'],
 q:'분자 농도가 10배 줄면 CARS와 자발 Raman 신호는 각각?',a:'CARS는 약 100배, 자발 Raman은 10배 줄어든다.'},
{t:'위상 정합: 빛의 방향 맞추기',ec:'파동 벡터 (folded BOXCARS 예)',mc:'신호 vs Δk·L',
 e:()=>{const O=[40,200],A1=[150,150],B1=[262,196],C1=[182,184];
  return LN(O[0],O[1],A1[0],A1[1],'var(--s3)',{w:2.5,mk:'s3'})+T(80,160,'k_p','sub','start','var(--s3)')
   +LN(A1[0],A1[1],B1[0],B1[1],'var(--s3)',{w:2.5,mk:'s3'})+T(214,160,'k_pr','sub','start','var(--s3)')
   +LN(B1[0],B1[1],C1[0],C1[1],'var(--s1)',{w:2.5,mk:'s1'})+T(228,214,'−k_S','sub','start','var(--s1)')
   +LN(O[0],O[1],C1[0],C1[1],'var(--s2)',{w:3,mk:'s2'})+T(96,214,'k_as (신호 방향)','sub','start','var(--s2)')
   +TM(14,30,['네 화살표를 이어 붙이면 닫힌 도형이 된다:','k_p + k_pr − k_S = k_as','이 방향으로 나가는 신호만 크게 더해진다.'],'sub')+T(14,250,'각도는 보기 쉽게 과장','sub')+T(14,266,'2D 페이지 셋업 탭의 BOXCARS와 같은 아이디어','sub')},
 m:()=>{const P=plot({x:[-12,12],y:[0,1.05],xt:[{v:-10,l:'−10'},{v:0,l:'0'},{v:10,l:'10'}],yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:'Δk·L / 2',yl:'신호 (상대)',T:26});
  return P.s+crv(P,x=>x===0?1:(Math.sin(x)/x)**2,-12,12,'var(--s2)',{n:400})+T(P.X(3.5),P.Y(.7),'sinc² (Δk·L/2)','sub')},
 read:['직관: 샘플 곳곳에서 나온 신호 파동이 같은 위상으로 겹쳐야 커진다. 방향이 어긋나면 앞쪽에서 나온 파동과 뒤쪽에서 나온 파동이 서로 지운다.','그 조건을 파동 벡터로 쓰면 k_as = k_p − k_S + k_pr. 왼쪽처럼 화살표를 이으면 닫힌 도형이 된다.','어긋남 Δk가 있으면 길이 L을 지나며 위상이 틀어져 신호가 sinc²(Δk·L/2)로 줄어든다.','물질의 분산 때문에 빛을 평행으로 보내면 Δk ≠ 0. 기체나 긴 셀에서는 빔 각도를 맞춘다(BOXCARS).','현미경처럼 초점이 아주 짧으면 Δk·L ≪ π라 평행 배치로도 충분하다.','CARS는 2D IR과 같은 3차(χ⁽³⁾) 4파 혼합이다. DSFD로 그리면 2D IR 그림과 같은 언어로 읽힌다.'],
 q:'현미경 CARS가 평행 빔으로도 되는 이유는?',a:'초점 길이 L이 μm 수준이라 Δk·L이 작아 위상이 거의 틀어지지 않기 때문.'},
{t:'비공명 배경 (NRB)',ec:'공명 vs 비공명 경로',mc:'측정 CARS 모양 |χ|²',slider:{min:0,max:1.5,step:.05,init:.5,label:'χ_NR 크기',fmt:v=>v.toFixed(2)},
 e:()=>{const g=(x0,lab,nr)=>L(x0,x0+140,250)+(nr?L(x0,x0+140,212,'lvl2'):L(x0,x0+140,212))+L(x0,x0+140,80,'lvl2')+L(x0,x0+140,42,'lvl2')+LN(x0+22,249,x0+22,83,'var(--s3)',{w:2,mk:'s3'})+LN(x0+44,81,x0+44,(nr?178:210),'var(--s1)',{w:2,mk:'s1'})+(nr?'':'')+LN(x0+78,(nr?176:211),x0+78,45,'var(--s3)',{w:2,mk:'s3'})+LN(x0+108,43,x0+108,247,'var(--s2)',{w:2,mk:'s2'})+(nr?L(x0+30,x0+90,178,'lvl2'):'')+T(x0+70,272,lab,'sub','middle');
  return g(10,'공명: 진짜 v=1 경유',0)+g(168,'비공명: 실제 준위 없음',1)+T(10,24,'점선 = 가상 상태, 실선 = 실제 준위','sub')},
 m:v=>{const P=plot({x:[2800,3000],y:[0,Math.max(1.5,(1+v)**2*1.15)],xt:[{v:2850,l:'2850'},{v:2900,l:'2900'},{v:2950,l:'2950'}],xl:'Ω (cm⁻¹)',yl:'|χ|² (상대)',T:26});
  const G=10,f=x=>{const d=2900-x,re=G*d/(d*d+G*G),im=G*G/(d*d+G*G);return (v+re)**2+im**2};
  return P.s+crv(P,x=>{const d=2900-x;return G*G/(d*d+G*G)},2800,3000,'var(--pump)',{dash:1})+crv(P,f,2800,3000,'var(--s2)',{n:400})+T(P.R,P.T-6,'실선 = 측정, 점선 = 순수 공명 (Raman 모양)','sub','end')},
 read:['χ⁽³⁾ = χ_R(진동 공명) + χ_NR(전자 응답). χ_NR은 진동과 상관없이 늘 있고 주파수에 거의 무관하다. 물, 유리 기판도 낸다.','신호 ∝ |χ|² = χ_NR² + 2χ_NR·Re χ_R + |χ_R|². 가운데 간섭 항 때문에 모양이 비틀린다.','슬라이더로 χ_NR을 키워 보자. 피크는 낮은 Ω 쪽으로 밀리고 높은 쪽에 움푹한 dip이 생긴다(분산형 모양).','약한 진동은 배경 위에 dip으로만 보이거나 묻힐 수 있다.','CARS 피크를 그대로 Raman 피크로 읽으면 위치와 세기가 틀린다. 위상 복원(MEM, Kramers–Kronig)으로 Im χ를 뽑아 비교한다.'],
 q:'χ_NR이 크면 피크 꼭대기는 어느 쪽으로 이동하나?',a:'진동수보다 낮은 Ω 쪽. 높은 쪽에는 dip이 생긴다.'},
{t:'배경 줄이기: probe를 늦춘다',ec:'펄스 타이밍',mc:'신호 vs probe 지연 τ (log)',slider:{min:-200,max:2500,step:10,init:0,label:'probe 지연 τ',fmt:v=>Math.round(v)+' fs',play:1},
 e:v=>{const P=plot({x:[-400,2600],y:[0,1.2],xt:[{v:0,l:'0'},{v:1000,l:'1 ps'},{v:2000,l:'2 ps'}],xl:'시간',L:20,noy:1,T:40,B:200});const gp=(t0,k,h)=>crv(P,t=>h*Math.exp(-(((t-t0)/60)**2)),t0-250,t0+250,COL[k],{n:120});
  return P.s+gp(0,'s3',1)+gp(0,'s1',.8)+gp(v,'s3',.7)+T(P.X(0),P.Y(1.08),'pump + Stokes','sub','middle')+T(P.X(v),P.Y(.8),'probe','sub','middle')+T(20,24,'pump·Stokes가 진동 결맞음을 만들고, probe가 τ 뒤에 읽는다','sub')},
 m:v=>{const P=plot({x:[-300,2500],y:[1e-4,1.2],logy:1,xt:[{v:0,l:'0'},{v:1000,l:'1000'},{v:2000,l:'2000'}],yt:[{v:1e-4,l:'10⁻⁴'},{v:1e-2,l:'10⁻²'},{v:1,l:'1'}],xl:'τ (fs)',yl:'신호',T:26});
  const nr=t=>Math.exp(-((t/85)**2)),rs=t=>.3*Math.exp(-2*Math.max(t,0)/1000)*(t<0?Math.exp(-((t/85)**2)):1);
  return P.s+crv(P,nr,-300,400,'var(--s6)',{clip:[1e-4,1.2]})+crv(P,rs,-300,2500,'var(--s2)',{clip:[1e-4,1.2]})+`<line x1="${P.X(v)}" x2="${P.X(v)}" y1="${P.T}" y2="${P.B}" class="cur" style="stroke:var(--accent)" stroke-dasharray="3 3"/>`
   +T(P.X(250),P.Y(.004),'NRB','sub','start','var(--s6)')+T(P.X(1600),P.Y(.04),'공명 (T₂ ≈ 1 ps)','sub','start','var(--s2)')+T(P.R,P.T-6,'공명 / NRB = '+(rs(v)/Math.max(nr(v),1e-12)).toExponential(1),'lab','end')},
 read:['비공명 응답은 전자가 즉시 따라오는 것이라 펄스가 겹칠 때만 있다.','진동 결맞음은 dephasing 시간 T₂(C–H 밴드 대략 1 ps) 동안 남는다. 신호는 exp(−2τ/T₂)로 준다.','probe를 늦추면 NRB가 먼저 사라져 공명 / NRB 비가 크게 오른다. 재생해 보자.','대가: 공명 신호도 줄고, 짧은 펄스는 대역이 넓어 스펙트럼 해상도와 맞바뀐다.','다른 방법: 편광 CARS, epi(후방) 검출, heterodyne(간섭계형), 그리고 구조적으로 NRB가 없는 SRS.','이 지연 τ는 2D 페이지의 시간 구간과 같은 개념이다(진동 결맞음을 probe가 읽음).'],
 q:'그림의 T₂ ≈ 1 ps는 Raman 선폭으로 몇 cm⁻¹ 정도인가?',a:'T₂ = 1/(πcΓ)에서 Γ ≈ 1/(π · 3×10¹⁰ cm/s · 10⁻¹² s) ≈ 10 cm⁻¹ (FWHM, 대략).'},
{t:'광대역 CARS와 기법 비교',ec:'multiplex: 좁은 pump + 넓은 Stokes',mc:'광대역 CARS 스펙트럼 (예시)',
 e:()=>{const P=plot({x:[8500,16500],y:[0,1.2],xt:[{v:9500,l:'9500'},{v:12500,l:'12500'},{v:15500,l:'15500'}],xl:'wavenumber (cm⁻¹)',L:20,noy:1,T:40});
  return P.s+crv(P,x=>Math.exp(-(((x-9600)/280)**2)),8800,10400,'var(--s1)')+`<line x1="${P.X(12500)}" x2="${P.X(12500)}" y1="${P.Y(0)}" y2="${P.Y(1.1)}" style="stroke:var(--s3)" stroke-width="4"/>`+crv(P,x=>.7*Math.exp(-(((x-15400)/280)**2)),14600,16200,'var(--s2)')
   +T(P.X(9600),P.Y(1.08),'넓은 Stokes','sub','middle')+T(P.X(12500)+6,P.Y(1.15),'좁은 pump','sub')+T(P.X(15400),P.Y(.8),'넓은 신호','sub','middle')+TM(20,24,['여러 Ω를 한 번에 → 분광기로 스펙트럼 한 장'],'sub')},
 m:()=>{const P=plot({x:[2780,3050],y:[0,3.2],xt:[{v:2850,l:'2850'},{v:2930,l:'2930'},{v:3000,l:'3000'}],xl:'Raman shift (cm⁻¹)',yl:'|χ|² (상대)',T:26});
  const nr=.6,R=x=>{let re=0,im=0;[[2850,1,9],[2930,.6,12]].forEach(([w,a,g])=>{const d=w-x,q=d*d+g*g;re+=a*g*d/q;im+=a*g*g/q});return(nr+re)**2+im*im};
  return P.s+crv(P,R,2780,3050,'var(--s2)',{n:400})+T(P.X(2850),P.Y(2.9),'CH₂ (지질)','sub','middle')+T(P.X(2935),P.Y(1.9),'CH₃','sub','middle')+T(P.R,P.T-6,'χ_NR = 0.6 가정','sub','end')},
 read:['좁은 pump와 넓은 Stokes를 쓰면 여러 Ω를 동시에 들뜨게 해 분광기로 CARS 스펙트럼 한 장을 받는다(multiplex, 광대역 CARS).','현미경 이미징은 보통 한 Ω(예: 지질 CH₂ 2850 cm⁻¹)에 맞춰 놓고 빠르게 훑는다.','자발 Raman: 약하고 형광에 약하지만, 선형이고 정량이 쉽다.','CARS: 강하고 빠르며 형광에서 자유롭다. 대신 NRB가 있고 N²에 비례해 정량이 까다롭다.','SRS(유도 Raman): CARS처럼 강하면서 NRB가 없고 N에 비례한다. 대신 작은 세기 변화를 lock-in으로 잡아야 한다.'],
 q:'세포 지질 이미지에 2850 cm⁻¹를 고르는 이유는?',a:'CH₂ 대칭 신축이 지질에 빽빽해서 N²로 신호가 매우 크고, 다른 성분과 대비가 좋기 때문.'}];

{t:'DEMS 계면: 막 위의 전극',ec:'DEMS 셀 단면',mc:'전류 계단에 대한 이온 전류 응답 (예시)',

 read:['다공성 전극을 소수성 막(PTFE) 위에 직접 올린다. 생성 기체가 수 μm만 지나 바로 진공으로 빠진다.','그래서 응답이 빠르고(대략 1초 안쪽), 이온 전류가 기체 생성 "속도"를 따라간다. 전류와 나란히 비교할 수 있다.','"differential"은 신호가 생성 속도(미분량)에 비례한다는 뜻으로 쓴다. 생성물을 모아 재는 적분형 방식과 대비된다.','막을 통해 들어오는 기체·증기가 많아 차등 배기(두 단 펌프)로 MS 쪽 진공을 지킨다.','수계 전기촉매(HER, OER, CO·메탄올 산화)에서 고전적인 방법. 휘발성 유기 전해질은 증기가 많이 넘어와 그대로 쓰기 어렵다.'],

 read:['배터리 셀을 닫고, 위쪽 빈 공간(헤드스페이스)에 기체가 쌓이게 둔다. 가는 모세관으로 아주 조금씩 MS로 빼낸다.',`${c(1,'s3')} 신호는 쌓인 양(적분)에 가깝다. ${c(2,'s2')} 시간으로 미분해 생성 속도를 얻는다.`,'배터리는 수 시간 단위로 돌아가므로 초 단위 응답보다 몇 μmol이 나왔는지가 중요하다.','닫힌 셀이라 휘발성 유기 전해질 증기를 MS로 덜 끌어가고, 리튬처럼 반응성 큰 재료도 다룰 수 있다.','샘플링으로 셀 기체가 조금씩 빠지므로 압력·부피 보정이 필요하다. 운반 기체(Ar)를 흘려 속도에 비례하는 신호를 받는 설계도 있다.'],

 read:['이온원에서 70 eV 전자가 분자를 이온화한다. 이때 분자가 일부 쪼개져 한 기체가 여러 m/z에 나온다.','아래 체크박스로 기체를 켜고 꺼 보자. m/z 28에 CO, N₂, C₂H₄, CO₂ 조각이 모두 겹친다.','그래서 C₂H₄는 m/z 26·27로, CO₂는 m/z 44로 추적하고, CO는 m/z 28에서 다른 기체 몫을 빼서 구한다.','정량할 때는 각 기체의 조각 비율을 보정 가스로 직접 재서 연립으로 나눈다.','그림의 비율은 NIST 기준 대략값이다. 장비와 이온원 조건마다 조금 다르다.'],
 q:'m/z 28이 늘었는데 m/z 27, 44는 그대로라면?',a:'CO 발생이거나 공기 중 N₂ 누설. m/z 14와 m/z 32(O₂)의 동반 증가로 누설을 구분한다.'},
{t:'정량: 이온 전류 → 몰 → Faraday 효율',ec:'보정과 계산 흐름',mc:'보정선 (CO₂ 예시)',
 e:()=>box(20,30,130,36,'보정 가스','(농도·유량 알려짐)')+LN(150,48,176,48,'var(--pump)',{mk:'g'})+box(178,30,128,36,'감도 K','(A per mol/s)')
  +box(20,100,130,36,'측정 이온 전류','I_ion')+LN(150,118,176,118,'var(--pump)',{mk:'g'})+box(178,100,128,36,'생성 속도','ṅ = I_ion / K')
  +LN(242,136,242,162,'var(--pump)',{mk:'g'})+box(178,164,128,36,'기체가 설명하는 전류','z F ṅ')+LN(242,200,242,226,'var(--pump)',{mk:'g'})+box(178,228,128,36,'Faraday 효율','z F ṅ / I')+LN(242,66,242,98,'var(--pump)',{dash:1}),
 m:()=>{const P=plot({x:[0,1100],y:[0,1.15],xt:[{v:0,l:'0'},{v:500,l:'500'},{v:1000,l:'1000'}],yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:'CO₂ 농도 (ppm)',yl:'m/z 44 (정규화)',T:26});
  const pts=[[0,.02],[100,.11],[250,.24],[500,.47],[750,.71],[1000,.95]];

 read:['보정 가스(농도를 아는 혼합 기체)로 m/z별 감도 K를 먼저 구한다. 이온 전류 ÷ K = 생성 속도 ṅ (mol/s).','전자 z개가 드는 반응이라면 그 기체가 설명하는 전류는 zFṅ. 이를 전체 전류로 나누면 Faraday 효율.','DEMS에서는 잘 아는 반응(예: 수소 발생)으로 전기화학적으로 보정 상수를 정하기도 한다.','OEMS는 셀 부피, 압력, 샘플링 유량으로 몰수를 환산한다.','감도는 시간이 지나며 변하므로 측정 전후로 보정하는 게 좋다.'],
 q:'전류 1 mA가 전부 수소 발생이라면 H₂ 생성 속도는?',a:'ṅ = I / (2F) = 10⁻³ / (2 × 96485) ≈ 5.2 × 10⁻⁹ mol/s.'},
{t:'배터리 첫 충전에서 보이는 기체 (예시)',ec:'어디서 무엇이 나오나',mc:'흑연 | 층상 산화물 셀, 첫 충전 (예시)',
 tg:[{k:'C₂H₄',l:'C₂H₄ (m/z 27)',on:true},{k:'H₂',l:'H₂ (m/z 2)',on:true},{k:'CO₂',l:'CO₂ (m/z 44)',on:true},{k:'O₂',l:'O₂ (m/z 32)',on:true}],
 e:()=>T(14,24,'음극 (흑연), 낮은 전위','lab')+TM(14,44,['EC + 2e⁻ + 2Li⁺ → Li₂CO₃ + C₂H₄','(SEI가 만들어지며 C₂H₄ 발생)','미량 수분·양성자 환원 → H₂'],'sub',undefined,16)
  +L(10,310,104,'lvl2')+T(14,130,'양극 (층상 산화물), 높은 전위','lab')+TM(14,150,['고충전 상태에서 격자 산소 방출 → O₂','방출된 산소가 전해질과 반응 → CO₂, CO','전해질 자체 산화 → CO₂'],'sub',undefined,16)
  +T(14,250,'전위·양은 소재와 조건마다 다른 예시','sub'),
 m:(v,tg)=>{const P1=plot({x:[0,10],y:[2.8,4.6],T:26,B:96,L:44,yt:[{v:3,l:'3.0'},{v:4.5,l:'4.5'}],yl:'V',ylx:12});const P2=plot({x:[0,10],y:[0,1.1],T:120,B:230,L:44,xt:[{v:0,l:'0'},{v:5,l:'5'},{v:10,l:'10 h'}],xl:'시간',yl:'생성 속도',ylx:12});
  const V=t=>t<.3?2.9+t*2:3.5+.95*(t-.3)/9.7+.08*Math.exp(-(((t-.6)/.4)**2));
  const g={'C₂H₄':[t=>Math.exp(-(((t-.8)/.35)**2)),'s5'],'H₂':[t=>.55*Math.exp(-(((t-.9)/.5)**2)),'s6'],'CO₂':[t=>.25*Math.exp(-(((t-.9)/.6)**2))+.8/(1+Math.exp(-(t-8.3)/.35)),'s1'],'O₂':[t=>.5/(1+Math.exp(-(t-8.8)/.3)),'s3']};
  let s=P1.s+P2.s+crv(P1,V,0,10,'var(--fg)',{n:300});Object.entries(g).forEach(([k,[f,col]])=>{if(tg[k])s+=crv(P2,f,0,10,COL[col],{n:300})});
  s+=Object.entries(g).filter(([k])=>tg[k]).map(([k,[f,col]],i)=>`<rect x="${P2.X(3.6)}" y="${130+i*15}" width="9" height="9" style="fill:${COL[col]}"/>`+T(P2.X(3.6)+13,139+i*15,k,'sub')).join('');return s},
 read:['초반(셀 전압이 막 오를 때): 흑연 쪽에서 SEI가 생기며 EC가 환원돼 C₂H₄가 나온다. 미량 수분 등에서 H₂도 나온다.','후반(고전압): 층상 산화물에서 격자 산소가 방출돼 O₂가 나오고, 반응성 큰 산소가 전해질과 만나 CO₂, CO가 된다. 전해질 자체 산화도 CO₂를 낸다.','체크박스로 기체를 하나씩 켜 보면 "언제, 어느 전극에서"가 갈린다.','그림은 전형적인 경향을 그린 예시다. 실제 전위, 양, 순서는 소재와 조건마다 다르다.'],
 q:'O₂는 거의 없는데 고전압에서 CO₂만 크게 나오면?',a:'방출된 산소가 바로 전해질과 반응해 CO₂/CO로 바뀌었거나 전해질 자체 산화일 수 있다. ¹⁸O 동위원소 표지 같은 방법으로 출처를 가린다.'},
{t:'주의할 점과 DEMS vs OEMS',ec:'DEMS와 OEMS 비교',mc:'공기 누설일 때 보이는 패턴',
 e:()=>{const rows=[['계면',['다공성 막 위 전극'],['닫힌 셀 + 모세관']],['응답',['대략 1초 안쪽'],['분–수십 분']],['신호 뜻',['생성 속도'],['쌓인 양 → 미분']],['주 대상',['수계 전기촉매'],['배터리 (유기 전해질)']]];

 m:()=>{const P=plot({x:[10,46],y:[0,110],xt:[14,18,28,32,40,44].map(v=>({v,l:String(v)})),xl:'m/z',yl:'세기 (상대)',T:26});
  const air={14:14,28:100,16:3,32:27,40:1.3};return P.s+Object.entries(air).map(([m,h])=>`<rect x="${P.X(+m)-4}" y="${P.Y(h)}" width="8" height="${P.Y(0)-P.Y(h)}" style="fill:var(--s6)"/>`).join('')+T(P.X(28)+8,P.Y(100)+10,'N₂','sub')+T(P.X(32)+8,P.Y(27),'O₂','sub')+T(P.X(40),P.Y(12),'Ar','sub','middle')+T(P.R,P.T-6,'m/z 28 : 32 ≈ 3.7 : 1이면 누설 의심','sub','end')},
 read:['측정 전 개방 회로(OCV)에서 기준선이 안정될 때까지 기다린다.','공기 누설 점검: m/z 28과 32가 같이 오르고 비가 약 3.7:1(공기 N₂:O₂), m/z 40(Ar)도 보이면 누설.','수분(m/z 18), 전해질 증기(용매 고유 조각 m/z를 정해 추적)도 같이 본다.','감도는 시간이 지나며 변하므로 측정 전후 보정, 셀 온도와 압력 기록.','기본 선택: 빠른 반응 속도를 보고 싶은 수계 촉매는 DEMS, 오래 도는 배터리의 누적 기체량은 OEMS.'],
 q:'측정 시작 전에 OCV에서 무엇부터 확인하나?',a:'기준선 안정, 누설 지표(m/z 28/32 비, m/z 40), 수분(m/z 18)이 줄어드는 추세.'}];

function sfgE(){return L(30,262,250)+T(266,254,'v=0','sub')+L(30,262,200)+T(266,204,'v=1','sub')+L(30,262,56,'lvl2')+T(266,60,'가상','sub')
 +A(70,249,70,203,'s1',1,{dx:-14})+A(100,199,100,59,'s3',2,{dx:-14})+A(150,57,150,247,'s2',3,{dx:14})}
const SF=[
{t:'에너지 그림: 두 빛이 더해진다',ec:'에너지 그림',mc:'빛의 주파수 (예: CH₃ 신축)',slider:{min:2800,max:3000,step:2,init:2880,label:'IR 파수',fmt:v=>Math.round(v)+' cm⁻¹'},
 e:()=>sfgE()+T(30,24,'IR (진동에 공명) + 가시광 → 합 주파수','sub'),
 m:v=>{const P=plot({x:[2000,17000],y:[0,1.15],xt:[{v:5000,l:'5000'},{v:10000,l:'10000'},{v:15000,l:'15000'}],xl:'wavenumber (cm⁻¹)',L:30,noy:1,T:30});
  const ws=12500+v,h=lor(v,2880,8);const st=(x,hh,k,n,lab,pos)=>{const hb=Math.max(hh,.3),bx=P.X(x),by=P.Y(hb)-16;return `<g data-n="${n}"><line x1="${bx}" x2="${bx}" y1="${P.Y(0)}" y2="${P.Y(hh)}" style="stroke:${COL[k]}" stroke-width="5"/>${badge(bx,by,n,COL[k])}</g>`+(pos==='top'?T(bx,by-14,lab,'sub','middle'):pos==='left'?T(bx-12,by+4,lab,'sub','end'):T(bx+12,by+4,lab,'sub'))};
  return P.s+st(v,.8,'s1',1,'IR '+Math.round(v))+st(12500,1,'s3',2,'가시광 12500','left')+st(ws,Math.max(.02,h*.9),'s2',3,'SFG '+Math.round(ws),'top')+T(P.R,P.T-12,'공명(2880 cm⁻¹) 일치도: '+Math.round(h*100)+'%','lab','end')},
 read:[`${c(1,'s1')} IR이 진동(v=0→1)에 공명하고, ${c(2,'s3')} 가시광이 거기서 가상 상태로 올린다.`,`${c(3,'s2')} 두 빛의 합 ω_SF = ω_IR + ω_vis로 새 빛이 나온다. 가시광 근처라 CCD로 쉽게 잰다.`,'슬라이더 = 쏘는 IR의 파수(2800–3000 cm⁻¹). 가시광은 12500 cm⁻¹로 고정이고, SFG는 둘의 합이라 IR을 바꾼 만큼 같이 움직인다.','IR이 진동(여기서 CH₃ 대칭 신축 2880 cm⁻¹ 가정)과 맞을 때만 SFG가 크다. 좁은 IR을 한 파수씩 바꿔 가며 재는 방식이 바로 이것이고, 6단계의 광대역 방식은 넓은 IR로 이 범위를 한 번에 잰다.','빛 두 개가 들어가 하나가 나오는 2차(χ⁽²⁾) 과정이다. CARS, 2D IR(3차, χ⁽³⁾)보다 한 차수 낮다.','예시 숫자: 가시광 800 nm(12500 cm⁻¹) + IR 3000 cm⁻¹ → SFG 15500 cm⁻¹(약 645 nm).'],
 q:'IR을 진동에 공명시키는 이유는? 가시광을 공명시키면?',a:'IR 쪽 공명이 진동 스펙트럼을 준다. 가시광까지 전자 전이에 공명시키면 신호가 커지는 이중 공명 SFG가 되며, 이건 전자 상태 정보까지 섞인다.'},
{t:'IR active이면서 Raman active여야 VSFG 신호가 나온다',ec:'모드별 활성',mc:'세기 ∝ IR × Raman (예시 값)',
 e:()=>{const rows=[['CO₂ 대칭 신축',0,1],['CO₂ 비대칭 신축',1,0],['CH₃ 대칭 신축',1,1],['계면 O–H 신축',1,1]];
  const mk=(ok,x,y)=>T(x,y,ok?'✓':'✗','lab','middle',ok?'var(--s3)':'var(--s1)');
  let s=T(170,30,'IR','sub','middle')+T(216,30,'Raman','sub','middle')+T(272,30,'VSFG','lab','middle')+L(10,310,40,'lvl2');
  rows.forEach(([l,a,b],i)=>{const y=70+i*48;s+=T(14,y,l,'sub')+mk(a,170,y)+mk(b,216,y)+mk(a&&b,272,y)+L(10,310,y+20,'lvl2')});
  return s+T(14,270,'Raman 탭 2단계의 CO₂와 이어진다','sub')},
 m:()=>{const P=plot({x:[0,4],y:[0,1.1],yt:[{v:0,l:'0'},{v:1,l:'1'}],L:40,T:30,B:220});const md=[['CH₃ 대칭',.6,.8],['CH₂ 비대칭',.8,.3],['CO₂ 대칭',0,1],['CO₂ 비대칭',1,0]];
  let s=P.s;md.forEach(([l,ir,ra],i)=>{const x0=P.X(i+.5);[[ir,'s1',-14],[ra,'s3',-4],[ir*ra,'s2',8]].forEach(([h,k,dx])=>s+=`<rect x="${x0+dx-4}" y="${P.Y(h)}" width="9" height="${P.Y(0)-P.Y(h)}" style="fill:${COL[k]}"/>`);s+=T(x0,P.B+16,l,'sub','middle')});
  return s+[['IR','s1'],['Raman','s3'],['곱 → VSFG','s2']].map(([l,k],i)=>`<rect x="${P.X(.1)+i*78}" y="14" width="9" height="9" style="fill:${COL[k]}"/>`+T(P.X(.1)+i*78+13,23,l,'sub')).join('')},
 read:['VSFG 세기는 그 진동의 IR 세기(∂μ/∂Q)와 Raman 세기(∂α/∂Q)의 곱에 비례한다. 하나라도 0이면 안 보인다.','그래서 대칭 중심이 있는 분자(CO₂ 등)는 상호 배제 규칙 때문에 어떤 모드도 VSFG에 안 보인다.','CH₃, CH₂ 신축이나 계면 물의 O–H 신축처럼 IR과 Raman 둘 다 활성인 모드가 대상이다.','그런데 분자 하나가 조건을 만족해도, 분자들이 무작위로 놓이면 더해서 0이 된다. 다음 단계의 조건.','오른쪽 막대 값은 설명용 예시.'],
 q:'IR 스펙트럼에서 아주 센 밴드가 VSFG에선 안 보일 수 있나?',a:'있다. Raman 활성이 거의 없으면 곱이 작아 안 보인다. 반대로 분자 배향이 무작위여도 안 보인다.'},
{t:'왜 계면만 보이나',ec:'벌크 vs 계면',mc:'깊이에 따른 순 χ⁽²⁾ (개념도)',
 e:()=>{let s=`<rect x="20" y="40" width="280" height="40" style="fill:var(--s4)" fill-opacity=".12"/>`+T(26,58,'공기','sub')+L(20,300,80);

function fpCos(t1,t2){const n=121,ts=Array.from({length:n},(_,i)=>i*10),sg=(t,t0)=>1/(1+Math.exp(-(t-t0)/60));
 const a=ts.map(t=>sg(t,t1)),b=ts.map(t=>sg(t,t2)),ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n,da=a.map(x=>x-ma),db=b.map(x=>x-mb);
 let F=0,Q=0;for(let j=0;j<n;j++){F+=da[j]*db[j];let s=0;for(let k=0;k<n;k++)if(k!==j)s+=db[k]/(Math.PI*(k-j));Q+=da[j]*s}
 return{phi:F/(n-1),psi:Q/(n-1),ts,a,b}}

 read:['보통 광섬유는 실리카 유리로 속이 차 있다. 실리카는 가시광은 잘 보내지만 중적외선으로 몇 µm만 가도 빛을 먹는다(경계는 확인 필요). 그래서 중적외선 탐침에는 그대로 못 쓴다.','속 빈 광섬유는 가운데가 공기다. 안쪽 벽의 은 반사층이 빛을 가두고, 빛은 공기 속을 지나니 광섬유 자체의 흡수가 거의 없다.','대신 벽에서 반사될 때마다 조금씩 잃는다. 구부리면 반사 횟수가 늘어 손실이 커진다.','심이 뚫려 있어 액체나 먼지가 들어가면 안 된다. 그래서 양 끝을 창으로 막는다.','두 가닥을 쓴다. 하나는 빛을 탐침 끝으로 보내고, 하나는 돌려받는다.'],
 q:'속 빈 광섬유를 크게 구부려 놓으면?',a:'벽 반사 횟수가 늘어 빛이 줄어든다. 측정 중 광섬유 모양이 바뀌면 기준선도 흔들릴 수 있다. 측정 동안 광섬유를 고정해 둔다.'},
{t:'탐침 끝: 접힌 빛길과 조절되는 틈',ec:'탐침 끝 (단면, 단순화)',mc:'창 재질이 정하는 범위 (CaF₂ 예)',
 slider:{min:0,max:3000,step:50,init:600,label:'틈 d',fmt:v=>Math.round(v)+' µm'},
 e:v=>{const g=4+v/3000*40,yw=176,ym=yw-g;

  s+=`<rect x="100" y="16" width="120" height="${ym-16-6}" style="fill:var(--soft);stroke:var(--fg)"/>`;
  s+=`<rect x="126" y="16" width="18" height="${ym-16-6}" style="fill:#fff;stroke:var(--s6)"/><rect x="178" y="16" width="18" height="${yw+44-16}" style="fill:#fff;stroke:var(--s6)"/>`;
  s+=`<rect x="122" y="${ym-6}" width="26" height="6" style="fill:var(--s2);fill-opacity:.5;stroke:var(--s2)"/>`;
  s+=`<rect x="100" y="${yw}" width="120" height="66" style="fill:var(--soft);stroke:var(--fg)"/><rect x="122" y="${yw}" width="26" height="6" style="fill:var(--s2);fill-opacity:.5;stroke:var(--s2)"/>`;
  s+=`<g data-n="1"><rect x="100" y="${ym}" width="70" height="${g}" style="fill:var(--s2);fill-opacity:.35"/>${badge(158,ym+g/2,1,'var(--s2)')}</g>`;
  s+=`<g data-n="2"><polygon points="124,${yw+22} 146,${yw+22} 146,${yw+44}" style="fill:var(--s4);fill-opacity:.7"/><polygon points="176,${yw+22} 198,${yw+22} 176,${yw+44}" style="fill:var(--s4);fill-opacity:.7"/>${badge(240,yw+40,2,'var(--s4)')}</g>`;
  s+=PL([[135,24],[135,yw+33],[187,yw+33],[187,24]],'var(--s1)',{w:1.8,mk:'s1'});
  s+=`<g data-n="3"><rect x="226" y="40" width="20" height="26" rx="3" style="fill:var(--line);stroke:var(--fg)"/>${badge(262,53,3,'var(--fg)')}</g>`+T(226,84,'마이크로미터','sub');
  s+=T(96,30,'보내는 쪽','sub','end')+T(224,104,'돌려받는 쪽','sub')+T(96,ym-12,'움직이는 창','sub','end')+T(96,yw+16,'고정 창','sub','end')+T(226,146,`d = ${Math.round(v)} µm`,'sub');
  return s+T(160,272,'틈 폭은 보기 쉽게 과장','sub','middle')},
 m:()=>{const P=plot(fpIrX({y:[0,1.05],yt:[{v:0,l:'0'},{v:1,l:'1'}],yl:'창 투과 (예시)',T:30}));
  const tr=x=>1/(1+Math.exp(-(x-1000)/45));
  return P.s+`<rect x="${P.X(4000)}" y="${P.T}" width="${P.X(1000)-P.X(4000)}" height="${P.B-P.T}" style="fill:var(--s3);fill-opacity:.08"/>`+crv(P,tr,4000,1000,'var(--s2)')+T(P.X(2500),P.Y(.8),'CaF₂ 창','sub','middle','var(--s2)')+T(P.X(2500),P.Y(.4),'쓸 수 있는 범위 대략 1000–4000 cm⁻¹','sub','middle')},
 read:[`빛은 보내는 광섬유를 따라 내려와 움직이는 창 → ${c(1,'s2')} 액체 틈 → 고정 창을 지난 뒤, ${c(2,'s4')} 금 코팅 반사면 두 개에서 180° 꺾여 돌려받는 광섬유로 올라간다.`,`${c(3,'f')} 마이크로미터 손잡이로 보내는 쪽 광섬유와 창을 위아래로 움직여 틈 d를 바꾼다. 슬라이더가 이 손잡이다.`,'탐침 몸통은 가늘어서 보통 플라스크 목으로 들어간다. 분광기 쪽에는 결합 장치를 두어 빛을 광섬유에 넣고 받은 빛을 검출기로 보낸다.','창 재질이 쓸 수 있는 파수 범위를 정한다. CaF₂는 대략 1000 cm⁻¹ 아래를 막지만 물에 거의 녹지 않아 수용액에도 쓴다(FTIR 탭의 창 재질 단계와 같은 논리).'],
 q:'KBr 창을 쓰면 범위는 넓어지는데 왜 안 쓰나?',a:'KBr은 물에 녹는다. 반응 액체에 직접 담그는 탐침에는 물·용매에 강한 창이 필요하다.'},
{t:'틈을 맞춰 흡광도를 좋은 범위로',ec:'세어 보기: 빛 100 중 검출기에 남는 몫',mc:'흡광도 vs 틈 (log-log, 예시)',
 slider:{min:1,max:3.5,step:.02,init:2,label:'틈 d',fmt:v=>Math.round(10**v)+' µm'},
 e:v=>{const d=10**v,cm=d*1e-4,sm=[['① 진한 띠 (ε 300, 5 M)',300*5,'s1'],['② 묽은 띠 (ε 300, 0.01 M)',300*.01,'s2']];
  return T(20,26,`A = ε · 농도 · d,  d = ${Math.round(d)} µm`,'lab')+sm.map(([l,ec,k],i)=>{const A=ec*cm,Tt=100*10**(-A),y=70+i*96,w=Math.max(1,2.4*Tt);
   return `<g data-n="${i+1}">`+T(20,y,l,'lab','start',COL[k])+`<rect x="20" y="${y+10}" width="240" height="18" style="fill:var(--line)"/><rect x="20" y="${y+10}" width="${w}" height="18" style="fill:${COL[k]}"/></g>`
    +T(20,y+46,`A = ${A<.01?A.toExponential(1):A.toFixed(2)} → 남는 빛 ${Tt<.01?'0.01개 미만':Tt.toFixed(Tt<10?2:0)+'개'}`,'sub')+T(20,y+62,A<.1?'너무 약하다: 잡음에 묻힌다':A>2?'너무 세다: 남는 빛이 거의 없다':'좋은 범위','sub')}).join('')},
 m:v=>{const d=10**v;const P=plot({x:[10,3162],y:[1e-3,1000],logx:1,logy:1,xt:[{v:10,l:'10'},{v:100,l:'100'},{v:1000,l:'1000'}],yt:[{v:1e-3,l:'0.001'},{v:.1,l:'0.1'},{v:1,l:'1'},{v:10,l:'10'},{v:1000,l:'1000'}],xl:'틈 d (µm)',yl:'흡광도 A',L:62,T:30});
  let s=P.s+`<rect x="${P.L}" y="${P.Y(2)}" width="${P.R-P.L}" height="${P.Y(.1)-P.Y(2)}" style="fill:var(--s3);fill-opacity:.12"/>`+T(P.L+4,P.Y(.2),'좋은 범위 (A 약 0.1–2)','sub');
  [[1500,'s1',1],[3,'s2',2]].forEach(([ec,k,n])=>{s+=`<g data-n="${n}">${crv(P,x=>ec*x*1e-4,10,3162,COL[k],{clip:[1e-3,1000]})}<circle cx="${P.X(d)}" cy="${P.Y(Math.min(1000,Math.max(1e-3,ec*d*1e-4)))}" r="5" style="fill:${COL[k]}"/></g>`});
  return s+`<line x1="${P.X(d)}" x2="${P.X(d)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`},
 read:['A = ε · 농도 · d. 같은 시료라도 틈 d를 바꾸면 흡광도가 비례해서 바뀐다.','A가 작으면 띠가 기준선 잡음에 묻힌다. A가 크면 띠 가운데로 빛이 거의 안 지나가 잡음과 떠도는 빛(stray light)이 값을 정한다. 세어 보기: A = 2면 빛 100 중 1만 남는다.',`${c(1,'s1')} 진한 띠(예: 순수 액체의 C=O)는 수 µm–수십 µm에서 이미 넘친다. ${c(2,'s2')} 묽은 띠는 mm 근처까지 넓혀야 잘 보인다(숫자는 예시).`,'고정된 셀이나 ATR은 이걸 못 한다. 틈을 조절하는 탐침은 진한 반응액과 묽은 용액을 같은 좋은 범위로 가져올 수 있다.','"좋은 범위"의 위 경계는 장비마다 다르다. 여기서는 대략 2로 두었다(확인 필요).'],
 q:'진한 띠와 묽은 띠를 한 번에 다 좋은 범위에 넣을 수 있나?',a:'보통 못 한다. 두 띠의 εc 차이가 수백 배면 한 d로는 둘 중 하나가 범위를 벗어난다. 보고 싶은 띠에 맞춰 d를 고르거나 두 번 잰다.'},
{t:'Beer–Lambert 점검: 직선인가, 0을 지나나',ec:'틈을 바꾸며 재기 (예시)',mc:'농도를 바꾸며 재기 (예시)',
 e:()=>{const P=plot({x:[0,1000],y:[0,1.2],xt:[0,250,500,750,1000].map(v=>({v,l:String(v)})),yt:[{v:0,l:'0'},{v:.5,l:'0.5'},{v:1,l:'1'}],xl:'눈금으로 읽은 틈 (µm)',yl:'흡광도 A',T:30});
  const off=100,f=x=>(x+off)*1e-3;let s=P.s+crv(P,f,0,1000,'var(--s3)',{dash:1})+[0,200,400,600,800,1000].map(x=>`<circle cx="${P.X(x)}" cy="${P.Y(f(x)+.02*Math.sin(x))}" r="4" style="fill:var(--s3)"/>`).join('');
  s+=`<g data-n="1">${LN(P.X(0)+2,P.Y(f(0)),P.X(0)+2,P.Y(0),'var(--s1)',{w:2})}${badge(P.X(0)+20,P.Y(f(0)/2),1,'var(--s1)')}</g>`+T(P.X(80),P.Y(.12),'눈금 0에서도 A가 남는다','sub');
  return s+T(P.R,P.T-12,'유효 경로 = 눈금 + 남는 틈 (예시 100 µm)','sub','end')},
 m:()=>{const P=plot({x:[0,10],y:[0,3],xt:[0,2,4,6,8,10].map(v=>({v,l:String(v)})),yt:[0,1,2,3].map(v=>({v,l:String(v)})),xl:'농도 (상대)',yl:'흡광도 A',T:30});
  const ideal=x=>.3*x,meas=x=>{const a=.3*x;return a<1.6?a:1.6+(a-1.6)*.45};
  let s=P.s+`<rect x="${P.L}" y="${P.T}" width="${P.R-P.L}" height="${P.Y(2)-P.T}" style="fill:var(--s6);fill-opacity:.1"/>`+crv(P,ideal,0,10,'var(--muted)',{dash:1,w:1.2})+crv(P,meas,0,10,'var(--s2)');
  s+=`<g data-n="2">${badge(P.X(8.4),P.Y(meas(8.4))+18,2,'var(--s2)')}</g>`+T(P.X(.4),P.Y(2.75),'A > 2: 직선에서 벗어난다','sub')+T(P.X(5.2),P.Y(.6),'점선 = 직선 기대값','sub');
  return s},
 read:['탐침 값이 정말 투과 흡광도인지 두 가지로 확인한다. 농도를 고정하고 틈을 바꾸면 A가 d에 비례해야 하고, 틈을 고정하고 농도를 바꾸면 A가 농도에 비례해야 한다.',`${c(1,'s1')} 창을 맞붙인 눈금 0에서도 A가 0이 아닐 수 있다. 창이 조금 기울었거나 가장자리 덮개 때문에 액체 층이 남는 것이다. 절대 농도를 구할 때는 이 남는 틈을 더한 유효 경로를 쓴다.`,`${c(2,'s2')} A가 너무 크면 직선에서 벗어난다. 검출기 포화, 떠도는 빛 등 원인은 따로 따져야 한다(대략 A 2를 작업 한계로 둔 예시).`,'성능 지표로 정리할 것: 기울기(감도), 직선이 유지되는 범위, 남는 틈(오프셋), 잡음과 검출 한계. 검출 한계는 따로 재야 한다(확인 필요).','틈 사이 가는 띠 무늬(간섭 무늬)의 간격으로 빈 틈 폭을 재는 방법도 있다: d = 1 / (2 · 무늬 간격).'],
 q:'눈금 300 µm, 남는 틈 100 µm일 때 눈금만 믿고 농도를 구하면?',a:'실제 경로가 400 µm라 농도가 4/3배, 약 33% 크게 나온다.'},
{t:'반응 따라가기: 띠 하나는 줄고 하나는 는다',ec:'시간에 따른 스펙트럼 (예시: C=O → C=N)',mc:'띠 높이 vs 시간',
 slider:{min:0,max:1200,step:10,init:300,label:'시간',fmt:v=>Math.round(v)+' s',play:1},
 e:v=>{const mix=t=>1-Math.exp(-t/60),pr=t=>mix(t)*(1-Math.exp(-t/350)),P=plot({x:[1800,1550],y:[0,1.1],xt:[1800,1700,1600].map(x=>({v:x,l:String(x)})),xl:'wavenumber (cm⁻¹)',yl:'흡광도 (상대)',T:30});
  const sp=t=>x=>.9*(1-.6*pr(t))*fpBand(x,1715,18)+.7*pr(t)*fpBand(x,1665,16);
  let s=P.s+[0,1200].map(t=>crv(P,sp(t),1800,1550,'var(--s6)',{w:1,dash:1})).join('')+crv(P,sp(v),1800,1550,'var(--fg)');
  s+=`<g data-n="1">${badge(P.X(1750),P.Y(.9*(1-.6*pr(v))),1,'var(--s2)')}</g><g data-n="2">${badge(P.X(1630),P.Y(Math.max(.2,.7*pr(v))),2,'var(--s1)')}</g>`;
  return s+T(P.R,P.T-12,'점선 = 처음과 끝','sub','end')},
 m:v=>{const mix=t=>1-Math.exp(-t/60),pr=t=>mix(t)*(1-Math.exp(-t/350));const P=plot({x:[0,1200],y:[0,1],xt:[0,300,600,900,1200].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:.5,l:'0.5'},{v:1,l:'1'}],xl:'시간 (s)',yl:'띠 높이 (상대)',T:30});
  let s=P.s+`<g data-n="1">${crv(P,t=>.9*(1-.6*pr(t)),0,1200,'var(--s2)')}<circle cx="${P.X(v)}" cy="${P.Y(.9*(1-.6*pr(v)))}" r="5" style="fill:var(--s2)"/></g><g data-n="2">${crv(P,t=>.7*pr(t),0,1200,'var(--s1)')}<circle cx="${P.X(v)}" cy="${P.Y(.7*pr(v))}" r="5" style="fill:var(--s1)"/></g>`;
  s+=T(P.X(1180),P.Y(.25),'반응물 C=O (줄어듦)','sub','end','var(--s2)')+T(P.X(1180),P.Y(.78),'생성물 C=N (늘어남)','sub','end','var(--s1)');
  return s+`<line x1="${P.X(60)}" x2="${P.X(60)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(60)+4,P.Y(.97)-6,'섞임 시간 (예시 60 s)','sub')},
 read:['스펙트럼을 일정한 간격(예: 10 s마다)으로 저장하면 띠마다 시간 곡선이 나온다.',`예시로 케톤과 아민이 이민(Schiff base)이 되는 반응을 그렸다. ${c(1,'s2')} 반응물 C=O 띠는 줄고 ${c(2,'s1')} 생성물 C=N 띠는 는다. 숫자와 모양은 예시다.`,'유리벽이 가리는 C=N, O–H 영역을 용기 안에서 액체를 빼지 않고 계속 볼 수 있다는 것이 탐침의 핵심이다.','처음 수십 초는 반응보다 섞임이 정한다. 넣은 시약이 탐침 틈 안까지 들어와 섞이는 데 시간이 걸린다. 빠른 초기 반응은 이 섞임 시간 아래로 볼 수 없다.','띠 높이를 농도로 바꾸려면 앞 단계의 유효 경로와 직선 범위가 필요하다. 진한 띠가 범위를 넘으면 그 띠는 정량에서 뺀다.'],
 q:'저장 간격을 1 s로 줄이면 반응 초기를 더 잘 보나?',a:'저장 간격만 줄여서는 안 된다. 틈 안 액체가 섞이는 시간이 더 길면 그게 한계다. 섞임을 빠르게 하거나(저어 주기, 틈 구조) 섞임 시간을 따로 재야 한다.'},
{t:'2D 상관 분석: 어느 띠가 먼저 변하나',ec:'두 띠의 시간 곡선 (예시)',mc:'동시(Φ) · 비동시(Ψ) 상관 부호',
 slider:{min:-200,max:200,step:10,init:120,label:'② 띠의 늦음',fmt:v=>(v>0?'+':'')+Math.round(v)+' s'},
 e:v=>{const r=fpCos(400,400+v);const P=plot({x:[0,1200],y:[0,1.05],xt:[0,400,800,1200].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:'시간 (s)',yl:'세기 변화 (상대)',T:30});
  return P.s+`<g data-n="1">${PL(r.ts.map((t,i)=>[P.X(t),P.Y(r.a[i])]),'var(--s3)',{w:2})}</g><g data-n="2">${PL(r.ts.map((t,i)=>[P.X(t),P.Y(r.b[i])]),'var(--s5)',{w:2,dash:1})}</g>`
   +`<line x1="${P.X(820)}" x2="${P.X(860)}" y1="${P.Y(.3)}" y2="${P.Y(.3)}" style="stroke:var(--s3)" stroke-width="2"/>`+T(P.X(870),P.Y(.3)+4,'① 띠','sub')+`<line x1="${P.X(820)}" x2="${P.X(860)}" y1="${P.Y(.15)}" y2="${P.Y(.15)}" style="stroke:var(--s5)" stroke-width="2" stroke-dasharray="4 3"/>`+T(P.X(870),P.Y(.15)+4,'② 띠','sub')},
 m:v=>{const r=fpCos(400,400+v),m=fpCos(400,400).phi,ph=r.phi/m,ps=r.psi/m,y0=150,sc=95;
  const bar=(x,val,lab)=>{const h=Math.abs(val)*sc,col=val>=0?'var(--s1)':'var(--s2)';return `<rect x="${x}" y="${val>=0?y0-h:y0}" width="56" height="${Math.max(1,h)}" style="fill:${col}"/>`+T(x+28,y0+(val>=0?18:-h-8)+0,lab,'lab','middle')+T(x+28,val>=0?y0-h-8:y0+h+16,(val>=0?'+':'')+val.toFixed(2),'sub','middle')};
  const verdict=Math.abs(ps)<.02?'Ψ ≈ 0: 같이 변한다':(ps>0?'Φ, Ψ 부호가 같다 → ① 띠가 먼저':'Φ, Ψ 부호가 다르다 → ② 띠가 먼저');
  return `<line x1="40" x2="300" y1="${y0}" y2="${y0}" class="ax"/>`+bar(80,ph,'Φ 동시')+bar(190,ps,'Ψ 비동시')+T(160,20,verdict,'labn','middle')+T(160,272,'빨강 = +, 파랑 = − (Φ 최대값으로 나눔)','sub','middle')},
 read:['2D 상관 분석(2D-COS)은 시간에 따라 쌓인 스펙트럼들에서 "두 파수의 세기가 어떻게 함께 변하나"를 본다. 2D IR(2D 분광 노트)과 이름만 비슷하고 다른 방법이다.','먼저 각 스펙트럼에서 평균 스펙트럼을 빼 변화분만 남긴다(동적 스펙트럼).','동시 상관 Φ는 두 파수의 변화가 같은 방향(+)인지 반대 방향(−)인지 알려 준다. 비동시 상관 Ψ는 변화의 시점이 어긋났는지 알려 준다.','Noda 규칙: Φ와 Ψ의 부호가 같으면 ① 띠가 먼저, 다르면 ② 띠가 먼저 변한다. Ψ가 0에 가까우면 같이 변한다. 슬라이더로 ② 띠의 늦음을 바꾸면 Ψ 부호가 뒤집힌다.','자세한 단계(평균 빼기, Φ·Ψ 지도, 겹친 띠, 함정)는 <a href="analysis.html">데이터 분석 노트</a>의 2D-COS 탭에 있다.','주의: 순서가 곧 반응 단계 순서는 아니다. 섞임, 띠 겹침, 흡광도 비선형성도 시점 차이를 만든다. Ψ/Φ가 작으면 순서도 불확실하다.'],
 q:'Φ < 0, Ψ > 0이면 어느 띠가 먼저인가?',a:'부호가 다르므로 ② 띠가 먼저 변한다. Φ < 0은 한 띠가 늘 때 다른 띠가 준다는 뜻이다.'},
{t:'점검 시료 H₂O/D₂O와 탐침의 한계',ec:'H₂O에 D₂O를 넣으면 (모양만 예시)',mc:'지금 탐침의 한계',
 tg:[{k:'d',l:'D₂O 넣은 뒤',on:true}],
 e:(v,tg)=>{const P=plot(fpIrX({x:[3000,1800],xt:[3000,2600,2200,1800].map(v=>({v,l:String(v)})),y:[0,1],yt:[{v:0,l:'0'}],yl:'흡광도 (상대)',T:30}));
  const w=x=>.25*fpBand(x,2130,180),od=x=>.6*fpBand(x,2500,160);
  let s=P.s+crv(P,w,3000,1800,'var(--s6)',{dash:1});
  if(tg.d)s+=`<g data-n="1">${crv(P,x=>w(x)+od(x),3000,1800,'var(--s3)')}${badge(P.X(2500),P.Y(.6)-18,1,'var(--s3)')}</g>`+T(P.R,P.Y(.75),'HDO의 O–D 신축 (약 2500 cm⁻¹)','sub','end');
  return s+T(P.R,P.Y(.4),'H₂O 결합 띠','sub','end')+T(P.L,P.T-12,'O–H 신축(약 3400 cm⁻¹)은 너무 세서 범위 밖','sub')},
 m:()=>{const rows=[['빛이 적다','초점이 광섬유 구멍보다 커 일부만 들어간다 (대략 10%)'],['최소 틈이 0이 아니다','창 기울기·덮개 → 진한 띠는 넘친다'],['내구성','접착제·덮개가 일부 용매에 약하다'],['섞임 시간','틈 안 액체가 바뀌는 데 수십 초 이상'],['매번 d가 바뀐다','닫을 때마다 알려진 띠로 다시 잰다']];
  return rows.map(([a,b],i)=>{const y=34+i*48;return `<line x1="8" x2="316" y1="${y-18}" y2="${y-18}" style="stroke:var(--line)"/>`+T(8,y,a,'labn')+T(8,y+18,b,'sub')}).join('')+T(8,272,'(정성적 정리, 값은 대략)','sub')},
 read:['H₂O에 D₂O를 넣으면 수소 교환으로 HDO가 생긴다. HDO의 O–D 신축은 약 2500 cm⁻¹에 나타나 H₂O 띠와 겹치지 않는다(문헌 수준 설명). IR pump-probe에서도 셋업 점검 시료로 많이 쓴다.',`${c(1,'s3')} 탐침으로 이 띠가 자라는 것을 용기 안에서 바로 볼 수 있다. 섞임과 교환이 끝나면 일정해진다.`,'물은 아주 세게 흡수한다. 틈이 수십 µm여도 O–H 신축(약 3400 cm⁻¹)은 범위를 넘고, O–D 영역만 볼 수 있다(대략).','유효 경로는 이미 광학 상수가 알려진 H₂O 결합 띠(약 2130 cm⁻¹) 모양을 맞춰 구할 수 있다. 탐침을 닫을 때마다 바뀔 수 있으니 매번 잰다.','오른쪽 표의 한계는 각각 개선 방향을 가리킨다: 더 좋은 결합 광학, 창 고정 구조, 내화학성 재료, 섞임이 빠른 틈 구조(확인 필요).'],
 q:'D₂O를 너무 많이 넣으면?',a:'HDO뿐 아니라 D₂O 자체 띠가 커지고, O–D 띠도 넘칠 수 있다. 기준 시료로 쓰려면 HDO가 묽은(H₂O 속 몇 %) 조건을 쓴다(대략).'}];
const TABS=[{id:'fu',name:'FTIR · UV-Vis',sub:'선형 흡수 분광',desc:'샘플링과 경로 길이, 장비 구조, 창·셀 재질, 용매까지. 측정 전에 고를 것들을 정리했다.',steps:FU},{id:'fp',name:'In situ FTIR',sub:'광섬유 탐침',desc:'반응 용기 안에서 투과 스펙트럼을 재는 탐침의 원리. 속 빈 광섬유, 조절되는 틈, Beer–Lambert 점검, 반응 추적과 2D 상관 분석까지. 그림 값은 예시다.',steps:FP},{id:'ra',name:'Raman',sub:'자발 산란',desc:'Stokes와 anti-Stokes, IR과 다른 선택 규칙, 형광과 레이저 선택, 필터 배치.',steps:RA},{id:'ca',name:'CARS',sub:'χ⁽³⁾ 결맞음 Raman',desc:'네 빛의 에너지 그림, N² 결맞음, 위상 정합, 비공명 배경과 줄이는 법.',steps:CA},{id:'sf',name:'VSFG',sub:'χ⁽²⁾ 계면 진동 분광',desc:'IR과 Raman 둘 다 활성인 진동이 계면에서만 보이는 이유와 측정 배치.',steps:SF},{id:'ms',name:'DEMS · OEMS',sub:'전기화학 기체 분석',desc:'전극에서 나오는 기체를 질량 분석으로 나눠 보는 두 방법과 정량, 배터리 예.',steps:MS}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent='재생';
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${i+1}단계" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent='재생';return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent='정지';
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent='재생'}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
render();
</script>
