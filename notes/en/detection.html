<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Detection and Spectrometer Notes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · detection and spectrometers</span><span class="status" title="Draft before expert review. Read values together with their approx./example/to-be-verified marks.">Under review</span><a class="lang" id="langbtn" data-base="../detection.html" href="../detection.html" title="한국어">한 · <b>EN</b></a></div><h1 id="htitle"></h1><p id="hdesc"></p></header>

  </div>

    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>Play</button>

</div>

<script>
const LANG='en';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 검출과 분광기 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 검출과 분광기
// @status 검토 중
// @lang ko en
// @title.en Detection and Spectrometer Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · detection and spectrometers
// @status.en Under review
/* 검출과 분광기 노트: 모노크로메이터(Czerny-Turner), 검출기(MCT·CCD·PMT), Boxcar 적분기.
   빛이 들어오는 순서대로: 분광기가 파장을 고르고 → 검출기가 광자를 전자로 바꾸고 → boxcar가 샷마다 숫자 하나로 만든다. */
const NOTE={key:'detection'};

/* ---------- 공통 헬퍼 (mo = 모노크로메이터, dt = 검출기) ---------- */
/* 파장(nm) → 보기용 색. 700 nm 넘으면 어두운 빨강 (근적외선, 실제로는 안 보임) */
const moCol=l=>l>700?'hsl(0,55%,36%)':`hsl(${Math.round(Math.max(0,Math.min(270,270*(1-(l-400)/300))))},72%,40%)`;
const moGauss=(x,x0,w)=>Math.exp(-(((x-x0)/w)**2)*2.77);
const moTri=(x,x0,w)=>Math.max(0,1-Math.abs(x-x0)/w);
/* 오목거울: 빛이 아래에서 오므로 오목한 면(가장자리가 내려온 쪽)이 아래를 향한다 */
const moMir=(x,y)=>`<path d="M${x-28},${y+6} Q${x},${y-10} ${x+28},${y+6}" style="fill:none;stroke:var(--fg)" stroke-width="2.5"/>`;
/* Czerny-Turner 광로. o.cols = [[λ nm, 위치 오프셋 -1..1], ...], o.exit = 'slit' | 'array', o.rot = 격자 회전(°), o.num = 번호 배지 */
function moCT(o={}){const cols=o.cols||[[550,0]],rot=o.rot??0;
 let s=LN(46,252,56,252,'var(--fg)',{w:3})+LN(64,252,74,252,'var(--fg)',{w:3});
 /* 광선이 돌아간 격자 면(중심 160,190, 양쪽 16) 위에서 끝나게 한다. 들어오고 나가는 빛은 각각 평행광을 유지한다 */
 const ur=rot*Math.PI/180,h1x=160-16*Math.cos(ur),h1y=190-16*Math.sin(ur),h2x=160+16*Math.cos(ur),h2y=190+16*Math.sin(ur),m1=h1x-(h1y-54)*70/136,m2=h2x-(h2y-54)*70/136;
 s+=LN(60,252,m1,54,'var(--pump)',{w:1})+LN(60,252,m2,54,'var(--pump)',{w:1})+LN(m1,54,h1x,h1y,'var(--pump)',{w:1})+LN(m2,54,h2x,h2y,'var(--pump)',{w:1});
 cols.forEach(([l,k])=>{const col=moCol(l),g=7*k+70,a=h1x+(h1y-54)*g/136,b=h2x+(h2y-54)*g/136,f=262+22*k;
  s+=LN(h1x,h1y,a,54,col,{w:1.3})+LN(h2x,h2y,b,54,col,{w:1.3})+LN(a,54,f,250,col,{w:1.3})+LN(b,54,f,250,col,{w:1.3})});
 s+=moMir(90,52)+moMir(230,52)+`<rect x="138" y="186" width="44" height="8" class="dev" transform="rotate(${rot} 160 190)"/>`;
 if(o.exit==='array'){s+=Array.from({length:12},(_,i)=>`<rect x="${222+i*7}" y="252" width="6" height="10" style="fill:var(--s3)" fill-opacity="${.25+.06*(i%3)}" stroke="var(--s3)" stroke-width=".6"/>`).join('')}
 else s+=`<line x1="222" x2="302" y1="252" y2="252" class="lvl2"/>`+LN(242,252,256,252,'var(--fg)',{w:3})+LN(268,252,282,252,'var(--fg)',{w:3});
 s+=T(60,272,TR('입구 슬릿','entrance slit'),'sub','middle')+T(90,24,TR('거울 1','mirror 1'),'sub','middle')+T(160,222,TR('회절격자','grating'),'sub','middle')+T(230,24,TR('거울 2','mirror 2'),'sub','middle')+T(262,276,o.exit==='array'?TR('배열 검출기','array detector'):TR('출구 슬릿','exit slit'),'sub','middle');
 if(o.num){const B=(x,y,n)=>`<g data-n="${n}">${badge(x,y,n,'var(--fg)')}</g>`;s+=B(30,252,1)+B(54,36,2)+B(196,202,3)+B(270,36,4)+B(298,236,5)}
 return s}
/* 격자 방정식: d = 1/(gr/mm) */
const MO_D=1e6/1200; /* 1200 gr/mm → d ≈ 833 nm (3단계 격자 회전) */
/* 1단계·7단계 격자 그림: 600 gr/mm, 입사각 α = 50° (오른쪽에서 들어옴).
   β는 법선의 입사 반대쪽(왼쪽)에서 잰다: m λ = d (sin α − sin β). β = α면 0차(거울 반사). */
const MO_D1=1e6/600,MO_AL=50*Math.PI/180;
const moBeta=(l,m=1)=>Math.asin(Math.sin(MO_AL)-m*l/MO_D1);
function moGr(cx,cy,R,inLab){const al=MO_AL;
 return `<line x1="40" x2="280" y1="${cy}" y2="${cy}" class="lvl"/>`+Array.from({length:24},(_,i)=>`<path d="M${40+i*10},${cy} l8,6 l2,-6" fill="none" style="stroke:var(--muted)" stroke-width=".8"/>`).join('')
  +`<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${cy-R-8}" class="lvl2"/>`+T(cx,cy-R-14,TR('법선','normal'),'sub','middle')
  +LN(cx+R*Math.sin(al),cy-R*Math.cos(al),cx+4,cy-4,'var(--pump)',{w:2,mk:'g'})+T(cx+R*Math.sin(al)+4,cy-R*Math.cos(al)-8,inLab,'sub','end')
  +LN(cx,cy,cx-.7*R*Math.sin(al),cy-.7*R*Math.cos(al),'var(--pump)',{w:1.2,dash:1})+T(cx-.7*R*Math.sin(al)-4,cy-.7*R*Math.cos(al)+4,TR('0차','0th order'),'sub','end')+T(cx-.7*R*Math.sin(al)-4,cy-.7*R*Math.cos(al)+18,TR('(거울 반사)','(specular)'),'sub','end')
  +`<path d="M${cx},${cy-34} A34,34 0 0 1 ${cx+34*Math.sin(al)},${cy-34*Math.cos(al)}" fill="none" style="stroke:var(--muted)"/>`+T(cx+16,cy-40,'α','sub')}

/* ======================= 모노크로메이터 (Czerny-Turner) ======================= */
const MO=[
{t:TR('회절격자: 파장마다 꺾이는 각도가 다르다','Diffraction grating: each wavelength leaves at a different angle'),ec:TR('격자에 들어오고 나가는 빛 (600 gr/mm, α = 50°)','Light entering and leaving the grating (600 gr/mm, α = 50°)'),mc:TR('회절각 β vs 파장','Diffraction angle β vs wavelength'),
 slider:{min:400,max:900,step:10,init:550,label:TR('파장 λ','Wavelength λ'),fmt:v=>Math.round(v)+' nm'},
 e:v=>{const R=140,cx=160,cy=210,b=moBeta(v);
  let s=moGr(cx,cy,R,TR('들어오는 빛 (백색)','incoming light (white)'));
  [400,650,900].forEach(l=>{const bb=moBeta(l);s+=LN(cx,cy,cx-(R-10)*Math.sin(bb),cy-(R-10)*Math.cos(bb),moCol(l),{w:1})});
  s+=LN(cx,cy,cx-R*Math.sin(b),cy-R*Math.cos(b),moCol(v),{w:3})+T(cx-R*Math.sin(b)-4,cy-R*Math.cos(b)-6,Math.round(v)+' nm','sub','end',moCol(v))
   +`<path d="M${cx},${cy-56} A56,56 0 0 0 ${cx-56*Math.sin(b)},${cy-56*Math.cos(b)}" fill="none" style="stroke:${moCol(v)}"/>`+T(cx-72*Math.sin(.09),cy-72*Math.cos(.09)+4,'β','sub','end',moCol(v));
  s+=T(20,250,TR(`1차 회절: λ = ${Math.round(v)} nm → β = ${(b*180/Math.PI).toFixed(1)}°`,`1st order: λ = ${Math.round(v)} nm → β = ${(b*180/Math.PI).toFixed(1)}°`),'lab')+T(20,268,TR('얇은 선 = 400, 650, 900 nm 위치','thin lines = 400, 650, 900 nm'),'sub')+T(282,228,TR('격자 홈','grooves'),'sub','end');
  return s},
 m:v=>{const bt=l=>moBeta(l)*180/Math.PI;
  const P=plot({x:[400,900],y:[0,50],xt:[400,500,600,700,800,900].map(x=>({v:x,l:String(x)})),yt:[0,10,20,30,40,50].map(y=>({v:y,l:y+'°'})),xl:'wavelength λ (nm)',yl:TR('회절각 β (°)','diffraction angle β (°)'),T:30});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(50)}" y2="${P.Y(50)}" class="lvl2"/>`+T(P.R,P.Y(50)+14,TR('0차 (β = α = 50°)','0th order (β = α = 50°)'),'sub','end')+crv(P,bt,400,900,'var(--fg)')+`<circle cx="${P.X(v)}" cy="${P.Y(bt(v))}" r="6" style="fill:${moCol(v)}"/>`+T(P.L+8,P.T-10,'m λ = d (sin α − sin β), m = 1','lab')},
 read:[TR('격자는 아주 촘촘한 홈(여기서는 1 mm에 600개, 홈 간격 d ≈ 1667 nm)이 새겨진 거울이다.','A grating is a mirror ruled with very fine grooves (here 600 per mm, groove spacing d ≈ 1667 nm).'),TR('홈마다 반사된 빛이 서로 간섭한다. 이웃 홈에서 온 빛의 길이 차이 d (sin α − sin β)가 파장의 정수배(m λ)가 되는 방향에서만 세게 더해진다. 이게 격자 방정식이다.','Light reflected from each groove interferes. It adds up strongly only in directions where the path difference between neighbouring grooves, d (sin α − sin β), is an integer number of wavelengths (m λ). This is the grating equation.'),TR('여기서 β는 법선의 입사 반대쪽에서 잰 각이다. 책마다 부호 약속이 달라 m λ = d (sin α + sin β)로 쓰고 β를 음수로 두기도 한다. 내용은 같다.','Here β is measured on the side of the normal opposite to the incident beam. Sign conventions differ between textbooks; some write m λ = d (sin α + sin β) with a negative β. The content is the same.'),TR('0차(m = 0)는 길이 차이가 0인 방향, 곧 β = α인 거울 반사다. 파장과 상관없어 색이 나뉘지 않는다.','Zeroth order (m = 0) is the direction with zero path difference, that is β = α, specular reflection. It does not depend on wavelength, so the colours do not separate.'),TR('1차에서는 파장이 길수록 β가 작아진다. 거울 반사 방향에서 더 멀리 꺾이는 셈이다. 그래서 백색광이 각도로 펼쳐진다. 슬라이더로 λ를 바꾸면 굵은 선이 움직인다.','In first order, a longer wavelength gives a smaller β, so it is bent further away from the specular direction. White light therefore fans out in angle. Changing λ with the slider moves the thick line.'),TR('홈이 더 촘촘하면(d가 작으면) 같은 파장 차이가 더 큰 각도 차이로 벌어진다.','With denser grooves (smaller d), the same wavelength difference spreads into a larger angle difference.')],
 q:TR('1200 gr/mm 격자로 바꾸면 d와 각도 퍼짐은?','With a 1200 gr/mm grating, what happens to d and to the angular spread?'),a:TR('d가 약 833 nm로 절반이 되고, 같은 파장 차이에 대한 각도 차이는 대략 2배가 된다.','d halves to about 833 nm, and the angle difference for the same wavelength difference roughly doubles.')},
{t:TR('Czerny-Turner 배치: 거울 둘, 격자 하나, 슬릿 둘','Czerny-Turner layout: two mirrors, one grating, two slits'),ec:TR('광로 (위에서 본 그림, 보기 쉽게 단순화)','Optical path (top view, simplified for clarity)'),mc:TR('출구 평면에서 본 빛','Light at the exit plane'),
 e:()=>moCT({cols:[[450,-1],[550,0],[650,1]],num:1}),
 m:()=>{const P=plot({x:[-6,6],y:[0,1.15],xt:[{v:-4,l:'−4'},{v:0,l:'0'},{v:4,l:'+4'}],xl:TR('출구 평면 위치 (mm, 예시)','position on exit plane (mm, example)'),L:30,noy:1,T:34});
  let s=P.s+`<g data-n="5"><rect x="${P.X(-.5)}" y="${P.T}" width="${P.X(.5)-P.X(-.5)}" height="${P.B-P.T}" style="fill:var(--s4)" fill-opacity=".18"/>${badge(P.X(0),P.T-12,5,'var(--fg)')}</g>`;
  [[450,-4],[550,0],[650,4]].forEach(([l,x])=>{s+=crv(P,u=>moGauss(u,x,.8),x-2,x+2,moCol(l))+T(P.X(x),P.Y(1.06),l+' nm','sub','middle',moCol(l))});
  return s+T(P.X(0)+14,P.T-8,TR('출구 슬릿 (나머지는 막힘)','exit slit (rest blocked)'),'sub')},
 read:[TR(`${c(1,'f')} 입구 슬릿이 좁은 광원 역할을 한다.`,`${c(1,'f')} The entrance slit acts as a narrow light source.`),TR(`${c(2,'f')} 오목거울 1이 퍼지는 빛을 평행광으로 만든다.`,`${c(2,'f')} Concave mirror 1 turns the diverging light into a collimated beam.`),TR(`${c(3,'f')} 격자가 파장마다 다른 각도로 보낸다(1단계).`,`${c(3,'f')} The grating sends each wavelength at a different angle (step 1).`),TR(`${c(4,'f')} 오목거울 2가 평행광을 다시 모으는데, 각도가 다르니 파장마다 출구 평면의 다른 위치에 초점이 맺힌다.`,`${c(4,'f')} Concave mirror 2 refocuses the collimated light. Because the angles differ, each wavelength comes to a focus at a different position on the exit plane.`),TR(`${c(5,'f')} 출구 슬릿은 그중 한 좁은 띠만 통과시킨다. "한 색만 고른다"는 뜻의 monochromator다.`,`${c(5,'f')} The exit slit passes only one narrow band of it. This is the monochromator: it "selects one colour".`),TR('거울 두 개를 대칭으로 놓으면 한 거울이 만드는 수차(코마)를 다른 거울이 일부 상쇄한다(확인 필요). 실제 장치는 각도가 더 작고, 그림의 광선 간격은 보기 쉽게 과장했다.','With the two mirrors placed symmetrically, the aberration (coma) of one mirror is partly cancelled by the other (to be verified). Real instruments use smaller angles, and the ray spacing in the figure is exaggerated for clarity.')],
 q:TR('출구 슬릿을 빼면 어떤 장치가 되나?','What does the instrument become without the exit slit?'),a:TR('출구 평면 전체에 스펙트럼이 펼쳐진다. 거기에 배열 검출기를 두면 여러 파장을 한 번에 찍는 분광기(spectrograph)가 된다(6단계).','The spectrum spreads over the whole exit plane. An array detector placed there turns it into a spectrograph that records many wavelengths at once (step 6).')},
{t:TR('격자를 돌리면 출구 파장이 바뀐다','Rotating the grating changes the exit wavelength'),ec:TR('격자 회전 (위에서 본 그림, 광로 각도는 보기 쉽게 과장)','Grating rotation (top view, path angles exaggerated for clarity)'),mc:TR('광원 스펙트럼 위의 통과 대역','Passband on the source spectrum'),
 slider:{min:13,max:34,step:.5,init:20,label:TR('격자 각도 θ','Grating angle θ'),fmt:v=>v.toFixed(1)+'°',play:1},
 e:v=>{const l=2*MO_D*Math.cos(15*Math.PI/180)*Math.sin(v*Math.PI/180),r=v*Math.PI/180;
  /* θ = 0이면 격자 법선이 세로 점선(입사·회절 방향의 가운데선)과 겹쳐 거울(0차)처럼 된다. 법선이 출구 쪽으로 θ만큼 돈다 */
  const nrm=`<line x1="160" y1="186" x2="160" y2="132" class="lvl2"/>`+LN(160,186,160+54*Math.sin(r),186-54*Math.cos(r),'var(--fg)',{w:1.2,dash:1})
   +`<path d="M160,${186-40} A40,40 0 0 1 ${160+40*Math.sin(r)},${186-40*Math.cos(r)}" fill="none" style="stroke:var(--muted)"/>`;
  return moCT({cols:[[l,0]],rot:v})+nrm+T(96,244,TR(`법선 회전 θ = ${v.toFixed(1)}°`,`normal rotated θ = ${v.toFixed(1)}°`),'lab')+T(96,262,TR(`출구 λ ≈ ${Math.round(l)} nm`,`exit λ ≈ ${Math.round(l)} nm`),'lab','start',moCol(l))},
 m:v=>{const l=2*MO_D*Math.cos(15*Math.PI/180)*Math.sin(v*Math.PI/180),src=x=>Math.min(1,.15+.85*Math.exp(-(((x-750)/320)**2)));
  const P=plot({x:[350,950],y:[0,1.15],xt:[400,500,600,700,800,900].map(x=>({v:x,l:String(x)})),xl:'wavelength λ (nm)',yl:TR('세기 (상대)','intensity (relative)'),T:30});
  return P.s+crv(P,src,350,950,'var(--s6)',{dash:1})+`<rect x="${P.X(l-6)}" y="${P.Y(src(l))}" width="${Math.max(2,P.X(l+6)-P.X(l-6))}" height="${P.B-P.Y(src(l))}" style="fill:${moCol(l)}" fill-opacity=".8"/>`
   +T(P.R,P.T-12,TR('점선 = 할로젠 램프 (예시)','dashed = halogen lamp (example)'),'sub','end')+T(P.X(l),P.Y(1.1),Math.round(l)+' nm','sub','middle')},
 read:[TR('Czerny-Turner에서는 입구와 출구 방향이 고정되어 있고 격자만 돈다. 격자를 돌리면 α와 β가 함께 바뀌고 출구 슬릿에 오는 파장이 바뀐다.','In a Czerny-Turner, the entrance and exit directions are fixed and only the grating rotates. Rotating it changes α and β together, and with them the wavelength that reaches the exit slit.'),TR('입사와 회절 사이 각도(편향각)가 고정이면 λ = (2d/m) cos K sin θ 꼴이 된다. K = 편향각의 절반, θ = 격자 회전각이다(여기서는 K = 15° 가정). θ는 격자 법선(진한 점선)이 입사·회절 방향의 가운데선(옅은 세로 점선)에서 돌아간 각이다. θ = 0이면 격자가 거울처럼 0차만 보낸다.','With a fixed angle between incidence and diffraction (deviation angle), λ = (2d/m) cos K sin θ, where K = half the deviation angle and θ = grating rotation angle (here K = 15°, assumed). θ is the angle by which the grating normal (dark dashed line) has turned away from the bisector of the incident and diffracted directions (faint vertical dashed line). At θ = 0 the grating acts as a mirror and sends only zeroth order.'),TR('재생을 누르면 격자가 돌며 통과 대역이 광원 스펙트럼 위를 훑는다. 출구 뒤에 PMT 같은 단일 검출기를 두고 값을 기록하면 파장 스캔이 된다.','With Play, the grating rotates and the passband sweeps across the source spectrum. A single detector such as a PMT behind the exit slit, recording as it goes, gives a wavelength scan.'),TR('그래서 모노크로메이터 + 단일 검출기는 "한 번에 한 파장"이다. 넓은 범위를 찍으려면 시간이 걸린다.','A monochromator plus a single detector is therefore "one wavelength at a time". Covering a wide range takes time.')],
 q:TR('파장 스캔 중 광원 세기가 흔들리면 어떻게 되나?','What happens if the source intensity fluctuates during a wavelength scan?'),a:TR('스펙트럼에 그대로 섞인다. 한 파장씩 다른 시간에 재기 때문이다. 그래서 기준 검출기로 광원을 같이 재서 나누거나 이중 빔 배치를 쓴다.','The fluctuation goes straight into the spectrum, because each wavelength is measured at a different time. For this reason the source is measured at the same time with a reference detector and divided out, or a double-beam layout is used.')},
{t:TR('슬릿 폭과 분해능은 맞바꾼다','Slit width trades against resolution'),ec:TR('출구 평면의 슬릿 상 (Hg 노란 두 줄)','Slit images on the exit plane (Hg yellow doublet)'),mc:TR('측정 스펙트럼 (역선형 분산 2.5 nm/mm 예시)','Measured spectrum (reciprocal linear dispersion 2.5 nm/mm, example)'),
 slider:{min:50,max:1000,step:10,init:200,label:TR('슬릿 폭','Slit width'),fmt:v=>Math.round(v)+' µm'},
 e:v=>{const D=2.5,sc=100,w=v/1000*sc,sep=2.1/D*sc,x1=120,x2=x1+sep;
  let s=T(20,30,TR(`통과 대역 ≈ 슬릿 폭 × 역선형 분산`,`passband ≈ slit width × reciprocal dispersion`),'lab')+T(20,48,`= ${(v/1000).toFixed(2)} mm × 2.5 nm/mm = ${(v/1000*D).toFixed(2)} nm`,'lab');
  s+=T(20,72,v/1000*D<2.1?TR('→ 두 줄이 갈라져 보인다','→ the two lines are resolved'):TR('→ 두 줄이 한 덩어리로 뭉친다','→ the two lines merge into one'),'labn')+`<line x1="20" x2="300" y1="200" y2="200" class="lvl2"/>`+T(20,218,TR('출구 평면','exit plane'),'sub');
  s+=`<g data-n="1"><rect x="${x1-w/2}" y="110" width="${w}" height="80" style="fill:var(--s4)" fill-opacity=".45"/>${badge(x1,98,1,'var(--s4)')}</g>`;
  s+=`<g data-n="2"><rect x="${x2-w/2}" y="110" width="${w}" height="80" style="fill:var(--s5)" fill-opacity=".45"/>${badge(x2,98,2,'var(--s5)')}</g>`;
  s+=LN(x1,236,x2,236,'var(--muted)',{w:1})+T((x1+x2)/2,252,TR('두 줄 간격 2.1 nm = 0.84 mm','line spacing 2.1 nm = 0.84 mm'),'sub','middle')+T(20,272,TR('막대 폭 = 입구 슬릿의 상 (슬릿 폭과 같음, 배율 1 가정)','bar width = slit image (= slit width, 1:1 assumed)'),'sub');
  return s},
 m:v=>{const bp=v/1000*2.5,h=v/1000;const P=plot({x:[572,584],y:[0,1.15],xt:[574,576,578,580,582].map(x=>({v:x,l:String(x)})),xl:'wavelength λ (nm)',yl:TR('세기 (상대, 같은 축)','intensity (rel., same axis)'),T:30});
  const f=x=>h*(moTri(x,577.0,bp)+moTri(x,579.1,bp));
  return P.s+crv(P,f,572,584,'var(--fg)',{n:600})+crv(P,x=>h*moTri(x,577.0,bp),572,584,'var(--s4)',{n:600,dash:1,w:1.2})+crv(P,x=>h*moTri(x,579.1,bp),572,584,'var(--s5)',{n:600,dash:1,w:1.2})
   +`<g data-n="1">${badge(P.X(577),P.Y(Math.max(f(577),h))-16,1,'var(--s4)')}</g><g data-n="2">${badge(P.X(579.1),P.Y(Math.max(f(579.1),h))-16,2,'var(--s5)')}</g>`
   },
 read:[TR('출구에서 옆으로 1 mm 갈 때 파장이 얼마나 바뀌는지를 역선형 분산(nm/mm)이라 한다. 여기서는 2.5 nm/mm로 가정했다(초점거리 약 300 mm, 1200 gr/mm 근처의 대략값, 확인 필요).','The change in wavelength per 1 mm sideways at the exit is the reciprocal linear dispersion (nm/mm). Here it is assumed to be 2.5 nm/mm (approx. value for a focal length of about 300 mm near 1200 gr/mm, to be verified).'),TR(`입구 슬릿의 상이 출구 평면에 맺힌다. 파장이 다른 ${c(1,'s4')} 577.0 nm와 ${c(2,'s5')} 579.1 nm는 0.84 mm 떨어진 두 막대가 된다.`,`The image of the entrance slit forms on the exit plane. The two wavelengths ${c(1,'s4')} 577.0 nm and ${c(2,'s5')} 579.1 nm become two bars 0.84 mm apart.`),TR('슬릿을 넓히면 막대가 넓어져 서로 겹친다. 통과 대역이 두 줄 간격(2.1 nm)보다 넓어지면 한 봉우리로 뭉친다.','Widening the slit widens the bars until they overlap. Once the passband is wider than the line spacing (2.1 nm), the two lines merge into one peak.'),TR('대신 슬릿이 넓을수록 빛이 많이 들어온다. 오른쪽 그림은 같은 축이라 슬릿을 넓히면 봉우리가 높아진다. 분해능과 신호를 맞바꾸는 셈이다.','In exchange, a wider slit lets in more light. The right panel keeps the same axis, so widening the slit raises the peaks. Resolution is traded for signal.'),TR('분산을 키우려면 초점거리를 늘리거나 홈이 더 촘촘한 격자를 쓴다.','Dispersion increases with a longer focal length or a grating with denser grooves.')],
 q:TR('슬릿 50 µm, 역선형 분산 4 nm/mm면 통과 대역은?','Slit 50 µm, reciprocal linear dispersion 4 nm/mm: what is the passband?'),a:'0.05 mm × 4 nm/mm = 0.2 nm.'},
{t:TR('홈 개수와 blaze: 효율이 높은 파장을 고른다','Groove density and blaze: choosing the high-efficiency wavelength'),ec:TR('격자 단면 (톱니 홈)','Grating cross-section (sawtooth grooves)'),mc:TR('회절 효율 (예시)','Diffraction efficiency (example)'),
 slider:{min:0,max:2,step:1,init:0,label:TR('격자','Grating'),fmt:v=>['1200 gr/mm · 500 nm','600 gr/mm · 1 µm','150 gr/mm · 4 µm'][Math.round(v)]},
 e:v=>{const i=Math.round(v),p=[16,32,128][i],th=17.5*Math.PI/180,x0=30,x1=290,y=170;let d=`M${x0},${y}`;
  let x=x0;for(;x+p<=x1;x+=p){const h=p*Math.cos(th)*Math.sin(th);d+=` L${x+p*Math.cos(th)**2},${y-h} L${x+p},${y}`}
  if(x<x1)d+=` L${x1},${y}`; /* 남는 자리는 평평하게 (반쪽 톱니를 그리지 않는다) */
  const xf=x0+p*Math.cos(th)**2*.5,yf=y-p*Math.cos(th)*Math.sin(th)*.5;
  return `<path d="${d}" style="fill:var(--soft);stroke:var(--fg)" stroke-width="1.4"/>`+`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" class="lvl2"/>`
   +LN(x0,y+18,x0+p,y+18,'var(--muted)',{w:1})+LN(x0,y+12,x0,y+24,'var(--muted)',{w:1})+LN(x0+p,y+12,x0+p,y+24,'var(--muted)',{w:1})+T(x0+p+6,y+22,'d = '+['833 nm','1667 nm','6.7 µm'][i],'sub')
   +T(20,30,['1200 gr/mm, blaze 500 nm','600 gr/mm, blaze 1 µm','150 gr/mm, blaze 4 µm'][i],'lab')+T(20,48,TR('세 격자 모두 blaze 각 약 17.5° (예시)','all three: blaze angle approx. 17.5° (example)'),'sub')

 read:[TR('홈 단면을 톱니 모양으로 깎으면, 각 홈 면이 작은 거울처럼 한 방향으로 빛을 몰아 준다. 그 방향이 원하는 파장의 1차 회절 방향과 맞으면 효율이 크게 오른다. 그 파장을 blaze 파장이라 한다.','Cutting the grooves into a sawtooth profile makes each facet act as a small mirror that throws the light in one direction. When that direction matches the first-order direction of the desired wavelength, the efficiency rises sharply. That wavelength is called the blaze wavelength.'),TR('효율 곡선은 blaze 파장 근처에서 높고, 짧은 쪽으로 빨리, 긴 쪽으로 천천히 떨어진다(대략적인 모양, 예시).','The efficiency curve is high near the blaze wavelength and falls quickly on the short side and slowly on the long side (approx. shape, example).'),TR('파장이 길수록 홈 간격 d도 커야 한다. m λ ≤ 2d라야 1차 회절이 생기기 때문이다. 그래서 중적외선용 격자는 홈이 성기다(예: 수십–150 gr/mm, 확인 필요).','Longer wavelengths need a larger groove spacing d, because first-order diffraction requires m λ ≤ 2d. Mid-infrared gratings therefore have sparse grooves (e.g. tens to 150 gr/mm, to be verified).'),TR('분광기 하나에 격자 두세 개를 달아 돌려 가며 쓰는 경우가 많다. 측정 파장에 맞는 격자를 골랐는지 먼저 본다.','A spectrometer often carries two or three gratings that can be swapped by rotation. The first check is whether the grating matches the measurement wavelength.')],

 read:[TR('출구 슬릿을 빼고 출구 평면에 CCD나 MCT 배열을 놓으면, 여러 파장을 한 번에 찍는다. 이걸 spectrograph(분광기)라 부른다.','Removing the exit slit and placing a CCD or MCT array at the exit plane records many wavelengths at once. This is called a spectrograph.'),TR('화소당 파장 간격 = 역선형 분산 × 화소 폭. 예: 2.5 nm/mm × 25 µm = 0.0625 nm (예시).','Wavelength step per pixel = reciprocal linear dispersion × pixel width. Example: 2.5 nm/mm × 25 µm = 0.0625 nm (example).'),TR('분해능은 출구 슬릿 대신 입구 슬릿 폭과 화소 크기가 정한다. 입구 슬릿 상이 화소 두세 개보다 좁으면 화소가 한계가 된다.','Resolution is then set by the entrance slit width and the pixel size instead of the exit slit. When the entrance slit image is narrower than two or three pixels, the pixels set the limit.'),TR('우리 IR pump-probe 셋업은 모노크로메이터(Horiba iHR 320) 뒤에 MCT 배열(한 스펙트럼 64화소)을 둔다. 격자와 화소당 간격은 확인 필요(논문 TODO).','Our IR pump-probe setup places an MCT array (64 pixels per spectrum) after a monochromator (Horiba iHR 320). The grating and the step per pixel are to be verified (thesis TODO).'),TR('배열이라도 화소 수가 유한해 한 번에 보는 범위가 정해진다. 범위를 넓히려면 격자를 돌려 여러 구간을 이어 붙인다.','Even an array has a finite number of pixels, which fixes the range seen at once. A wider range is covered by rotating the grating and stitching several windows together.')],

 read:[TR('모든 광검출기는 광자 하나가 전자 하나(또는 전자-정공 쌍)를 만드는 데서 시작한다. 이 단계가 노트 전체의 출발점이다.','Every photodetector starts from one photon producing one electron (or electron–hole pair). This step is the starting point of the whole note.'),TR('들어온 광자 중 전자를 만든 비율이 양자 효율(QE)이다. 광자 100개, QE 60%면 전자 60개다.','The fraction of incoming photons that produce an electron is the quantum efficiency (QE). 100 photons at QE 60% give 60 electrons.'),TR('나머지 광자는 표면에서 반사되거나, 흡수되지 않고 지나가거나, 전자를 만들었다가 잃는다.','The other photons are reflected at the surface, pass through without being absorbed, or produce an electron that is then lost.'),TR('QE는 파장마다 다르다. 다음 단계에서 보듯 재료가 "어느 파장까지 전자를 만들 수 있나"를 정한다.','QE depends on wavelength. As the next step shows, the material decides "up to which wavelength electrons can be produced".')],
 q:TR('광자 500개가 QE 20% 검출기에 들어오면 전자는 평균 몇 개?','If 500 photons enter a detector with QE 20%, how many electrons are produced on average?'),a:TR('100개.','100.')},
{t:TR('파장 한계는 재료의 띠 간격이 정한다','The band gap of the material sets the wavelength limit'),ec:TR('띠 간격과 광자 에너지','Band gap and photon energy'),mc:TR('쓸 수 있는 파장 범위 (대략)','Usable wavelength range (approx.)'),
 slider:{min:-.6,max:1.25,step:.01,init:0,label:TR('광자 파장','Photon wavelength'),fmt:v=>{const l=10**v;return (l<1?l.toFixed(2):l.toFixed(1))+' µm · '+Math.round(1e4/l)+' cm⁻¹'}},
 e:v=>{const l=10**v,E=1.24/l,Y=e=>236-e/1.6*200;let s=`<line x1="40" x2="40" y1="36" y2="236" class="ax"/>`+[0,.4,.8,1.2,1.6].map(e=>`<line x1="35" x2="40" y1="${Y(e)}" y2="${Y(e)}" class="ax"/>`+T(32,Y(e)+4,String(e),'sub','end')).join('');
  s+=TR(`<text x="12" y="136" class="lab" text-anchor="middle" transform="rotate(-90 12 136)">에너지 (eV)</text>`,`<text x="12" y="136" class="lab" text-anchor="middle" transform="rotate(-90 12 136)">energy (eV)</text>`);
  DT_DET.forEach(([n,g,k],i)=>{const x=74+i*62,ok=E>=g,st=!ok?'x':(l<DT_RNG[i][0]?'s':'o');s+=`<g data-n="${i+1}"><rect x="${x-16}" y="${Y(g)}" width="32" height="${236-Y(g)}" style="fill:${COL[k]}" fill-opacity=".22" stroke="${COL[k]}"/>`+badge(x,Y(g)-14,i+1,COL[k])+T(x,252,n.split(' ')[0],'sub','middle')+(n.includes(' ')?T(x,266,n.split(' ')[1],'sub','middle'):'')+'</g>'
   +T(x,Y(Math.min(E,1.6))-(Y(g)-Y(Math.min(E,1.6))<26?-14:-14)+0,'','sub')+`<text x="${236-Y(g)<20?x+24:x}" y="${236-Y(g)<20?234:230}" class="labn" text-anchor="middle" style="fill:${{o:'var(--s3)',s:'var(--s4)',x:'var(--s1)'}[st]}">${{o:'✓',s:'△',x:'✗'}[st]}</text>`});
  const yE=Y(Math.min(E,1.6));s+=`<line x1="44" x2="300" y1="${yE}" y2="${yE}" class="cur" style="stroke:var(--fg)" stroke-width="1.5" stroke-dasharray="6 3"/>`;
  return s+T(44,12,TR('막대 = 띠 간격, 점선 = 광자 ','bars = band gap, dashed = photon ')+E.toFixed(2)+' eV'+(E>1.6?TR(' (위로 넘침)',' (off scale)'):''),'sub')+T(44,28,TR('✓ 보임 · △ 짧은 쪽 한계 · ✗ 띠 간격 미달','✓ detected · △ short-side limit · ✗ below band gap'),'sub')},
 m:v=>{const l=10**v;const P=plot({x:[.2,20],y:[0,5],logx:1,xt:[{v:.2,l:'0.2'},{v:1,l:'1'},{v:2,l:'2'},{v:5,l:'5'},{v:10,l:'10'},{v:20,l:'20'}],xl:'wavelength (µm)',L:20,noy:1,T:30});
  const R=DT_RNG;
  let s=P.s+DT_DET.map(([n,g,k],i)=>{const y=P.Y(4.3-i)+0;return `<g data-n="${i+1}"><rect x="${P.X(R[i][0])}" y="${y-8}" width="${P.X(R[i][1])-P.X(R[i][0])}" height="16" rx="3" style="fill:${COL[k]}" fill-opacity=".45"/>`+badge(P.X(R[i][0])-12+(i===0||i===1?14:0),y-18,i+1,COL[k])+'</g>'+(i===3?T(P.X(1)-6,y+4,n,'sub','end'):T(P.X(R[i][1])+6,y+4,n,'sub'))}).join('');
  return s+`<line x1="${P.X(l)}" x2="${P.X(l)}" y1="${P.T}" y2="${P.B}" class="cur" style="stroke:var(--fg)" stroke-width="1.5" stroke-dasharray="6 3"/>`+`<rect x="${P.X(1)}" y="${P.Y(1.3)-8}" width="${P.X(2)-P.X(1)}" height="16" rx="3" style="fill:var(--s1)" fill-opacity=".15" stroke="var(--s1)" stroke-dasharray="3 3"/>`+T(P.R,P.T-12,TR('오른쪽 끝 = 띠 간격 · 왼쪽 끝 = 창·표면','right end = band gap · left end = window/surface'),'sub','end')+T(P.R,P.B-8,TR('MCT 점선 칸 = 창 재질에 따라 (확인 필요)','MCT dashed box = depends on window (to be verified)'),'sub','end')},
 read:[TR('광자 에너지가 재료의 띠 간격(PMT는 광음극의 일함수)보다 커야 전자가 생긴다. 그래서 검출기마다 긴 파장 한계가 있다. 광자 에너지(eV) ≈ 1.24 / 파장(µm).','An electron is produced only when the photon energy exceeds the band gap of the material (for a PMT, the work function of the photocathode). Each detector therefore has a long-wavelength limit. Photon energy (eV) ≈ 1.24 / wavelength (µm).'),TR(`${c(2,'s2')} Si는 띠 간격 약 1.1 eV라 약 1.1 µm까지 본다. CCD와 흔한 포토다이오드가 여기에 속한다.`,`${c(2,'s2')} Si has a band gap of about 1.1 eV and detects up to about 1.1 µm. CCDs and common photodiodes belong here.`),TR(`${c(3,'s4')} InGaAs는 대략 0.9–1.7 µm(근적외선), ${c(1,'s5')} PMT 광음극은 재료에 따라 대략 UV–0.9 µm다(확인 필요).`,`${c(3,'s4')} InGaAs covers approx. 0.9–1.7 µm (near infrared), and ${c(1,'s5')} PMT photocathodes cover approx. UV–0.9 µm depending on the material (to be verified).`),TR(`${c(4,'s1')} HgCdTe(MCT)는 Hg와 Cd 비율로 띠 간격을 바꾼다. 3–5 µm용은 Cd 비율 x ≈ 0.3이고, 우리 MCT 배열은 차단 파장이 약 12 µm(띠 간격 약 0.1 eV)다.`,`${c(4,'s1')} HgCdTe (MCT) tunes its band gap through the Hg:Cd ratio. Detectors for 3–5 µm have a Cd fraction x ≈ 0.3, and our MCT array has a cutoff wavelength of about 12 µm (band gap about 0.1 eV).`),TR('같은 단위로 긴 쪽 한계: Si 약 1.1 µm, InGaAs 약 1.7 µm, MCT 약 12 µm(우리 배열 기준, 조성에 따라 더 길게도 만든다). 중적외선 pump-probe에 MCT를 쓰는 이유다.','Long-wavelength limits in the same unit: Si about 1.1 µm, InGaAs about 1.7 µm, MCT about 12 µm (our array; other compositions reach further). This is why MCT is used for mid-infrared pump-probe.'),TR('짧은 쪽은 띠 간격으로 막히지 않는다. 띠 간격보다 큰 광자는 원리상 모두 전자를 만든다. 대신 다른 이유로 효율이 떨어진다: 첫째, 검출기 창 재질(예: Ge 창은 약 1.8 µm보다 짧은 빛을 막는다, 대략), 둘째, 에너지가 큰 광자는 표면 바로 아래에서 흡수되어 표면 재결합으로 전자를 잃는다, 셋째, 같은 W에 든 광자 수가 줄어 반응도(A/W)가 λ에 비례해 낮아진다. InGaAs가 약 0.9 µm 아래에서 약해지는 것도 같은 종류의 이유(기판 흡수)다(확인 필요).','The short side is not limited by the band gap. In principle every photon above the band gap produces an electron. The efficiency drops for other reasons instead. First, the detector window (e.g. a Ge window blocks light shorter than about 1.8 µm, approx.). Second, high-energy photons are absorbed just below the surface, and the electrons are lost to surface recombination. Third, the number of photons per watt falls, so the responsivity (A/W) drops in proportion to λ. The weakening of InGaAs below about 0.9 µm has the same kind of origin (substrate absorption) (to be verified).'),TR('그래서 MCT의 실용 범위는 대략 2 µm 위로 잡는다. 반대로 pump(근적외선 등)의 산란광이 MCT 창을 통과하면 원치 않는 신호가 될 수 있어, 앞에 필터를 두기도 한다(확인 필요).','The practical range of MCT is therefore taken as above approx. 2 µm. Conversely, scattered pump light (near infrared, etc.) that passes the MCT window can give an unwanted signal, so a filter is sometimes placed in front (to be verified).'),TR('슬라이더로 파장을 늘리면 ✓가 ✗로(긴 쪽 한계), 줄이면 MCT와 InGaAs가 △로(짧은 쪽 한계) 바뀐다.','Increasing the wavelength with the slider turns ✓ into ✗ (long-side limit); decreasing it turns MCT and InGaAs into △ (short-side limit).')],
 q:TR('2000 cm⁻¹(5 µm) 빛을 Si CCD로 볼 수 있나? 반대로 800 nm 빛은 MCT에 안 잡히나?','Can 2000 cm⁻¹ (5 µm) light be seen with a Si CCD? Conversely, is 800 nm light invisible to MCT?'),a:TR('5 µm는 Si로 못 본다. 광자 에너지 약 0.25 eV가 Si 띠 간격(약 1.1 eV)보다 작다. 800 nm는 띠 간격으로는 MCT에 잡힐 수 있지만, 창 재질과 표면 흡수 때문에 효율이 낮거나 창에서 막힌다. 막히지 않으면 산란광이 섞일 수 있다.','5 µm cannot be seen with Si: the photon energy of about 0.25 eV is below the Si band gap (about 1.1 eV). 800 nm can be detected by MCT as far as the band gap is concerned, but the window material and surface absorption make the efficiency low, or the window blocks it. If it is not blocked, scattered light can leak into the signal.')},
{t:TR('MCT를 액체 질소로 식히는 이유: 열로 생기는 전자','Why MCT is cooled with liquid nitrogen: thermally generated electrons'),ec:TR('MCT 띠 그림 (띠 간격 0.1 eV 예시)','MCT band diagram (band gap 0.1 eV, example)'),mc:TR('열 전자 수 (300 K 대비, log)','Number of thermal electrons (relative to 300 K, log)'),
 slider:{min:60,max:300,step:1,init:300,label:TR('온도','Temperature'),fmt:v=>Math.round(v)+' K'},
 e:v=>{const g=.1,f=t=>Math.exp(-g/(2*dtKT(t))),r=f(v)/f(300),n=Math.round(40*r);let s=`<rect x="30" y="60" width="260" height="70" style="fill:var(--s2)" fill-opacity=".1"/>`+T(296,100,TR('전도띠','conduction band'),'sub','end')
   +`<rect x="30" y="170" width="260" height="70" style="fill:var(--s6)" fill-opacity=".15"/>`+T(296,212,TR('가전자띠','valence band'),'sub','end')+LN(30,130,290,130,'var(--fg)')+LN(30,170,290,170,'var(--fg)')
   +T(160,154,TR('띠 간격 0.1 eV','band gap 0.1 eV'),'sub','middle');
  for(let i=0;i<n;i++){const x=40+((i*53)%22)*TR(10,7.6),y=72+((i*29)%5)*11; /* 22칸 × 5줄, 겹치지 않음. 오른쪽 '전도띠' 글자 자리는 비운다 */s+=`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--s2)"/>`}
  return s+T(30,30,`kT = ${(dtKT(v)*1000).toFixed(1)} meV`,'lab')+T(30,48,TR(`열 전자 (300 K 40개 기준): ${n<1&&r>0?'1개 미만':n+'개'}`,`thermal electrons (40 at 300 K): ${n<1&&r>0?'fewer than 1':n}`),'lab')+T(30,262,TR('점 = 열로 띠 간격을 넘은 전자 (개수는 예시)','dots = thermally excited electrons (example)'),'sub')},
 m:v=>{const f=(g,t)=>Math.exp(-g/(2*dtKT(t)))/Math.exp(-g/(2*dtKT(300)));const P=plot({x:[60,300],y:[1e-9,1],logy:1,xt:[{v:77,l:'77'},{v:150,l:'150'},{v:200,l:'200'},{v:300,l:'300'}],yt:[{v:1,l:'1'},{v:1e-3,l:'10⁻³'},{v:1e-6,l:'10⁻⁶'},{v:1e-9,l:'10⁻⁹'}],xl:TR('온도 (K)','temperature (K)'),yl:TR('상대값','relative value'),L:62,T:30});
  return P.s+crv(P,t=>f(.1,t),60,300,'var(--s1)')+crv(P,t=>f(.25,t),60,300,'var(--s5)',{dash:1})+`<line x1="${P.X(77)}" x2="${P.X(77)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(77)+4,P.Y(1e-8),'LN₂ 77 K','sub')+`<line x1="${P.X(220)}" x2="${P.X(220)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(220)+4,P.Y(1e-8),TR('TE 약 220 K','TE approx. 220 K'),'sub')+`<line x1="${P.X(295)}" x2="${P.X(295)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(295)+4,P.T-8,TR('상온 약 295 K','room temp. approx. 295 K'),'sub','end')
   +`<circle cx="${P.X(v)}" cy="${P.Y(f(.1,v))}" r="5" style="fill:var(--s1)"/>`+`<line x1="${P.X(140)}" x2="${P.X(140)+22}" y1="${P.Y(1e-6)}" y2="${P.Y(1e-6)}" style="stroke:var(--s1)" stroke-width="2"/>`+T(P.X(140)+28,P.Y(1e-6)+4,TR('0.1 eV (약 12 µm 차단)','0.1 eV (approx. 12 µm cutoff)'),'sub')+`<line x1="${P.X(140)}" x2="${P.X(140)+22}" y1="${P.Y(1e-7)}" y2="${P.Y(1e-7)}" style="stroke:var(--s5)" stroke-width="2" stroke-dasharray="5 4"/>`+T(P.X(140)+28,P.Y(1e-7)+4,TR('0.25 eV (약 5 µm 차단)','0.25 eV (approx. 5 µm cutoff)'),'sub')},
 read:[TR('띠 간격이 작으면 긴 파장을 보지만, 열에너지만으로도 전자가 띠 간격을 넘어 버린다. 빛 없이 생긴 이 전자가 암전류와 잡음이 된다.','A small band gap reaches long wavelengths, but then thermal energy alone can lift electrons across the gap. These electrons, produced without light, become dark current and noise.'),TR('300 K의 kT는 약 26 meV(약 208 cm⁻¹)다. 띠 간격 0.1 eV는 kT의 4배뿐이다. Si(1.1 eV)는 kT의 40배가 넘어 실온에서도 훨씬 조용하다.','kT at 300 K is about 26 meV (about 208 cm⁻¹). A band gap of 0.1 eV is only 4 kT. Si (1.1 eV) is more than 40 kT, so it is much quieter even at room temperature.'),TR('열 전자 수는 대략 exp(−E_g / 2kT)를 따른다(온도 앞 인자는 무시한 근사). 세어 보기: 300 K에서 1000개라면 77 K에서는 약 4개다.','The number of thermal electrons roughly follows exp(−E_g / 2kT) (approximation that ignores the temperature prefactor). Counting it out: 1000 at 300 K become about 4 at 77 K.'),TR('그래서 MCT는 액체 질소(77 K)로 식힌다. 열전 냉각(TE)은 단 수에 따라 대략 200–240 K까지 내려간다(그림의 220 K는 예시, 확인 필요). 77 K까지 못 내려가 우리 12 µm MCT 같은 긴 파장 검출기에는 LN₂를 대신하지 못한다(논문 A.4.3).','MCT is therefore cooled with liquid nitrogen (77 K). Thermoelectric (TE) cooling reaches approx. 200–240 K depending on the number of stages (220 K in the figure is an example, to be verified). It cannot reach 77 K, so it does not replace LN₂ for long-wavelength detectors such as our 12 µm MCT (thesis A.4.3).'),TR('띠 간격도 온도에 따라 바뀐다. 측정 중 온도가 일정해야 하는 이유이기도 하다. LN₂가 떨어지면 신호와 잡음이 같이 변한다.','The band gap also changes with temperature. This is another reason the temperature must stay constant during a measurement. When the LN₂ runs out, the signal and the noise change together.')],
 q:TR('5 µm 차단 MCT(0.25 eV)와 12 µm 차단 MCT(0.1 eV) 중 냉각이 더 절실한 쪽은?','Which needs cooling more: a 5 µm cutoff MCT (0.25 eV) or a 12 µm cutoff MCT (0.1 eV)?'),a:TR('12 µm 쪽. 띠 간격이 작아 같은 온도에서 열 전자가 훨씬 많다.','The 12 µm one. Its smaller band gap gives far more thermal electrons at the same temperature.')},
{t:TR('PMT: 광전자 하나를 수백만 개로 키운다','PMT: one photoelectron multiplied into millions'),ec:TR('광음극 → 다이노드 → 양극','Photocathode → dynodes → anode'),mc:TR('증폭률 vs 다이노드 단 수 (단마다 4배)','Gain vs number of dynode stages (×4 per stage)'),
 slider:{min:1,max:12,step:1,init:10,label:TR('다이노드 수','Dynode stages'),fmt:v=>Math.round(v)+TR('단',' stages')},
 e:v=>{const n=Math.round(v);let s=`<rect x="12" y="150" width="14" height="70" style="fill:var(--s5)" fill-opacity=".35" stroke="var(--s5)"/>`+T(TR(19,4),240,TR('광음극','photocathode'),'sub',TR('middle','start'))+LN(2,128,12,160,'var(--s4)',{w:2,mk:'s4'})+T(4,120,TR('광자','photon'),'sub');
  let px=26,py=185;for(let i=1;i<=12;i++){const x=26+i*20,y=i%2?110:200,on=i<=n;s+=`<rect x="${x-7}" y="${y-4}" width="14" height="8" rx="2" style="fill:${on?'var(--fg)':'var(--line)'}"/>`;if(on){s+=LN(px,py,x,y+(i%2?4:-4),'var(--s2)',{w:Math.min(3.5,.6+i*.25)});px=x;py=y+(i%2?4:-4)}}
  const ax=26+(n+1)*20;s+=`<rect x="${ax-4}" y="140" width="8" height="40" style="fill:var(--s3)"/>`+LN(px,py,ax-4,160,'var(--s2)',{w:3.5})+T(ax,196,TR('양극','anode'),'sub','middle');

/* ======================= Boxcar (gated integrator) ======================= */
/* 시간 단위 µs. MCT 프리앰프 출력 모양(예시): 트리거 0.7 µs 뒤 빠르게 오르고 약 0.9 µs로 줄어든다.
   실제 우리 MCT 출력은 아래(−)로 향하지만(논문 그림 A.9) 보기 쉽게 위로 그린다. */

 read:[TR('검출기 출력에는 신호 말고도 느리게 변하는 오프셋(전기 잡음, 기준선 흔들림)이 얹힌다. 신호 창만 적분하면 이 오프셋도 같이 더해진다.','Besides the signal, the detector output carries a slowly varying offset (electrical noise, baseline drift). Integrating the signal window alone adds this offset as well.'),TR(`${c(1,'s4')} 신호 창과 ${c(2,'s5')} 같은 폭의 배경 창(펄스가 없는 시간)을 열어, ① − ②를 값으로 쓴다. 체크박스를 켜면 출렁임이 사라진다.`,`A ${c(1,'s4')} signal window and a ${c(2,'s5')} background window of the same width (at a time with no pulse) are opened, and ① − ② is used as the value. With the checkbox on, the wobble disappears.`),TR('우리 적분기는 빛이 없어도 출력을 약 150 mV(약 1966 counts)로 일부러 띄워 둔다. 잡음이 0에서 잘리지 않게 하려는 것이다. 그래서 빛 없는 값(배경)을 따로 재서 뺀다(논문 A.5.3).','Our integrator deliberately lifts its output to about 150 mV (about 1966 counts) even without light, so that the noise is not clipped at zero. The value without light (background) is therefore measured separately and subtracted (thesis A.5.3).'),TR('pump-probe에서 이웃한 두 샷(펌프 켬, 끔)을 서로 나누거나 빼는 것도 같은 생각이다. 두 샷이 1 ms 떨어져 있어 그사이 느린 흔들림이 거의 같다.','In pump-probe, dividing or subtracting two neighbouring shots (pump on, off) follows the same idea. The two shots are 1 ms apart, so slow fluctuations are almost the same in both.')],
 q:TR('배경 창을 신호 창보다 2배 넓게 잡으면?','What if the background window is twice as wide as the signal window?'),a:TR('오프셋이 2배로 들어가 제대로 안 지워진다. 폭을 같게 하거나, 폭 비율로 나눠서 뺀다.','The offset enters twice and is not removed properly. The widths are made equal, or the background is scaled by the width ratio before subtracting.')},

 read:[TR('boxcar는 혼자 창을 열지 못한다. 증폭기가 펄스마다 내보내는 TTL 신호를 트리거로 받는다.','A boxcar cannot open its window by itself. It takes as its trigger the TTL signal that the amplifier emits with every pulse.'),TR(`${c(1,'f')} 트리거를 받으면 ${c(2,'s4')} 지연 Td 뒤에 폭 Tw의 게이트를 연다. ${c(3,'s3')} MCT 신호는 광로, 케이블, 검출기 응답만큼 늦게 오므로 Td를 그 시간에 맞춘다.`,`On receiving the ${c(1,'f')} trigger, it opens a gate of width Tw after a ${c(2,'s4')} delay Td. The ${c(3,'s3')} MCT signal arrives late by the optical path, the cables and the detector response, so Td is set to match that time.`),TR('우리 FPAS-0144는 채널 144개(배열 위 줄 64 + 아래 줄 64 + 외부 입력 16)가 같은 트리거로 동시에 적분하고, 각 채널의 16-bit ADC가 값을 숫자로 바꾼다. 읽기만 차례로 한다.','Our FPAS-0144 integrates 144 channels (64 in the upper array row + 64 in the lower row + 16 external inputs) simultaneously on the same trigger, and a 16-bit ADC on each channel converts the value to a number. Only the readout is sequential.'),TR('오른쪽: 레이저 1 kHz, 초퍼 500 Hz라 펌프가 한 샷 걸러 들어간다. 게이트 값도 켬·끔이 번갈아 나오고, 이웃한 두 샷으로 신호를 만든다(값 차이는 예시).','Right: with a 1 kHz laser and a 500 Hz chopper, the pump enters every other shot. The gate values also alternate on/off, and two neighbouring shots make one signal (difference in values: example).'),TR('지연을 맞추는 법: 오실로스코프로 트리거와 MCT 출력을 같이 보고, 창이 펄스를 덮도록 Td를 옮긴다. 현재 장비의 Td, Tw는 직렬 명령으로 읽어 확인해야 한다(확인 필요).','Setting the delay: the trigger and the MCT output are viewed together on an oscilloscope, and Td is moved until the window covers the pulse. The current Td and Tw of the instrument have to be read with serial commands (to be verified).')],
 q:TR('샘플 위치를 바꿔 광로가 30 cm 길어지면 Td를 바꿔야 하나?','If moving the sample lengthens the optical path by 30 cm, does Td need to change?'),a:TR('30 cm는 약 1 ns 늦어질 뿐이라 µs 단위 게이트에는 거의 영향이 없다. 케이블을 수십 m 바꾸는 정도라야 다시 맞출 필요가 생긴다(케이블 1 m 대략 5 ns).','30 cm is only about 1 ns of delay, so it barely affects a µs-scale gate. Readjustment is needed only when cables change by tens of metres (approx. 5 ns per metre of cable).')},
{t:TR('레이저 시계에 맞춰 읽어야 한다: boxcar, lock-in, 디지타이저','Reading must follow the laser clock: boxcar, lock-in, digitizer'),ec:TR('샘플이 펄스의 어디를 찍나 (레이저 1000.570 Hz, 예시)','Where the samples land on the pulse (laser 1000.570 Hz, example)'),mc:TR('4초 동안 기록된 값','Values recorded over 4 s'),
 slider:{min:0,max:2,step:1,init:0,label:TR('읽는 방식','Readout mode'),fmt:v=>[TR('내부 시계 1 kSa/s','internal clock 1 kSa/s'),TR('시작 트리거만','start trigger only'),TR('레이저 TTL을 샘플 시계로','laser TTL as sample clock')][Math.round(v)]},
 e:v=>{const m=Math.round(v),P=plot({x:[-5,40],y:[-.1,1.2],xt:[0,10,20,30,40].map(x=>({v:x,l:String(x)})),xl:TR('레이저 펄스 뒤 시간 (µs)','time after laser pulse (µs)'),yl:TR('포토다이오드 (상대)','photodiode (relative)'),T:30});
  let s=P.s+crv(P,bxPD,-5,40,'var(--s3)');const ph0=m===2?3:(m===1?-4:-1.2);
  for(let k=0;k<70;k++){const ph=m===2?ph0:ph0+k*BX_DEL;if(ph>40)break;s+=`<g data-n="1"><circle cx="${P.X(ph)}" cy="${P.Y(bxPD(ph))}" r="2.8" style="fill:var(--s2)"/></g>`}
  return s+T(P.R,P.T-12,m===2?TR('모든 샘플이 같은 자리 (펄스마다 한 번)','every sample at the same point (once per pulse)'):TR('샘플마다 0.57 µs씩 밀려 펄스를 훑는다','each sample slips 0.57 µs and sweeps the pulse'),'sub','end')},
 m:v=>{const m=Math.round(v),P=plot({x:[0,4],y:[-.1,1.2],xt:[0,1,2,3,4].map(x=>({v:x,l:x+' s'})),xl:TR('기록 시간','recording time'),yl:TR('기록 값 (상대)','recorded value (relative)'),T:30});
  const ph0=m===2?3:(m===1?-4:-600);let d='';
  for(let k=0;k<=4000;k+=2){let ph=m===2?ph0:((ph0+k*BX_DEL)%1000+1000)%1000;if(m!==2&&ph>990)ph-=1000;d+=(k?' L':'M')+P.X(k/1000).toFixed(1)+','+P.Y(bxPD(ph)).toFixed(1)}
  return P.s+`<g data-n="1"><path d="${d}" fill="none" style="stroke:var(--s2)" stroke-width="1.4"/></g>`+(m<2?T(P.R,P.T-12,TR('약 1.75 s마다 펄스 모양이 다시 나타남','pulse shape reappears approx. every 1.75 s'),'sub','end'):T(P.R,P.T-12,TR('평평: 펄스마다 같은 자리를 읽음','flat: the same point is read on every pulse'),'sub','end'))},
 read:[TR('펄스 신호를 시계가 레이저와 안 맞는 장치로 찍으면, 샘플 순간이 펄스에 대해 조금씩 밀린다. 1 kSa/s로 1000.570 Hz 레이저를 찍으면 샘플마다 0.57 µs씩 밀린다.','Recording a pulsed signal with a device whose clock is not locked to the laser makes the sampling instant slip slowly relative to the pulse. Sampling a 1000.570 Hz laser at 1 kSa/s shifts each sample by 0.57 µs.'),TR('20 µs 펄스면 기록의 약 98%가 바닥이고, 약 1.75 s마다 펄스 모양이 느리게 다시 그려진다(주기 = 1 / 0.57 Hz). 신호처럼 보이지만 샘플링이 만든 맥놀이다(오실로스코프 aliasing과 같은 원리).','For a 20 µs pulse, about 98% of the record is baseline, and the pulse shape is slowly redrawn approx. every 1.75 s (period = 1 / 0.57 Hz). It looks like a signal, but it is a beat created by the sampling (the same principle as aliasing on an oscilloscope).'),TR('시작 트리거만 주면 첫 샘플만 맞고 그 뒤는 다시 밀린다. 슬라이더 1번과 2번이 같은 모양인 이유다. 해결은 레이저 TTL을 샘플 시계로 쓰는 것(펄스마다 한 번)이다.','With only a start trigger, just the first sample is aligned and the rest slip again. This is why the first two slider settings look the same. The fix is to use the laser TTL as the sample clock (once per pulse).'),TR('비교 (대략): boxcar = 레이저 트리거로 샷마다 창을 열어 적분, 샷별 값이 남는다. lock-in = 초퍼 같은 변조 주파수 성분만 골라 오래 평균한다. 샷별 값은 남지 않는다(확인 필요). 디지타이저 = MS/s로 파형 전체를 찍고 소프트웨어로 펄스마다 적분한다. 같은 결과지만 데이터가 많다(2초에 약 2 × 10⁶점).','Comparison (approx.): boxcar = opens a window on every shot from the laser trigger and integrates; per-shot values remain. Lock-in = picks out only the component at a modulation frequency such as the chopper frequency and averages it for a long time; per-shot values do not remain (to be verified). Digitizer = records the whole waveform at MS/s and integrates each pulse in software; the same result, but much more data (about 2 × 10⁶ points in 2 s).'),TR('우리 IR pump-probe는 FPAS-0144가 샷마다 트리거되고 DIO 카드로 읽혀 이 문제가 없다(논문 부록 B.3).','In our IR pump-probe, the FPAS-0144 is triggered on every shot and read through a DIO card, so this problem does not arise (thesis Appendix B.3).')],
 case:TR('<b>사례: 1.7초 주기의 수수께끼.</b> 연구실에서 가시광 pump-probe를 개발할 때, 스테이지를 멈추고 산란광만 받아도 기록에 약 1.7초 주기의 느린 파형이 나타났다. 저역 필터를 달고 포토다이오드를 바꿔도 남았다. 나중에 원자료를 다시 분석해 보니 레이저 반복률이 정확히 1000 Hz가 아니라 1000.570 Hz였고, 내부 시계 1 kSa/s로 찍은 샘플이 펄스를 천천히 훑으며 생긴 맥놀이였다. 트리거를 받은 gated integrator를 넣자 흔들림이 20.8%에서 0.41%로 줄었다. 다만 적분기 출력을 다시 내부 시계로 읽어 1.61초마다 한 점씩 떨어지는 값이 남았고, 1 kHz 저역 필터로 없앴다. 교훈: 시작 트리거만으로는 부족하고, 읽는 시계 자체가 레이저와 맞아야 한다(논문 부록 B).','<b>Case: the 1.7-second mystery.</b> During the development of a visible pump-probe setup in the lab, a slow waveform with a period of about 1.7 s appeared in the record even with the stage stopped and only scattered light reaching the detector. It remained after adding a low-pass filter and changing the photodiode. A later reanalysis of the raw data showed that the laser repetition rate was not exactly 1000 Hz but 1000.570 Hz, and that the samples taken with the internal 1 kSa/s clock were slowly sweeping across the pulse, producing a beat. Adding a triggered gated integrator reduced the fluctuation from 20.8% to 0.41%. The integrator output, however, was again read with the internal clock, which left a value dropping by one point every 1.61 s; a 1 kHz low-pass filter removed it. Lesson: a start trigger alone is not enough; the readout clock itself must be locked to the laser (thesis Appendix B).'),
 q:TR('레이저가 정확히 1000.000 Hz라면 내부 시계 1 kSa/s로도 괜찮나?','If the laser ran at exactly 1000.000 Hz, would the internal 1 kSa/s clock be fine?'),a:TR('밀림이 0이라 매번 같은 자리를 찍지만, 그 자리가 펄스 위인지는 운이고 두 시계가 조금만 달라져도 다시 밀린다. 레이저 TTL을 시계로 쓰거나 적분기를 샷마다 트리거해야 안전하다.','The slip would be zero, so every sample would land at the same point, but whether that point lies on the pulse is luck, and the slightest drift between the two clocks starts the slip again. Using the laser TTL as the clock, or triggering the integrator on every shot, is the safe choice.')}];

       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
