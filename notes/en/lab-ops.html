<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lab Operations Notes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · lab operations</span><span class="status" title="Draft before expert review. Read values together with their approx./example/to-be-verified marks.">Under review</span><a class="lang" id="langbtn" data-base="../lab-ops.html" href="../lab-ops.html" title="한국어">한 · <b>EN</b></a></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>
  <div class="stage" id="stage">
    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="Left figure"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="Right figure"></svg></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>Play</button>
    <span id="tgl"></span>
  </div>
  <div class="notes">
    <div class="read"><ul id="read"></ul><div class="case" id="case" hidden></div></div>
    <div class="quiz"><span class="k">Check question</span><p id="q"></p><details id="ad"><summary>Show answer</summary><p id="a"></p></details></div>
  </div>
  <nav><button id="prev" type="button">← Previous</button><div class="dots" id="dots"></div><button id="next" type="button">Next →</button></nav>
</div>

<script>
const LANG='en';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 실험실 운영 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 실험실 운영
// @status 검토 중
// @lang ko en
// @title.en Lab Operations Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · lab operations
// @status.en Under review
/* 실험실 운영 노트: 기초 장비, UPS·정전 대비
   이 노트의 숫자는 일반 대략값·예시다. 실제 순서와 값은 장비 설명서와 연구실 규정을 따른다.
   글은 TR('한국어','English')로 쓴다 (영어판 notes/en/lab-ops.html). */
const NOTE={key:'labops'};

/* ---------- UPS 헬퍼 ---------- */
const upsOK='var(--s3)',upsBAT='var(--s4)';
/* 가는 세로 막대 + 번호 */
const upsGuide=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="lvl2"/>`;
/* 2단계: 전원 경로 한 줄 */
function upsRow(y,n,name,kind){
 let s=`<g data-n="${n}">${badge(16,y-28,n,'var(--fg)')}</g>`+T(30,y-24,name,'lab')+box(4,y-12,40,24,TR('전원','Mains'));
 if(kind==='on'){
  s+=LN(44,y,62,y,upsOK,{w:2})+box(62,y-12,56,24,'AC→DC')+LN(118,y,190,y,upsOK,{w:2})+T(154,y-6,TR('직류','DC'),'sub','middle')+box(190,y-12,56,24,'DC→AC')+LN(246,y,262,y,upsOK,{w:2,mk:'s3'})
   +box(132,y+12,44,20,TR('배터리','Battery'))+LN(154,y+12,154,y+1,upsBAT,{w:2,dash:1});
 }else{
  if(kind==='li')s+=LN(44,y,70,y,upsOK,{w:2})+box(70,y-12,60,24,TR('전압 조정','AVR'))+LN(130,y,150,y,upsOK,{w:2});
  else s+=LN(44,y,150,y,upsOK,{w:2});
  s+=box(150,y-10,34,20,TR('전환','Switch'))+LN(184,y,262,y,upsOK,{w:2,mk:'s3'})+box(100,y+12,44,20,TR('배터리','Battery'))+PL([[144,y+22],[167,y+22],[167,y+12]],upsBAT,{dash:1,mk:'s4'});
 }
 return s+box(264,y-12,52,24,TR('장비','Device'))}
/* 2단계: 출력 파형 (60 Hz 가정, 주기 약 16.7 ms) */
const upsSin=(c0,a)=>t=>c0+a*Math.sin(2*Math.PI*t/16.67);
/* 3단계: 버티는 시간 (분) = 216 Wh × 0.8 / 부하 × 60 */
const upsMin=P=>216*0.8/P*60;
/* 6단계: 켤 때 전류 (상대). 각 장비 = 정상 소비 + 순간 전류(지수 감쇠) */
const upsDev=[{n:1,t:1,b:2,a:3,k:'s5'},{n:3,t:5,b:1.5,a:2.5,k:'s2'},{n:4,t:8,b:.5,a:1,k:'s6'}];
const upsCur=(all,t)=>upsDev.reduce((sum,d)=>{const t0=all?1:d.t;return sum+(t>=t0?d.b+d.a*Math.exp(-(t-t0)/.25):0)},0);

const UPS=[
{t:TR('정전이 실험에 주는 피해','What a power outage does to an experiment'),ec:TR('전원이 끊기면 (일반 예시)','When power is lost (general example)'),mc:TR('다시 측정하기까지 걸리는 시간 (예시)','Time until measuring can resume (example)'),
 e:()=>{const it=[[1,TR('레이저','Laser'),TR(['냉각이 멈춘 채 꺼짐','(장비마다 다름, 확인 필요)'],['Off with cooling stopped','(varies; to be verified)']),'s2'],[2,TR('냉각기','Chiller'),TR(['다시 식히는 데','시간이 걸림'],['Takes time to','cool down again']),'s5'],[3,TR('진공 펌프','Vacuum pump'),TR(['진공이 깨질 수 있음'],['Vacuum may be lost']),'s4'],[4,TR('측정 PC','Measurement PC'),TR(['저장 안 한 데이터 사라짐','스테이지 기준점 잃음'],['Unsaved data is lost','Stage loses its home']),'s6']];
  return T(14,20,TR('순간 정전(1초 미만)으로도 재시작될 수 있다','Even a brief outage (< 1 s) can cause a restart'),'sub')+it.map(([n,name,lines,k],i)=>{const y=62+i*58;return `<g data-n="${n}">${badge(18,y,n,COL[k])}</g>`+box(34,y-15,96,30,name)+LN(130,y,150,y,'var(--muted)',{w:1,mk:'g'})+TM(156,y-(lines.length-1)*7+4,lines,'sub')}).join('')},
 m:()=>{const P=plot({x:[1,1000],logx:1,noy:1,xt:[{v:1,l:'1'},{v:10,l:'10'},{v:100,l:'100'},{v:1000,l:'1000'}],xl:TR('분 (log, 예시)','minutes (log, example)'),L:96,R:300,T:44,B:236});
  const it=[[4,TR('측정 PC','PC'),5,TR('약 5분','~5 min'),'s6'],[2,TR('냉각기','Chiller'),30,TR('약 30분','~30 min'),'s5'],[1,TR('레이저','Laser'),60,TR('약 1시간','~1 h'),'s2'],[3,TR('진공','Vacuum'),300,TR('수 시간','hours'),'s4']];
  return P.s+upsGuide(P.X(35),P.T,P.X(35),P.B)+T(P.X(35),P.T-10,TR('UPS가 버티는 시간 예시 (3단계)','Example UPS runtime (step 3)'),'sub','middle')
   +it.map(([n,name,v,lab,k],i)=>{const y=74+i*42;return `<g data-n="${n}">${badge(16,y,n,COL[k])}</g>`+T(30,y+4,name,'sub')+`<rect x="${P.L}" y="${y-6}" width="${P.X(v)-P.L}" height="12" rx="2" style="fill:${COL[k]}" fill-opacity=".55"/>`+T(P.X(v),y-11,lab,'sub','end')}).join('')},

 q:TR('오프라인 UPS에 물린 장비가 정전 때마다 재부팅된다. 의심할 것은?','Equipment on an offline UPS reboots at every outage. What is the likely cause?'),a:TR('전환 시간(수 ms) 동안 장비 전원이 버티지 못하는 것. 온라인 형으로 바꾸거나, 배터리·UPS 상태(용량 부족, 과부하)를 확인한다.','The equipment power supply cannot ride through the transfer time (a few ms). The fix is an online-type UPS, or a check of the battery and UPS condition (low capacity, overload).')},

const eqTr=f=>{const r=f/1.5,z=.1;return Math.sqrt((1+(2*z*r)**2)/((1-r*r)**2+(2*z*r)**2))};

function eqAng(k,wrong){let t1=.02,t2=-.005;const h=[[t1,t2]];
 for(let i=0;i<k;i++){const a=i%2===0;

/* 6단계: 두 가우시안 빔 겹침 (1/e² 반경 wp, wr, 중심 거리 d) */
const eqOv=(d,wp,wr)=>Math.exp(-2*d*d/(wp*wp+wr*wr));

 read:[TR('광학 테이블은 무거운 판을 아주 무른 용수철(공기 다리) 위에 올린 것이다. 무겁고 무르면 공진 진동수가 낮아진다(대략 1–2 Hz, 예시).','An optical table is a heavy plate on very soft springs (air legs). Heavy and soft means a low resonance frequency (approx. 1–2 Hz, example).'),`${c(1,'s3')} `+TR('공진보다 빠른 바닥 진동(사람 발걸음, 펌프, 건물 진동 대략 수–수십 Hz)은 테이블에 거의 전달되지 않는다. 진동수가 공진의 10배면 전달이 대략 2% 수준으로 준다(이 그림의 가정: 공진 1.5 Hz, 감쇠비 0.1).','Floor vibration faster than the resonance (footsteps, pumps, building vibration, approx. a few to tens of Hz) hardly reaches the table. At 10× the resonance frequency, transmission drops to approx. 2% (assumed in this figure: resonance 1.5 Hz, damping ratio 0.1).'),TR('반대로 공진 근처의 아주 느린 흔들림은 오히려 커진다. 공기 다리를 켠 채 테이블을 세게 밀면 한동안 출렁이는 이유다.','Conversely, very slow motion near the resonance is amplified. That is why a table pushed hard with the air legs on keeps swaying for a while.'),TR('표면의 나사 구멍(보통 25 mm 간격, 확인 필요)에 마운트를 고정한다. 판 내부의 벌집 구조가 판 자체의 떨림을 줄인다.','Mounts are fixed in the threaded holes on the surface (usually 25 mm spacing, to be verified). The honeycomb core inside the plate damps vibration of the plate itself.'),TR('진동만 문제가 아니다. 방 온도가 바뀌면 금속 테이블·포스트·마운트가 늘었다 줄며 정렬이 틀어진다. 온도를 되돌려도 정렬이 완전히 돌아오지 않았다는 경험이 있다(논문 A.8.1, 마운트의 기계적 이력 때문으로 추정, 확인 필요). 그래서 실험실 온도를 일정하게 유지하고, 큰 온도 변화 뒤에는 정렬을 다시 확인한다.','Vibration is not the only issue. When the room temperature changes, the metal table, posts and mounts expand and contract, and the alignment drifts. In our experience the alignment did not fully recover even after the temperature returned (thesis A.8.1; presumably mechanical hysteresis of the mounts, to be verified). That is why the lab temperature is kept constant and the alignment is rechecked after a large temperature change.')],
 q:TR('공기 다리 압축 공기가 빠졌다. 무엇이 달라지나?','The compressed air in the air legs has run out. What changes?'),a:TR('테이블이 다리 받침에 내려앉아 단단히 붙는다. 그러면 바닥 진동이 거의 그대로 전달된다. 측정 전에 공기 압력과 테이블이 떠 있는지 확인한다.','The table settles onto the leg supports and becomes rigidly coupled to them. Floor vibration is then transmitted almost unchanged. The air pressure and whether the table is floating are checked before measuring.')},
{t:TR('두 거울 정렬: 가까운 조리개는 먼 거울, 먼 조리개는 가까운 거울','Two-mirror alignment: near iris with the far mirror, far iris with the near mirror'),ec:TR('위에서 본 빔 경로 (각도 오차는 크게 과장)','Beam path seen from above (angle errors greatly exaggerated)'),mc:TR('조리개에서 빔이 벗어난 정도 (예시 단위)','Beam offset at the irises (example units)'),
 slider:{min:0,max:10,step:1,init:0,label:TR('조정 횟수','Adjustments'),fmt:v=>Math.round(v)+TR('번',''),play:1},tg:[{k:'wr',l:TR('순서를 바꿔 본다 (틀린 방법)','Swapped order (wrong method)'),on:false}],
 e:(v,tg)=>{const k=Math.round(v),wr=!!tg.wr,[t1,t2]=eqAng(k,wr)[k],[x1,x2]=eqAlign(k,wr)[k];
  /* Z자(잠망경) 배치: 레이저 → M1(아래, 위로 꺾음) → M2(위, 오른쪽으로 꺾음) → 조리개 1, 2.
     거리: M1→M2 100, M2→조리개 1 200, 조리개 1→2 300 (예시 단위). 어긋남은 6배로 과장. */
  const mx=70,y1=214,y2=104,sc=.46,X=z=>mx+(z-100)*sc,G=6,cl=d=>Math.max(-60,Math.min(60,d));
  /* M1 오차로 M2에 닿는 점이 가로로 dh 밀리면, 45° 거울 M2에서 반사된 뒤에는 세로로 dh 어긋난다. 그래서 닿는 점은 M2 거울면 위 (mx+dh, y2−dh).
     M2 뒤 빔은 곧은 선 하나 (기울기 = 두 거울 오차의 합). 거울 기호는 실제 그린 입사·반사 빔의 이등분 방향으로 돌린다 (입사각 = 반사각). */
  const dh=cl(G*t1*100),hx=mx+dh,hy=y2-dh,sl=-G*(t1+t2)/sc,Yb=x=>Math.max(y2-80,Math.min(y2+80,hy+sl*(x-hx))),Y=z=>Yb(X(z));
  const adj=k%2===0?(wr?2:1):(wr?1:2),tgt=k%2===0?1:2;
  const th1=Math.atan2(y1-hy,hx-mx),th2=Math.atan2(-sl,1);
  const mir=(x,y,ph,on)=>{const cx=17*Math.cos(ph),cy=17*Math.sin(ph);return `<line x1="${x-cx}" y1="${y+cy}" x2="${x+cx}" y2="${y-cy}" style="stroke:${on?'var(--s4)':'var(--fg)'}" stroke-width="${on?4:3}"/>`};
  let s=`<path d="M44,${y1} H${mx} V${y2} H306" fill="none" class="lvl2"/>`+`<rect x="8" y="${y1-8}" width="36" height="16" rx="2" class="dev"/>`+T(26,y1+26,TR('레이저','Laser'),'sub','middle');
  s+=PL([[44,y1],[mx,y1],[hx,hy],[X(600),Y(600)]],'var(--s1)',{w:2});
  s+=mir(mx,y1,th1/2,adj===1)+T(mx+16,y1+22,'M1','labn','start',adj===1?'var(--s4)':undefined)+mir(hx,hy,(th1+th2)/2,adj===2)+T(Math.min(mx,hx)-16,hy-12,'M2','labn','end',adj===2?'var(--s4)':undefined);
  [[300,1,'s5'],[600,2,'s2']].forEach(([z,n,kk])=>{const x=X(z),w=tgt===n?4:3;
   s+=`<g data-n="${n}"><line x1="${x}" x2="${x}" y1="${y2-34}" y2="${y2-6}" style="stroke:${COL[kk]}" stroke-width="${w}"/><line x1="${x}" x2="${x}" y1="${y2+6}" y2="${y2+34}" style="stroke:${COL[kk]}" stroke-width="${w}"/>`
    +`<circle cx="${x}" cy="${Y(z)}" r="3.5" style="fill:var(--s1)"/>`+badge(x,y2+50,n,COL[kk])+'</g>'+T(n===2?x+8:x,y2+76,TR('조리개 ','Iris ')+n,'sub',n===2?'end':'middle')});
  const next=wr?(adj===2?TR('다음: M2로 조리개 1에 맞춘다 (틀린 짝)','Next: M2 to iris 1 (wrong pair)'):TR('다음: M1로 조리개 2에 맞춘다 (틀린 짝)','Next: M1 to iris 2 (wrong pair)')):(adj===1?TR('다음: M1로 조리개 1에 맞춘다','Next: M1 to iris 1'):TR('다음: M2로 조리개 2에 맞춘다','Next: M2 to iris 2'));
  return s+T(14,24,next,'lab')+T(14,42,TR(`어긋남 — 조리개 1: ${x1.toFixed(1)} · 조리개 2: ${x2.toFixed(1)}`,`Offset — iris 1: ${x1.toFixed(1)} · iris 2: ${x2.toFixed(1)}`),'sub')+T(14,272,TR('점선 = 맞춰야 할 경로, 빨간 점 = 조리개에 닿는 위치','Dotted = target path, red dot = where beam hits iris'),'sub')+T(14,256,TR('노란 거울 = 다음에 돌릴 거울','Yellow mirror = next one to adjust'),'sub')},
 m:(v,tg)=>{const k=Math.round(v),h=eqAlign(10,!!tg.wr);const P=plot({x:[0,10],y:[0,30],xt:[0,2,4,6,8,10].map(x=>({v:x,l:String(x)})),yt:[0,10,20,30].map(y=>({v:y,l:String(y)})),xl:TR('조정 횟수','adjustments'),yl:TR('벗어난 정도 |x|','offset |x|'),T:30});
  const pts=j=>h.slice(0,k+1).map((p,i)=>[P.X(i),P.Y(Math.min(30,Math.abs(p[j])))]);
  let s=P.s+`<g data-n="1">${PL(pts(0),'var(--s5)',{w:2})}${pts(0).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--s5)"/>`).join('')}</g><g data-n="2">${PL(pts(1),'var(--s2)',{w:2})}${pts(1).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--s2)"/>`).join('')}</g>`;
  s+=`<line x1="${P.R-130}" x2="${P.R-110}" y1="${P.T-14}" y2="${P.T-14}" style="stroke:var(--s5)" stroke-width="2"/>`+T(P.R-106,P.T-10,TR('조리개 1','Iris 1'),'sub')+`<line x1="${P.R-56}" x2="${P.R-36}" y1="${P.T-14}" y2="${P.T-14}" style="stroke:var(--s2)" stroke-width="2"/>`+T(P.R-32,P.T-10,TR('조리개 2','Iris 2'),'sub');
  return s+T(P.R,P.Y(26),tg.wr?TR('점점 커진다 (발산)','Keeps growing (diverges)'):TR('점점 0으로 간다','Goes toward 0'),'sub','end')},
 read:[TR('거울 두 개면 빔의 위치와 방향을 둘 다 맞출 수 있다. 조리개 두 개를 빔이 지나가야 할 축 위에 세워 두고 번갈아 맞춘다.','Two mirrors can set both the position and the direction of a beam. Two irises are placed on the axis the beam should follow, and the beam is aligned to them in turn.'),TR(`순서: M1(빔이 먼저 닿는, 조리개에서 먼 거울)로 ${c(1,'s5')} 가까운 조리개를 맞추고, M2(조리개에 가까운 거울)로 ${c(2,'s2')} 먼 조리개를 맞춘다. 이걸 반복한다.`,`Order: M1 (hit first by the beam, far from the irises) aligns the beam to the ${c(1,'s5')} near iris, and M2 (close to the irises) aligns it to the ${c(2,'s2')} far iris. This is repeated.`),TR('재생을 누르면 한 번 맞출 때마다 두 조리개의 어긋남이 함께 줄어든다. 이 배치(예시 거리)에서는 한 바퀴마다 약 0.8배로 줄어 몇 바퀴면 거의 0이 된다.','With Play, every adjustment reduces the offsets at both irises together. In this layout (example distances) they shrink by approx. 0.8× per round and are nearly 0 after a few rounds.'),TR('체크박스를 켜서 순서를 바꾸면(M2로 가까운 조리개, M1로 먼 조리개) 한 바퀴마다 약 1.25배로 커진다. "맞출수록 더 틀어지는" 경험의 이유다.','With the checkbox on, the order is swapped (M2 for the near iris, M1 for the far iris), and the offsets grow by approx. 1.25× per round. This explains the experience of "the more I align, the worse it gets."'),TR('줄어드는 속도는 거울과 조리개 사이 거리에 따라 다르다. 조리개 사이를 멀리 둘수록 방향을 정밀하게 맞출 수 있다.','How fast the offsets shrink depends on the distances between the mirrors and the irises. The farther apart the irises, the more precisely the direction can be set.')],
 q:TR('조리개 하나만 쓰면 무엇을 못 맞추나?','What cannot be set with a single iris?'),a:TR('빔이 그 점을 지나기만 하면 방향은 아무래도 된다. 위치와 방향 두 가지를 정하려면 점이 두 개 필요하다.','As long as the beam passes through that point, any direction is allowed. Fixing both position and direction takes two points.')},
{t:TR('파워미터와 에너지미터: 평균 출력과 펄스 하나','Power meter and energy meter: average power and a single pulse'),ec:TR('5 ms 동안의 펄스 (평균 출력 1 W 고정)','Pulses within 5 ms (average power fixed at 1 W)'),mc:TR('펄스 하나 에너지 = 평균 출력 / 반복률','Single-pulse energy = average power / repetition rate'),
 slider:{min:0,max:6,step:.05,init:3,label:TR('반복률','Repetition rate'),fmt:v=>{const f=10**v;return f>=1e6?(f/1e6).toFixed(1)+' MHz':f>=1e3?(f/1e3).toFixed(f<1e4?1:0)+' kHz':f.toFixed(f<10?1:0)+' Hz'}},
 e:v=>{const f=10**v,E=1/f,n=f*5e-3,H=e=>20+(Math.log10(e)+6)/6*130,y0=210;let s=`<line x1="30" x2="300" y1="${y0}" y2="${y0}" class="ax"/>`+T(30,226,'0','sub','middle')+T(300,226,'5 ms','sub','middle');
  if(n<=60){const N=Math.max(1,Math.floor(n));if(n>=1)for(let i=0;i<N;i++){const x=30+(i+.5)/n*270;s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0-H(E)}" style="stroke:var(--s1)" stroke-width="2"/>`}else s+=T(165,y0-40,TR('이 5 ms 안에는 펄스가 없을 수도 있다','This 5 ms window may contain no pulse'),'sub','middle')}
  else s+=`<rect x="30" y="${y0-H(E)}" width="270" height="${H(E)}" style="fill:var(--s1)" fill-opacity=".35"/>`+T(165,y0-H(E)-8,TR('촘촘해서 띠로 보임','So dense it looks like a band'),'sub','middle');
  return s+T(20,30,TR('5 ms 안 펄스 수 ≈ ','Pulses in 5 ms ≈ ')+(n<1?n.toPrecision(2):Math.round(n).toLocaleString('en-US'))+TR('개',''),'lab')+T(20,48,TR('펄스 하나 = 1 W / 반복률 = ','One pulse = 1 W / rep. rate = ')+(E>=.9995?E.toPrecision(3)+' J':eqFE(E)),'lab')+T(20,262,TR('막대 높이 = 펄스 에너지 (log 눈금, 보기용)','Bar height = pulse energy (log scale, for display)'),'sub')},
 m:v=>{const f=10**v,P=plot({x:[1,1e6],y:[1e-6,1],logx:1,logy:1,xt:[{v:1,l:'1 Hz'},{v:1e3,l:'1 kHz'},{v:1e6,l:'1 MHz'}],yt:[{v:1e-6,l:'1 µJ'},{v:1e-3,l:'1 mJ'},{v:1,l:'1 J'}],xl:TR('반복률','repetition rate'),yl:TR('펄스 에너지','pulse energy'),L:62,T:30});
  return P.s+`<g data-n="2"><rect x="${P.L}" y="${P.T}" width="${P.X(3e3)-P.L}" height="${P.B-P.T}" style="fill:var(--s4)" fill-opacity=".1"/>${badge(P.X(3),P.Y(1e-5),2,'var(--s4)')}</g>`+T(P.X(3)+14,P.Y(1e-5)+4,TR('에너지미터가 한 발씩 읽는 쪽','Energy meter: single shots'),'sub')
   +`<g data-n="1">${crv(P,x=>1/x,1,1e6,'var(--fg)')}${badge(P.X(30)+12,P.Y(1/30)-14,1,'var(--fg)')}</g>`+T(P.X(30)+26,P.Y(1/30)-10,TR('1 W 선','1 W line'),'sub')+`<circle cx="${P.X(f)}" cy="${P.Y(1/f)}" r="6" style="fill:var(--s1)"/>`+T(P.R,P.T-12,TR('색 영역 경계 3 kHz는 예시 (확인 필요)','Shaded edge at 3 kHz: example (to be verified)'),'sub','end')},
 read:[`${c(1,'f')} `+TR('파워미터는 열을 재는 센서가 많아 반응이 느리다. 그래서 평균 출력(W)을 읽는다. 반복률과 상관없이 쓸 수 있다.','Power meters often use thermal sensors and respond slowly, so they read the average power (W). They work at any repetition rate.'),`${c(2,'s4')} `+TR('에너지미터(초전 센서 등)는 펄스 하나의 에너지(J)를 한 발씩 읽는다. 대신 읽을 수 있는 반복률에 한계가 있다(모델마다 다름, 확인 필요).','Energy meters (pyroelectric sensors, etc.) read the energy of each single pulse (J). In exchange, the repetition rate they can follow is limited (model-dependent, to be verified).'),TR('세어 보기: 평균 1 W, 1 kHz면 펄스 하나 = 1 W / 1000 Hz = 1 mJ다. 같은 1 W라도 100 kHz면 10 µJ로 100배 작다.','Counting it out: at 1 W average and 1 kHz, one pulse = 1 W / 1000 Hz = 1 mJ. The same 1 W at 100 kHz gives 10 µJ, 100× smaller.'),TR('봉우리 출력은 훨씬 크다. 1 mJ 펄스가 100 fs 동안 몰려 나오면 1 mJ / 100 fs = 10 GW다(가정한 펄스 폭). 그래서 같은 평균 출력에서도 펄스 레이저는 광학 부품을 쉽게 상하게 한다.','The peak power is far higher. A 1 mJ pulse delivered within 100 fs gives 1 mJ / 100 fs = 10 GW (assumed pulse width). That is why, at the same average power, pulsed lasers damage optics easily.'),TR('작은 출력을 잴 때는 배경(빛을 막고 읽은 값)을 꼭 뺀다. 배경도 시간에 따라 흔들린다.','When measuring small powers, the background (the reading with the beam blocked) must be subtracted. The background also drifts over time.')],
 case:TR('<b>사례: 배경이 신호보다 크다.</b> 우리 셋업에서 핀홀을 통과한 pump를 잴 때, 파워미터 배경이 약 275 µW로 통과한 신호(약 120 µW)의 2배가 넘었다. 같은 날 배경 자체가 17 µW 변하기도 했다(논문 3.7). 작은 변화를 따질 때는 배경을 측정 직전·직후에 다시 잰다.','<b>Case: background larger than the signal.</b> When the pump transmitted through a pinhole was measured in our setup, the power meter background was approx. 275 µW, more than twice the transmitted signal (approx. 120 µW). The background itself also changed by 17 µW within the same day (thesis 3.7). When small changes matter, the background is remeasured right before and right after the measurement.'),
 q:TR('1 kHz, 펄스 하나 2 mJ면 파워미터는 얼마를 읽나?','At 1 kHz and 2 mJ per pulse, what does the power meter read?'),a:'2 mJ × 1000 Hz = 2 W.'},
{t:TR('편광자 둘로 세기 줄이기: cos⁴θ','Attenuating with two polarizers: cos⁴θ'),ec:TR('편광자 두 개의 정면 모습 (빔 순서대로 옆에 늘어놓음)','Front view of the two polarizers (laid side by side in beam order)'),mc:TR('투과율 vs 첫 편광자 각도','Transmission vs first polarizer angle'),
 slider:{min:0,max:90,step:1,init:45,label:TR('첫 편광자 각도 θ','First polarizer angle θ'),fmt:v=>Math.round(v)+'°',play:1},
 e:v=>{const th=v*Math.PI/180,cy=130,Ar=(x,ang,len)=>{const dx=Math.sin(ang)*len/2,dy=Math.cos(ang)*len/2;return len<4?`<circle cx="${x}" cy="${cy}" r="2.5" style="fill:var(--s1)"/>`:LN(x-dx,cy+dy,x+dx,cy-dy,'var(--s1)',{w:2.5,mk:'s1'})+LN(x+dx,cy-dy,x-dx,cy+dy,'var(--s1)',{w:2.5,mk:'s1'})};
  const pol=(x,ang,n,lab)=>{let s=`<g data-n="${n}"><circle cx="${x}" cy="${cy}" r="36" style="fill:var(--soft);stroke:var(--fg)"/>`;for(let j=-4;j<=4;j++){const ox=Math.cos(ang)*j*7,oy=-Math.sin(ang)*j*7,Lw=Math.sqrt(Math.max(0,1225-(j*7)**2));s+=`<line x1="${x+ox+Math.sin(ang)*Lw}" y1="${cy+oy+Math.cos(ang)*Lw}" x2="${x+ox-Math.sin(ang)*Lw}" y2="${cy+oy-Math.cos(ang)*Lw}" style="stroke:var(--muted)" stroke-width=".8"/>`}return s+badge(x,cy-50,n,'var(--fg)')+'</g>'+T(x,cy+56,lab,'sub','middle')};

   +T(40,214,'E₀','sub','middle')+T(170,214,'E₀ cos θ','sub','middle')+T(292,214,'E₀ cos²θ','sub','middle')+T(20,30,TR('점선 = 빔. 왼쪽에서 오른쪽으로 간다','Dotted line = beam, travelling left to right'),'sub')+T(20,236,TR('원 = 빔 축을 따라 본 편광자 정면 (옆으로 늘어놓음)','Circles = polarizers viewed along the beam axis'),'sub')+T(20,252,TR('회색 줄 = 금속 줄. 투과 축은 줄에 수직이다','Gray lines = wire grid; pass axis ⊥ wires'),'sub')+T(20,268,TR('빨간 화살표 = 같은 방향에서 본 전기장 방향과 크기','Red arrows = E-field direction and size, same view'),'sub')},
 m:v=>{const P=plot({x:[0,90],y:[0,1.05],xt:[0,15,30,45,60,75,90].map(x=>({v:x,l:x+'°'})),yt:[{v:0,l:'0'},{v:.25,l:'25%'},{v:.5,l:'50%'},{v:1,l:'100%'}],xl:TR('첫 편광자 각도 θ','first polarizer angle θ'),yl:TR('투과율 I / I₀','transmission I / I₀'),T:30});

   +`<line x1="${P.X(58)}" x2="${P.X(66)}" y1="${P.Y(.92)}" y2="${P.Y(.92)}" style="stroke:var(--s2)" stroke-width="2"/>`+T(P.X(67),P.Y(.92)+4,TR('둘: cos⁴θ','two: cos⁴θ'),'sub')+`<line x1="${P.X(58)}" x2="${P.X(66)}" y1="${P.Y(.8)}" y2="${P.Y(.8)}" style="stroke:var(--s6)" stroke-width="2" stroke-dasharray="5 4"/>`+T(P.X(67),P.Y(.8)+4,TR('하나: cos²θ','one: cos²θ'),'sub')},
 read:[TR('편광자 하나를 θ만큼 돌리면 투과 세기가 cos²θ가 된다(Malus 법칙). 전기장은 cos θ, 세기는 그 제곱이다.','Rotating a single polarizer by θ makes the transmitted intensity cos²θ (Malus\'s law). The field scales as cos θ, the intensity as its square.'),TR(`${c(1,'f')} 첫 편광자 P1을 θ로 돌리고 ${c(2,'f')} 둘째 편광자 P2를 원래 편광(세로)으로 고정하면 cos²θ를 두 번 거쳐 cos⁴θ가 된다. 45°면 25%, 60°면 6.25%다.`,`With the ${c(1,'f')} first polarizer P1 rotated to θ and the ${c(2,'f')} second polarizer P2 fixed at the original polarization (vertical), cos²θ applies twice, giving cos⁴θ. 45° gives 25%, 60° gives 6.25%.`),TR('장점: 나가는 편광이 P2 때문에 항상 세로로 고정된다. pump 세기를 바꿔도 시료에서 편광(예: magic angle 조건)이 바뀌지 않는다.','Advantage: P2 always fixes the output polarization to vertical. Changing the pump intensity does not change the polarization at the sample (e.g., the magic-angle condition).'),TR('반파장판 + 편광자도 같은 일을 하지만, 반파장판은 설계 파장 근처에서만 제대로 돈다. 파장을 넓게 바꾸는 중적외선에서는 편광자 두 개가 낫다(논문 A.3.7).','A half-wave plate + polarizer does the same job, but a half-wave plate rotates the polarization correctly only near its design wavelength. In the mid-IR, where the wavelength is tuned over a wide range, two polarizers work better (thesis A.3.7).'),TR('대가: 편광자마다 θ = 0에서도 손실이 있어 최대 투과가 줄고, 아무리 돌려도 소광비만큼은 새어 나온다. 우리 편광자의 기판 재질과 소광비는 확인 필요(논문 TODO).','Cost: each polarizer has some loss even at θ = 0, which lowers the maximum transmission, and some light always leaks through, set by the extinction ratio. The substrate material and extinction ratio of our polarizers are to be verified (thesis TODO).')],
 q:TR('pump를 원래의 약 1/10로 줄이려면 θ는 대략?','Roughly what θ reduces the pump to approx. 1/10 of the original?'),a:TR('cos⁴θ = 0.1 → cos θ ≈ 0.56 → θ ≈ 56°. 실제 다이얼 눈금은 최대 투과 위치만큼 어긋나 있으니 측정으로 확인한다.','cos⁴θ = 0.1 → cos θ ≈ 0.56 → θ ≈ 56°. The actual dial reading is offset by the position of maximum transmission, so the value is confirmed by measurement.')},
{t:TR('지연 스테이지: 거리가 시간이 된다','Delay stage: distance becomes time'),ec:TR('역반사경을 얹은 스테이지 (위에서 본 모습, 레일은 아래에 따로 그림)','Stage carrying a retroreflector (top view; rail drawn separately below)'),mc:TR('스테이지 이동 거리 → 시간 지연','Stage travel → time delay'),

  s+=LN(20,130,x+8,130,'var(--s1)',{w:2,mk:'s1'})+LN(x+10,131,x+10,169,'var(--s1)',{w:2})+LN(x+8,170,20,170,'var(--s1)',{w:2,mk:'s1'})+T(20,120,TR('들어오는 빔','Incoming beam'),'sub')+T(20,188,TR('되돌아가는 빔','Returning beam'),'sub');

 m:v=>{const ps=L=>2*L*1e-3/2.998e8*1e12;const P=plot({x:[0,90],y:[0,620],xt:[0,30,60,90].map(x=>({v:x,l:x+' mm'})),yt:[200,400,600].map(y=>({v:y,l:y+' ps'})),xl:TR('스테이지 이동 L','stage travel L'),yl:TR('시간 지연','time delay'),L:64,T:30});
  return P.s+crv(P,ps,0,90,'var(--s1)')+`<circle cx="${P.X(v)}" cy="${P.Y(ps(v))}" r="6" style="fill:var(--s1)"/>`+T(P.X(v)-10,P.Y(ps(v))-8,ps(v).toFixed(0)+' ps','labn','end')+T(P.R,P.B-10,TR('90 mm 이동 = 빛 길이 180 mm = 약 600 ps','90 mm → 180 mm path ≈ 600 ps'),'sub','end')},
 read:[TR('pump와 probe 사이 시간 차이는 빛이 가는 길이로 만든다. 빛은 1 ps에 약 0.3 mm 간다.','The time difference between pump and probe is made from the distance the light travels. Light covers approx. 0.3 mm in 1 ps.'),TR('역반사경은 빔을 들어온 방향 그대로 되돌린다. 스테이지가 L만큼 움직이면 빛 길이는 2L 늘어난다. 그래서 1 µm 이동이 약 6.67 fs다.','A retroreflector sends the beam back in the direction it came from. When the stage moves by L, the optical path grows by 2L. So a 1 µm move corresponds to approx. 6.67 fs.'),TR('우리 pump 스테이지는 −50 ps부터 +550 ps까지 600 ps를 훑는다. 이건 스테이지 90 mm, 빛 길이 180 mm다(논문 3.7).','Our pump stage scans 600 ps, from −50 ps to +550 ps. That is 90 mm of stage travel and 180 mm of optical path (thesis 3.7).'),TR('스테이지 정밀도가 곧 시간 정밀도다. 0.1 µm 단위로 움직이면 약 0.67 fs 단위다.','Stage precision is time precision. Steps of 0.1 µm correspond to steps of approx. 0.67 fs.'),TR('길게 움직일수록 빔이 조금씩 옆으로 흐를 수 있다(다음 단계). <a href="pumpprobe.html">IR pump-probe 노트</a>에서 이 지연을 어떻게 쓰는지 이어 본다.','Over long travel the beam can slowly drift sideways (next step). The <a href="pumpprobe.html">IR pump-probe note</a> continues with how this delay is used.')],
 q:TR('스테이지를 0.3 mm 움직이면 시간 지연은?','What time delay does a 0.3 mm stage move give?'),a:TR('빛 길이 0.6 mm → 약 2 ps.','0.6 mm of optical path → approx. 2 ps.')},
{t:TR('빔 흐름(beam walk): 지연이 길어지면 겹침이 줄 수 있다','Beam walk: overlap can drop at long delays'),ec:TR('시료 위치에서 본 두 빔 (어긋남 3배 과장)','The two beams at the sample position (offset exaggerated 3×)'),mc:TR('겹침 신호 vs 지연 (가정한 흐름)','Overlap signal vs delay (assumed drift)'),
 slider:{min:-50,max:550,step:5,init:250,label:TR('지연','Delay'),fmt:v=>Math.round(v)+' ps',play:1},
 e:v=>{const d=40*(v+50)/600,sc=.32,cx=150,cy=140,ov=eqOv(d,167.6,132);
  return `<circle cx="${cx}" cy="${cy}" r="${132*sc}" style="fill:var(--s3)" fill-opacity=".25" stroke="var(--s3)"/>`+`<circle cx="${cx+3*d*sc}" cy="${cy}" r="${167.6*sc}" style="fill:none;stroke:var(--s5)" stroke-width="2" stroke-dasharray="5 3"/>`
   +`<circle cx="${cx}" cy="${cy}" r="2.5" style="fill:var(--s3)"/>`+`<circle cx="${cx+3*d*sc}" cy="${cy}" r="2.5" style="fill:var(--s5)"/>`
   +T(20,30,TR(`중심 어긋남 d = ${d.toFixed(0)} µm`,`Center offset d = ${d.toFixed(0)} µm`),'lab')+T(20,48,TR(`겹침 = ${(ov*100).toFixed(1)}% (−50 ps 대비)`,`Overlap = ${(ov*100).toFixed(1)}% (relative to −50 ps)`),'lab')
   +`<circle cx="30" cy="236" r="6" style="fill:var(--s3)" fill-opacity=".25" stroke="var(--s3)"/>`+T(42,240,'probe (w ≈ 132 µm)','sub')+`<circle cx="180" cy="236" r="6" style="fill:none;stroke:var(--s5)" stroke-width="2" stroke-dasharray="3 2"/>`+T(192,240,'pump (w ≈ 168 µm)','sub')+T(20,264,TR('원 = 1/e² 반경. 흐름은 지연에 비례한다고 가정','Circles = 1/e² radius; drift assumed ∝ delay'),'sub')},
 m:v=>{const f=t=>eqOv(40*(t+50)/600,167.6,132);const P=plot({x:[-50,550],y:[.9,1.01],xt:[0,100,200,300,400,500].map(x=>({v:x,l:String(x)})),yt:[{v:.9,l:'90%'},{v:.95,l:'95%'},{v:1,l:'100%'}],xl:TR('지연 (ps)','delay (ps)'),yl:TR('신호 (상대)','signal (relative)'),L:62,T:30});
  return P.s+crv(P,f,-50,550,'var(--s5)')+`<circle cx="${P.X(v)}" cy="${P.Y(f(v))}" r="6" style="fill:var(--s5)"/>`+T(P.R,P.T-12,TR('진짜 감쇠가 없어도 신호가 줄어 보인다','The signal appears to drop with no real decay'),'sub','end')+T(P.X(-40),P.Y(.915),TR('끝(+550 ps)에서 약 6.8% 감소','approx. 6.8% lower at the end (+550 ps)'),'sub')},
 read:[TR('스테이지 축이 빔과 조금이라도 비뚤면, 스테이지가 움직일 때 빔이 옆으로 흐른다. 그러면 시료에서 pump와 probe의 겹침이 지연에 따라 바뀐다.','If the stage axis is even slightly misaligned with the beam, the beam drifts sideways as the stage moves. The pump–probe overlap at the sample then changes with delay.'),TR('겹침이 줄면 신호도 준다. 시료에는 아무 변화가 없어도 "느리게 사라지는 성분"처럼 보일 수 있다.','Less overlap means less signal. Even with no change in the sample, this can look like a "slowly decaying component."'),TR('우리 셋업 예: 600 ps 이동 동안 핀홀 통과 pump가 약 10% 줄었다. 가우시안 빔이 옮겨 갔다고 보면 약 40 µm 어긋남이다. 이 경우 겹침 신호는 끝에서 약 6.8% 준다(논문 3.7). 이 계산은 가정에 기댄 추정이고, 측정한 보정값은 아니다.','Example from our setup: over 600 ps of travel, the pump transmitted through the pinhole dropped by approx. 10%. Treated as a shifted Gaussian beam, this is an offset of approx. 40 µm. In that case the overlap signal drops by approx. 6.8% at the end (thesis 3.7). This calculation is an estimate resting on assumptions, not a measured correction.'),TR('같은 감소를 빔 크기 변화(약 5.7% 커짐)나 레이저·배경 흔들림으로도 설명할 수 있다. 위치와 크기를 따로 보려면 knife-edge로 중심을 직접 따라간다(다음 단계).','The same drop can also be explained by a change in beam size (approx. 5.7% larger) or by laser or background fluctuations. Separating position from size requires tracking the center directly with a knife-edge (next step).'),TR('정리: 10 ps 안쪽의 빠른 변화에는 영향이 거의 없다(이 가정에서 −10 → +10 ps 사이 약 0.04%, −50 → +50 ps 사이 약 0.2%). 수백 ps의 느린 성분을 해석할 때는 이 효과를 먼저 재거나 범위를 정해 둔다.','In summary: fast changes within 10 ps are hardly affected (under this assumption, approx. 0.04% between −10 and +10 ps, approx. 0.2% between −50 and +50 ps). Before slow components of hundreds of ps are interpreted, this effect is measured first or its range is bounded.')],
 q:TR('지연 스캔에서 느린 감쇠가 보인다. 빔 흐름 때문인지 가리려면?','A slow decay shows up in a delay scan. How can beam walk be identified as the cause or ruled out?'),a:TR('시료 위치에서 pump의 위치·크기·출력을 지연마다 잰다. 겹침 변화만으로 같은 감쇠가 나오면 빔 흐름이 원인일 수 있다.','The pump position, size and power at the sample position are measured at each delay. If the overlap change alone reproduces the same decay, beam walk may be the cause.')},
{t:TR('빔 크기 재기: 핀홀과 knife-edge','Measuring beam size: pinhole and knife-edge'),ec:TR('핀홀 통과 (반경 a = 50 µm)','Pinhole transmission (radius a = 50 µm)'),mc:TR('knife-edge: 칼날 위치에 따른 통과 출력','Knife-edge: transmitted power vs blade position'),

   +T(20,30,`T = 1 − exp(−2a²/w²) = ${T0.toFixed(3)}`,'lab')+T(20,250,TR('거꾸로 T를 재서 w를 구한다. T = 0.163 → w = 168 µm','Measured T gives w: T = 0.163 → w = 168 µm'),'sub')+T(20,266,TR('(우리 pump, 논문 3.3. 중심·원형·가우시안·초점 가정)','(our pump, thesis 3.3; four assumptions, see text)'),'sub')},
 m:v=>{const P=plot({x:[-400,400],y:[0,1.08],xt:[-400,-200,0,200,400].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:.1,l:'10%'},{v:.9,l:'90%'},{v:1,l:'100%'}],xl:TR('칼날 위치 x (µm)','blade position x (µm)'),yl:TR('통과 출력','transmitted power'),L:58,T:30});

 read:[`${c(1,'f')} `+TR('핀홀: 시료 위치에 작은 구멍(여기서 지름 100 µm)을 두고, 통과 출력 / 전체 출력 = T를 잰다. 가우시안이면 T = 1 − exp(−2a²/w²)라 T에서 w를 바로 구한다. 빠르다.','Pinhole: a small hole (here 100 µm in diameter) is placed at the sample position, and T = transmitted power / total power is measured. For a Gaussian beam, T = 1 − exp(−2a²/w²), so w follows directly from T. Fast.'),TR('대신 가정이 넷이다: 빔이 구멍 한가운데, 원형, 가우시안, 초점이 구멍 평면. 중심이 어긋나거나 타원·비가우시안이면 T가 작아져 w를 크게 잡는다.','But it rests on four assumptions: the beam is centered on the hole, round, Gaussian, and focused at the hole plane. If it is off-center, elliptical or non-Gaussian, T comes out smaller and w is overestimated.'),`${c(2,'s2')} `+TR('knife-edge: 칼날을 빔을 가로질러 옮기며 통과 출력을 잰다. 가우시안이면 오차 함수 모양이고, 90%와 10% 위치 사이가 1.28 w다. 슬라이더로 w를 바꾸면 곡선이 가팔라지거나 완만해진다.','Knife-edge: a blade is moved across the beam while the transmitted power is measured. For a Gaussian beam the curve is an error function, and the distance between the 90% and 10% points is 1.28 w. Changing w with the slider makes the curve steeper or gentler.'),TR('knife-edge는 시간이 더 들지만 빔 중심 위치도 함께 나와, 빔 흐름(앞 단계)처럼 위치와 크기를 나눠 봐야 할 때 쓴다.','A knife-edge scan takes longer but also gives the beam center position, so it is used when position and size must be separated, as with beam walk (previous step).'),TR('빔 크기는 보통 1/e² 세기 반경 w로 적는다. 반치폭(FWHM)은 약 1.18 w다. 어느 정의인지 꼭 같이 적는다.','Beam size is usually given as the 1/e² intensity radius w. The full width at half maximum (FWHM) is approx. 1.18 w. The definition used is always stated alongside the value.')],

 read:[TR('공기 중 수증기는 중적외선에 가는 흡수선이 빽빽하다(대략 1400–1900 cm⁻¹ 굽힘, 3500–3900 cm⁻¹ 신축). CO₂는 약 2350 cm⁻¹에 센 띠가 있다.','Water vapor in air has dense, narrow absorption lines in the mid-IR (approx. 1400–1900 cm⁻¹ bending, 3500–3900 cm⁻¹ stretching). CO₂ has a strong band near 2350 cm⁻¹.'),TR('이 선들이 빔 경로에 있으면 스펙트럼에 겹쳐 나온다. 습도가 바뀌면 같이 바뀌어 pump-probe 신호나 FTIR 배경 나눗셈을 흔든다.','When these lines lie in the beam path, they show up on top of the spectrum. They change with humidity and disturb the pump-probe signal and the FTIR background division.'),TR('빔 경로를 상자로 덮고 건조 공기나 질소(N₂)를 흘려 공기를 밀어낸다. 재생을 누르면 시간이 지나며 흡수선이 얕아진다(속도는 예시).','The beam path is enclosed in a box and flushed with dry air or nitrogen (N₂) to push the air out. With Play, the absorption lines become shallower over time (the rate is an example).'),TR('건조 공기 장치가 CO₂까지 빼는지는 장치마다 다르다(확인 필요). N₂는 둘 다 뺀다.','Whether a dry-air unit also removes CO₂ depends on the unit (to be verified). N₂ removes both.'),TR('퍼지는 상자를 열면 바로 깨진다. 정렬 뒤 다시 충분히 기다리고 측정한다. FTIR 배경 문제는 <a href="lab-techniques.html">측정 기법 노트</a> FTIR 탭과 같은 이야기다.','Opening the box breaks the purge at once. After alignment, the measurement waits again until the purge has settled. The FTIR background problem is the same story as in the FTIR tab of the <a href="lab-techniques.html">lab techniques note</a>.')],

 m:v=>{const o=L=>20.9*(1-Math.min(1,.7*L/22.5));const P=plot({x:[0,20],y:[5,22],xt:[0,5,10,15,20].map(x=>({v:x,l:x+' L'})),yt:[{v:10,l:'10%'},{v:15,l:'15%'},{v:20.9,l:'21%'}],xl:TR('쏟은 LN₂','LN₂ spilled'),yl:TR('산소 농도','oxygen concentration'),L:58,T:30});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(19.5)}" y2="${P.Y(19.5)}" class="lvl2" style="stroke:var(--s1)"/>`+T(P.R,P.T-12,TR('빨간 점선 19.5% = 흔히 쓰는 산소 결핍 기준 (확인 필요)','Red 19.5%: common low-O₂ limit (to be verified)'),'sub','end')

 read:[TR('LN₂는 끓는점 77 K(−196 °C)의 액체다. 독성은 없지만 1 L가 기체 약 700 L가 된다(논문 A.4.3).','LN₂ is a liquid that boils at 77 K (−196 °C). It is not toxic, but 1 L becomes approx. 700 L of gas (thesis A.4.3).'),TR('세어 보기: 3 × 3 × 2.5 m 방은 22 500 L다. 10 L 듀어를 쏟으면 N₂ 7000 L가 생겨 방 공기의 약 3분의 1을 밀어낸다. 산소는 21%에서 약 14%로 떨어진다(고루 섞인다는 가정).','Counting it out: a 3 × 3 × 2.5 m room holds 22 500 L. Spilling a 10 L dewar produces 7000 L of N₂, displacing approx. one third of the room air. Oxygen falls from 21% to approx. 14% (assuming even mixing).'),TR('산소가 모자라도 숨이 차다는 느낌 없이 의식을 잃을 수 있다. 작은 방, 환기가 약한 곳에서는 산소 경보기와 환기를 확인한다(기준 농도와 우리 실험실 설비는 확인 필요).','Oxygen deficiency can cause loss of consciousness without any feeling of breathlessness. In small or poorly ventilated rooms, oxygen alarms and ventilation are checked (the threshold concentration and our lab facilities are to be verified).'),TR('액체에 닿으면 동상을 입는다. 듀어를 채울 때 저온 장갑과 보안경을 쓴다.','Contact with the liquid causes frostbite. Cryogenic gloves and safety glasses are worn when filling a dewar.'),TR('레이저 보안경은 OD(광학 밀도)로 고른다. OD 4 = 투과 10⁻⁴다. 1 W 빔이면 100 µW가 지나온다. OD는 파장마다 다르니 쓰는 파장(800 nm, 중적외선 등)에서의 OD를 확인한다(우리 보안경 규격은 확인 필요).','Laser safety eyewear is chosen by OD (optical density). OD 4 = transmission 10⁻⁴: with a 1 W beam, 100 µW gets through. OD depends on wavelength, so the OD at the wavelength in use (800 nm, mid-IR, etc.) is what matters (the rating of our eyewear is to be verified).')],
 q:TR('OD 3 보안경으로 평균 2 W 빔을 직접 맞으면 눈에 들어오는 출력은?','With OD 3 eyewear, how much power reaches the eye from a direct hit by a beam of 2 W average power?'),a:TR('2 W × 10⁻³ = 2 mW. 직접 보기에 안전한 수준이 아니다. 파장에 맞는 충분한 OD를 쓰고, 애초에 빔 높이에 눈을 두지 않는다.','2 W × 10⁻³ = 2 mW. This is not a safe level for direct viewing. Eyewear with enough OD at the wavelength is used, and the eyes are never brought to beam height in the first place.')}];

const TABS=[{id:'eq',name:TR('기초 장비','Basic equipment'),sub:TR('테이블·정렬·측정·안전','Table · alignment · measurement · safety'),desc:TR('광학 테이블, 두 거울 정렬, 파워미터와 에너지미터, 편광자 감쇠, 지연 스테이지와 빔 흐름, 빔 크기, 퍼지, LN₂·레이저 안전. 값은 대략이고, 우리 셋업 값은 논문에서 가져왔다.','Optical table, two-mirror alignment, power and energy meters, polarizer attenuation, delay stage and beam walk, beam size, purge, LN₂ and laser safety. Values are approximate; values for our setup come from the thesis.'),steps:EQ},{id:'ups',name:TR('UPS · 정전','UPS · outages'),sub:TR('전원이 끊길 때','When the power goes out'),desc:TR('UPS 종류, 용량 계산, 무엇을 물릴지, 정전·복전 때 순서, 정기 점검. 일반 원리만 다루며, 실제 순서는 장비 설명서와 연구실 규정을 따른다.','UPS types, sizing, what to connect, order of steps during an outage and when power returns, regular checks. General principles only; actual procedures follow the equipment manuals and lab rules.'),steps:UPS}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------

     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox

       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */

 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');

[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
