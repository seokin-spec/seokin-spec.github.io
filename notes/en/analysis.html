<!doctype html>
<html lang="en">
<meta charset="utf-8">

<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · data analysis</span><span class="status" title="Draft before expert review. Read values together with their approx./example/to-be-verified marks.">Under review</span><a class="lang" id="langbtn" data-base="../analysis.html" href="../analysis.html" title="한국어">한 · <b>EN</b></a></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>

    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="Left figure"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="Right figure"></svg></div>
  </div>

    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>Play</button>
    <span id="tgl"></span>

</div>

<script>
const LANG='en';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 데이터 분석 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 데이터 분석
// @status 검토 중
// @lang ko en
// @title.en Data Analysis Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · data analysis
// @status.en Under review
/* 데이터 분석 노트: 속도론과 전역 피팅, 2D-COS(시간별 FTIR 상관 지도). 시간 분해 신호(pump-probe 등)를 모델로 맞출 때 알아 둘 것.
   모든 수치는 예시 계(가상의 흡수체)다. 특정 시료의 결과가 아니다. 헬퍼는 an 접두사.
   글은 TR('한국어','English')로 쓴다 (영어판 notes/en/analysis.html). */
const NOTE={key:'analysis'};

/* ---------- 헬퍼 ---------- */
/* erfc 근사 (Abramowitz–Stegun 7.1.26, 오차 약 1e-7) */
function anErfc(x){const z=Math.abs(x),t=1/(1+.3275911*z),y=t*(.254829592+t*(-.284496736+t*(1.421413741+t*(-1.453152027+t*1.061405429))))*Math.exp(-z*z);return x>=0?y:2-y}
/* 가우시안 IRF(FWHM)와 t0 = 0의 계단·지수 감쇠(τ)의 합성곱 */
function anConv(t,tau,fw){const s=fw/2.3548;if(s<1e-6)return t<0?0:Math.exp(-t/tau);return .5*Math.exp(-t/tau+s*s/(2*tau*tau))*anErfc((s*s/tau-t)/(Math.SQRT2*s))}
/* A→B 순차 모델 (k = 1/τ), N_A(0) = 1, N_B(0) = 0 */
const anNA=(t,k1)=>Math.exp(-k1*t);
function anNB(t,k1,k2){if(Math.abs(k1-k2)<1e-9)return k1*t*Math.exp(-k1*t);return k1/(k2-k1)*(Math.exp(-k1*t)-Math.exp(-k2*t))}
const anNC=(t,k1,k2)=>1-anNA(t,k1)-anNB(t,k1,k2);
/* 교환한 해에서 B 계수: c_B' = (c_A (k2 − k1) + c_B k1) / k2 (부록 E 식 E.3을 이 표기로) */
const anCBx=(cA,cB,k1,k2)=>(cA*(k2-k1)+cB*k1)/k2;
const anG=(x,x0,w)=>Math.exp(-(((x-x0)/w)**2)/2);
/* 고정된 의사 난수 (-1..1): 그림이 매번 같게 */
const anRnd=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return 2*(x-Math.floor(x))-1};
/* Poisson P(n | 평균 m) */
const anPois=(n,m)=>{let p=Math.exp(-m);for(let i=1;i<=n;i++)p*=m/i;return p};
/* 막대 하나 (가운데 0에서 좌우로). ΔT/T 부호색: + 빨강, − 파랑 */
function anBar(x0,y,v,sc,lab,lx){const w=Math.abs(v)*sc,col=v>=0?'var(--s1)':'var(--s2)';
 return T(lx??x0-70,y+4,lab,'sub')+`<rect x="${v>=0?x0:x0-w}" y="${y-7}" width="${w}" height="14" rx="2" style="fill:${col}"/>`+T(v>=0?x0+w+5:x0+5,y+4,(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2),'sub','start')}
/* 8단계 데이터와 맞춤 (한 번만 계산) */
let anFitC=null;
function anFit(){if(anFitC)return anFitC;const ts=[],ys=[],sg=.015;
 for(let i=0;i<80;i++){const t=.1+i*.1;ts.push(t);ys.push(.6*Math.exp(-t/.4)+.4*Math.exp(-t/3)+sg*anRnd(i+7)*1.6)}
 const lin=(fs)=>{/* 진폭 최소제곱 (기저 1개 또는 2개) */const n=fs.length;if(n===1){let a=0,b=0;ts.forEach((t,i)=>{const f=fs[0](t);a+=f*ys[i];b+=f*f});return[a/b]}
  let s11=0,s12=0,s22=0,r1=0,r2=0;ts.forEach((t,i)=>{const f1=fs[0](t),f2=fs[1](t);s11+=f1*f1;s12+=f1*f2;s22+=f2*f2;r1+=f1*ys[i];r2+=f2*ys[i]});const d=s11*s22-s12*s12;return[(r1*s22-r2*s12)/d,(r2*s11-r1*s12)/d]};
 const chi=(m)=>ts.reduce((q,t,i)=>q+((ys[i]-m(t))/sg)**2,0);
 let b1={x:1e99};for(let tau=.3;tau<=6;tau+=.01){const f=t=>Math.exp(-t/tau),[a]=lin([f]),x=chi(t=>a*f(t));if(x<b1.x)b1={x,tau,a}}
 let b2={x:1e99};for(let t1=.1;t1<=1.5;t1+=.02)for(let t2=1;t2<=6;t2+=.05){const f1=t=>Math.exp(-t/t1),f2=t=>Math.exp(-t/t2),[a1,a2]=lin([f1,f2]),x=chi(t=>a1*f1(t)+a2*f2(t));if(x<b2.x)b2={x,t1,t2,a1,a2}}
 b1.m=t=>b1.a*Math.exp(-t/b1.tau);b2.m=t=>b2.a1*Math.exp(-t/b2.t1)+b2.a2*Math.exp(-t/b2.t2);b1.nu=b1.x/(80-2);b2.nu=b2.x/(80-4);
 return anFitC={ts,ys,sg,b1,b2}}
const anTx=()=>TR('시간 t (ps)','time t (ps)');

/* ======================= 속도론 · 전역 피팅 ======================= */
const KIN=[
{t:TR('단일 지수 감쇠: 수명 τ는 1/e로 줄어드는 시간','Single-exponential decay: the lifetime τ is the time to fall to 1/e'),ec:TR('들뜬 분자 100개 (τ = 1 ps, 예시)','100 excited molecules (τ = 1 ps, example)'),mc:TR('남은 들뜬 분자 수','Excited molecules remaining'),
 slider:{min:0,max:4,step:.02,init:0,label:TR('시간 t','Time t'),fmt:v=>v.toFixed(2)+' ps',play:1},
 e:v=>{const n=Math.round(100*Math.exp(-v));let s='';
  for(let i=0;i<100;i++){const x=40+(i%10)*24,y=56+Math.floor(i/10)*18;s+=i<n?`<circle cx="${x}" cy="${y}" r="6" style="fill:var(--s3)"/>`:`<circle cx="${x}" cy="${y}" r="6" style="fill:none;stroke:var(--s6)" stroke-width="1.2"/>`}
  return T(20,26,TR(`t = ${v.toFixed(2)} ps → 남은 들뜬 분자 ${n}개`,`t = ${v.toFixed(2)} ps → ${n} still excited`),'lab')+s+`<circle cx="44" cy="258" r="6" style="fill:var(--s3)"/>`+T(56,262,TR('아직 들뜬 상태','still excited'),'sub')+`<circle cx="166" cy="258" r="6" style="fill:none;stroke:var(--s6)" stroke-width="1.2"/>`+T(178,262,TR('바닥으로 돌아감','back to ground'),'sub')},
 m:v=>{const P=plot({x:[0,4],y:[0,110],xt:[0,1,2,3,4].map(x=>({v:x,l:String(x)})),yt:[0,37,100].map(y=>({v:y,l:String(y)})),xl:anTx(),yl:TR('들뜬 분자 수','excited molecules'),T:30});
  return P.s+`<line x1="${P.X(1)}" x2="${P.X(1)}" y1="${P.Y(37)}" y2="${P.B}" class="lvl2"/><line x1="${P.L}" x2="${P.X(1)}" y1="${P.Y(37)}" y2="${P.Y(37)}" class="lvl2"/>`+T(P.X(1)+6,P.Y(37)-8,TR('t = τ → 37개 (1/e)','t = τ → 37 left (1/e)'),'sub')
   +crv(P,t=>100*Math.exp(-t),0,4,'var(--fg)')+`<circle cx="${P.X(v)}" cy="${P.Y(100*Math.exp(-v))}" r="5" style="fill:var(--s3)"/>`+T(P.R,P.T-12,'N(t) = 100 · exp(−t / τ)','sub','end')},
 read:[TR('들뜬 분자 하나하나는 언제 돌아갈지 모른다. 하지만 1초(여기서는 1 ps)마다 돌아갈 확률이 일정하면, 모인 수는 지수 함수로 줄어든다: N(t) = N₀ exp(−t/τ).','When a single excited molecule returns is unpredictable. But if the chance of returning per unit time (here per 1 ps) is constant, the total count falls exponentially: N(t) = N₀ exp(−t/τ).'),TR('세어 보기 (τ = 1 ps): 100개 → 1 ps 뒤 37개 → 2 ps 뒤 14개 → 3 ps 뒤 5개. 1 τ마다 남은 것의 63%가 빠진다. 재생을 누르면 점이 줄어든다.','Counting (τ = 1 ps): 100 → 37 after 1 ps → 14 after 2 ps → 5 after 3 ps. Each τ removes 63% of what remains. With Play, the dots empty out.'),TR('τ는 "반으로 줄어드는 시간"이 아니다. 반감기는 τ × ln 2 ≈ 0.69 τ다.','τ is not the "time to halve". The half-life is τ × ln 2 ≈ 0.69 τ.'),TR('신호 계수가 시간에 따라 변하지 않으면, ΔT/T도 같은 모양으로 줄어든다. 세로축을 log로 그리면 직선이 된다. 직선이 아니면 지수가 하나가 아니라는 첫 신호다.','If the signal coefficient does not change with time, ΔT/T decays with the same shape. On a log vertical axis it is a straight line. A line that is not straight is the first sign of more than one exponential.')],
 q:TR('τ = 2 ps라면 4 ps 뒤 남은 비율은?','With τ = 2 ps, what fraction remains after 4 ps?'),a:TR('exp(−4/2) = exp(−2) ≈ 14%.','exp(−4/2) = exp(−2) ≈ 14%.')},
{t:TR('IRF: 측정 곡선은 모델과 장비 응답의 합성곱이다','IRF: the measured curve is the model convolved with the instrument response'),ec:TR('모델(점선)과 장비 응답 IRF','Model (dashed) and instrument response IRF'),mc:TR('측정되는 곡선 (τ = 1 ps, 예시)','Measured curve (τ = 1 ps, example)'),
 slider:{min:.05,max:.8,step:.01,init:.3,label:TR('IRF 폭 (FWHM)','IRF width (FWHM)'),fmt:v=>Math.round(v*1000)+' fs'},
 e:v=>{const P=plot({x:[-1,3],y:[0,1.15],xt:[-1,0,1,2,3].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:anTx(),yl:TR('세기 (상대)','intensity (rel.)'),T:30});
  return P.s+`<g data-n="1">${crv(P,t=>t<0?0:Math.exp(-t),-1,3,'var(--fg)',{dash:1,n:400})}${badge(P.X(.6),P.Y(.75),1,'var(--fg)')}</g>`
   +`<g data-n="2">${crv(P,t=>anG(t,0,v/2.3548),-1,3,'var(--s5)',{n:400})}${badge(P.X(-.45),P.Y(.8),2,'var(--s5)')}</g>`+T(P.R,P.T-12,TR('점선 = 모델, 보라 = IRF','dashed = model, purple = IRF'),'sub','end')},
 m:v=>{const P=plot({x:[-1,3],y:[0,1.15],xt:[-1,0,1,2,3].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:anTx(),yl:TR('세기 (상대)','intensity (rel.)'),T:30});
  let pk=-1,pv=0;for(let t=-1;t<=3;t+=.005){const y=anConv(t,1,v);if(y>pv){pv=y;pk=t}}
  return P.s+crv(P,t=>t<0?0:Math.exp(-t),-1,3,'var(--muted)',{dash:1,n:400,w:1.2})+crv(P,t=>anConv(t,1,v),-1,3,'var(--fg)',{n:400})
   +`<line x1="${P.X(0)}" x2="${P.X(0)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`+T(P.X(0)+4,P.Y(1.1)+4,'t₀','sub')
   +`<circle cx="${P.X(pk)}" cy="${P.Y(pv)}" r="4.5" style="fill:var(--fg)"/>`+T(P.X(pk)+10,P.Y(pv)-8,TR(`측정 피크: t = ${pk.toFixed(2)} ps, 높이 ${pv.toFixed(2)}`,`peak at ${pk.toFixed(2)} ps, height ${pv.toFixed(2)}`),'sub')+T(P.R,P.T-12,TR('실선 = ① ⊗ ② (합성곱), 점선 = ①','solid = ① ⊗ ② (convolution), dashed = ①'),'sub','end')},
 read:[TR(`${c(1,'f')} 모델은 t₀에서 갑자기 올라가 지수로 줄어든다. 하지만 ${c(2,'s5')} 펄스에 길이가 있어서, 장비는 이 모양을 그대로 보지 못한다.`,`${c(1,'f')} The model jumps up at t₀ and decays exponentially. But ${c(2,'s5')} the pulses have a finite length, so the instrument cannot see this shape as it is.`),TR('측정 곡선 = 모델과 IRF(장비 응답)의 합성곱(⊗)이다. 곱하기가 아니라, IRF를 시간축으로 밀면서 겹친 만큼 더한 것이다. IRF가 가우시안이면 지수 하나는 식 하나로 쓸 수 있다(erfc가 들어간 꼴).','Measured curve = convolution (⊗) of the model with the IRF (instrument response). It is not a product: the IRF slides along the time axis and the overlap is summed. For a Gaussian IRF, a single exponential has a closed form (one containing erfc).'),TR('IRF를 넓히면 피크가 낮아지고 늦어진다. 그래서 "피크 위치 = t₀"가 아니고, "반쯤 올라간 점 = t₀"도 IRF와 τ에 따라 어긋난다.','A wider IRF makes the peak lower and later. So "peak position = t₀" is wrong, and "half-rise point = t₀" also drifts with the IRF and τ.'),TR('τ가 IRF보다 아주 짧으면 측정 곡선은 거의 IRF 모양이 된다. 이때 τ는 데이터만으로 잘 정해지지 않는다.','When τ is much shorter than the IRF, the measured curve looks almost like the IRF. τ is then poorly determined by the data alone.'),TR('t₀ 근처의 결맞음 잡신호(coherent artifact) 구간은 보통 맞춤에서 뺀다. 이 잘라 내는 시간을 바꿔도 빠른 τ가 버티는지 따로 확인한다(맞춤 구간 민감도).','The coherent-artifact window near t₀ is usually excluded from the fit. Whether the fast τ survives a change of this cutoff is checked separately (fit-window sensitivity).')],
 q:TR('IRF FWHM 300 fs인 장비로 τ = 100 fs 과정을 재면?','What happens when a τ = 100 fs process is measured with an IRF FWHM of 300 fs?'),a:TR('측정 곡선이 거의 IRF 모양이라 τ의 불확도가 크다. IRF를 따로 재서 고정하고 합성곱 모델로 맞춘 뒤, "IRF 수준보다 짧다" 정도로만 보고하는 편이 안전하다.','The measured curve is nearly the IRF shape, so τ has a large uncertainty. The safe route is to measure the IRF separately, fix it, fit with the convolution model, and report only that τ is "shorter than the IRF".')},
{t:TR('A → B → C: 중간 상태는 올라갔다 내려간다','A → B → C: the intermediate rises and then falls'),ec:TR('순차 모델 (τ₁ = 1 ps 고정, 예시)','Sequential model (τ₁ = 1 ps fixed, example)'),mc:TR('인구 N(t)','Population N(t)'),
 slider:{min:.2,max:5,step:.05,init:2,label:TR('τ₂ (B의 수명)','τ₂ (lifetime of B)'),fmt:v=>v.toFixed(2)+' ps'},
 e:v=>{const sp=(x,l,k)=>`<rect x="${x}" y="96" width="56" height="40" rx="6" style="fill:${COL[k]}" fill-opacity=".18" stroke="${COL[k]}"/>`+T(x+28,121,l,'labn','middle',COL[k]);
  return sp(20,'A','s3')+sp(132,'B','s5')+sp(244,'C','s6')
   +`<g data-n="1">${LN(78,116,128,116,'var(--fg)',{w:2,mk:'f'})}${badge(103,92,1,'var(--fg)')}</g>`+T(103,156,'τ₁ = 1 ps','sub','middle')
   +`<g data-n="2">${LN(190,116,240,116,'var(--fg)',{w:2,mk:'f'})}${badge(215,92,2,'var(--fg)')}</g>`+T(215,156,`τ₂ = ${v.toFixed(2)} ps`,'sub','middle')
   +TM(20,196,['N_A = exp(−k₁t)','N_B = k₁/(k₂ − k₁) · [exp(−k₁t) − exp(−k₂t)]','N_C = 1 − N_A − N_B      (k = 1/τ)'],'sub')+T(20,40,TR('처음에는 모두 A에 있다고 가정한다 (N_A(0) = 1).','Assumed: all start in A (N_A(0) = 1).'),'sub')+(()=>{const k1=1,k2=1/v,tm=Math.abs(k1-k2)<1e-9?1/k1:Math.log(k1/k2)/(k1-k2);return T(20,64,TR(`B 최대 ${anNB(tm,k1,k2).toFixed(2)} (t = ${tm.toFixed(2)} ps, 오른쪽 보라 점)`,`B max ${anNB(tm,k1,k2).toFixed(2)} (t = ${tm.toFixed(2)} ps, purple dot at right)`),'sub','start','var(--s5)')})()},
 m:v=>{const k1=1,k2=1/v;const P=plot({x:[0,8],y:[0,1.1],xt:[0,2,4,6,8].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:.5,l:'0.5'},{v:1,l:'1'}],xl:anTx(),yl:TR('인구 (비율)','population (fraction)'),T:30});
  const tm=Math.abs(k1-k2)<1e-9?1/k1:Math.log(k1/k2)/(k1-k2),nb=anNB(tm,k1,k2);
  return P.s+crv(P,t=>anNA(t,k1),0,8,'var(--s3)')+crv(P,t=>anNB(t,k1,k2),0,8,'var(--s5)')+crv(P,t=>anNC(t,k1,k2),0,8,'var(--s6)',{dash:1})
   +`<circle cx="${P.X(tm)}" cy="${P.Y(nb)}" r="4.5" style="fill:var(--s5)"/>`
   +T(P.X(.35),P.Y(.95),'A','labn','start','var(--s3)')+T(P.X(7.6),P.Y(anNC(7.6,k1,k2))-8,'C','labn','end','var(--s6)')+T(P.R,P.T-12,TR('초록 A · 보라 B · 회색 점선 C','green A · purple B · grey dashed C'),'sub','end')},
 read:[TR(`A가 ${c(1,'f')} τ₁로 B가 되고, B가 ${c(2,'f')} τ₂로 C가 된다. 단계마다 1단계와 같은 지수 감쇠다.`,`A turns into B with ${c(1,'f')} τ₁, and B turns into C with ${c(2,'f')} τ₂. Each step is the same exponential decay as in step 1.`),TR('B는 A에서 들어오는 만큼 늘고, 자기 수명만큼 빠져나간다. 그래서 올라갔다 내려가는 모양이 된다.','B grows by what flows in from A and drains at the rate set by its own lifetime. That gives the rise-then-fall shape.'),TR('τ₂를 줄이면(B가 빨리 빠지면) B는 별로 쌓이지 않는다. τ₂를 늘리면 B가 많이 쌓이고 오래 남는다.','A shorter τ₂ (B drains quickly) leaves little B. A longer τ₂ lets B build up and stay longer.'),TR('모든 인구는 지수 함수 두 개(exp(−t/τ₁), exp(−t/τ₂))의 합으로 쓸 수 있다(N_C에는 상수 1이 더 붙는다). 단계가 더 많아도 같은 방식으로 이어진다.','Every population is a sum of two exponentials (exp(−t/τ₁), exp(−t/τ₂)); N_C has an extra constant 1. More steps chain in the same way.'),TR('τ₁ = τ₂면 위 식의 분모가 0이 된다. 그때는 N_B = k t exp(−kt)라는 다른 꼴을 쓴다.','When τ₁ = τ₂, the denominator above is 0. The form N_B = k t exp(−kt) is used instead.')],
 q:TR('τ₂가 τ₁보다 훨씬 짧으면 B는 어떻게 보이나?','What does B look like when τ₂ is much shorter than τ₁?'),a:TR('B가 거의 쌓이지 않는다. 들어오자마자 빠져나가므로, 겉보기에는 A가 바로 C로 가는 것처럼 보인다.','B hardly builds up. It leaves as soon as it arrives, so A appears to go straight to C.')},
{t:TR('신호 = 계수 × 인구의 합','Signal = sum of coefficient × population'),ec:TR('상태별 신호 계수 (ΔT/T, 예시)','Signal coefficient of each state (ΔT/T, example)'),mc:TR('측정 신호 ΔT/T (τ₁ = 1 ps, τ₂ = 3 ps)','Measured signal ΔT/T (τ₁ = 1 ps, τ₂ = 3 ps)'),
 slider:{min:-1,max:1,step:.05,init:-.5,label:TR('B의 계수 c_B','Coefficient of B, c_B'),fmt:v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)},
 e:v=>T(20,30,TR('한 파수에서 상태마다 신호에 주는 몫','Share of each state at one wavenumber'),'lab')+`<line x1="160" x2="160" y1="60" y2="170" class="lvl2"/>`+T(160,186,'0','sub','middle')
   +`<g data-n="1">${badge(20,90,1,COL.s3)}${anBar(160,90,1,90,'c_A',36)}</g><g data-n="2">${badge(20,140,2,COL.s5)}${anBar(160,140,v,90,'c_B',36)}</g>`
   +T(20,224,TR('빨강 = + (투과 증가: GSB, SE)','red = + (more transmission: GSB, SE)'),'sub','start','var(--s1)')+T(20,242,TR('파랑 = − (투과 감소: ESA)','blue = − (less transmission: ESA)'),'sub','start','var(--s2)')+T(20,264,TR('연구실 규약 ΔT/T. ΔA와는 부호가 반대다.','Lab convention ΔT/T: sign opposite to ΔA.'),'sub'),
 m:v=>{const k1=1,k2=1/3;const P=plot({x:[0,8],y:[-.7,1.1],xt:[0,2,4,6,8].map(x=>({v:x,l:String(x)})),yt:[{v:-.5,l:'−0.5'},{v:0,l:'0'},{v:.5,l:'0.5'},{v:1,l:'1'}],xl:anTx(),yl:TR('ΔT/T (상대)','ΔT/T (rel.)'),T:30});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(0)}" y2="${P.Y(0)}" class="lvl2"/>`
   +`<g data-n="1">${crv(P,t=>anNA(t,k1),0,8,'var(--s3)',{dash:1,w:1.4})}${badge(P.X(.3),P.Y(anNA(.3,k1))+(v>=0?18:-18),1,COL.s3)}</g><g data-n="2">${crv(P,t=>v*anNB(t,k1,k2),0,8,'var(--s5)',{dash:1,w:1.4})}${badge(P.X(5),P.Y(v*anNB(5,k1,k2))+(v<0?14:-14),2,COL.s5)}</g>`
   +crv(P,t=>anNA(t,k1)+v*anNB(t,k1,k2),0,8,'var(--fg)')+T(P.R,P.T-12,TR('실선 = 합, 점선 ① c_A N_A, ② c_B N_B','solid = sum, dashed ① c_A N_A, ② c_B N_B'),'sub','end')},
 read:[TR('측정 신호는 인구에 상태별 계수를 곱해 더한 것이다: ΔT/T(t) = c_A N_A(t) + c_B N_B(t) + …','The measured signal is each population times its state coefficient, summed: ΔT/T(t) = c_A N_A(t) + c_B N_B(t) + …'),TR(`${c(1,'s3')} c_A는 고정(+1)이고, ${c(2,'s5')} c_B를 슬라이더로 바꾼다. 계수의 부호는 그 상태가 투과를 늘리는지(+, 빨강) 줄이는지(−, 파랑)를 뜻한다. 오른쪽 점선의 초록·보라는 부호가 아니라 상태(A, B) 구분이다(3단계와 같은 색).`,`${c(1,'s3')} c_A is fixed (+1), and the slider sets ${c(2,'s5')} c_B. The sign of a coefficient says whether the state increases (+, red) or decreases (−, blue) the transmission. Green and purple in the dashed curves on the right mark the states (A, B), not the sign (same colours as step 3).`),TR('c_B가 음수면 신호가 0 아래로 내려갔다가 돌아온다. 같은 인구라도 계수에 따라 곡선 모양이 크게 바뀐다.','With negative c_B, the signal dips below 0 and comes back. The same populations give very different curve shapes depending on the coefficients.'),TR('계수는 파수마다 다르다. 그래서 같은 τ라도 파수마다 신호 모양이 다르다(6단계 전역 피팅의 출발점).','The coefficients differ between wavenumbers. So the same τ gives different signal shapes at different wavenumbers (the starting point of global fitting in step 6).'),TR('진폭(맞춤에서 나온 계수)은 "몇 %가 그 상태에 있나"와 같은 말이 아니다. 계수에는 그 상태의 흡수 세기가 곱해져 있다.','An amplitude (a fitted coefficient) is not the same as "what % is in that state". The coefficient includes the absorption strength of that state.')],
 q:TR('c_B = 0이면 신호는 어떤 모양인가?','What shape does the signal have when c_B = 0?'),a:TR('c_A N_A만 남아 τ₁ 하나짜리 지수 감쇠다. B가 존재해도 그 파수에서 신호를 내지 않으면 보이지 않는다.','Only c_A N_A remains: a single exponential decay with τ₁. Even if B exists, it is invisible when it gives no signal at that wavenumber.')},
{t:TR('교환 대칭: 맞춤이 좋아도 순서는 정해지지 않는다','Exchange symmetry: a good fit does not fix the order'),ec:TR('두 해: τ₁과 τ₂를 바꾸고 c_B만 다시 맞춤 (예시)','Two solutions: τ₁ and τ₂ swapped, only c_B refitted (example)'),mc:TR('두 해의 신호 (ΔT/T)','Signals of the two solutions (ΔT/T)'),
 tg:[{k:'pop',l:TR('B 인구도 보기','Show B population too'),on:false}],
 e:()=>{const cB2=anCBx(1,.6,2,1/3);

 read:[TR('3단계 모델에서 τ₁과 τ₂를 서로 바꾸고, B의 계수만 다시 맞추면 신호가 정확히 같아진다. 굵은 선과 점선이 완전히 겹친다.','Swapping τ₁ and τ₂ in the step-3 model and refitting only the coefficient of B gives exactly the same signal. The thick and dashed lines overlap completely.'),TR(`${c(1,'s3')} 해 ①: 빠르게(0.5 ps) B가 되고 B가 천천히(3 ps) 사라진다. c_B = +0.6.`,`${c(1,'s3')} Solution ①: B forms fast (0.5 ps) and decays slowly (3 ps). c_B = +0.6.`),TR(`${c(2,'s5')} 해 ②: 천천히(3 ps) B가 되고 B가 빠르게(0.5 ps) 사라진다. c_B' = −1.40 (부호까지 바뀐다).`,`${c(2,'s5')} Solution ②: B forms slowly (3 ps) and decays fast (0.5 ps). c_B' = −1.40 (even the sign changes).`),TR('체크박스로 B 인구를 켜면 두 해의 속은 완전히 다르다. 그래도 데이터는 둘을 가르지 못한다. 잡음이 0이어도 마찬가지다.','With the checkbox on, the B populations of the two solutions are completely different. The data still cannot tell them apart, even with zero noise.'),TR('성립 조건 세 가지: B가 처음에 비어 있다(N_B(0) = 0), c_B가 자유 맞춤 변수다, k₁ ≠ k₂. 하나라도 깨지면 대칭도 깨진다.','Three conditions: B starts empty (N_B(0) = 0), c_B is a free fit parameter, and k₁ ≠ k₂. Breaking any one breaks the symmetry.'),TR('그래서 "맞춤이 잘 된다"는 τ와 과정의 짝을 정해 주지 않는다. c_B의 부호나 크기에 대한 물리적 기대, 조건을 바꾼 실험의 경향처럼 맞춤 밖의 정보가 필요하다. 그 전에는 두 해를 같이 보고한다.','So "the fit is good" does not pair each τ with a process. Information from outside the fit is needed, such as physical expectations for the sign or size of c_B, or trends in experiments under changed conditions. Until then, both solutions are reported.')],
 q:TR('B가 t = 0에 이미 30% 차 있으면?','What if B is already 30% populated at t = 0?'),a:TR('교환 대칭이 깨진다. 바꾼 해가 같은 신호를 내지 못하므로, 데이터가 순서를 가릴 수 있다(조건 1).','The exchange symmetry breaks. The swapped solution cannot give the same signal, so the data can decide the order (condition 1).')},

 read:[TR('왼쪽 세 곡선은 모양이 다 다르지만, 같은 τ₁ = 0.5 ps와 τ₂ = 3 ps로 만든 것이다. 파수마다 달라지는 건 진폭뿐이다.','The three curves on the left all differ in shape, yet all are built from the same τ₁ = 0.5 ps and τ₂ = 3 ps. Only the amplitudes change with wavenumber.'),TR('그래서 파수를 따로따로 맞추지 않고 한꺼번에 맞춘다(전역 피팅). τ는 공유, 진폭은 파수마다 따로다. 잡음에 훨씬 강해진다.','So the wavenumbers are fitted all at once instead of one by one (global fitting). τ is shared; the amplitudes are separate for each wavenumber. The fit becomes much more robust against noise.'),TR(`오른쪽은 파수별 진폭을 이어 그린 "스펙트럼"이다. 세로 점선 ${c(1,'s4')} ${c(2,'s5')} ${c(3,'s3')}가 왼쪽 곡선의 파수다.`,`The right panel joins the amplitudes at each wavenumber into a "spectrum". The vertical dashed lines ${c(1,'s4')} ${c(2,'s5')} ${c(3,'s3')} mark the wavenumbers of the left curves.`),TR('DAS(감쇠 연관 스펙트럼): 지수 하나하나의 진폭. 부호가 섞일 수 있다. EAS(진화 연관 스펙트럼): 같은 τ를 짧은 것부터 순서대로 이은 A → B 모델의 계수. 체크박스로 바꿔 보면 모양이 다르다.','DAS (decay-associated spectra): the amplitude of each exponential; signs can be mixed. EAS (evolution-associated spectra): the coefficients of an A → B model that chains the same τ values from shortest to longest. Switching with the checkbox shows different shapes.'),TR('DAS, EAS, 그리고 실제 모델을 넣은 SAS(종 연관 스펙트럼)는 서로 일차 변환일 뿐이고 맞춤 결과는 같다. 물리적인 뜻은 모델이 맞을 때 SAS에만 있다.','DAS, EAS, and SAS (species-associated spectra, from the actual model) are only linear transforms of each other, and the fit is the same. Physical meaning lies only in the SAS, and only when the model is right.'),TR('파수를 더 늘려도 5단계의 교환 대칭은 없어지지 않는다. 파수마다 자유 계수가 하나씩 더 생기기 때문이다.','Adding more wavenumbers does not remove the exchange symmetry of step 5, because each wavenumber brings one more free coefficient.')],
 q:TR('DAS 하나가 한 파수에서 음수면 그 상태가 ESA라는 뜻인가?','If one DAS is negative at a wavenumber, does that mean the state is ESA?'),a:TR('아니다. DAS는 지수 성분의 진폭이라 순차 모델에서는 상태 계수들의 차이가 섞여 부호가 뒤집힐 수 있다. 상태의 부호를 말하려면 모델을 정한 뒤의 SAS를 봐야 한다.','No. A DAS is the amplitude of an exponential component; in a sequential model it mixes differences of state coefficients, so its sign can flip. The sign of a state comes from the SAS after a model is chosen.')},

 m:v=>{const m=10**v,P=plot({x:[.03,4],y:[1e-4,1],logx:1,logy:1,xt:[{v:.03,l:'0.03'},{v:.1,l:'0.1'},{v:.3,l:'0.3'},{v:1,l:'1'},{v:4,l:'4'}],yt:[{v:1e-4,l:'10⁻⁴'},{v:1e-2,l:'10⁻²'},{v:1,l:'1'}],xl:TR('⟨N⟩ (fluence에 비례)','⟨N⟩ (proportional to fluence)'),yl:TR('비율','fraction'),L:62,T:30});

 read:[TR('펄스 하나가 흡수체(분자, 입자) 하나에 평균 몇 개의 광자를 넣는지는 ⟨N⟩ = σJ다. J = 광자 fluence(광자 수/cm²), σ = 흡수체 하나의 흡수 단면적(cm²).','The mean number of photons one pulse puts into one absorber (molecule, particle) is ⟨N⟩ = σJ. J = photon fluence (photons/cm²), σ = absorption cross-section of one absorber (cm²).'),TR('σ를 몰 흡광계수 ε에서 구할 때는 ε가 "흡수체 1몰"당 값이어야 한다. 구성 원자 1몰당 값을 쓰면 크게 틀린다.','When σ is derived from the molar absorption coefficient ε, ε must be per mole of absorbers. A value per mole of constituent atoms gives a large error.'),TR('흡수가 서로 독립이면 n개를 흡수할 확률은 Poisson 분포다. 세어 보기 (⟨N⟩ = 0.1): 100개 중 0개 흡수 90, 1개 9, 2개 이상 약 0.5.','If absorption events are independent, the probability of absorbing n photons follows a Poisson distribution. Counting (⟨N⟩ = 0.1): out of 100, 90 absorb none, 9 absorb one, approx. 0.5 absorb two or more.'),TR(`fluence가 작을 때 ${c(1,'s3')} 1개 흡수는 fluence에 비례하고(기울기 1), ${c(2,'s5')} 2개 이상은 제곱에 비례한다(기울기 2).`,`At low fluence, ${c(1,'s3')} one-photon absorption scales with the fluence (slope 1), and ${c(2,'s5')} two or more scale with its square (slope 2).`),TR('그래서 신호가 fluence에 선형이면 "한 번 들뜬 것만 본다"의 필요조건은 맞다. 하지만 충분조건은 아니다. 여러 번 들뜬 몫이 작아서 안 보일 뿐일 수 있다.','So a signal linear in fluence meets the necessary condition for "only singly excited absorbers are seen". It is not sufficient: the multiply excited share may just be too small to see.'),TR('fluence를 바꾸면 처음 인구 비율만 바뀌고 속도 상수는 그대로여야 한다. 여러 fluence를 같은 τ로 함께 맞추는 것이 인구와 속도를 떼어 보는 방법이다. 출력계 값만으로는 ⟨N⟩이 정해지지 않는다(빔 면적과 σ가 필요하다).','Changing the fluence should change only the initial population ratios, not the rate constants. Fitting several fluences together with the same τ separates populations from rates. A power-meter reading alone does not fix ⟨N⟩ (the beam area and σ are needed).')],
 q:TR('⟨N⟩ = 0.1에서 fluence를 2배로 하면 1개 흡수와 2개 이상 흡수는 각각 몇 배가 되나?','At ⟨N⟩ = 0.1, by what factor do one-photon and two-or-more absorption change when the fluence doubles?'),a:TR('1개 흡수는 약 1.8배(9.0% → 16.4%), 2개 이상은 약 3.7배(0.47% → 1.75%). 낮은 fluence일수록 2배와 4배에 가까워진다.','One-photon absorption rises approx. 1.8× (9.0% → 16.4%), two or more approx. 3.7× (0.47% → 1.75%). At lower fluence the factors approach 2× and 4×.')},

 read:[TR('데이터는 지수 2개(0.4 ps, 3 ps)로 만든 예시에 잡음을 얹은 것이다. 지수 1개로 맞추면 곡선은 그럴듯해 보여도, 잔차에 시간 구조(맨 처음엔 위, 0.5–2 ps는 아래, 그 뒤는 다시 위)가 남는다.','The data are an example built from two exponentials (0.4 ps, 3 ps) plus noise. A one-exponential fit looks plausible, but the residuals keep a time structure (above at the very start, below at 0.5–2 ps, above again later).'),TR('χ²_ν = χ² / (점 수 − 변수 수). 1 근처면 잡음 수준으로 맞은 것이다. 훨씬 크면 모델이 모자라거나 잡음을 작게 잡은 것이다.','χ²_ν = χ² / (number of points − number of parameters). Near 1 means a fit at the noise level. Much larger means the model is missing something or the noise was underestimated.'),TR('변수를 늘리면 χ²는 항상 줄어든다. 그래서 잔차의 구조를 같이 보고, 변수 수에 벌점을 주는 AIC·BIC나 F-검정으로 모델을 비교한다.','Adding parameters always lowers χ². So the residual structure is checked as well, and models are compared with AIC·BIC (which penalize the parameter count) or an F-test.'),TR('한 변수를 고정하며 χ²가 얼마나 오르는지 본다(profile). Δχ² = 1이 대략 68% 구간이고, χ²가 평평하면 그 변수는 데이터로 정해지지 않는다.','Stepping one parameter at fixed values shows how much χ² rises (a profile). Δχ² = 1 is approx. a 68% interval; a flat χ² means the data do not determine that parameter.'),TR('모델 없이 하는 확인도 같이 한다: fluence별 곡선을 정규화해 겹쳐 보기, 맞춤 시작 시간을 바꿔 보기, 같은 측정을 반복해 흩어짐 보기. τ가 여러 값으로 퍼져 있으면(시료가 균일하지 않으면) 지수 몇 개로도 흉내 낼 수 있다는 점도 기억한다.','Model-free checks go alongside: normalized curves at different fluences overlaid, the fit start time varied, the same measurement repeated to see the scatter. A spread of τ values (an inhomogeneous sample) can also be mimicked by a few exponentials.')],
 q:TR('지수를 3개로 늘렸더니 χ²_ν가 1.02에서 0.98로 줄었다. 3개가 맞나?','Going to three exponentials lowered χ²_ν from 1.02 to 0.98. Are three right?'),a:TR('그것만으로는 알 수 없다. 변수를 늘리면 χ²는 원래 준다. 잔차 구조가 사라졌는지, AIC·BIC가 나아졌는지, 새 τ의 profile이 평평하지 않은지 확인한다.','That alone does not tell. χ² always drops with more parameters. The checks are whether the residual structure is gone, whether AIC·BIC improved, and whether the profile of the new τ is not flat.')},

 e:()=>{const it=TR(['데이터와 잡음 추정','IRF·t₀ 정하기, 앞 구간 자르기','모델 고르기 (가정 적기)','전역 피팅 (τ 공유)','잔차·χ²_ν·AIC/BIC','대안 해 확인 (교환 대칭)','맞춤 밖 정보로 배정'],['Data and noise estimate','Set IRF·t₀, cut the early window','Choose a model (write assumptions)','Global fit (shared τ)','Residuals·χ²_ν·AIC/BIC','Alternative solutions (exchange)','Assign with outside information']);

 m:()=>TM(14,30,TR(['• τ와 구간 (profile 또는 반복 측정)','• IRF 폭, t₀, 잘라 낸 구간','• 모델 구조와 가정','   (예: 중간 상태가 처음엔 비어 있다)','• 계수가 자유인지, 관계로 묶었는지','• 교환한 대안 해 (있으면 둘 다)','• fluence → ⟨N⟩ 계산 경로와 빔 면적','• χ²_ν, 잔차 그림','• 어떤 배정이 맞춤 밖 정보에 기대는지'],['• τ and intervals (profile or repeats)','• IRF width, t₀, excluded window','• model structure and assumptions','   (e.g., the intermediate starts empty)','• free or constrained coefficients','• swapped alternative (both, if any)','• fluence → ⟨N⟩ route and beam area','• χ²_ν, residual plot','• which assignments use outside info']),'sub','start',24),
 read:[TR(`${c(1,'f')} 잡음 크기를 먼저 정한다. χ²가 이 값에 기대기 때문이다(8단계).`,`${c(1,'f')} The noise level is set first, because χ² depends on it (step 8).`),TR(`${c(2,'f')} IRF와 t₀를 정하고, 결맞음 잡신호 구간을 어디서 자를지 정한다. 자르는 위치를 바꿔도 결과가 버티는지 본다(2단계).`,`${c(2,'f')} The IRF and t₀ are set, and the cutoff of the coherent-artifact window is chosen. The results should hold when the cutoff moves (step 2).`),TR(`${c(3,'f')} 모델을 고르고 가정(처음 인구, 계수 관계)을 적는다(3·4·7단계).`,`${c(3,'f')} A model is chosen and its assumptions (initial populations, coefficient relations) are written down (steps 3, 4, 7).`),TR(`${c(4,'f')} 모든 파수를 같은 τ로 함께 맞춘다(6단계).`,`${c(4,'f')} All wavenumbers are fitted together with the same τ (step 6).`),TR(`${c(5,'f')} 잔차 구조와 χ²_ν, AIC/BIC를 본다(8단계).`,`${c(5,'f')} Residual structure, χ²_ν, and AIC/BIC are checked (step 8).`),TR(`${c(6,'f')} 같은 신호를 내는 다른 해가 있는지 확인한다(5단계).`,`${c(6,'f')} Other solutions that give the same signal are looked for (step 5).`),TR(`${c(7,'f')} τ와 과정의 짝은 맞춤 밖 정보(부호에 대한 기대, 조건을 바꾼 실험)로 정한다. 정하지 못하면 그렇다고 쓴다.`,`${c(7,'f')} The pairing of τ with processes is set by information outside the fit (expected signs, experiments under changed conditions). If it cannot be set, the report says so.`)],
 q:TR('"전역 피팅으로 τ₁ = 0.5 ps는 B 생성이다"라고 쓰려면 무엇이 더 필요한가?','What more is needed to write "global fitting shows τ₁ = 0.5 ps is the formation of B"?'),a:TR('교환한 해(τ₁ = 3 ps가 B 생성)를 배제할 근거. 예를 들어 바꾼 해에서 c_B의 부호가 물리적으로 맞지 않는다는 독립 정보, 또는 B를 직접 보는 다른 파수·실험이 필요하다.','Grounds to rule out the swapped solution (τ₁ = 3 ps as the formation of B). For example, independent information that c_B in the swapped solution has a physically wrong sign, or another wavenumber or experiment that sees B directly.')}];

/* ======================= 2D-COS (시간별 FTIR 상관 지도) =======================
   예시 데이터: 반응 중 FTIR을 10 s 간격으로 121장(0–1200 s) 찍었다고 가정한 가상 스펙트럼.
   Φ = ỹᵀỹ/(m−1), Ψ = ỹᵀ(Nỹ)/(m−1), N_jk = 1/(π(k−j)) (대각선 0). Ψ[a][b] = Ψ(ν₁ = NU[a], ν₂ = NU[b]).
   부호 약속은 랩 측정 기법 노트 In situ FTIR 탭 7단계(fpCos)와 같다. 헬퍼는 cs 접두사. */
const CS_NU=Array.from({length:41},(_,i)=>1760-5*i);   /* 1760 → 1560 cm⁻¹, 5 cm⁻¹ 간격 */
const CS_T=Array.from({length:121},(_,i)=>i*10);        /* 0–1200 s */
const csSig=x=>1/(1+Math.exp(-x/60));
const csG=(x,x0,w)=>Math.exp(-(((x-x0)/w)**2)*2.77);
/* 띠 하나의 세기와 위치: {nu, nu1(이동 끝, 선택), w, a0, a1, t0} */
const csAmp=(b,t)=>b.a0+(b.a1-b.a0)*csSig(t-b.t0);
const csSpec=(bands,t,nu)=>bands.reduce((s,b)=>{const f=csSig(t-b.t0);return s+(b.a0+(b.a1-b.a0)*f)*csG(nu,b.nu+((b.nu1??b.nu)-b.nu)*f,b.w)},0);
function csCompute(bands){const Y=CS_T.map(t=>CS_NU.map(nu=>csSpec(bands,t,nu))),m=Y.length,n=CS_NU.length;
 const mean=Array(n).fill(0);Y.forEach(r=>r.forEach((v,i)=>mean[i]+=v/m));const D=Y.map(r=>r.map((v,i)=>v-mean[i]));
 const Z=D.map((_,j)=>{const z=Array(n).fill(0);for(let k=0;k<m;k++){if(k===j)continue;const h=1/(Math.PI*(k-j)),d=D[k];for(let i=0;i<n;i++)z[i]+=h*d[i]}return z});
 const phi=Array.from({length:n},()=>Array(n).fill(0)),psi=Array.from({length:n},()=>Array(n).fill(0));
 for(let j=0;j<m;j++){const d=D[j],z=Z[j];for(let a=0;a<n;a++){const da=d[a],pa=phi[a],qa=psi[a];for(let b=0;b<n;b++){pa[b]+=da*d[b];qa[b]+=da*z[b]}}}
 let mx=0;for(let a=0;a<n;a++)for(let b=0;b<n;b++){phi[a][b]/=m-1;psi[a][b]/=m-1;mx=Math.max(mx,Math.abs(phi[a][b]))}
 let mq=0;psi.forEach(r=>r.forEach(v=>mq=Math.max(mq,Math.abs(v))));
 return{bands,Y,mean,D,phi,psi,mx,mq}}
const csMemo={};
const csGet=(key,bands)=>csMemo[key]??(csMemo[key]=csCompute(bands));
/* 예시 데이터 세 가지 */
const csMain=(dl=200)=>csGet('m'+dl,[{nu:1715,w:22,a0:1,a1:.2,t0:350},{nu:1650,w:22,a0:.1,a1:.8,t0:350+dl},{nu:1600,w:16,a0:.5,a1:.5,t0:0}]);
const csOver=()=>csGet('o',[{nu:1690,w:28,a0:.9,a1:.3,t0:300},{nu:1668,w:28,a0:.8,a1:.2,t0:650}]);
const csShift=on=>on?csGet('s1',[{nu:1700,nu1:1680,w:20,a0:.9,a1:.9,t0:500}]):csGet('s0',[{nu:1690,w:20,a0:.9,a1:.3,t0:500}]);
const csIdx=nu=>Math.round((1760-nu)/5);
/* 2D 지도: 가로 ν₁(왼쪽이 높은 파수), 세로 ν₂(아래가 높은 파수). 대각선 = 왼쪽 아래 → 오른쪽 위 */
const CS_L=58,CS_B=256,CS_W=228,CS_CW=CS_W/41,CS_R=CS_L+CS_W;
const csX=nu=>CS_L+((1760-nu)/5+.5)*CS_CW,csY=nu=>CS_B-((1760-nu)/5+.5)*CS_CW;
function csMap(M,mx,o={}){let s=`<rect x="${CS_L}" y="${CS_B-CS_W}" width="${CS_W}" height="${CS_W}" style="fill:var(--panel);stroke:var(--line)"/>`;
 for(let a=0;a<41;a++)for(let b=0;b<41;b++){const v=M[a][b]/mx,av=Math.abs(v);if(av<.03)continue;
  s+=`<rect x="${(CS_L+a*CS_CW).toFixed(1)}" y="${(CS_B-(b+1)*CS_CW).toFixed(1)}" width="${(CS_CW+.4).toFixed(1)}" height="${(CS_CW+.4).toFixed(1)}" style="fill:${v>0?'var(--s1)':'var(--s2)'}" fill-opacity="${Math.min(1,Math.pow(av,.6)).toFixed(2)}"/>`}
 s+=`<line x1="${CS_L}" y1="${CS_B}" x2="${CS_R}" y2="${CS_B-CS_W}" class="lvl2"/>`;
 [1750,1700,1650,1600].forEach(v=>{s+=`<line x1="${csX(v)}" x2="${csX(v)}" y1="${CS_B}" y2="${CS_B+5}" class="ax"/>`+T(csX(v),CS_B+17,String(v),'sub','middle')+`<line x1="${CS_L-5}" x2="${CS_L}" y1="${csY(v)}" y2="${csY(v)}" class="ax"/>`+T(CS_L-8,csY(v)+4,String(v),'sub','end')});
 s+=T((CS_L+CS_R)/2,CS_B+36,'wavenumber ν₁ (cm⁻¹)','lab','middle')+`<text x="14" y="${CS_B-CS_W/2}" class="lab" text-anchor="middle" transform="rotate(-90 14 ${CS_B-CS_W/2})">ν₂ (cm⁻¹)</text>`;
 s+=`<rect x="${CS_R+8}" y="34" width="10" height="10" style="fill:var(--s1)"/>`+T(CS_R+22,43,'+','labn')+`<rect x="${CS_R+8}" y="52" width="10" height="10" style="fill:var(--s2)"/>`+T(CS_R+22,61,'−','labn');
 (o.bands||[]).forEach(([nu,n,k])=>{s+=`<g data-n="${n}">${badge(csX(nu),CS_B-CS_W-12,n,COL[k])}${badge(CS_R+14,csY(nu),n,COL[k])}</g>`});
 if(o.mark){const[x1,x2]=o.mark;s+=`<circle cx="${csX(x1)}" cy="${csY(x2)}" r="10" style="fill:none;stroke:var(--fg)" stroke-width="2"/>`}
 return s}
/* 1D 스펙트럼 축 (높은 파수가 왼쪽) */
const csSpecAx=(y,o={})=>plot({x:[1760,1560],y,xt:[1750,1700,1650,1600].map(v=>({v,l:String(v)})),xl:'wavenumber (cm⁻¹)',T:30,B:256,...o});
const csLine=(P,arr,col,o)=>PL(CS_NU.map((nu,i)=>[P.X(nu),P.Y(arr[i])]),col,o);
const csTimeAx=(y,o={})=>plot({x:[0,1200],y,xt:[0,300,600,900,1200].map(v=>({v,l:String(v)})),xl:TR('시간 (s)','time (s)'),T:30,B:256,...o});
const CS_K=['s4','s5','s6'];  /* ① C=O 1715, ② C=N 1650, ③ 용매 1600: 띠 구분용 색 (부호와 무관) */
const csNotes=TR('가로·세로 모두 같은 스펙트럼의 파수다. 2D 분광 노트의 pump ω₁ · probe ω₃ 축과는 뜻이 다르다.','Both axes are wavenumbers of the same spectrum. They mean something different from the pump ω₁ · probe ω₃ axes of the 2D spectroscopy note.');
const csAbs=()=>TR('흡광도 (예시)','absorbance (example)');
const csDyn=()=>TR('ỹ (예시)','ỹ (example)');

const CS=[
{t:TR('시간별 스펙트럼 묶음: 10초마다 한 장씩 쌓인다','A stack of time-resolved spectra: one every 10 s'),ec:TR('반응 중 FTIR (예시, 10 s 간격 121장)','FTIR during a reaction (example, 121 spectra at 10 s steps)'),mc:TR('띠별 세기 vs 시간 (예시)','Band intensity vs time (example)'),
 slider:{min:0,max:1200,step:10,init:0,label:TR('시간','Time'),fmt:v=>Math.round(v)+' s',play:1},
 e:v=>{const r=csMain(),P=csSpecAx([0,1.35],{yl:csAbs()});let s=P.s+T(P.R,P.Y(1.2),TR('회색 = 200 s마다, 검정 = 지금','grey = every 200 s, black = now'),'sub','end');
  for(let t=0;t<=1200;t+=200)s+=csLine(P,CS_NU.map(nu=>csSpec(r.bands,t,nu)),'var(--line)',{w:1.2});
  s+=csLine(P,CS_NU.map(nu=>csSpec(r.bands,v,nu)),'var(--fg)',{w:2});
  [[1715,1],[1650,2],[1600,3]].forEach(([nu,n],i)=>{s+=`<g data-n="${n}">${badge(P.X(nu),P.T-10,n,COL[CS_K[i]])}</g>`});
  return s},
 m:v=>{const r=csMain(),P=csTimeAx([0,1.1],{yl:TR('띠 세기 (예시)','band intensity (example)')});
  let s=P.s+r.bands.map((b,i)=>`<g data-n="${i+1}">${PL(CS_T.map(t=>[P.X(t),P.Y(csAmp(b,t))]),COL[CS_K[i]],{w:2,dash:i===2})}</g>`).join('');
  s+=`<line x1="${P.X(v)}" x2="${P.X(v)}" y1="${P.T}" y2="${P.B}" class="lvl2"/>`;
  return s+`<g data-n="1">${badge(P.X(60),P.Y(1)+16,1,COL.s4)}</g><g data-n="2">${badge(P.X(1140),P.Y(.8)-16,2,COL.s5)}</g><g data-n="3">${badge(P.X(1140),P.Y(.5)-16,3,COL.s6)}</g>`},
 read:[TR('반응을 FTIR로 따라가면 10초마다 스펙트럼이 한 장씩 쌓인다. 20분이면 121장이다(예시 데이터).','Following a reaction by FTIR stacks up one spectrum every 10 s. 20 min gives 121 spectra (example data).'),TR(`예시 반응은 In situ FTIR 탭과 같은 케톤 + 아민 → 이민이다. ${c(1,'s4')} 1715 cm⁻¹(C=O)는 줄고, ${c(2,'s5')} 1650 cm⁻¹(C=N)는 늘고, ${c(3,'s6')} 1600 cm⁻¹(용매)는 그대로다. 파수와 시점은 예시다.`,`The example reaction is the same ketone + amine → imine as in the In situ FTIR tab. ${c(1,'s4')} 1715 cm⁻¹ (C=O) falls, ${c(2,'s5')} 1650 cm⁻¹ (C=N) rises, and ${c(3,'s6')} 1600 cm⁻¹ (solvent) stays the same. The wavenumbers and timings are examples.`),TR('재생을 누르면 ①이 먼저 줄고, ②가 조금 늦게 는다.','With Play, ① falls first and ② rises a little later.'),TR('띠가 몇 개뿐이면 오른쪽처럼 띠마다 시간 곡선을 그리면 된다. 띠가 많고 서로 겹치면 어렵다. 2D-COS는 모든 파수 쌍을 한 번에 비교하는 지도다.','With only a few bands, a time curve per band as on the right is enough. With many overlapping bands this gets hard. 2D-COS is a map that compares all wavenumber pairs at once.')],
 q:TR('121장을 지도 한 장으로 줄이면 무엇을 잃나?','What is lost when 121 spectra are reduced to one map?'),a:TR('시간축 자체(몇 초에 변했는지)를 잃는다. 지도에는 "같이 변하나, 누가 먼저냐"만 남는다. 그래서 시간 곡선도 같이 본다.','The time axis itself (at what time things changed). The map keeps only "do they change together, and which changes first". So the time curves are viewed as well.')},
{t:TR('평균을 뺀다: 변한 부분만 남긴다(동적 스펙트럼)','Subtract the mean: only the change remains (dynamic spectrum)'),ec:TR('평균 스펙트럼과 지금 스펙트럼','Mean spectrum and current spectrum'),mc:TR('동적 스펙트럼 ỹ = y − ȳ','Dynamic spectrum ỹ = y − ȳ'),
 slider:{min:0,max:1200,step:10,init:100,label:TR('시간','Time'),fmt:v=>Math.round(v)+' s',play:1},
 e:v=>{const r=csMain(),P=csSpecAx([0,1.15],{yl:csAbs()});
  return P.s+csLine(P,r.mean,'var(--muted)',{w:2,dash:1})+csLine(P,CS_NU.map(nu=>csSpec(r.bands,v,nu)),'var(--fg)',{w:2})
   +`<line x1="${P.R-120}" x2="${P.R-98}" y1="${P.T-12}" y2="${P.T-12}" style="stroke:var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`+T(P.R-92,P.T-8,TR('평균 ȳ','mean ȳ'),'sub')+`<line x1="${P.R-50}" x2="${P.R-28}" y1="${P.T-12}" y2="${P.T-12}" style="stroke:var(--fg)" stroke-width="2"/>`+T(P.R-22,P.T-8,'y(t)','sub')},
 m:v=>{const r=csMain(),j=Math.round(v/10),d=r.D[j],P=csSpecAx([-.5,.75],{yl:csDyn(),yt:[{v:-.4,l:'−0.4'},{v:0,l:'0'},{v:.4,l:'+0.4'}]});
  let s=P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(0)}" y2="${P.Y(0)}" class="lvl2"/>`;const bw=(P.R-P.L)/41;
  CS_NU.forEach((nu,i)=>{const y=d[i];if(Math.abs(y)<.004)return;s+=`<rect x="${(P.X(nu)-bw/2).toFixed(1)}" y="${P.Y(Math.max(y,0)).toFixed(1)}" width="${(bw+.3).toFixed(1)}" height="${Math.abs(P.Y(y)-P.Y(0)).toFixed(1)}" style="fill:${y>0?'var(--s1)':'var(--s2)'}" fill-opacity=".8"/>`});
  return s+`<g data-n="1">${badge(P.X(1715),P.Y(.68),1,COL.s4)}</g><g data-n="2">${badge(P.X(1650),P.Y(.68),2,COL.s5)}</g><g data-n="3">${badge(P.X(1600),P.Y(.68),3,COL.s6)}</g>`+T(P.R,P.T-12,TR('빨강 = 평균보다 큼(+), 파랑 = 작음(−)','red = above mean (+), blue = below (−)'),'sub','end')},
 read:[TR('파수마다 121장의 평균 ȳ를 구해 각 스펙트럼에서 뺀다. 남은 ỹ = y − ȳ가 동적 스펙트럼이다.','At each wavenumber, the mean ȳ of the 121 spectra is subtracted from every spectrum. What remains, ỹ = y − ȳ, is the dynamic spectrum.'),TR(`${c(3,'s6')} 용매 띠는 시간에 따라 변하지 않아서 평균을 빼면 0이 된다. 2D-COS는 변하는 것만 본다. 큰 용매 띠에 가려진 작은 변화도 그래서 드러난다.`,`${c(3,'s6')} The solvent band does not change with time, so subtracting the mean leaves 0. 2D-COS sees only what changes. That is also why small changes hidden under a large solvent band show up.`),TR(`초반에는 ${c(1,'s4')}이 평균보다 커(+) 빨강이고 ${c(2,'s5')}는 작아(−) 파랑이다. 후반에는 반대가 된다.`,`Early on, ${c(1,'s4')} is above the mean (+, red) and ${c(2,'s5')} is below (−, blue). Later it is the other way round.`),TR('평균 대신 첫 스펙트럼을 기준으로 빼기도 한다. 기준에 따라 지도가 조금 달라지니 무엇을 썼는지 적어 둔다.','Sometimes the first spectrum is subtracted instead of the mean. The map changes slightly with the reference, so the choice is recorded.')],
 q:TR('모든 스펙트럼에 같은 기준선 오프셋이 더해져 있으면?','What if the same baseline offset is added to every spectrum?'),a:TR('평균을 빼면 같이 사라진다. 하지만 기준선이 시간에 따라 흐르면 사라지지 않고 가짜 상관을 만든다(8단계).','It disappears with the mean. But a baseline that drifts with time does not disappear and creates false correlation (step 8).')},
{t:TR('동기 지도 Φ: 같이 변하는가','Synchronous map Φ: do they change together?'),ec:TR('두 띠의 동적 변화 ỹ (평균 뺀 값)','Dynamic change ỹ of two bands (mean subtracted)'),mc:TR('동기 지도 Φ(ν₁, ν₂) (예시)','Synchronous map Φ(ν₁, ν₂) (example)'),
 e:()=>{const r=csMain(),P=csTimeAx([-.5,.75],{yl:csDyn(),yt:[{v:-.4,l:'−0.4'},{v:0,l:'0'},{v:.4,l:'+0.4'}]});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(0)}" y2="${P.Y(0)}" class="lvl2"/>`+`<g data-n="1">${PL(CS_T.map((t,j)=>[P.X(t),P.Y(r.D[j][csIdx(1715)])]),COL.s4,{w:2})}${badge(P.X(60),P.Y(r.D[6][csIdx(1715)])+18,1,COL.s4)}</g>`
   +`<g data-n="2">${PL(CS_T.map((t,j)=>[P.X(t),P.Y(r.D[j][csIdx(1650)])]),COL.s5,{w:2})}${badge(P.X(60),P.Y(r.D[6][csIdx(1650)])-18,2,COL.s5)}</g>`+T(P.R,P.T-12,TR('① 은 + → −, ② 는 − → +','① goes + → −, ② goes − → +'),'sub','end')},
 m:()=>{const r=csMain();return csMap(r.phi,r.mx,{bands:[[1715,1,'s4'],[1650,2,'s5']]})+T(csX(1715),csY(1650)-22,TR('교차 피크 ①②','cross peak ①②'),'sub','middle')+T(csX(1712),csY(1716)+24,'autopeak','sub')},
 read:[TR('Φ(ν₁, ν₂) = (1/(m−1)) Σ ỹ(ν₁, t) · ỹ(ν₂, t). 두 파수의 변화를 시점마다 곱해 더한 값, 곧 공분산이다(m = 스펙트럼 수).','Φ(ν₁, ν₂) = (1/(m−1)) Σ ỹ(ν₁, t) · ỹ(ν₂, t). The changes at two wavenumbers are multiplied at each time and summed: a covariance (m = number of spectra).'),TR(`대각선(ν₁ = ν₂) 위의 봉우리는 autopeak다. 그 파수가 얼마나 크게 변했는지를 뜻하고 항상 +다. ${c(3,'s6')} 용매는 변하지 않아 autopeak이 없다.`,`Peaks on the diagonal (ν₁ = ν₂) are autopeaks. They show how much that wavenumber changed and are always +. ${c(3,'s6')} The solvent does not change, so it has no autopeak.`),TR(`대각선 밖은 교차 피크다. ${c(1,'s4')} 1715와 ${c(2,'s5')} 1650은 한쪽이 줄 때 다른 쪽이 늘어서 파랑(−)이다. 같이 늘거나 같이 줄면 빨강(+)이다.`,`Off the diagonal are cross peaks. ${c(1,'s4')} 1715 falls while ${c(2,'s5')} 1650 rises, so their cross peak is blue (−). Rising together or falling together gives red (+).`),TR('Φ는 대각선을 사이에 두고 대칭이다. 위쪽과 아래쪽 교차 피크가 같다.','Φ is symmetric about the diagonal. The cross peaks above and below it are the same.'),csNotes+TR(' 이름만 비슷한 다른 방법이다.',' Only the names are similar; the methods differ.')],
 q:TR('Φ 교차 피크가 빨강(+)이면?','What does a red (+) Φ cross peak mean?'),a:TR('두 파수가 같은 방향으로 변했다(같이 늘거나 같이 줄었다). 같은 물질의 두 띠일 가능성이 있다.','The two wavenumbers changed in the same direction (both rose or both fell). They may be two bands of the same species.')},
{t:TR('세어 보기: Φ는 두 띠 변화를 곱해 더한 것이다','Counting: Φ multiplies the two band changes and sums them'),ec:TR('시점 5개의 ỹ 값 (예시)','ỹ values at 5 times (example)'),mc:TR('시점별 곱과 합','Product at each time and the sum'),
 tg:[{k:'same',l:TR('② 도 같이 줄게 하기','Make ② fall too'),on:false}],
 e:(v,tg)=>{const a=[.4,.2,0,-.2,-.4],b=(tg.same?[.3,.15,0,-.15,-.3]:[-.3,-.15,0,.15,.3]),f=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(2);
  let s=T(48,44,TR('시점','time'),'lab','middle')+`<g data-n="1">${T(118,44,'① ỹ','lab','middle')}</g><g data-n="2">${T(188,44,'② ỹ','lab','middle')}</g>`+T(262,44,'① × ②','lab','middle')+`<line x1="20" x2="300" y1="54" y2="54" style="stroke:var(--line)"/>`;
  a.forEach((x,i)=>{const y=80+i*30,p=x*b[i];s+=T(48,y,'t'+(i+1),'sub','middle')+T(118,y,f(x),'sub','middle')+T(188,y,f(b[i]),'sub','middle')+T(262,y,f(p),'labn','middle',p>0?'var(--s1)':p<0?'var(--s2)':undefined)});
  const sum=a.reduce((q,x,i)=>q+x*b[i],0);
  return s+`<line x1="20" x2="300" y1="214" y2="214" style="stroke:var(--line)"/>`+T(160,238,TR('합 = ','sum = ')+f(sum),'labn','middle',sum>0?'var(--s1)':'var(--s2)')+T(160,262,TR('Φ = 합 / (5 − 1) = ','Φ = sum / (5 − 1) = ')+(sum>0?'+':'−')+Math.abs(sum/4).toFixed(3),'labn','middle',sum>0?'var(--s1)':'var(--s2)')+T(160,286,TR('평균을 뺐으므로 ① 열, ② 열의 합은 각각 0이다','Mean removed: columns ① and ② each sum to 0'),'sub','middle')},
 m:(v,tg)=>{const a=[.4,.2,0,-.2,-.4],b=(tg.same?[.3,.15,0,-.15,-.3]:[-.3,-.15,0,.15,.3]),p=a.map((x,i)=>x*b[i]),sum=p.reduce((q,x)=>q+x,0);
  const P=plot({x:[0,7],y:[-.35,.35],xt:[1,2,3,4,5].map(x=>({v:x,l:'t'+x})).concat([{v:6.2,l:TR('합','sum')}]),yt:[{v:-.3,l:'−0.3'},{v:0,l:'0'},{v:.3,l:'+0.3'}],yl:TR('곱 (예시)','product (example)'),T:30,B:256});
  let s=P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(0)}" y2="${P.Y(0)}" class="lvl2"/>`;
  p.concat([sum]).forEach((x,i)=>{const cx=i<5?i+1:6.2,w=i<5?.5:.7;if(Math.abs(x)<1e-9)return;s+=`<rect x="${P.X(cx-w/2)}" y="${P.Y(Math.max(x,0))}" width="${P.X(cx+w/2)-P.X(cx-w/2)}" height="${Math.abs(P.Y(x)-P.Y(0))}" style="fill:${x>0?'var(--s1)':'var(--s2)'}" fill-opacity="${i<5?.6:1}"/>`});
  return s+T(P.R,P.T-12,sum<0?TR('반대로 변함 → Φ < 0 (파랑)','opposite change → Φ < 0 (blue)'):TR('같이 변함 → Φ > 0 (빨강)','same change → Φ > 0 (red)'),'sub','end')},
 read:[TR('3단계 식을 숫자 다섯 개로 직접 계산한다. 평균을 뺀 ỹ 값이 시점 t1–t5에 있다(예시).','The step-3 formula is worked out by hand with five numbers. The mean-subtracted ỹ values are given at times t1–t5 (example).'),TR(`시점마다 ${c(1,'s4')}과 ${c(2,'s5')}의 ỹ를 곱한다. 둘의 부호가 같으면 곱이 +, 다르면 −다.`,`At each time, the ỹ values of ${c(1,'s4')} and ${c(2,'s5')} are multiplied. The same sign gives +, opposite signs give −.`),TR('곱을 모두 더해 (스펙트럼 수 − 1)로 나누면 Φ다. 여기서는 0이 아닌 곱이 모두 −라 Φ < 0, 지도에서 파랑 교차 피크가 된다.','Summing all products and dividing by (number of spectra − 1) gives Φ. Here every nonzero product is −, so Φ < 0: a blue cross peak on the map.'),TR('체크박스로 ②도 같이 줄게 하면 0이 아닌 곱이 모두 +가 되어 Φ > 0, 빨강이 된다.','With the checkbox, ② falls too; every nonzero product becomes +, so Φ > 0: red.'),TR('변화가 큰 시점(t1, t5)의 곱이 Φ를 주로 정한다.','The times with large changes (t1, t5) dominate Φ.')],
 q:TR('①은 변하는데 ②가 내내 그대로면 Φ는?','What is Φ if ① changes but ② stays constant throughout?'),a:TR('0이다. ②의 ỹ가 모두 0이라 곱이 모두 0이다.','0. Every ỹ of ② is 0, so every product is 0.')},
{t:TR('비동기 지도 Ψ: 변하는 시점이 다른가','Asynchronous map Ψ: do they change at different times?'),ec:TR('두 띠의 변화 진행률 (② 시작 시점을 옮김)','Progress of change of two bands (onset of ② shifted)'),mc:TR('비동기 지도 Ψ(ν₁, ν₂) (예시)','Asynchronous map Ψ(ν₁, ν₂) (example)'),
 slider:{min:-300,max:300,step:25,init:200,label:TR('② 의 늦음','Delay of ②'),fmt:v=>(v>0?'+':'')+Math.round(v)+' s'},
 e:v=>{const r=csMain(v),P=csTimeAx([0,1.1],{yl:TR('변화 진행률','progress of change'),yt:[{v:0,l:'0'},{v:1,l:'1'}]});
  let s=P.s+`<g data-n="1">${PL(CS_T.map(t=>[P.X(t),P.Y(csSig(t-350))]),COL.s4,{w:2})}</g><g data-n="2">${PL(CS_T.map(t=>[P.X(t),P.Y(csSig(t-350-v))]),COL.s5,{w:2,dash:1})}</g>`;
  s+=`<line x1="${P.X(760)}" x2="${P.X(820)}" y1="${P.Y(.32)}" y2="${P.Y(.32)}" style="stroke:var(--s4)" stroke-width="2"/>`+T(P.X(830),P.Y(.32)+4,TR('① 1715 감소','① 1715 falls'),'sub')+`<line x1="${P.X(760)}" x2="${P.X(820)}" y1="${P.Y(.16)}" y2="${P.Y(.16)}" style="stroke:var(--s5)" stroke-width="2" stroke-dasharray="4 3"/>`+T(P.X(830),P.Y(.16)+4,TR('② 1650 증가','② 1650 rises'),'sub');
  return s+T(P.L,P.T-12,TR(`Ψ 최대 / Φ 최대 = ${(r.mq/r.mx).toFixed(2)}`,`max Ψ / max Φ = ${(r.mq/r.mx).toFixed(2)}`),'labn')},
 m:v=>{const r=csMain(v);return csMap(r.psi,r.mx,{bands:[[1715,1,'s4'],[1650,2,'s5']]})+(r.mq/r.mx<.03?T(150,CS_B-CS_W+40,TR('Ψ ≈ 0: 같은 시점에 변한다','Ψ ≈ 0: same timing'),'labn','middle'):'')},
 read:[TR('Ψ(ν₁, ν₂) = (1/(m−1)) Σⱼ ỹ(ν₁, tⱼ) · Σₖ Nⱼₖ ỹ(ν₂, tₖ). N은 Hilbert–Noda 행렬이다(Nⱼₖ = 1/(π(k−j)), 대각선은 0). ν₂ 쪽 변화를 시간축에서 90°(위상) 밀어 놓고 ν₁과 곱하는 셈이다.','Ψ(ν₁, ν₂) = (1/(m−1)) Σⱼ ỹ(ν₁, tⱼ) · Σₖ Nⱼₖ ỹ(ν₂, tₖ). N is the Hilbert–Noda matrix (Nⱼₖ = 1/(π(k−j)), 0 on the diagonal). In effect, the change at ν₂ is shifted by 90° in phase along the time axis and then multiplied by the change at ν₁.'),TR('슬라이더를 0에 두면 두 띠가 같은 시점에 변해 Ψ = 0이다. 지도가 빈다.','With the slider at 0, the two bands change at the same time and Ψ = 0. The map is empty.'),TR('시점이 어긋날수록 교차 피크가 생기고 커진다. 앞뒤를 바꾸면(슬라이더 부호) 교차 피크 부호가 뒤집힌다.','The more the timings differ, the larger the cross peaks. Swapping which comes first (the slider sign) flips the cross-peak sign.'),TR('Ψ는 대각선을 사이에 두고 반대칭이다. Ψ(ν₁, ν₂) = −Ψ(ν₂, ν₁)이고, 대각선 위는 항상 0이다.','Ψ is antisymmetric about the diagonal: Ψ(ν₁, ν₂) = −Ψ(ν₂, ν₁), and it is always 0 on the diagonal.'),TR('Ψ는 대개 Φ보다 작다. 지도 색은 두 지도 모두 Φ 최대값으로 나눈 값이라 크기를 비교할 수 있다.','Ψ is usually smaller than Φ. Both maps are coloured relative to the maximum of Φ, so their sizes can be compared.')],
 q:TR('두 띠가 거의 같은 시점에 변하는데 잡음이 크면 Ψ는?','What about Ψ when the two bands change at almost the same time but the noise is large?'),a:TR('잡음이 만든 작은 Ψ가 순서처럼 보일 수 있다. Ψ/Φ가 잡음 수준만큼 작으면 순서를 말하지 않는다.','A small Ψ made by noise can look like an order. When Ψ/Φ is as small as the noise level, no order is claimed.')},
{t:TR('Noda 규칙: Φ와 Ψ 부호로 순서를 읽는다','Noda rules: reading the order from the signs of Φ and Ψ'),ec:TR('동기 Φ (② 200 s 늦음, 예시)','Synchronous Φ (② 200 s later, example)'),mc:TR('비동기 Ψ (같은 데이터)','Asynchronous Ψ (same data)'),
 e:()=>{const r=csMain(200),v=r.phi[csIdx(1715)][csIdx(1650)];return csMap(r.phi,r.mx,{bands:[[1715,1,'s4'],[1650,2,'s5']],mark:[1715,1650]})+T(csX(1715)+14,csY(1650)+4,'Φ '+(v<0?'< 0':'> 0'),'labn')},
 m:()=>{const r=csMain(200),v=r.psi[csIdx(1715)][csIdx(1650)];return csMap(r.psi,r.mx,{bands:[[1715,1,'s4'],[1650,2,'s5']],mark:[1715,1650]})+T(csX(1715)+14,csY(1650)+4,'Ψ '+(v<0?'< 0':'> 0'),'labn')},
 read:[TR(`같은 자리 (ν₁, ν₂)에서 Φ와 Ψ의 부호를 읽는다. 여기서는 ν₁ = ${c(1,'s4')} 1715, ν₂ = ${c(2,'s5')} 1650 (검은 동그라미)이다.`,`The signs of Φ and Ψ are read at the same point (ν₁, ν₂). Here ν₁ = ${c(1,'s4')} 1715 and ν₂ = ${c(2,'s5')} 1650 (black circle).`),TR('Noda 규칙: Φ와 Ψ 부호가 같으면 ν₁ 쪽이 먼저 변한다. 다르면 ν₂ 쪽이 먼저 변한다. Ψ ≈ 0이면 같이 변한다. Φ ≈ 0인 자리에서는 규칙을 쓰지 않는다.','Noda rules: if Φ and Ψ have the same sign, ν₁ changes first. If the signs differ, ν₂ changes first. Ψ ≈ 0 means they change together. The rules are not applied where Φ ≈ 0.'),TR('여기서는 Φ < 0, Ψ < 0으로 부호가 같다 → ① 1715(C=O 감소)가 먼저, ② 1650(C=N 증가)이 나중이다. 1단계 시간 곡선과 맞는다.','Here Φ < 0 and Ψ < 0 have the same sign → ① 1715 (C=O falls) first, ② 1650 (C=N rises) later. This agrees with the time curves of step 1.'),TR('랩 측정 기법 노트 In situ FTIR 탭 7단계와 같은 식, 같은 부호 약속이다.','Same formula and same sign convention as step 7 of the In situ FTIR tab in the Lab Techniques note.'),TR('주의: 순서 ≠ 반응 메커니즘. "먼저 변했다"는 세기 변화의 시점일 뿐이다. 섞임, 띠 겹침, 흡광도 비선형, 기준선 흐름도 시점 차이를 만든다. 순서는 시간 곡선과 화학으로 다시 확인한다.','Caution: order ≠ reaction mechanism. "Changed first" refers only to the timing of intensity changes. Mixing, band overlap, absorbance nonlinearity, and baseline drift also create timing differences. The order is checked again against the time curves and the chemistry.'),TR('Ψ 부호 약속(어느 축을 ν₁로 두는지, N의 부호)은 책과 프로그램마다 다를 수 있다. 다른 프로그램 결과와 비교할 때 먼저 확인한다(확인 필요).','The Ψ sign convention (which axis is ν₁, the sign of N) may differ between books and programs. It is checked first when comparing with results from another program (to be verified).')],
 q:TR('Φ > 0, Ψ < 0이면 어느 쪽이 먼저인가?','With Φ > 0 and Ψ < 0, which side changes first?'),a:TR('부호가 다르므로 ν₂ 쪽이 먼저 변한다.','The signs differ, so ν₂ changes first.')},
{t:TR('겹친 띠 나누기: 1D에서는 하나, 비동기 지도에서는 둘','Splitting overlapped bands: one in 1D, two in the asynchronous map'),ec:TR('겹친 띠 (예시: 1690 + 1668 cm⁻¹, 폭이 넓음)','Overlapped bands (example: 1690 + 1668 cm⁻¹, broad)'),mc:TR('비동기 지도 Ψ','Asynchronous map Ψ'),
 tg:[{k:'hid',l:TR('숨은 두 띠 보기','Show the two hidden bands'),on:false}],
 e:(v,tg)=>{const r=csOver(),P=csSpecAx([0,1.6],{yl:csAbs()});let s=P.s;
  [0,300,600,900,1200].forEach(t=>{s+=csLine(P,CS_NU.map(nu=>csSpec(r.bands,t,nu)),t===0?'var(--fg)':'var(--muted)',{w:t===0?2:1.2})});
  if(tg.hid)r.bands.forEach((b,i)=>{s+=`<g data-n="${i+1}">${csLine(P,CS_NU.map(nu=>b.a0*csG(nu,b.nu,b.w)),COL[CS_K[i]],{w:2,dash:1})}${badge(P.X(b.nu)+(i?14:-14),P.Y(b.a0)-30,i+1,COL[CS_K[i]])}</g>`});
  return s+T(P.R,P.T-12,TR('검정 = 0 s, 회색 = 300 s마다','black = 0 s, grey = every 300 s'),'sub','end')},
 m:()=>{const r=csOver();return csMap(r.psi,r.mx,{bands:[[1690,1,'s4'],[1668,2,'s5']]})},
 read:[TR('1690과 1668 cm⁻¹ 근처 두 띠가 폭이 넓어서 1D 스펙트럼에서는 봉우리 하나로 보인다(예시).','Two broad bands near 1690 and 1668 cm⁻¹ look like a single peak in the 1D spectrum (example).'),TR(`${c(1,'s4')}이 먼저(300 s), ${c(2,'s5')}가 나중(650 s)에 준다. 시점이 다르니 Ψ 지도에 교차 피크 한 쌍이 생긴다. 봉우리 하나였던 자리가 두 파수로 갈라진다.`,`${c(1,'s4')} falls first (300 s) and ${c(2,'s5')} later (650 s). The different timing creates a pair of cross peaks in the Ψ map. What was one peak splits into two wavenumbers.`),TR('Φ 지도에서는 둘 다 같이 줄어 + 덩어리 하나로 보인다. 갈라 보이게 하는 건 Ψ다. 이것을 2D-COS의 분해능 향상이라 부른다.','In the Φ map both fall together and appear as a single + lump. Ψ is what separates them. This is called the resolution enhancement of 2D-COS.'),TR('체크박스로 숨은 두 띠를 켜면 실제 성분이 보인다. 교차 피크 좌표는 두 띠 파수와 대략 맞는다.','The checkbox shows the two hidden bands, the actual components. The cross-peak coordinates match the two band positions approx.'),TR('두 띠가 같은 시점에 변하면 Ψ로도 나누지 못한다.','Two bands that change at the same time cannot be separated by Ψ either.')],
 q:TR('Ψ 교차 피크에서 두 띠의 파수를 어떻게 읽나?','How are the two band wavenumbers read from a Ψ cross peak?'),a:TR('교차 피크의 가로 좌표(ν₁)와 세로 좌표(ν₂)가 각각 두 띠의 파수(대략)다.','The horizontal (ν₁) and vertical (ν₂) coordinates of the cross peak are the wavenumbers of the two bands (approx.).')},
{t:TR('함정: 띠 이동, 기준선, 잡음이 만드는 가짜 피크','Pitfalls: false peaks from band shifts, baselines, and noise'),ec:TR('1D 스펙트럼 (예시)','1D spectrum (example)'),mc:TR('동기 지도 Φ','Synchronous map Φ'),
 tg:[{k:'sh',l:TR('띠 이동 켬 (세기는 그대로)','Band shift on (same intensity)'),on:true}],
 e:(v,tg)=>{const r=csShift(tg.sh),P=csSpecAx([0,1.15],{yl:csAbs()});let s=P.s;
  [0,300,600,900,1200].forEach(t=>{s+=csLine(P,CS_NU.map(nu=>csSpec(r.bands,t,nu)),t===0?'var(--fg)':'var(--muted)',{w:t===0?2:1.2})});
  return s+T(P.R,P.T-12,tg.sh?TR('1700 → 1680 cm⁻¹로 이동만 한다','only shifts 1700 → 1680 cm⁻¹'):TR('1690 cm⁻¹ 세기만 준다','only the 1690 cm⁻¹ intensity falls'),'sub','end')},
 m:(v,tg)=>{const r=csShift(tg.sh);return csMap(r.phi,r.mx)+(tg.sh?T(csX(1660),csY(1720)+4,TR('가짜 교차 피크','false cross peak'),'labn'):'')},
 read:[TR('띠 하나가 자리만 옮겨도(1700 → 1680 cm⁻¹, 세기 그대로) Φ 지도에 autopeak 두 개와 파랑(−) 교차 피크가 생긴다. 한 띠가 줄고 다른 띠가 느는 것처럼 보인다.','A single band that only moves (1700 → 1680 cm⁻¹, same intensity) creates two autopeaks and a blue (−) cross peak in the Φ map. It looks as if one band falls and another rises.'),TR('체크박스를 끄면(이동 없이 세기만 줄면) autopeak 하나뿐이다.','With the checkbox off (the intensity falls, no shift), there is only one autopeak.'),TR('이동인지 두 띠인지는 1D 스펙트럼에서 봉우리 꼭대기 위치를 직접 따라가 확인한다. 이동은 Ψ 지도에도 나비 모양 패턴을 만든다(확인 필요).','Whether it is a shift or two bands is checked by following the peak-top position directly in the 1D spectrum. A shift also creates a butterfly-shaped pattern in the Ψ map (to be verified).'),TR('기준선이 시간에 따라 흐르면 넓은 영역이 같이 변해 큰 + 덩어리가 생긴다. 지도를 만들기 전에 기준선을 맞춘다.','A baseline that drifts with time makes a wide region change together, giving a large + lump. The baseline is corrected before the map is made.'),TR('잡음은 Φ 대각선을 키우고 Ψ에 작은 얼룩을 만든다. 잡음 수준보다 작은 Ψ는 해석하지 않는다.','Noise enlarges the Φ diagonal and leaves small blotches in Ψ. Ψ below the noise level is not interpreted.'),TR('흡광도가 너무 커서 비선형이면 세기 변화의 시점이 어긋나 가짜 Ψ가 생긴다. In situ FTIR 탭 4단계의 "좋은 흡광도 범위"와 같은 이야기다.','Absorbance so high that it is nonlinear shifts the timing of intensity changes and creates false Ψ. This is the same point as the "good absorbance range" in step 4 of the In situ FTIR tab.')],
 q:TR('Φ 지도에 autopeak 두 개와 − 교차 피크가 있다. 두 띠가 서로 바뀌는 반응이라고 바로 말해도 되나?','A Φ map shows two autopeaks and a − cross peak. Can it be called a reaction that converts one band into the other right away?'),a:TR('안 된다. 띠 하나가 이동해도 같은 모양이 나온다. 1D 스펙트럼에서 봉우리 위치를 따라가 확인한다.','No. A single shifting band gives the same pattern. The peak position is followed in the 1D spectrum to check.')}];

const TABS=[{id:'kin',name:TR('속도론 · 전역 피팅','Kinetics · global fitting'),sub:TR('시간 신호를 모델로','Modelling time signals'),desc:TR('지수 감쇠와 IRF부터 순차 모델, 교환 대칭, 전역 피팅, 들뜸 통계, 잔차까지. 맞춤이 말해 주는 것과 말해 주지 않는 것.','From exponential decay and the IRF to sequential models, exchange symmetry, global fitting, excitation statistics, and residuals. What a fit tells and what it does not.'),steps:KIN},
 {id:'cos',name:'2D-COS',sub:TR('시간별 FTIR 상관 지도','Correlation maps of time-resolved FTIR'),desc:TR('반응 중 10초마다 찍은 FTIR에서 동기 Φ·비동기 Ψ 지도를 만든다. 무엇이 같이 변하고 누가 먼저 변하는지 읽는 법과 함정까지. 데이터는 모두 예시다.','Synchronous Φ and asynchronous Ψ maps from FTIR spectra taken every 10 s during a reaction. How to read what changes together and what changes first, plus the pitfalls. All data are examples.'),ev:'0 0 320 300',mv:'0 0 320 300',steps:CS}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
