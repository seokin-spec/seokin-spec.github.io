<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}

.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · 장비 원리</span><span class="status" title="전문가 검토 전 초안이다. 값의 대략·예시·확인 필요 표시를 같이 본다.">검토 중</span><a class="lang" id="langbtn" data-base="en/ell14k-piezo.html" href="en/ell14k-piezo.html" title="English"><b>한</b> · EN</a></div><h1 id="htitle"></h1><p id="hdesc"></p></header>

<script>
const LANG='ko';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title ELL14K 피에조 회전 마운트 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 장비 원리
// @status 검토 중
// @lang ko en
// @title.en ELL14K Piezo Rotation Mount Notes
// @eyebrow.en ADVANCED SPECTROSCOPY LAB · how equipment works
// @status.en Under review
/* ELL14K(Thorlabs Elliptec 회전 마운트)의 공진 피에조 모터가 링을 돌리는 원리.
   그림은 모두 단순화한 모식도다. 주파수 값(92, 108 kHz)은 예시이고 실제 값은 개체마다 다르다(둘 다 약 100 kHz 근처).
   확인이 필요한 값은 REVIEW.md에 적었다. 글은 TR('한국어','English')로 쓴다. */
const NOTE={key:'ell14k'};

/* ---------- 그림 헬퍼 (이 노트 전용, 이름은 el로 시작) ---------- */
/* 모터 본체: 알루미늄 공진기 + 그 안에 끼운 피에조. 팁 꼭짓점은 (238+dx, 106+dy) */
const elBody=(dx=0,dy=0,op=1)=>`<g transform="translate(${dx.toFixed(2)},${dy.toFixed(2)})" opacity="${op}"><path d="M70,135 H212 L238,106 L250,114 L236,140 V175 H70 Z" style="fill:#e4e7ee;stroke:var(--fg)" stroke-width="1.2"/><rect x="110" y="143" width="80" height="24" style="fill:var(--s4);stroke:var(--s4)" fill-opacity=".3"/>${[0,1,2,3,4,5,6].map(i=>`<line x1="${120+i*10}" y1="143" x2="${120+i*10}" y2="167" style="stroke:var(--s4)" stroke-width=".8"/>`).join('')}</g>`;
/* 세로 스프링 (지그재그) */
const elSpring=(x,y1,y2,n=6,w=7)=>{const p=[[x,y1]];for(let i=0;i<n;i++)p.push([x+(i%2?-w:w),y1+(y2-y1)*(i+.5)/n]);p.push([x,y2]);return PL(p,'var(--s3)',{w:1.6})};
/* 링 테두리(피구동체)를 편 막대 */
const elBar=(x,y,w,h=20)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" style="fill:var(--soft);stroke:var(--s2)" stroke-width="1.4"/>`;
/* 공진 곡선 (예시): 공진 A 92 kHz, 공진 B 108 kHz, 폭 2.5 kHz */
const elLor=(f,f0)=>1/(1+((f-f0)/2.5)**2);
const elAmp=f=>elLor(f,92)+.9*elLor(f,108);
/* 한 주기의 걸음: 위상 ph=0이 타원 꼭대기(링에 가장 깊이 닿는 점). |ph| < 60° 동안만 접촉한다고 가정 */
const elPc=Math.PI/3;
function elCyc(t){const k=Math.min(3,Math.floor(t)),u=t-k,ph=2*Math.PI*(u-.5),sc=Math.sin(elPc);
 const p=ph<-elPc?0:ph>elPc?1:(Math.sin(ph)+sc)/(2*sc);return{ph,d:k+p,on:Math.abs(ph)<elPc}}
/* 위에서 본 작은 모터: 팁이 (x,y), 본체는 a도 돌린 방향으로 뻗는다 */
const elMini=(x,y,a)=>`<g transform="translate(${x},${y}) rotate(${a})"><path d="M0,0 L7,12 V58 H-7 V12 Z" style="fill:#e4e7ee;stroke:var(--fg)" stroke-width="1.2"/><rect x="-4" y="22" width="8" height="26" style="fill:var(--s4)" fill-opacity=".5"/></g>`;
/* 고정폭 글자 */
const elMono=(x,y,s,col='var(--fg)')=>`<text x="${x}" y="${y}" class="num" style="fill:${col}">${s}</text>`;
const elHex=n=>n.toString(16).toUpperCase().padStart(8,'0');
const elDot=(x,y,col,r=5)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:${col}"/>`;
/* 공진 곡선 그래프 틀 */
const elResPlot=()=>plot({x:[70,130],y:[0,1.25],xt:[70,80,90,100,110,120,130].map(u=>({v:u,l:String(u)})),xl:TR('구동 주파수 (kHz, 예시 값)','drive frequency (kHz, example values)'),yl:TR('팁 진폭 (상대)','tip amplitude (relative)')});

/* ================= 탭 1: 공진 피에조 모터 ================= */
const MOTOR=[
{t:TR('부품은 넷: 피에조, 공진기, 스프링, 팁','Four parts: piezo, resonator, spring, tip'),ec:TR('모터 하나의 구조','Structure of one motor'),mc:TR('전기가 회전이 되는 순서','From electricity to rotation'),
 e:()=>{const lg=[[1,TR('피에조 소자','Piezo element'),'s4'],[2,TR('알루미늄 공진기','Aluminum resonator'),'s6'],[3,TR('스프링','Spring'),'s3'],[4,TR('팁','Tip'),'s1'],[5,TR('링 테두리 (밀리는 쪽)','Ring rim (driven part)'),'s2']];
  return T(14,20,TR('단순화한 그림 (실제 모양과 다름)','Simplified sketch (not the real shape)'),'sub')
   +elBar(150,86,160)+LN(180,72,236,72,COL.s2,{mk:'s2'})+T(242,76,TR('이동','motion'),'sub')
   +elBody()+elSpring(215,175,240)+L(192,238,240)
   +`<g data-n="1">${badge(150,155,1,COL.s4)}</g><g data-n="2">${badge(88,155,2,COL.s6)}</g><g data-n="3">${badge(238,208,3,COL.s3)}</g><g data-n="4">${badge(266,126,4,COL.s1)}</g><g data-n="5">${badge(298,96,5,COL.s2)}</g>`
   +lg.map(([n,s,k],i)=>{const y=196+i*19;return `<g data-n="${n}">${badge(20,y-4,n,COL[k])}${T(34,y,s,'sub')}</g>`}).join('')},
 m:()=>{const it=[[0,TR('구동 회로: 5 V → 약 100 kHz 교류','Driver: 5 V → approx. 100 kHz AC'),'f'],[1,TR('피에조: 전압 → 길이 변화','Piezo: voltage → length change'),'s4'],[2,TR('공진기: 떨림을 키운다','Resonator: amplifies the vibration'),'s6'],[4,TR('팁: 타원 운동','Tip: elliptical motion'),'s1'],[5,TR('링: 마찰로 밀려 회전','Ring: pushed around by friction'),'s2']];
  return it.map(([n,s,k],i)=>{const y=14+i*54;return `<g${n?` data-n="${n}"`:''}><rect x="52" y="${y}" width="250" height="32" rx="6" class="dev"/>${n?badge(30,y+16,n,COL[k]):''}${T(177,y+20,s,'sub','middle')}</g>`+(i<4?LN(177,y+32,177,y+52,'var(--muted)',{w:1.2,mk:'g'}):'')}).join('')},
 read:[TR('ELL14K의 모터는 전자석으로 도는 모터가 아니다. 초음파로 떠는 금속 조각이 링을 조금씩 밀어서 돌린다.','The motor in the ELL14K does not turn by electromagnets. A piece of metal vibrating at ultrasonic frequency pushes the ring around a little at a time.'),
  `${c(1,'s4')} `+TR('피에조 소자: 전압을 걸면 길이가 변한다. 모터의 힘이 나오는 곳이다.','Piezo element: its length changes with voltage. This is where the motor force comes from.'),
  `${c(2,'s6')} `+TR('알루미늄 공진기: 피에조를 꽉 끼워 넣은 틀이다. 틀 전체가 같이 떨면서 진폭을 키운다.','Aluminum resonator: the frame the piezo is press-fit into. The whole frame vibrates with it and amplifies the amplitude.'),
  `${c(3,'s3')} `+TR('스프링: 팁을 링 테두리에 늘 눌러 붙인다.','Spring: keeps the tip pressed against the ring rim at all times.'),
  TR(`${c(4,'s1')} 팁이 ${c(5,'s2')} 링 테두리에 닿는 한 점에서 마찰로 힘이 전달된다. 기어가 없다.`,`Force passes by friction at the single point where the ${c(4,'s1')} tip touches the ${c(5,'s2')} ring rim. There are no gears.`)],
 q:TR('이 모터에서 "회전하는 부품"은 모터 안에 있나?','Is the "rotating part" inside this motor?'),a:TR('없다. 모터는 제자리에서 떨기만 하고, 도는 것은 모터가 미는 링이다.','No. The motor only vibrates in place; what turns is the ring it pushes.')},

{t:TR('피에조는 전압을 길이로 바꾼다. 하지만 너무 조금이다','A piezo turns voltage into length, but far too little'),ec:TR('피에조 소자에 전압을 걸면','Voltage applied to the piezo element'),mc:TR('전압과 길이 변화 (예시)','Voltage and length change (example)'),
 slider:{min:0,max:5,step:.1,init:2.5,label:TR('전압','Voltage'),fmt:v=>v.toFixed(1)+' V'},
 e:v=>{const x=100,w=120+v*8;return T(14,20,TR('늘어남은 보기 쉽게 과장','Elongation exaggerated for clarity'),'sub')
  +T(160,84,TR('피에조 소자 (얇은 층을 쌓은 것)','Piezo element (stacked thin layers)'),'sub','middle')
  +`<rect x="88" y="92" width="12" height="86" class="dev"/>`+T(62,140,TR('고정','fixed'),'sub','middle')
  +`<g data-n="1"><rect x="${x}" y="100" width="${w}" height="70" style="fill:var(--s4);stroke:var(--s4)" fill-opacity=".25"/>${Array.from({length:9},(_,i)=>`<line x1="${x+w*(i+1)/10}" y1="100" x2="${x+w*(i+1)/10}" y2="170" style="stroke:var(--s4)" stroke-width=".8"/>`).join('')}</g>`
  +`<line x1="220" y1="94" x2="220" y2="196" class="lvl2"/>`
  +(v>.4?LN(220,188,x+w,188,COL.s1,{w:2,mk:'s1'}):'')+T(224,208,TR('늘어난 길이','length gained'),'sub')
  +T(160,244,`V = ${v.toFixed(1)} V`,'lab','middle')},
 m:v=>{const P=plot({x:[0,5],y:[0,1],xt:[0,1,2,3,4,5].map(u=>({v:u,l:String(u)})),xl:TR('전압 (V)','voltage (V)'),yl:TR('길이 변화 (상대, 예시)','length change (relative, example)')});
  return P.s+crv(P,u=>u*.16,0,5,COL.s4)+`<g data-n="1">${elDot(P.X(v),P.Y(v*.16),'var(--s4)')}</g>`+T(70,40,TR('5 V에서도 1 µm보다 작다 (대략)','Below 1 µm even at 5 V (approx.)'),'sub')},
 read:[`${c(1,'s4')} `+TR('피에조 소자는 전압에 비례해 늘어난다. 전압을 빼면 원래 길이로 돌아온다.','A piezo element lengthens in proportion to the voltage and returns to its original length when the voltage is removed.'),
  TR('얇은 층을 여러 장 쌓으면 낮은 전압으로도 층마다 센 전기장이 걸린다. 그래서 5 V 전원으로 움직일 수 있다.','Stacking many thin layers gives a strong electric field in each layer even at low voltage. This is why a 5 V supply is enough.'),
  TR('그래도 가만히 전압만 건 변위는 1 µm보다 작다(대략). 이것만으로는 링을 눈에 띄게 돌릴 수 없다.','Even so, the displacement from a steady voltage is below 1 µm (approx.). That alone cannot turn the ring noticeably.'),
  TR('해결책은 두 가지다. 떨림을 키우고(다음 단계), 작은 걸음을 아주 빠르게 되풀이한다(5단계).','There are two remedies: amplifying the vibration (next step) and repeating a tiny stride very fast (step 5).')],
 q:TR('전압을 5 V로 고정해 두면 링이 계속 도는가?','Does the ring keep turning if the voltage is held at 5 V?'),a:TR('돌지 않는다. 피에조가 한 번 늘어난 채 멈출 뿐이다. 계속 밀려면 전압을 빠르게 올렸다 내렸다 해야 한다.','No. The piezo only stretches once and stays there. Continuous pushing needs a voltage that rises and falls rapidly.')},

{t:TR('공진: 같은 전압으로 진폭을 키운다','Resonance: more amplitude from the same voltage'),ec:TR('모터가 떠는 모습','How the motor vibrates'),mc:TR('주파수에 따른 팁 진폭 (예시)','Tip amplitude versus frequency (example)'),
 slider:{min:70,max:130,step:.5,init:80,label:TR('구동 주파수','Drive frequency'),fmt:v=>v.toFixed(1)+' kHz',play:1},
 e:v=>{const a=elAmp(v),d=a*9;return T(14,20,TR('떨림은 보기 쉽게 과장','Vibration exaggerated for clarity'),'sub')

  +`<g data-n="4">${LN(282,110-d-2,282,110+d+2,COL.s1,{w:3})}</g>`+T(282,82,TR('팁 진폭','tip amplitude'),'sub','middle')
  +T(160,226,TR('팁 진폭 (상대): ','Tip amplitude (relative): ')+a.toFixed(2),'lab','middle')+T(160,246,TR('구동 전압은 그대로 5 V','Drive voltage unchanged at 5 V'),'sub','middle')},
 m:v=>{const P=elResPlot();return P.s+crv(P,elAmp,70,130,COL.s5,{n:300})
  +T(P.X(92),P.Y(1.1),TR('공진 A','Res. A'),'sub','middle')+T(P.X(108),P.Y(1.0),TR('공진 B','Res. B'),'sub','middle')
  +LN(P.X(v),P.T,P.X(v),P.B,'var(--muted)',{w:1,dash:1})+`<g data-n="4">${elDot(P.X(v),P.Y(elAmp(v)),'var(--s1)')}</g>`},
 read:[TR('그네를 제 박자에 맞춰 밀면 작은 힘으로도 크게 흔들린다. 공진기도 같다. 고유 진동수에 맞춰 전압을 흔들면 떨림이 쌓여 커진다.','A swing pushed in time with its own rhythm swings high with small pushes. The resonator behaves the same way: driving at its natural frequency lets the vibration build up.'),
  TR('이 모터의 공진은 약 100 kHz 근처다. 사람 귀에 들리지 않는 초음파다.','The resonances of this motor are near 100 kHz, which is ultrasonic and inaudible.'),
  `${c(4,'s1')} `+TR('공진에 맞으면 팁이 수 µm까지 움직인다(5 V, 부하 없음, 제조사 설명). 공진에서 벗어나면 거의 떨지 않는다.','On resonance the tip moves up to a few µm (5 V, no load, per the manufacturer). Off resonance it hardly vibrates.'),
  TR('쓸 만한 공진이 두 개 있다(공진 A, 공진 B). 두 개인 이유는 6단계에서 나온다.','There are two usable resonances (A and B). The reason for two appears in step 6.'),
  TR('그래프의 92, 108 kHz는 예시 값이다. 실제 값은 모터마다 다르다.','The 92 and 108 kHz in the graph are example values. Real values differ from motor to motor.')],
 q:TR('구동 주파수가 공진에서 몇 kHz만 어긋나면 어떻게 되나?','What happens if the drive frequency is a few kHz off resonance?'),a:TR('진폭이 크게 줄어 링을 미는 힘과 속도가 떨어진다. 그래서 공진 주파수를 정확히 찾아 저장해 두는 기능(주파수 탐색)이 있다.','The amplitude drops sharply, so push force and speed fall. This is why the unit can search for and store its exact resonance frequencies (frequency search).')},

{t:TR('팁은 직선이 아니라 타원을 그린다','The tip traces an ellipse, not a straight line'),ec:TR('팁 끝이 그리는 길','Path traced by the tip end'),mc:TR('두 방향 떨림의 시간 변화','The two vibration components in time'),

  return T(14,20,TR('팁 끝을 크게 확대 (실제 진폭은 수 µm 이하)','Tip magnified (real amplitude: a few µm or less)'),'sub')
   +T(160,84,TR('링 테두리','Ring rim'),'sub','middle')+elBar(40,93,240)

   +`<g data-n="1">${LN(cx,cy,px,cy,COL.s2,{w:2.5})}</g><g data-n="2">${LN(px,cy,px,py,COL.s3,{w:2.5})}</g><g data-n="4">${elDot(px,py,'var(--s1)',6)}</g>`
   +`<g data-n="1">${LN(20,250,40,250,COL.s2,{w:2.5})}${T(46,254,TR('표면 방향 떨림','along the surface'),'sub')}</g><g data-n="2">${LN(170,250,190,250,COL.s3,{w:2.5})}${T(196,254,TR('누르는 방향 떨림','into the surface'),'sub')}</g>`},
 m:v=>{const P=plot({x:[0,360],y:[-1.2,1.2],xt:[0,90,180,270,360].map(u=>({v:u,l:String(u)})),yt:[{v:0,l:'0'}],xl:TR('한 주기 안의 위상 (°)','phase within one cycle (°)'),yl:TR('변위 (상대)','displacement (relative)'),T:46});
  const fs=u=>Math.sin(u*Math.PI/180),fc=u=>Math.cos(u*Math.PI/180);
  return P.s+LN(P.L,P.Y(0),P.R,P.Y(0),'var(--line)',{w:1})
   +`<g data-n="1">${crv(P,fs,0,360,COL.s2)}${LN(64,14,84,14,COL.s2,{w:2.5})}${T(90,18,TR('표면 방향','along the surface'),'sub')}</g>`
   +`<g data-n="2">${crv(P,fc,0,360,COL.s3)}${LN(64,30,84,30,COL.s3,{w:2.5})}${T(90,34,TR('누르는 방향 (90° 앞섬)','into the surface (leads by 90°)'),'sub')}</g>`
   +LN(P.X(v),P.T,P.X(v),P.B,'var(--muted)',{w:1,dash:1})+`<g data-n="1">${elDot(P.X(v),P.Y(fs(v)),'var(--s2)',4)}</g><g data-n="2">${elDot(P.X(v),P.Y(fc(v)),'var(--s3)',4)}</g>`},
 read:[TR('공진기 틀은 좌우가 다른 모양이라, 한 번 떨 때 팁이 두 방향으로 같이 움직인다.','The resonator frame is asymmetric, so one vibration moves the tip in two directions at once.'),
  TR(`${c(1,'s2')} 표면을 따라 가는 떨림과 ${c(2,'s3')} 표면을 누르는 떨림이다.`,`These are the ${c(1,'s2')} vibration along the surface and the ${c(2,'s3')} vibration pressing into the surface.`),
  TR('두 떨림의 박자가 90° 어긋나면 팁은 타원을 그린다. 박자가 똑같으면 직선으로 왔다 갔다만 한다.','When the two are 90° out of step, the tip traces an ellipse. If they were exactly in step, it would only move back and forth on a line.'),
  `${c(4,'s1')} `+TR('타원 꼭대기(위상 0°)에서 팁은 링을 가장 세게 누르면서 오른쪽으로 간다. 바닥(180°)에서는 링에서 물러난 채 왼쪽으로 돌아온다.','At the top of the ellipse (phase 0°) the tip presses hardest on the ring while moving right. At the bottom (180°) it has backed away from the ring and returns to the left.'),
  TR('한 방향으로만 미는 비결이 이 타원이다. 그림의 90°와 타원 모양은 원리를 보이는 단순화다.','This ellipse is what makes the push one-directional. The 90° and the ellipse shape in the figure are a simplification that shows the principle.')],
 q:TR('두 떨림의 박자가 완전히 같다면(위상 차 0°) 링은 도는가?','If the two vibrations were exactly in step (0° phase difference), would the ring turn?'),a:TR('거의 돌지 않는다. 팁이 직선으로 왔다 갔다 하면 가는 길과 오는 길에 똑같이 눌러서 미는 양이 상쇄된다.','Hardly. A tip moving back and forth on a line presses equally on the way out and on the way back, so the pushes cancel.')},

{t:TR('타원 한 바퀴가 한 걸음: 붙어서 밀고, 떨어져서 돌아온다','One loop of the ellipse is one stride: push in contact, return out of contact'),ec:TR('팁과 링 테두리','Tip and ring rim'),mc:TR('링이 간 거리','Distance moved by the ring'),
 slider:{min:0,max:4,step:.01,init:.2,label:TR('시간','Time'),fmt:v=>v.toFixed(2)+TR(' 주기',' cycles'),play:1},
 e:v=>{const s=elCyc(v),px=160+30*Math.sin(s.ph),py=Math.max(96,108-24*Math.cos(s.ph));let tk='';
  for(let j=-5;j<6;j++){const x=50+52*j+s.d*52;if(x>16&&x<304)tk+=`<line x1="${x.toFixed(1)}" y1="78" x2="${x.toFixed(1)}" y2="94" style="stroke:var(--s2)" stroke-width="${j?1:4}"/>`}
  return T(14,20,TR('단순화: 붙어 있는 동안만 링이 밀린다','Simplified: the ring moves only during contact'),'sub')+T(14,66,TR('링 테두리','Ring rim'),'sub')+LN(236,62,292,62,COL.s2,{mk:'s2'})
   +`<ellipse cx="160" cy="108" rx="30" ry="24" fill="none" class="lvl2"/>`+elBar(10,76,300)+`<g data-n="5">${tk}</g>`
   +`<g data-n="4"><path d="M${px.toFixed(1)},${py.toFixed(1)} l-14,48 h36 Z" style="fill:#e4e7ee;stroke:var(--fg)" stroke-width="1.2"/>${elDot(px,py,'var(--s1)',4)}</g>`
   +T(160,206,s.on?TR('접촉: 팁이 링을 민다','In contact: the tip pushes the ring'):TR('떨어짐: 팁만 돌아온다','Out of contact: only the tip returns'),'lab','middle',s.on?COL.s1:undefined)
   +T(160,228,TR('지금까지 ','So far: ')+s.d.toFixed(2)+TR(' 걸음',' strides'),'sub','middle')},
 m:v=>{const P=plot({x:[0,4],y:[0,4.4],xt:[0,1,2,3,4].map(u=>({v:u,l:String(u)})),yt:[0,1,2,3,4].map(u=>({v:u,l:String(u)})),xl:TR('시간 (진동 주기)','time (vibration cycles)'),yl:TR('링이 간 거리 (걸음)','ring travel (strides)'),ylx:22});
  return P.s+crv(P,u=>u,0,4,'var(--muted)',{dash:1,w:1.2})+T(P.X(1.1),P.Y(2.3),TR('평균 속도','average speed'),'sub')
   +`<g data-n="5">${crv(P,u=>elCyc(u).d,0,4,COL.s2,{n:400})}${elDot(P.X(v),P.Y(elCyc(v).d),'var(--s2)')}</g>`},
 read:[`${c(4,'s1')} `+TR('팁이 타원 윗부분을 지날 때는 링에 눌려 붙어 있다. 이때 마찰이 링을 팁과 같이 끌고 간다.','While passing the upper part of the ellipse the tip is pressed against the ring. Friction then drags the ring along with the tip.'),
  TR('팁이 아랫부분을 지날 때는 누르는 힘이 약해진다. 팁만 빠르게 돌아오고 링은 따라오지 않는다.','While passing the lower part the pressing force is weak. Only the tip returns quickly; the ring does not follow.'),
  `${c(5,'s2')} `+TR('한 바퀴에 한 걸음씩, 링은 한쪽으로만 간다.','One stride per loop, and the ring moves in one direction only.'),
  TR('세어 보기: 최고 속도 430°/s를 초당 약 10만 걸음으로 나누면 한 걸음은 약 0.004°다(대략). 걸음 하나는 작지만 1초에 10만 번 되풀이해 빠르게 돈다.','Counting it out: 430°/s at top speed divided by about 100,000 strides per second gives about 0.004° per stride (approx.). Each stride is tiny, but 100,000 of them per second make the rotation fast.'),
  TR('실제 링은 관성이 있어 계단처럼 멈췄다 가지 않고 거의 매끈하게 돈다. 계단 그림은 원리를 보이는 단순화다.','The real ring has inertia, so it turns almost smoothly rather than in stop-and-go stairs. The staircase is a simplification that shows the principle.')],
 q:TR('스프링이 약해져 팁이 링에 잘 눌리지 않으면?','What if the spring weakens and the tip no longer presses well on the ring?'),a:TR('마찰이 줄어 팁이 링 위에서 미끄러진다. 걸음마다 링이 덜 가므로 속도와 힘이 떨어진다.','Friction drops and the tip slips on the ring. The ring advances less per stride, so speed and force fall.')},

{t:TR('방향 전환: 다른 공진으로 떨면 타원이 반대로 돈다','Reversing: the other resonance makes the ellipse run backward'),ec:TR('타원이 도는 방향과 링의 방향','Sense of the ellipse and ring direction'),mc:TR('구동 주파수 고르기 (예시)','Choosing the drive frequency (example)'),
 tg:[{k:'rev',l:TR('공진 B로 구동 (역방향)','Drive at resonance B (reverse)'),on:false}],
 e:(v,g)=>{const r=g.rev,col=r?COL.s5:COL.s1,k=r?'s5':'s1';
  return T(160,66,r?TR('링: 왼쪽으로','Ring: to the left'):TR('링: 오른쪽으로','Ring: to the right'),'lab','middle')
   +(r?LN(190,82,130,82,COL.s2,{w:2,mk:'s2'}):LN(130,82,190,82,COL.s2,{w:2,mk:'s2'}))+elBar(40,93,240)
   +`<ellipse cx="160" cy="160" rx="70" ry="45" fill="none" style="stroke:${col}" stroke-width="2"/>`

  TR(`${c(1,'f')} 모터 1과 ${c(2,'f')} 모터 2는 기판 아래쪽에 나란히 서 있다. 가느다란 금속 팔 끝(팁)이 링 테두리의 왼쪽 아래와 오른쪽 아래에 닿는다.`,`${c(1,'f')} Motor 1 and ${c(2,'f')} motor 2 stand side by side at the bottom of the board. The end of each thin metal arm (the tip) touches the ring rim at the lower left and the lower right.`),
  `${c(3,'s3')} `+TR('팔 밑동마다 코일 스프링이 있어 팁을 링에 누른다. 탭 1의 모터 그림은 이 팔을 원리만 남기고 단순화한 것이다.','A coil spring at the base of each arm presses the tip on the ring. The motor drawing in tab 1 is this arm reduced to its principle.'),
  TR('두 모터는 좌우 대칭이다. 링을 시계 방향으로 돌리려면 왼쪽 팁은 위로, 오른쪽 팁은 아래로 가야 한다. 그래서 한쪽은 미는 공진, 다른 쪽은 당기는 공진을 같이 쓴다(배치에서 추론, 확인 필요).','The two motors are mirror images. To turn the ring clockwise, the left tip must go up and the right tip down. So one motor uses its pushing resonance while the other uses its pulling resonance (inferred from the layout; to be verified).'),

/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
