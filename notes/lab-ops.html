<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>실험실 운영 노트</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 공통 스타일 — 디자인 토큰은 CLAUDE.md 5절 */
:root{color-scheme:light;--f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Arial,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--panel:#ffffff;--fg:#1f2328;--muted:#5d636b;--line:#e3e6ec;--soft:#f6f7fa;--pump:#7b8392;--accent:#24407f;
--s1:#c9512f;--s2:#2a66c9;--s3:#17806b;--s4:#a8730a;--s5:#6a4bb8;--s6:#6b7280;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 14px var(--f-sans)}
.tabs button small{font-weight:400;font-size:12px;opacity:.85}
.tabs button[aria-selected="true"]{background:#0d1630;border-color:#0d1630;color:#d5def0}
.hero{border-radius:12px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,#1b2b57 0%,#0d1630 70%);color:#d5def0;display:flex;flex-direction:column;gap:4px}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:#9cc2ff}
.hero .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .lang{margin-left:auto;font:500 12px var(--f-sans);color:#d5def0;border:1px solid #3a4a78;border-radius:999px;padding:0 10px;line-height:15px;text-decoration:none;white-space:nowrap}
.hrow .lang b{color:#fff;font-weight:700}
.hrow .lang:hover{border-color:#9cc2ff}
.status{font:600 11px var(--f-sans);color:#5a3d00;background:#f6dfa8;border-radius:999px;padding:1px 9px;letter-spacing:0}
.hero h1{color:#fff;font-size:26px;font-weight:700;margin:0}
.hero p{margin:0;font-size:14px;color:#d5def0;max-width:70ch}
input[type=range]{accent-color:var(--accent)}
.steprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:18px;font-weight:600;margin:0}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stage{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fig .cap{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
svg{display:block;width:100%;height:auto}
.ax{stroke:var(--muted);stroke-width:1}.lvl{stroke:var(--fg);stroke-width:1.6}.lvl2{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.beam{fill:none;stroke:var(--pump);stroke-width:1.5}.dev{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
.lab,.sub{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}.lab{fill:var(--fg);font:12px var(--f-sans)}.sub{fill:var(--muted);font:11px var(--f-sans)}.num{font:500 11px var(--f-mono)}.labn{fill:var(--fg);font:500 12px var(--f-sans)}.subn{fill:var(--muted);font:11px var(--f-sans)}
.stage [data-n]{transition:opacity .15s}.stage.focus [data-n]:not(.on){opacity:.18}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ctl input[type=range]{flex:1;min-width:120px}.ctl output{font:500 14px var(--f-mono);min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.ctl label.t{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.notes{grid-template-columns:minmax(0,1fr)}}
.read{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.read ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.case{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--soft);border-left:3px solid var(--s4);font-size:14px}.case b{font-weight:600}
.quiz{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:0}
.quiz .k{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.quiz p{margin:4px 0 8px}
.quiz details summary{cursor:pointer;color:var(--accent);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:500 11px var(--f-mono);vertical-align:1px;cursor:default}
.k-s1{color:var(--s1)}.k-s2{color:var(--s2)}.k-s3{color:var(--s3)}.k-s4{color:var(--s4)}.k-s5{color:var(--s5)}.k-s6{color:var(--s6)}.k-g{color:var(--pump)}.k-f{color:var(--fg)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav button,.ctl button{font:500 14px var(--f-sans);padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-b{color:var(--s1)}.k-r{color:var(--s2)}
[hidden]{display:none!important} /* display:flex 같은 클래스 규칙이 hidden 속성을 덮지 않게 */
</style>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <header class="hero"><div class="hrow"><span class="eyebrow">ADVANCED SPECTROSCOPY LAB · 실험실 운영</span><span class="status" title="전문가 검토 전 초안이다. 값의 대략·예시·확인 필요 표시를 같이 본다.">검토 중</span></div><h1 id="htitle"></h1><p id="hdesc"></p></header>
  <div class="steprow"><span class="count" id="count"></span><h2 id="stitle"></h2></div>
  <div class="stage" id="stage">
    <div class="fig"><p class="cap" id="ecap"></p><svg id="esvg" viewBox="0 0 320 280" role="img" aria-label="왼쪽 그림"></svg></div>
    <div class="fig"><p class="cap" id="mcap"></p><svg id="msvg" viewBox="0 0 320 280" role="img" aria-label="오른쪽 그림"></svg></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <span id="slw" hidden><label for="sl" id="sll"></label></span><input type="range" id="sl"><output id="slo"></output><button id="play" type="button" hidden>재생</button>
    <span id="tgl"></span>
  </div>
  <div class="notes">
    <div class="read"><ul id="read"></ul><div class="case" id="case" hidden></div></div>
    <div class="quiz"><span class="k">점검 질문</span><p id="q"></p><details id="ad"><summary>답 보기</summary><p id="a"></p></details></div>
  </div>
  <nav><button id="prev" type="button">← 이전</button><div class="dots" id="dots"></div><button id="next" type="button">다음 →</button></nav>
</div>

<script>
const LANG='ko';
/* ---------- 언어 ----------
   build.py가 맨 앞에 const LANG='ko' 또는 'en'을 넣는다.
   TR('한국어','English'): 영어판에서는 en, 없으면 ko를 쓴다 (조금씩 번역해도 빌드가 깨지지 않는다). */
const TR=(ko,en)=>LANG==='en'&&en!=null?en:ko;
/* ---------- SVG 헬퍼 (모든 노트 공통) ----------
   색 키: s1~s6 데이터 색, g = pump(회색), f = 글자색, b/r = ΔT/T 부호(+ 빨강 / − 파랑, s1/s2와 같은 색) */
const COL={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',s4:'var(--s4)',s5:'var(--s5)',s6:'var(--s6)',g:'var(--pump)',f:'var(--fg)',b:'var(--s1)',r:'var(--s2)'};
const DEFS=`<defs>${Object.keys(COL).map(k=>`<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${COL[k]}"/></marker>`).join('')}</defs>`;
/* 글자 한 줄 / 여러 줄 */
const T=(x,y,s,c='lab',a='start',col)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}"${col?` style="fill:${col}"`:''}>${s}</text>`;
const TM=(x,y,lines,c='sub',a='start',dy=14)=>lines.map((l,i)=>T(x,y+i*dy,l,c,a)).join('');
/* 가로 준위선, 임의 선, 꺾은선 */
const L=(x1,x2,y,c='lvl')=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" class="${c}"/>`;
const LN=(x1,y1,x2,y2,col='var(--pump)',o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
const PL=(pts,col='var(--pump)',o={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col}" stroke-width="${o.w??1.5}"${o.dash?' stroke-dasharray="4 3"':''}${o.mk?` marker-end="url(#m${o.mk})"`:''}/>`;
/* 번호 배지 ①② */
function badge(x,y,n,col){return `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--panel);stroke:${col}"/><text x="${x}" y="${y+4}" class="num" text-anchor="middle" style="fill:${col}">${n}</text>`}
/* 전이 화살표: k = 색 키, n = 번호(data-n으로 짝 강조)
   o.t 글자 위치: 기본은 화살표 가운데 기준(tx 8, ty 4), o.at='end'면 화살표 끝 x 기준(tx 6, ty 18) */
function A(x1,y1,x2,y2,k,n,o={}){const col=COL[k];let s=`<g${n?` data-n="${n}"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="2"${o.dash?' stroke-dasharray="5 3"':''} marker-end="url(#m${k})"/>`;
 if(n)s+=badge((x1+x2)/2+(o.dx??-14),(y1+y2)/2+(o.dy??0),n,col);
 if(o.t)s+=o.at==='end'?T(x2+(o.tx??6),(y1+y2)/2+(o.ty??18),o.t,'sub','start',col):T((x1+x2)/2+(o.tx??8),(y1+y2)/2+(o.ty??4),o.t,'sub','start',col);
 return s+'</g>'}
/* 장치 상자 (한 줄 또는 두 줄 이름) */
function box(x,y,w,h,a,b){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="dev"/>`+T(x+w/2,y+(b?h/2-2:h/2+4),a,'sub','middle')+(b?T(x+w/2,y+h/2+12,b,'sub','middle'):'')}
/* 그래프 틀: plot({x:[a,b], y:[c,d], xt, yt, xl, yl, logx, logy, L,R,T,B}) → {s, X, Y, ...} */
function plot(c){const Lx=c.L??58,R=c.R??304,Tp=c.T??22,B=c.B??236,tf=(v,l)=>l?Math.log10(v):v;
 const[x0,x1]=c.x.map(v=>tf(v,c.logx)),[y0,y1]=(c.y||[0,1]).map(v=>tf(v,c.logy));
 const X=v=>Lx+(tf(v,c.logx)-x0)/(x1-x0)*(R-Lx),Y=v=>B-(tf(v,c.logy)-y0)/(y1-y0)*(B-Tp);
 let s=`<line x1="${Lx}" y1="${B}" x2="${R}" y2="${B}" class="ax"/>`;if(!c.noy)s+=`<line x1="${Lx}" y1="${Tp}" x2="${Lx}" y2="${B}" class="ax"/>`;
 (c.xt||[]).forEach(t=>s+=`<line x1="${X(t.v)}" x2="${X(t.v)}" y1="${B}" y2="${B+5}" class="ax"/>`+T(X(t.v),B+17,t.l,'sub','middle'));
 (c.yt||[]).forEach(t=>s+=`<line x1="${Lx-5}" x2="${Lx}" y1="${Y(t.v)}" y2="${Y(t.v)}" class="ax"/>`+T(Lx-8,Y(t.v)+4,t.l,'sub','end'));
 if(c.xl)s+=T((Lx+R)/2,B+33,c.xl,'lab','middle');
 if(c.yl){const yx=c.ylx??14,ym=(Tp+B)/2;s+=`<text x="${yx}" y="${ym}" class="lab" text-anchor="middle" transform="rotate(-90 ${yx} ${ym})">${c.yl}</text>`}
 return{s,X,Y,L:Lx,R,T:Tp,B}}
/* 곡선: plot 결과 P 위에 f(v)를 a~b 구간으로 */
function crv(P,f,a,b,col,o={}){const n=o.n??200;let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;let y=f(v);if(!isFinite(y))continue;if(o.clip)y=Math.max(o.clip[0],Math.min(o.clip[1],y));d+=(d?' L':'M')+P.X(v).toFixed(1)+','+P.Y(y).toFixed(1)}
 return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${o.w??2}"${o.dash?' stroke-dasharray="5 4"':''}/>`}
/* 본문 속 번호 칩: c(1,'s1') → 그림의 data-n="1"과 짝 */
const c=(n,k)=>`<span class="chip k-${k}" data-n="${n}">${n}</span>`;
// @title 실험실 운영 노트
// @eyebrow ADVANCED SPECTROSCOPY LAB · 실험실 운영
// @status 검토 중
/* 실험실 운영 노트: 기초 장비, UPS·정전 대비
   이 노트의 숫자는 일반 대략값·예시다. 실제 순서와 값은 장비 설명서와 연구실 규정을 따른다. */
const NOTE={key:'labops'};

/* ---------- UPS 헬퍼 ---------- */
const upsOK='var(--s3)',upsBAT='var(--s4)';
/* 가는 세로 막대 + 번호 */
const upsGuide=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="lvl2"/>`;
/* 2단계: 전원 경로 한 줄 */
function upsRow(y,n,name,kind){
 let s=`<g data-n="${n}">${badge(16,y-28,n,'var(--fg)')}</g>`+T(30,y-24,name,'lab')+box(4,y-12,40,24,'전원');
 if(kind==='on'){
  s+=LN(44,y,62,y,upsOK,{w:2})+box(62,y-12,56,24,'AC→DC')+LN(118,y,190,y,upsOK,{w:2})+T(154,y-6,'직류','sub','middle')+box(190,y-12,56,24,'DC→AC')+LN(246,y,262,y,upsOK,{w:2,mk:'s3'})
   +box(132,y+12,44,20,'배터리')+LN(154,y+12,154,y+1,upsBAT,{w:2,dash:1});
 }else{
  if(kind==='li')s+=LN(44,y,70,y,upsOK,{w:2})+box(70,y-12,60,24,'전압 조정')+LN(130,y,150,y,upsOK,{w:2});
  else s+=LN(44,y,150,y,upsOK,{w:2});
  s+=box(150,y-10,34,20,'전환')+LN(184,y,262,y,upsOK,{w:2,mk:'s3'})+box(100,y+12,44,20,'배터리')+PL([[144,y+22],[167,y+22],[167,y+12]],upsBAT,{dash:1,mk:'s4'});
 }
 return s+box(264,y-12,52,24,'장비')}
/* 2단계: 출력 파형 (60 Hz 가정, 주기 약 16.7 ms) */
const upsSin=(c0,a)=>t=>c0+a*Math.sin(2*Math.PI*t/16.67);
/* 3단계: 버티는 시간 (분) = 216 Wh × 0.8 / 부하 × 60 */
const upsMin=P=>216*0.8/P*60;
/* 6단계: 켤 때 전류 (상대). 각 장비 = 정상 소비 + 순간 전류(지수 감쇠) */
const upsDev=[{n:1,t:1,b:2,a:3,k:'s5'},{n:3,t:5,b:1.5,a:2.5,k:'s2'},{n:4,t:8,b:.5,a:1,k:'s6'}];
const upsCur=(all,t)=>upsDev.reduce((sum,d)=>{const t0=all?1:d.t;return sum+(t>=t0?d.b+d.a*Math.exp(-(t-t0)/.25):0)},0);

const UPS=[
{t:'정전이 실험에 주는 피해',ec:'전원이 끊기면 (일반 예시)',mc:'다시 측정하기까지 걸리는 시간 (예시)',
 e:()=>{const it=[[1,'레이저',['냉각이 멈춘 채 꺼짐','(장비마다 다름, 확인 필요)'],'s2'],[2,'냉각기',['다시 식히는 데','시간이 걸림'],'s5'],[3,'진공 펌프',['진공이 깨질 수 있음'],'s4'],[4,'측정 PC',['저장 안 한 데이터 사라짐','스테이지 기준점 잃음'],'s6']];
  return T(14,20,'순간 정전(1초 미만)으로도 재시작될 수 있다','sub')+it.map(([n,name,lines,k],i)=>{const y=62+i*58;return `<g data-n="${n}">${badge(18,y,n,COL[k])}</g>`+box(34,y-15,96,30,name)+LN(130,y,150,y,'var(--muted)',{w:1,mk:'g'})+TM(156,y-(lines.length-1)*7+4,lines,'sub')}).join('')},
 m:()=>{const P=plot({x:[1,1000],logx:1,noy:1,xt:[{v:1,l:'1'},{v:10,l:'10'},{v:100,l:'100'},{v:1000,l:'1000'}],xl:'분 (log, 예시)',L:96,R:300,T:44,B:236});
  const it=[[4,'측정 PC',5,'약 5분','s6'],[2,'냉각기',30,'약 30분','s5'],[1,'레이저',60,'약 1시간','s2'],[3,'진공',300,'수 시간','s4']];
  return P.s+upsGuide(P.X(35),P.T,P.X(35),P.B)+T(P.X(35),P.T-10,'UPS가 버티는 시간 예시 (3단계)','sub','middle')
   +it.map(([n,name,v,lab,k],i)=>{const y=74+i*42;return `<g data-n="${n}">${badge(16,y,n,COL[k])}</g>`+T(30,y+4,name,'sub')+`<rect x="${P.L}" y="${y-6}" width="${P.X(v)-P.L}" height="12" rx="2" style="fill:${COL[k]}" fill-opacity=".55"/>`+T(P.X(v),y-11,lab,'sub','end')}).join('')},
 read:['이 탭은 일반 원리만 다룬다. 실제 순서와 값은 장비 설명서와 연구실 규정을 따른다.',`${c(1,'s2')} 레이저: 갑자기 꺼지면 냉각이 멈춘 채 결정·다이오드가 뜨거운 상태로 남을 수 있다(장비마다 다름, 확인 필요).`,`${c(2,'s5')} 냉각기와 ${c(3,'s4')} 진공 펌프는 멈추면 다시 켜서 정상으로 돌아오기까지 시간이 걸린다. 진공은 깨질 수도 있다.`,`${c(4,'s6')} 측정 PC: 저장하지 않은 데이터가 사라지고, delay stage 같은 모터가 기준점을 잃을 수 있다.`,'순간 정전(1초 미만)만으로도 장비가 재시작될 수 있다.','오른쪽 막대는 감을 잡기 위한 예시다. 회복 시간이 UPS가 버티는 시간보다 길면, UPS는 "실험을 이어 가는" 장치가 아니라 "안전하게 끄는 시간을 버는" 장치다.'],
 q:'UPS가 30분 버틴다면 그동안 측정을 계속해도 되나?',a:'보통은 아니다. UPS 시간은 데이터를 저장하고 장비를 순서대로 끄는 데 쓴다. 냉각기처럼 UPS에 안 물린 장비는 이미 멈췄을 수 있다.'},

 read:[`${c(1,'f')} 오프라인(대기형): 평소엔 전원을 그대로 장비로 보내고, 정전이 나면 배터리로 전환한다. 전환에 수 ms가 걸린다(확인 필요). 싸다.`,`${c(2,'f')} 라인 인터랙티브: 오프라인에 전압 조정 기능을 더했다. 약한 전압 변동은 배터리 없이 보정한다.`,`${c(3,'f')} 온라인(이중 변환): 늘 교류 → 직류 → 교류로 바꿔 내보낸다. 배터리가 늘 직류 줄에 붙어 있어 전환 시간이 0이다. 비싸고 열이 난다.`,'오른쪽 파형은 60 Hz(한 주기 약 16.7 ms)를 가정한 예시다. 오프라인 형의 끊김은 컴퓨터는 버텨도 민감한 장비는 재시작시킬 수 있다.','레이저 제어기처럼 민감한 장비에는 온라인 형을 권하는 경우가 많다(확인 필요).'],
 q:'오프라인 UPS에 물린 장비가 정전 때마다 재부팅된다. 의심할 것은?',a:'전환 시간(수 ms) 동안 장비 전원이 버티지 못하는 것. 온라인 형으로 바꾸거나, 배터리·UPS 상태(용량 부족, 과부하)를 확인한다.'},

 q:'300 W 부하로 10분만 버티면 된다. 배터리는 대략 몇 Wh가 필요한가?',a:'300 × (10/60) / 0.8 ≈ 63 Wh. 배터리 노화와 큰 부하 효과를 생각해 2배 정도 여유를 둔다.'},

function eqAng(k,wrong){let t1=.02,t2=-.005;const h=[[t1,t2]];
 for(let i=0;i<k;i++){const a=i%2===0;
  if(!wrong){if(a)t1=-t2*200/300;else t2=-t1*600/500}
  else{if(a)t2=-t1*300/200;else t1=-t2*500/600}
  h.push([t1,t2])}

const eqAlign=(k,wrong)=>eqAng(k,wrong).map(([a,b])=>[300*a+200*b,600*a+500*b]);

  return s+T(P.R,P.Y(26),tg.wr?'점점 커진다 (발산)':'점점 0으로 간다','sub','end')},
 read:['거울 두 개면 빔의 위치와 방향을 둘 다 맞출 수 있다. 조리개 두 개를 빔이 지나가야 할 축 위에 세워 두고 번갈아 맞춘다.',`순서: M1(빔이 먼저 닿는, 조리개에서 먼 거울)로 ${c(1,'s5')} 가까운 조리개를 맞추고, M2(조리개에 가까운 거울)로 ${c(2,'s2')} 먼 조리개를 맞춘다. 이걸 반복한다.`,'재생을 누르면 한 번 맞출 때마다 두 조리개의 어긋남이 함께 줄어든다. 이 배치(예시 거리)에서는 한 바퀴마다 약 0.8배로 줄어 몇 바퀴면 거의 0이 된다.','체크박스를 켜서 순서를 바꾸면(M2로 가까운 조리개, M1로 먼 조리개) 한 바퀴마다 약 1.25배로 커진다. "맞출수록 더 틀어지는" 경험의 이유다.','줄어드는 속도는 거울과 조리개 사이 거리에 따라 다르다. 조리개 사이를 멀리 둘수록 방향을 정밀하게 맞출 수 있다.'],
 q:'조리개 하나만 쓰면 무엇을 못 맞추나?',a:'빔이 그 점을 지나기만 하면 방향은 아무래도 된다. 위치와 방향 두 가지를 정하려면 점이 두 개 필요하다.'},
{t:'파워미터와 에너지미터: 평균 출력과 펄스 하나',ec:'5 ms 동안의 펄스 (평균 출력 1 W 고정)',mc:'펄스 하나 에너지 = 평균 출력 / 반복률',
 slider:{min:0,max:6,step:.05,init:3,label:'반복률',fmt:v=>{const f=10**v;return f>=1e6?(f/1e6).toFixed(1)+' MHz':f>=1e3?(f/1e3).toFixed(f<1e4?1:0)+' kHz':f.toFixed(f<10?1:0)+' Hz'}},
 e:v=>{const f=10**v,E=1/f,n=f*5e-3,H=e=>20+(Math.log10(e)+6)/6*130,y0=210;let s=`<line x1="30" x2="300" y1="${y0}" y2="${y0}" class="ax"/>`+T(30,226,'0','sub','middle')+T(300,226,'5 ms','sub','middle');
  if(n<=60){const N=Math.max(1,Math.floor(n));if(n>=1)for(let i=0;i<N;i++){const x=30+(i+.5)/n*270;s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0-H(E)}" style="stroke:var(--s1)" stroke-width="2"/>`}else s+=T(165,y0-40,'이 5 ms 안에는 펄스가 없을 수도 있다','sub','middle')}
  else s+=`<rect x="30" y="${y0-H(E)}" width="270" height="${H(E)}" style="fill:var(--s1)" fill-opacity=".35"/>`+T(165,y0-H(E)-8,'촘촘해서 띠로 보임','sub','middle');
  return s+T(20,30,`5 ms 안 펄스 수 ≈ ${n<1?n.toPrecision(2):Math.round(n).toLocaleString('en-US')}개`,'lab')+T(20,48,`펄스 하나 = 1 W / 반복률 = ${E>=.9995?E.toPrecision(3)+' J':eqFE(E)}`,'lab')+T(20,262,'막대 높이 = 펄스 에너지 (log 눈금, 보기용)','sub')},
 m:v=>{const f=10**v,P=plot({x:[1,1e6],y:[1e-6,1],logx:1,logy:1,xt:[{v:1,l:'1 Hz'},{v:1e3,l:'1 kHz'},{v:1e6,l:'1 MHz'}],yt:[{v:1e-6,l:'1 µJ'},{v:1e-3,l:'1 mJ'},{v:1,l:'1 J'}],xl:'반복률',yl:'펄스 에너지',L:62,T:30});
  return P.s+`<g data-n="2"><rect x="${P.L}" y="${P.T}" width="${P.X(3e3)-P.L}" height="${P.B-P.T}" style="fill:var(--s4)" fill-opacity=".1"/>${badge(P.X(3),P.Y(1e-5),2,'var(--s4)')}</g>`+T(P.X(3)+14,P.Y(1e-5)+4,'에너지미터가 한 발씩 읽는 쪽','sub')
   +`<g data-n="1">${crv(P,x=>1/x,1,1e6,'var(--fg)')}${badge(P.X(30)+12,P.Y(1/30)-14,1,'var(--fg)')}</g>`+T(P.X(30)+26,P.Y(1/30)-10,'1 W 선','sub')+`<circle cx="${P.X(f)}" cy="${P.Y(1/f)}" r="6" style="fill:var(--s1)"/>`+T(P.R,P.T-12,'색 영역 경계 3 kHz는 예시 (확인 필요)','sub','end')},
 read:[`${c(1,'f')} 파워미터는 열을 재는 센서가 많아 반응이 느리다. 그래서 평균 출력(W)을 읽는다. 반복률과 상관없이 쓸 수 있다.`,`${c(2,'s4')} 에너지미터(초전 센서 등)는 펄스 하나의 에너지(J)를 한 발씩 읽는다. 대신 읽을 수 있는 반복률에 한계가 있다(모델마다 다름, 확인 필요).`,'세어 보기: 평균 1 W, 1 kHz면 펄스 하나 = 1 W / 1000 Hz = 1 mJ다. 같은 1 W라도 100 kHz면 10 µJ로 100배 작다.','봉우리 출력은 훨씬 크다. 1 mJ 펄스가 100 fs 동안 몰려 나오면 1 mJ / 100 fs = 10 GW다(가정한 펄스 폭). 그래서 같은 평균 출력에서도 펄스 레이저는 광학 부품을 쉽게 상하게 한다.','작은 출력을 잴 때는 배경(빛을 막고 읽은 값)을 꼭 뺀다. 배경도 시간에 따라 흔들린다.'],
 case:'<b>사례: 배경이 신호보다 크다.</b> 우리 셋업에서 핀홀을 통과한 pump를 잴 때, 파워미터 배경이 약 275 µW로 통과한 신호(약 120 µW)의 2배가 넘었다. 같은 날 배경 자체가 17 µW 변하기도 했다(논문 3.7). 작은 변화를 따질 때는 배경을 측정 직전·직후에 다시 잰다.',
 q:'1 kHz, 펄스 하나 2 mJ면 파워미터는 얼마를 읽나?',a:'2 mJ × 1000 Hz = 2 W.'},
{t:'편광자 둘로 세기 줄이기: cos⁴θ',ec:'편광자 두 개의 정면 모습 (빔 순서대로 옆에 늘어놓음)',mc:'투과율 vs 첫 편광자 각도',
 slider:{min:0,max:90,step:1,init:45,label:'첫 편광자 각도 θ',fmt:v=>Math.round(v)+'°',play:1},
 e:v=>{const th=v*Math.PI/180,cy=130,Ar=(x,ang,len)=>{const dx=Math.sin(ang)*len/2,dy=Math.cos(ang)*len/2;return len<4?`<circle cx="${x}" cy="${cy}" r="2.5" style="fill:var(--s1)"/>`:LN(x-dx,cy+dy,x+dx,cy-dy,'var(--s1)',{w:2.5,mk:'s1'})+LN(x+dx,cy-dy,x-dx,cy+dy,'var(--s1)',{w:2.5,mk:'s1'})};
  const pol=(x,ang,n,lab)=>{let s=`<g data-n="${n}"><circle cx="${x}" cy="${cy}" r="36" style="fill:var(--soft);stroke:var(--fg)"/>`;for(let j=-4;j<=4;j++){const ox=Math.cos(ang)*j*7,oy=-Math.sin(ang)*j*7,Lw=Math.sqrt(Math.max(0,1225-(j*7)**2));s+=`<line x1="${x+ox+Math.sin(ang)*Lw}" y1="${cy+oy+Math.cos(ang)*Lw}" x2="${x+ox-Math.sin(ang)*Lw}" y2="${cy+oy-Math.cos(ang)*Lw}" style="stroke:var(--muted)" stroke-width=".8"/>`}return s+badge(x,cy-50,n,'var(--fg)')+'</g>'+T(x,cy+56,lab,'sub','middle')};
  return LN(10,cy,310,cy,'var(--pump)',{w:1,dash:1})+Ar(40,0,60)+pol(110,Math.PI/2-th,1,`P1 (θ = ${Math.round(v)}°)`)+Ar(170,th,60*Math.cos(th))+pol(230,Math.PI/2,2,'P2 (세로 고정)')+Ar(292,0,60*Math.cos(th)**2)
   +T(40,214,'E₀','sub','middle')+T(170,214,'E₀ cos θ','sub','middle')+T(292,214,'E₀ cos²θ','sub','middle')+T(20,30,'점선 = 빔. 왼쪽에서 오른쪽으로 간다','sub')+T(20,236,'원 = 빔 축을 따라 본 편광자 정면 (옆으로 늘어놓음)','sub')+T(20,252,'회색 줄 = 금속 줄. 투과 축은 줄에 수직이다','sub')+T(20,268,'빨간 화살표 = 같은 방향에서 본 전기장 방향과 크기','sub')},
 m:v=>{const P=plot({x:[0,90],y:[0,1.05],xt:[0,15,30,45,60,75,90].map(x=>({v:x,l:x+'°'})),yt:[{v:0,l:'0'},{v:.25,l:'25%'},{v:.5,l:'50%'},{v:1,l:'100%'}],xl:'첫 편광자 각도 θ',yl:'투과율 I / I₀',T:30});
  const d=Math.PI/180,y4=Math.cos(v*d)**4;
  return P.s+crv(P,x=>Math.cos(x*d)**2,0,90,'var(--s6)',{dash:1})+crv(P,x=>Math.cos(x*d)**4,0,90,'var(--s2)')+`<circle cx="${P.X(v)}" cy="${P.Y(y4)}" r="6" style="fill:var(--s2)"/>`+T(P.R,P.T-12,`θ = ${Math.round(v)}° → ${(y4*100).toFixed(1)}%`,'labn','end')
   +`<line x1="${P.X(58)}" x2="${P.X(66)}" y1="${P.Y(.92)}" y2="${P.Y(.92)}" style="stroke:var(--s2)" stroke-width="2"/>`+T(P.X(67),P.Y(.92)+4,'둘: cos⁴θ','sub')+`<line x1="${P.X(58)}" x2="${P.X(66)}" y1="${P.Y(.8)}" y2="${P.Y(.8)}" style="stroke:var(--s6)" stroke-width="2" stroke-dasharray="5 4"/>`+T(P.X(67),P.Y(.8)+4,'하나: cos²θ','sub')},
 read:['편광자 하나를 θ만큼 돌리면 투과 세기가 cos²θ가 된다(Malus 법칙). 전기장은 cos θ, 세기는 그 제곱이다.',`${c(1,'f')} 첫 편광자 P1을 θ로 돌리고 ${c(2,'f')} 둘째 편광자 P2를 원래 편광(세로)으로 고정하면 cos²θ를 두 번 거쳐 cos⁴θ가 된다. 45°면 25%, 60°면 6.25%다.`,'장점: 나가는 편광이 P2 때문에 항상 세로로 고정된다. pump 세기를 바꿔도 시료에서 편광(예: magic angle 조건)이 바뀌지 않는다.','반파장판 + 편광자도 같은 일을 하지만, 반파장판은 설계 파장 근처에서만 제대로 돈다. 파장을 넓게 바꾸는 중적외선에서는 편광자 두 개가 낫다(논문 A.3.7).','대가: 편광자마다 θ = 0에서도 손실이 있어 최대 투과가 줄고, 아무리 돌려도 소광비만큼은 새어 나온다. 우리 편광자의 기판 재질과 소광비는 확인 필요(논문 TODO).'],
 q:'pump를 원래의 약 1/10로 줄이려면 θ는 대략?',a:'cos⁴θ = 0.1 → cos θ ≈ 0.56 → θ ≈ 56°. 실제 다이얼 눈금은 최대 투과 위치만큼 어긋나 있으니 측정으로 확인한다.'},
{t:'지연 스테이지: 거리가 시간이 된다',ec:'역반사경을 얹은 스테이지 (위에서 본 모습, 레일은 아래에 따로 그림)',mc:'스테이지 이동 거리 → 시간 지연',
 slider:{min:0,max:90,step:1,init:15,label:'스테이지 이동 L',fmt:v=>Math.round(v)+' mm',play:1},
 e:v=>{const x=150+v*1.4;
  let s=`<line x1="120" x2="300" y1="196" y2="196" style="stroke:var(--muted)" stroke-width="5"/>`+T(300,216,'레일','sub','end');
  s+=`<rect x="${x+30}" y="114" width="14" height="72" class="dev"/>`+`<path d="M${x},120 L${x+30},150 L${x},180" fill="none" style="stroke:var(--fg)" stroke-width="2.5"/>`;
  /* 역반사경(지붕형): 열린 쪽이 빔을 향한다. 위 빔이 윗면 → 아랫면에서 두 번 반사되어 아래로 평행하게 돌아간다 */
  s+=LN(20,130,x+8,130,'var(--s1)',{w:2,mk:'s1'})+LN(x+10,131,x+10,169,'var(--s1)',{w:2})+LN(x+8,170,20,170,'var(--s1)',{w:2,mk:'s1'})+T(20,120,'들어오는 빔','sub')+T(20,188,'되돌아가는 빔','sub');
  s+=`<line x1="150" x2="150" y1="96" y2="196" class="lvl2"/>`+(v>4?LN(152,104,x-2,104,'var(--fg)',{w:1,mk:'f'}):'')+T(150,88,'처음 위치','sub','middle')+T(Math.min(300,Math.max(196,x+24)),100,`L = ${Math.round(v)} mm`,'sub',x+24>260?'end':'start');
  return s+T(20,30,'스테이지가 L만큼 가면 빛은 왕복으로 2L 더 간다','lab')+T(20,48,`2L / c = ${(2*v*1e-3/2.998e8*1e12).toFixed(1)} ps`,'lab')+T(20,246,'세어 보기: 1 µm 이동 → 2 µm 더 감 → 약 6.67 fs','sub')+T(20,264,'역반사경은 들어온 방향 그대로 되돌려 보낸다','sub')},
 m:v=>{const ps=L=>2*L*1e-3/2.998e8*1e12;const P=plot({x:[0,90],y:[0,620],xt:[0,30,60,90].map(x=>({v:x,l:x+' mm'})),yt:[200,400,600].map(y=>({v:y,l:y+' ps'})),xl:'스테이지 이동 L',yl:'시간 지연',L:64,T:30});
  return P.s+crv(P,ps,0,90,'var(--s1)')+`<circle cx="${P.X(v)}" cy="${P.Y(ps(v))}" r="6" style="fill:var(--s1)"/>`+T(P.X(v)-10,P.Y(ps(v))-8,ps(v).toFixed(0)+' ps','labn','end')+T(P.R,P.B-10,'90 mm 이동 = 빛 길이 180 mm = 약 600 ps','sub','end')},
 read:['pump와 probe 사이 시간 차이는 빛이 가는 길이로 만든다. 빛은 1 ps에 약 0.3 mm 간다.','역반사경은 빔을 들어온 방향 그대로 되돌린다. 스테이지가 L만큼 움직이면 빛 길이는 2L 늘어난다. 그래서 1 µm 이동이 약 6.67 fs다.','우리 pump 스테이지는 −50 ps부터 +550 ps까지 600 ps를 훑는다. 이건 스테이지 90 mm, 빛 길이 180 mm다(논문 3.7).','스테이지 정밀도가 곧 시간 정밀도다. 0.1 µm 단위로 움직이면 약 0.67 fs 단위다.','길게 움직일수록 빔이 조금씩 옆으로 흐를 수 있다(다음 단계). <a href="pumpprobe.html">IR pump-probe 노트</a>에서 이 지연을 어떻게 쓰는지 이어 본다.'],
 q:'스테이지를 0.3 mm 움직이면 시간 지연은?',a:'빛 길이 0.6 mm → 약 2 ps.'},
{t:'빔 흐름(beam walk): 지연이 길어지면 겹침이 줄 수 있다',ec:'시료 위치에서 본 두 빔 (어긋남 3배 과장)',mc:'겹침 신호 vs 지연 (가정한 흐름)',
 slider:{min:-50,max:550,step:5,init:250,label:'지연',fmt:v=>Math.round(v)+' ps',play:1},
 e:v=>{const d=40*(v+50)/600,sc=.32,cx=150,cy=140,ov=eqOv(d,167.6,132);
  return `<circle cx="${cx}" cy="${cy}" r="${132*sc}" style="fill:var(--s3)" fill-opacity=".25" stroke="var(--s3)"/>`+`<circle cx="${cx+3*d*sc}" cy="${cy}" r="${167.6*sc}" style="fill:none;stroke:var(--s5)" stroke-width="2" stroke-dasharray="5 3"/>`
   +`<circle cx="${cx}" cy="${cy}" r="2.5" style="fill:var(--s3)"/>`+`<circle cx="${cx+3*d*sc}" cy="${cy}" r="2.5" style="fill:var(--s5)"/>`
   +T(20,30,`중심 어긋남 d = ${d.toFixed(0)} µm`,'lab')+T(20,48,`겹침 = ${(ov*100).toFixed(1)}% (−50 ps 대비)`,'lab')
   +`<circle cx="30" cy="236" r="6" style="fill:var(--s3)" fill-opacity=".25" stroke="var(--s3)"/>`+T(42,240,'probe (w ≈ 132 µm)','sub')+`<circle cx="180" cy="236" r="6" style="fill:none;stroke:var(--s5)" stroke-width="2" stroke-dasharray="3 2"/>`+T(192,240,'pump (w ≈ 168 µm)','sub')+T(20,264,'원 = 1/e² 반경. 흐름은 지연에 비례한다고 가정','sub')},
 m:v=>{const f=t=>eqOv(40*(t+50)/600,167.6,132);const P=plot({x:[-50,550],y:[.9,1.01],xt:[0,100,200,300,400,500].map(x=>({v:x,l:String(x)})),yt:[{v:.9,l:'90%'},{v:.95,l:'95%'},{v:1,l:'100%'}],xl:'지연 (ps)',yl:'신호 (상대)',L:62,T:30});
  return P.s+crv(P,f,-50,550,'var(--s5)')+`<circle cx="${P.X(v)}" cy="${P.Y(f(v))}" r="6" style="fill:var(--s5)"/>`+T(P.R,P.T-12,'진짜 감쇠가 없어도 신호가 줄어 보인다','sub','end')+T(P.X(-40),P.Y(.915),'끝(+550 ps)에서 약 6.8% 감소','sub')},
 read:['스테이지 축이 빔과 조금이라도 비뚤면, 스테이지가 움직일 때 빔이 옆으로 흐른다. 그러면 시료에서 pump와 probe의 겹침이 지연에 따라 바뀐다.','겹침이 줄면 신호도 준다. 시료에는 아무 변화가 없어도 "느리게 사라지는 성분"처럼 보일 수 있다.','우리 셋업 예: 600 ps 이동 동안 핀홀 통과 pump가 약 10% 줄었다. 가우시안 빔이 옮겨 갔다고 보면 약 40 µm 어긋남이다. 이 경우 겹침 신호는 끝에서 약 6.8% 준다(논문 3.7). 이 계산은 가정에 기댄 추정이고, 측정한 보정값은 아니다.','같은 감소를 빔 크기 변화(약 5.7% 커짐)나 레이저·배경 흔들림으로도 설명할 수 있다. 위치와 크기를 따로 보려면 knife-edge로 중심을 직접 따라간다(다음 단계).','정리: 10 ps 안쪽의 빠른 변화에는 영향이 거의 없다(이 가정에서 −10 → +10 ps 사이 약 0.04%, −50 → +50 ps 사이 약 0.2%). 수백 ps의 느린 성분을 해석할 때는 이 효과를 먼저 재거나 범위를 정해 둔다.'],
 q:'지연 스캔에서 느린 감쇠가 보인다. 빔 흐름 때문인지 가리려면?',a:'시료 위치에서 pump의 위치·크기·출력을 지연마다 잰다. 겹침 변화만으로 같은 감쇠가 나오면 빔 흐름이 원인일 수 있다.'},
{t:'빔 크기 재기: 핀홀과 knife-edge',ec:'핀홀 통과 (반경 a = 50 µm)',mc:'knife-edge: 칼날 위치에 따른 통과 출력',
 slider:{min:60,max:300,step:1,init:168,label:'빔 반경 w (1/e²)',fmt:v=>Math.round(v)+' µm'},
 e:v=>{const a=50,T0=1-Math.exp(-2*a*a/(v*v)),sc=.3,cx=120,cy=140,r0=v*sc*1.25;

   +`<rect x="${cx-r0}" y="${cy-r0}" width="${2*r0}" height="${2*r0}" fill="url(#eqG)"/><path d="M${cx-v*sc},${cy} a${v*sc},${v*sc} 0 1 0 ${2*v*sc},0 a${v*sc},${v*sc} 0 1 0 ${-2*v*sc},0" style="fill:none;stroke:var(--s1)" stroke-dasharray="4 3"/>`

   +T(20,30,`T = 1 − exp(−2a²/w²) = ${T0.toFixed(3)}`,'lab')+T(20,250,'거꾸로 T를 재서 w를 구한다. T = 0.163 → w = 168 µm','sub')+T(20,266,'(우리 pump, 논문 3.3. 중심·원형·가우시안·초점 가정)','sub')},
 m:v=>{const P=plot({x:[-400,400],y:[0,1.08],xt:[-400,-200,0,200,400].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:.1,l:'10%'},{v:.9,l:'90%'},{v:1,l:'100%'}],xl:'칼날 위치 x (µm)',yl:'통과 출력',L:58,T:30});

 read:[`${c(1,'f')} 핀홀: 시료 위치에 작은 구멍(여기서 지름 100 µm)을 두고, 통과 출력 / 전체 출력 = T를 잰다. 가우시안이면 T = 1 − exp(−2a²/w²)라 T에서 w를 바로 구한다. 빠르다.`,'대신 가정이 넷이다: 빔이 구멍 한가운데, 원형, 가우시안, 초점이 구멍 평면. 중심이 어긋나거나 타원·비가우시안이면 T가 작아져 w를 크게 잡는다.',`${c(2,'s2')} knife-edge: 칼날을 빔을 가로질러 옮기며 통과 출력을 잰다. 가우시안이면 오차 함수 모양이고, 90%와 10% 위치 사이가 1.28 w다. 슬라이더로 w를 바꾸면 곡선이 가팔라지거나 완만해진다.`,'knife-edge는 시간이 더 들지만 빔 중심 위치도 함께 나와, 빔 흐름(앞 단계)처럼 위치와 크기를 나눠 봐야 할 때 쓴다.','빔 크기는 보통 1/e² 세기 반경 w로 적는다. 반치폭(FWHM)은 약 1.18 w다. 어느 정의인지 꼭 같이 적는다.'],
 q:'핀홀이 빔 중심에서 조금 빗나갔는데 그대로 계산하면?',a:'통과량 T가 실제보다 작게 나와 w가 실제보다 크게 계산된다. 그러면 fluence(단위 면적당 에너지)를 작게 잡게 된다.'},
{t:'건조 공기·질소 퍼지: 공기 속 물과 CO₂를 뺀다',ec:'빔 경로 상자에 퍼지 가스',mc:'공기 중 투과 스펙트럼 (선 위치·세기는 모양만 예시)',

 e:v=>{const h=Math.exp(-v/2.5),n=Math.round(30*h);let s=`<rect x="40" y="80" width="240" height="110" rx="6" class="dev"/>`+LN(10,135,310,135,'var(--s1)',{w:2,mk:'s1'});

  return s+T(20,24,`남은 수증기 (처음 대비): ${(h*100).toFixed(0)}%`,'lab')+`<circle cx="26" cy="256" r="3" style="fill:var(--s2)" fill-opacity=".7"/>`+T(36,260,'= 물 분자 (개수는 예시)','sub')},
 m:v=>{const h=Math.exp(-v/2.5),P=plot({x:[4000,1200],y:[0,1.05],xt:[4000,3000,2000,1200].map(x=>({v:x,l:String(x)})),yt:[{v:0,l:'0'},{v:1,l:'1'}],xl:'wavenumber (cm⁻¹)',yl:'투과율',T:30});
  return P.s+crv(P,w=>eqAbs(w,h,h),4000,1200,'var(--fg)',{n:1400,w:1.2})+T(P.X(1650),P.T-8,'물 굽힘','sub','middle')+T(P.X(2350),P.T-8,'CO₂','sub','middle')+T(P.X(3730),P.T-8,'물 신축','sub','middle')},
 read:['공기 중 수증기는 중적외선에 가는 흡수선이 빽빽하다(대략 1400–1900 cm⁻¹ 굽힘, 3500–3900 cm⁻¹ 신축). CO₂는 약 2350 cm⁻¹에 센 띠가 있다.','이 선들이 빔 경로에 있으면 스펙트럼에 겹쳐 나온다. 습도가 바뀌면 같이 바뀌어 pump-probe 신호나 FTIR 배경 나눗셈을 흔든다.','빔 경로를 상자로 덮고 건조 공기나 질소(N₂)를 흘려 공기를 밀어낸다. 재생을 누르면 시간이 지나며 흡수선이 얕아진다(속도는 예시).','건조 공기 장치가 CO₂까지 빼는지는 장치마다 다르다(확인 필요). N₂는 둘 다 뺀다.','퍼지는 상자를 열면 바로 깨진다. 정렬 뒤 다시 충분히 기다리고 측정한다. FTIR 배경 문제는 <a href="lab-techniques.html">측정 기법 노트</a> FTIR 탭과 같은 이야기다.'],
 q:'퍼지 상자를 연 직후 측정한 pump-probe 스펙트럼에 1600 cm⁻¹ 근처 가는 줄무늬가 생겼다. 왜?',a:'공기 중 수증기가 다시 들어와 probe 스펙트럼에 흡수선이 생겼다. 퍼지가 다시 안정될 때까지 기다린다.'},
{t:'안전: LN₂ 1 L는 기체 약 700 L',ec:'작은 방에 LN₂를 쏟으면 (3 × 3 × 2.5 m, 예시. 파란 높이 = N₂로 바뀐 부피 비율)',mc:'방 안 산소 농도 (가정)',
 slider:{min:0,max:20,step:.5,init:5,label:'쏟은 LN₂',fmt:v=>v.toFixed(1)+' L'},
 e:v=>{const V=.7*v,frac=Math.min(1,V/22.5),y0=230,H=160;
  return `<rect x="40" y="${y0-H}" width="200" height="${H}" style="fill:none;stroke:var(--fg)" stroke-width="2"/>`+`<rect x="41" y="${y0-H*frac}" width="198" height="${H*frac}" style="fill:var(--s2)" fill-opacity=".2"/>`
   +`<rect x="256" y="170" width="30" height="60" rx="6" class="dev"/>`+T(271,248,'듀어','sub','middle')
   +T(20,30,`${v.toFixed(1)} L × 700 = 기체 약 ${(V*1000).toFixed(0)} L`,'lab')+T(20,48,`방 22 500 L 중 ${(frac*100).toFixed(0)}%가 N₂로 바뀜`,'lab')
   +(frac>.08?T(140,y0-H*frac/2+4,'새로 생긴 N₂','sub','middle'):'')+T(20,266,'고루 섞인다고 가정 (실제로는 찬 기체가 바닥에 먼저 고인다)','sub')},
 m:v=>{const o=L=>20.9*(1-Math.min(1,.7*L/22.5));const P=plot({x:[0,20],y:[5,22],xt:[0,5,10,15,20].map(x=>({v:x,l:x+' L'})),yt:[{v:10,l:'10%'},{v:15,l:'15%'},{v:20.9,l:'21%'}],xl:'쏟은 LN₂',yl:'산소 농도',L:58,T:30});
  return P.s+`<line x1="${P.L}" x2="${P.R}" y1="${P.Y(19.5)}" y2="${P.Y(19.5)}" class="lvl2" style="stroke:var(--s1)"/>`+T(P.R,P.T-12,'빨간 점선 19.5% = 흔히 쓰는 산소 결핍 기준 (확인 필요)','sub','end')
   +crv(P,o,0,20,'var(--s2)')+`<circle cx="${P.X(v)}" cy="${P.Y(o(v))}" r="6" style="fill:var(--s2)"/>`+T(P.X(v)+(v>14?-10:10),P.Y(o(v))+(v>14?18:-10),o(v).toFixed(1)+'%','labn',v>14?'end':'start')},
 read:['LN₂는 끓는점 77 K(−196 °C)의 액체다. 독성은 없지만 1 L가 기체 약 700 L가 된다(논문 A.4.3).','세어 보기: 3 × 3 × 2.5 m 방은 22 500 L다. 10 L 듀어를 쏟으면 N₂ 7000 L가 생겨 방 공기의 약 3분의 1을 밀어낸다. 산소는 21%에서 약 14%로 떨어진다(고루 섞인다는 가정).','산소가 모자라도 숨이 차다는 느낌 없이 의식을 잃을 수 있다. 작은 방, 환기가 약한 곳에서는 산소 경보기와 환기를 확인한다(기준 농도와 우리 실험실 설비는 확인 필요).','액체에 닿으면 동상을 입는다. 듀어를 채울 때 저온 장갑과 보안경을 쓴다.','레이저 보안경은 OD(광학 밀도)로 고른다. OD 4 = 투과 10⁻⁴다. 1 W 빔이면 100 µW가 지나온다. OD는 파장마다 다르니 쓰는 파장(800 nm, 중적외선 등)에서의 OD를 확인한다(우리 보안경 규격은 확인 필요).'],
 q:'OD 3 보안경으로 평균 2 W 빔을 직접 맞으면 눈에 들어오는 출력은?',a:'2 W × 10⁻³ = 2 mW. 직접 보기에 안전한 수준이 아니다. 파장에 맞는 충분한 OD를 쓰고, 애초에 빔 높이에 눈을 두지 않는다.'}];

const TABS=[{id:'eq',name:'기초 장비',sub:'테이블·정렬·측정·안전',desc:'광학 테이블, 두 거울 정렬, 파워미터와 에너지미터, 편광자 감쇠, 지연 스테이지와 빔 흐름, 빔 크기, 퍼지, LN₂·레이저 안전. 값은 대략이고, 우리 셋업 값은 논문에서 가져왔다.',steps:EQ},{id:'ups',name:'UPS · 정전',sub:'전원이 끊길 때',desc:'UPS 종류, 용량 계산, 무엇을 물릴지, 정전·복전 때 순서, 정기 점검. 일반 원리만 다루며, 실제 순서는 장비 설명서와 연구실 규정을 따른다.',steps:UPS}];
/* ---------- 공통 엔진: 탭, 단계, 슬라이더, 체크박스, 번호 강조, 저장 ----------
   노트 파일이 정의해야 하는 것:
     TABS = [{id, name, sub, desc, steps, (선택) title, ec, mc, tl, ev, mv}]
       title: 헤더 제목(없으면 name) / ec, mc, tl: 단계에 없을 때 쓰는 캡션 기본값 / ev, mv: 기본 viewBox
     NOTE = {key, (선택) ev, mv, top, afterCtl, init(), onRender()}
       key: localStorage 키 / top: 헤더 바로 아래 넣을 HTML / afterCtl: 컨트롤 줄 아래 넣을 HTML
   단계 형식은 CLAUDE.md 3절. 오른쪽 캡션 = mc + ' · ' + tl.
   주소 끝 #t=<탭 id>&s=<단계 번호>로 현재 위치를 적고 읽는다. 언어 전환 버튼(#langbtn)도 이 위치를 따라간다. */
let tab=0,idx=0,V=0,TG={},raf=0;
const $=id=>document.getElementById(id);
if(NOTE.top)document.querySelector('.hero').insertAdjacentHTML('afterend',NOTE.top);
if(NOTE.afterCtl)$('ctl').insertAdjacentHTML('afterend',NOTE.afterCtl);
if(NOTE.init)NOTE.init();
$('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="false">${t.name}<small>${t.sub}</small></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;idx=0;render()}};
const S=()=>TABS[tab].steps[idx];
function draw(){const s=S();$('esvg').innerHTML=DEFS+s.e(V,TG);$('msvg').innerHTML=DEFS+s.m(V,TG)}
function fmt(v){const sl=S().slider;return sl?(sl.fmt?sl.fmt(v):String(v)):''}
function render(){const T0=TABS[tab],set=T0.steps,s=S();cancelAnimationFrame(raf);raf=0;
 $('htitle').textContent=T0.title||T0.name;$('hdesc').textContent=T0.desc||'';$('count').textContent=(idx+1)+' / '+set.length;$('stitle').textContent=s.t;
 const mc=s.mc||T0.mc||'',tl=s.tl||T0.tl;$('ecap').innerHTML=s.ec||T0.ec||'';$('mcap').innerHTML=mc+(tl?(mc?' · ':'')+tl:'');
 $('esvg').setAttribute('viewBox',s.ev||T0.ev||NOTE.ev||'0 0 320 280');$('msvg').setAttribute('viewBox',s.mv||T0.mv||NOTE.mv||'0 0 320 280');
 $('read').innerHTML=s.read.map(r=>`<li>${r}</li>`).join('');$('case').hidden=!s.case;$('case').innerHTML=s.case||'';$('q').textContent=s.q;$('a').textContent=s.a;$('ad').open=false;
 const sl=s.slider;$('ctl').hidden=!(sl||s.tg);$('slw').hidden=!sl;$('sl').hidden=!sl;$('slo').hidden=!sl;$('play').hidden=!(sl&&sl.play);$('play').textContent=TR('재생','Play');
 if(sl){$('sl').min=sl.min;$('sl').max=sl.max;$('sl').step=sl.step;V=sl.init??sl.min;$('sl').value=V;$('sll').textContent=sl.label;$('slo').value=fmt(V)}else V=0;
 TG={};$('tgl').innerHTML=(s.tg||[]).map((t,i)=>{TG[t.k]=t.on;return `<label class="t" for="tg${i}"><input type="checkbox" id="tg${i}" data-k="${t.k}"${t.on?' checked':''}>${t.l}</label>`}).join('');
 $('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;
 $('dots').innerHTML=set.map((_,i)=>`<button aria-label="${TR((i+1)+'단계','Step '+(i+1))}" class="${i===idx?'on':''}" data-i="${i}"></button>`).join('');
 [...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-selected',i===tab));
 if(NOTE.onRender)NOTE.onRender(s);
 draw();try{localStorage.setItem(NOTE.key,JSON.stringify({tab,idx}))}catch(e){}
 const h='#t='+T0.id+'&s='+(idx+1);try{history.replaceState(null,'',h)}catch(e){}
 const lb=$('langbtn');if(lb)lb.href=lb.dataset.base+h}
function go(i){idx=Math.max(0,Math.min(TABS[tab].steps.length-1,i));render()}
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
$('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
$('sl').oninput=e=>{V=+e.target.value;$('slo').value=fmt(V);draw()};
$('tgl').onchange=e=>{const k=e.target.dataset.k;if(k){TG[k]=e.target.checked;draw()}};
$('play').onclick=()=>{if(raf){cancelAnimationFrame(raf);raf=0;$('play').textContent=TR('재생','Play');return}
 const sl=S().slider,rate=(sl.max-sl.min)/6000;if(V>=sl.max)V=sl.min;let last=performance.now();$('play').textContent=TR('정지','Stop');
 const step=t=>{V=Math.min(sl.max,V+(t-last)*rate);last=t;$('sl').value=V;$('slo').value=fmt(V);draw();if(V<sl.max)raf=requestAnimationFrame(step);else{raf=0;$('play').textContent=TR('재생','Play')}};raf=requestAnimationFrame(step)};
const stage=$('stage'),notes=document.querySelector('.notes');
function hl(n){stage.classList.toggle('focus',!!n);stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('on',el.dataset.n===n))}
[stage,notes].forEach(el=>{el.addEventListener('mouseover',e=>{const t=e.target.closest('[data-n]');hl(t?t.dataset.n:'')});el.addEventListener('mouseleave',()=>hl(''))});
try{const s=JSON.parse(localStorage.getItem(NOTE.key)||'null');if(s&&TABS[s.tab]){tab=s.tab;idx=Math.min(s.idx,TABS[tab].steps.length-1)}}catch(e){}
/* 주소 #t=<탭 id>&s=<단계> 가 있으면 그 위치로 연다 (언어 전환 버튼이 같은 단계로 넘어가게) */
{const m=location.hash.match(/t=([\w-]+)&s=(\d+)/),i=m?TABS.findIndex(t=>t.id===m[1]):-1;if(i>=0){tab=i;idx=Math.max(0,Math.min(+m[2]-1,TABS[i].steps.length-1))}}
render();
</script>
